    function ReviewerSurface({
      focused,
      workspace,
      timeline,
      leftRailWidth,
      startDragTree,
      isDraggingTree,
      activityHeight,
      startDragActivity,
      isDraggingActivity,
    }) {
      const [prs, setPRs] = useState([]);
      const [filesByPR, setFilesByPR] = useState({});
      const [commentsByPR, setCommentsByPR] = useState({});
      const [diffByFile, setDiffByFile] = useState({});
      const [loadingByPR, setLoadingByPR] = useState({});
      const [commentsLoadingByPR, setCommentsLoadingByPR] = useState({});
      const [errorsByPR, setErrorsByPR] = useState({});
      const [commentErrorsByPR, setCommentErrorsByPR] = useState({});
      const [diffLoadingByFile, setDiffLoadingByFile] = useState({});
      const [diffErrorsByFile, setDiffErrorsByFile] = useState({});
      const [selectedFileByPR, setSelectedFileByPR] = useState({});
      const [selectedFileSourceByPR, setSelectedFileSourceByPR] = useState({});
      const [fileStatesByPR, setFileStatesByPR] = useState({});
      const [diffModeByPR, setDiffModeByPR] = useState({});
      const [reviewDraftByPR, setReviewDraftByPR] = useState({});
      const [reviewIntentByPR, setReviewIntentByPR] = useState({});
      const [reviewBusyByPR, setReviewBusyByPR] = useState({});
      const [reviewErrorByPR, setReviewErrorByPR] = useState({});

      const activePR = useMemo(() => normalizeReviewPR(workspace && workspace.current_pr), [workspace]);
      const activePRKey = reviewPRKey(activePR);
      const runtimeReviewFile = String(workspace && workspace.current_review_file || '').trim();
      const activeFiles = activePRKey ? (filesByPR[activePRKey] || []) : [];
      const activeComments = activePRKey ? (commentsByPR[activePRKey] || []) : [];
      const activeFileStates = activePRKey ? (fileStatesByPR[activePRKey] || {}) : {};
      const activeTitle = useMemo(() => {
        if (!activePR) return '';
        const match = asArrayPayload(prs, 'prs')
          .map(normalizeReviewPR)
          .find(pr => pr && pr.owner === activePR.owner && pr.repo === activePR.repo && pr.index === activePR.index);
        return match ? match.title : '';
      }, [prs, activePR]);
      const selectedFilePath = activePRKey ? (selectedFileByPR[activePRKey] || '') : '';
      const fileDiffKey = activePRKey && selectedFilePath ? `${activePRKey}:${selectedFilePath}` : '';
      const activeDiff = fileDiffKey ? diffByFile[fileDiffKey] : null;
      const diffMode = activePRKey && diffModeByPR[activePRKey] ? diffModeByPR[activePRKey] : 'unified';
      const reviewDraft = activePRKey ? (reviewDraftByPR[activePRKey] || '') : '';
      const reviewIntent = activePRKey ? (reviewIntentByPR[activePRKey] || '') : '';
      const reviewBusy = Boolean(activePRKey && reviewBusyByPR[activePRKey]);
      const reviewError = activePRKey ? (reviewErrorByPR[activePRKey] || '') : '';
      const visibleTimeline = (timeline || []).slice(-30);
      const reviewTree = useMemo(() => buildReviewTree(activeFiles), [activeFiles]);
      const parsedPatch = useMemo(() => parseUnifiedDiffPatch(activeDiff && activeDiff.patch), [activeDiff]);
      const fetchDiff = (path) => {
        if (!activePR || !activePRKey || !path) return;
        const diffKey = `${activePRKey}:${path}`;
        if (diffByFile[diffKey] || diffLoadingByFile[diffKey]) return;
        setDiffLoadingByFile(current => ({ ...current, [diffKey]: true }));
        setDiffErrorsByFile(current => ({ ...current, [diffKey]: '' }));
        fetch(`/api/v1/gitea/prs/${encodeURIComponent(activePR.owner)}/${encodeURIComponent(activePR.repo)}/${encodeURIComponent(activePR.index)}/diff?file=${encodeURIComponent(path)}`)
          .then(response => {
            if (!response.ok) throw new Error('failed to load file diff');
            return response.json();
          })
          .then(data => {
            setDiffByFile(current => ({ ...current, [diffKey]: data }));
          })
          .catch(error => {
            setDiffByFile(current => ({ ...current, [diffKey]: null }));
            setDiffErrorsByFile(current => ({ ...current, [diffKey]: error.message || 'failed to load file diff' }));
          })
          .finally(() => {
            setDiffLoadingByFile(current => ({ ...current, [diffKey]: false }));
          });
      };

      useEffect(() => {
        let cancelled = false;
        fetch('/api/v1/gitea/prs')
          .then(response => {
            if (!response.ok) throw new Error('failed to load pull requests');
            return response.json();
          })
          .then(data => {
            if (!cancelled) setPRs(asArrayPayload(data, 'prs'));
          })
          .catch(() => {
            if (!cancelled) setPRs([]);
          });
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (!activePR || !activePRKey) return;
        let cancelled = false;
        setLoadingByPR(current => ({ ...current, [activePRKey]: true }));
        setCommentsLoadingByPR(current => ({ ...current, [activePRKey]: true }));
        setErrorsByPR(current => ({ ...current, [activePRKey]: '' }));
        setCommentErrorsByPR(current => ({ ...current, [activePRKey]: '' }));
        Promise.allSettled([
          fetch(`/api/v1/gitea/prs/${encodeURIComponent(activePR.owner)}/${encodeURIComponent(activePR.repo)}/${encodeURIComponent(activePR.index)}/files`).then(response => {
            if (!response.ok) throw new Error('failed to load PR files');
            return response.json();
          }),
          fetch(`/api/v1/gitea/prs/${encodeURIComponent(activePR.owner)}/${encodeURIComponent(activePR.repo)}/${encodeURIComponent(activePR.index)}/comments`).then(response => {
            if (!response.ok) throw new Error('failed to load PR comments');
            return response.json();
          }),
        ]).then(([filesResult, commentsResult]) => {
          if (cancelled) return;
          if (filesResult.status === 'fulfilled') {
            setFilesByPR(current => ({ ...current, [activePRKey]: asArrayPayload(filesResult.value, 'files') }));
          } else {
            setFilesByPR(current => ({ ...current, [activePRKey]: [] }));
            setErrorsByPR(current => ({ ...current, [activePRKey]: filesResult.reason.message || 'failed to load PR files' }));
          }
          if (commentsResult.status === 'fulfilled') {
            setCommentsByPR(current => ({ ...current, [activePRKey]: asArrayPayload(commentsResult.value, 'comments') }));
          } else {
            setCommentsByPR(current => ({ ...current, [activePRKey]: [] }));
            setCommentErrorsByPR(current => ({ ...current, [activePRKey]: commentsResult.reason.message || 'failed to load PR comments' }));
          }
        }).finally(() => {
          if (!cancelled) {
            setLoadingByPR(current => ({ ...current, [activePRKey]: false }));
            setCommentsLoadingByPR(current => ({ ...current, [activePRKey]: false }));
          }
        });
        return () => { cancelled = true; };
      }, [activePR, activePRKey]);

      useEffect(() => {
        if (!activePRKey || !runtimeReviewFile) return;
        if (selectedFileSourceByPR[activePRKey] === 'user') return;
        setSelectedFileByPR(current => current[activePRKey] === runtimeReviewFile ? current : ({ ...current, [activePRKey]: runtimeReviewFile }));
        setSelectedFileSourceByPR(current => ({ ...current, [activePRKey]: 'runtime' }));
        fetchDiff(runtimeReviewFile);
      }, [activePR, activePRKey, runtimeReviewFile, selectedFileSourceByPR, diffByFile, diffLoadingByFile]);

      const onSelectFile = (path) => {
        if (!activePRKey || !path) return;
        setSelectedFileByPR(current => ({ ...current, [activePRKey]: path }));
        setSelectedFileSourceByPR(current => ({ ...current, [activePRKey]: 'user' }));
        fetchDiff(path);
      };

      const activeReviewState = (path) => reviewFileState(activeFileStates[path], selectedFilePath === path);

      const reviewCommentsForFile = activeComments.filter(comment => String(comment.path || '').trim() === selectedFilePath);
      const commentThreadsByLine = reviewCommentsForFile.reduce((acc, comment) => {
        const line = Number(comment.line || 0);
        const originalLine = Number(comment.original_line || 0);
        if (line > 0) {
          const key = `new:${line}`;
          acc[key] = acc[key] || [];
          acc[key].push(comment);
        }
        if (originalLine > 0) {
          const key = `old:${originalLine}`;
          acc[key] = acc[key] || [];
          acc[key].push(comment);
        }
        return acc;
      }, {});

      const threadedCommentKeys = new Set();
      parsedPatch.forEach(line => {
        if (line.kind === 'add' || line.kind === 'context') {
          const key = `new:${line.newLine}`;
          if (line.newLine && commentThreadsByLine[key]) threadedCommentKeys.add(key);
        }
        if (line.kind === 'remove') {
          const key = `old:${line.oldLine}`;
          if (line.oldLine && commentThreadsByLine[key]) threadedCommentKeys.add(key);
        }
      });
      const generalComments = activeComments.filter(comment => {
        const path = String(comment.path || '').trim();
        if (path && path !== selectedFilePath) return false;
        const line = Number(comment.line || 0);
        const originalLine = Number(comment.original_line || 0);
        if (line > 0 && threadedCommentKeys.has(`new:${line}`)) return false;
        if (originalLine > 0 && threadedCommentKeys.has(`old:${originalLine}`)) return false;
        return true;
      });

      const commentThreadForLine = (line) => {
        if (line.kind === 'remove') return commentThreadsByLine[`old:${line.oldLine}`] || [];
        if (line.kind === 'add' || line.kind === 'context') return commentThreadsByLine[`new:${line.newLine}`] || [];
        return [];
      };

      const refreshComments = () => {
        if (!activePR || !activePRKey) return Promise.resolve();
        return fetch(`/api/v1/gitea/prs/${encodeURIComponent(activePR.owner)}/${encodeURIComponent(activePR.repo)}/${encodeURIComponent(activePR.index)}/comments`)
          .then(response => {
            if (!response.ok) throw new Error('failed to refresh PR comments');
            return response.json();
          })
          .then(data => {
            setCommentsByPR(current => ({ ...current, [activePRKey]: asArrayPayload(data, 'comments') }));
            setCommentErrorsByPR(current => ({ ...current, [activePRKey]: '' }));
          });
      };

      const submitReview = () => {
        if (!activePR || !activePRKey || !selectedFilePath || !reviewIntent) return;
        setReviewBusyByPR(current => ({ ...current, [activePRKey]: true }));
        setReviewErrorByPR(current => ({ ...current, [activePRKey]: '' }));
        fetch(`/api/v1/gitea/prs/${encodeURIComponent(activePR.owner)}/${encodeURIComponent(activePR.repo)}/${encodeURIComponent(activePR.index)}/review`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event: reviewIntent, body: reviewDraft }),
        })
          .then(response => {
            if (!response.ok) throw new Error(`review submit failed: ${response.status}`);
            return response.json();
          })
          .then(() => refreshComments())
          .then(() => {
            const nextState =
              reviewIntent === 'APPROVED' ? 'reviewed-approved'
              : reviewIntent === 'REQUEST_CHANGES' ? 'reviewed-blocking'
              : 'reviewed-comment';
            setFileStatesByPR(current => ({
              ...current,
              [activePRKey]: {
                ...(current[activePRKey] || {}),
                [selectedFilePath]: nextState,
              },
            }));
            setReviewDraftByPR(current => ({ ...current, [activePRKey]: '' }));
            setReviewIntentByPR(current => ({ ...current, [activePRKey]: '' }));
          })
          .catch(error => {
            setReviewErrorByPR(current => ({ ...current, [activePRKey]: error.message || 'review submit failed' }));
          })
          .finally(() => {
            setReviewBusyByPR(current => ({ ...current, [activePRKey]: false }));
          });
      };

      const renderUnifiedLine = (line, index) => {
        if (line.kind === 'hunk') {
          return (
            <div key={`${line.text}-${index}`} className="px-4 py-1 font-mono text-[11px] leading-5 bg-zinc-800/40 text-zinc-500 border-b border-zinc-900/60">
              {line.text}
            </div>
          );
        }
        const lineClasses =
          line.kind === 'add' ? 'bg-emerald-500/10 text-emerald-200'
          : line.kind === 'remove' ? 'bg-red-500/10 text-red-200'
          : 'text-zinc-400';
        const thread = commentThreadForLine(line);
        return (
          <React.Fragment key={`${line.text}-${index}`}>
            <div className={`flex font-mono text-[11px] leading-5 ${lineClasses}`}>
              <span className="w-10 text-right pr-3 text-zinc-700 select-none shrink-0">{line.oldLine || ''}</span>
              <span className="w-10 text-right pr-3 text-zinc-700 select-none shrink-0">{line.newLine || ''}</span>
              <span className="flex-1 whitespace-pre-wrap break-all">{line.text || ' '}</span>
            </div>
            {thread.length > 0 && (
              <div className="px-4 py-2">
                <ReviewCommentThread comments={thread} />
              </div>
            )}
          </React.Fragment>
        );
      };

      const renderSideBySideLine = (line, index) => {
        if (line.kind === 'hunk') {
          return (
            <div key={`${line.text}-${index}`} className="px-4 py-1 font-mono text-[11px] leading-5 bg-zinc-800/40 text-zinc-500 border-b border-zinc-900/60">
              {line.text}
            </div>
          );
        }
        const thread = commentThreadForLine(line);
        const leftClass = line.kind === 'remove' ? 'bg-red-500/10 text-red-200' : line.kind === 'context' ? 'text-zinc-400' : 'text-zinc-700';
        const rightClass = line.kind === 'add' ? 'bg-emerald-500/10 text-emerald-200' : line.kind === 'context' ? 'text-zinc-400' : 'text-zinc-700';
        const leftText = line.kind === 'remove' || line.kind === 'context' ? line.text : '';
        const rightText = line.kind === 'add' || line.kind === 'context' ? line.text : '';
        const anchorSide = line.kind === 'remove' ? 'left' : line.kind === 'add' ? 'right' : 'both';
        return (
          <React.Fragment key={`${line.text}-${index}`}>
            <div className="grid grid-cols-2 border-b border-zinc-900/20">
              <div className={`flex font-mono text-[11px] leading-5 ${leftClass}`}>
                <span className="w-10 text-right pr-3 text-zinc-700 select-none shrink-0">{line.oldLine || ''}</span>
                <span className="flex-1 whitespace-pre-wrap break-all">{leftText}</span>
              </div>
              <div className={`flex font-mono text-[11px] leading-5 border-l border-zinc-900/40 ${rightClass}`}>
                <span className="w-10 text-right pr-3 text-zinc-700 select-none shrink-0">{line.newLine || ''}</span>
                <span className="flex-1 whitespace-pre-wrap break-all">{rightText}</span>
              </div>
            </div>
            {thread.length > 0 && (
              <div className="grid grid-cols-2 px-4 py-2 gap-4">
                <div>{anchorSide === 'left' || anchorSide === 'both' ? <ReviewCommentThread comments={thread} /> : null}</div>
                <div>{anchorSide === 'right' || anchorSide === 'both' ? <ReviewCommentThread comments={thread} /> : null}</div>
              </div>
            )}
          </React.Fragment>
        );
      };

      return (
        <div className="flex-1 flex flex-col min-h-0">
          <div className="flex-1 flex min-h-0">
            <div style={{ width: `${leftRailWidth}px` }} className="border-r border-zinc-800 bg-zinc-900/30 overflow-y-auto shrink-0">
              <div className="p-3 border-b border-zinc-800/60">
                <div className="text-[10px] uppercase text-zinc-500">Pull Request</div>
                {activePR ? (
                  <>
                    <div className="mt-2 text-xs text-zinc-200">{activePR.repo} #{activePR.index}</div>
                    <div className="mt-1 text-[11px] text-zinc-400 leading-relaxed">
                      {activeTitle || `${activePR.owner}/${activePR.repo}`}
                    </div>
                  </>
                ) : (
                  <div className="mt-2 text-[11px] text-zinc-600">No active PR</div>
                )}
              </div>
              <div className="px-3 py-2 border-b border-zinc-800/60 flex items-center gap-2 text-[10px] uppercase text-zinc-500">
                <Icon name="GitPullRequest" className="w-3 h-3" />
                <span>Changed Files</span>
                <span className="ml-auto text-zinc-600">{activeFiles.length}</span>
              </div>
              {!activePR ? (
                <div className="px-3 py-3 text-[11px] text-zinc-600">This surface activates when {focused ? focused.name : 'the agent'} picks up review work.</div>
              ) : loadingByPR[activePRKey] ? (
                <div className="px-3 py-3 text-[11px] text-zinc-600">Loading changed files...</div>
              ) : errorsByPR[activePRKey] ? (
                <div className="px-3 py-3 text-[11px] text-red-300">{errorsByPR[activePRKey]}</div>
              ) : reviewTree.length === 0 ? (
                <div className="px-3 py-3 text-[11px] text-zinc-600">No changed files returned.</div>
              ) : (
                <div className="py-1">
                  {reviewTree.map((node, index) => (
                    <ReviewTreeNode
                      key={`${node.path || node.name}-${index}`}
                      node={node}
                      selectedPath={selectedFilePath}
                      fileStates={activeFileStates}
                      onSelectFile={onSelectFile}
                    />
                  ))}
                </div>
              )}
            </div>
            <ResizeRailHandle startDragTree={startDragTree} isDraggingTree={isDraggingTree} />
            <div className="flex-1 flex flex-col min-w-0">
              <div className="px-4 py-1.5 border-b border-zinc-800 bg-zinc-900/30 flex items-center gap-2 shrink-0">
                <Icon name="GitPullRequest" className="w-3.5 h-3.5 text-blue-400" />
                <span className="text-xs text-zinc-300 truncate">
                  {selectedFilePath || (activePR ? `${activePR.repo} #${activePR.index}` : 'Reviewer surface')}
                </span>
                {selectedFilePath && (
                  <button
                    onClick={() => setDiffModeByPR(current => ({ ...current, [activePRKey]: diffMode === 'unified' ? 'side-by-side' : 'unified' }))}
                    className="ml-auto flex items-center gap-1 rounded border border-zinc-800 px-2 py-0.5 text-[10px] text-zinc-400 hover:border-zinc-700 hover:text-zinc-200"
                  >
                    <Icon name="Columns2" className="w-3 h-3" />
                    <span>{diffMode === 'unified' ? 'Unified' : 'Side-by-side'}</span>
                  </button>
                )}
              </div>
              <div className="flex-1 overflow-y-auto bg-zinc-950">
                {!activePR ? (
                  <div className="h-full flex items-center justify-center text-center px-6">
                    <div>
                      <div className="text-sm text-zinc-400">No PR currently under review by {focused ? focused.name : 'this agent'}</div>
                      <div className="mt-1 text-[10px] text-zinc-600">The surface activates when the runtime sets `workspace.current_pr` during review work.</div>
                    </div>
                  </div>
                ) : !selectedFilePath ? (
                  <div className="h-full flex items-center justify-center text-center px-6">
                    <div>
                      <div className="text-sm text-zinc-400">No file currently in focus</div>
                      <div className="mt-1 text-[10px] text-zinc-600">The runtime will follow `workspace.current_review_file`, or you can click a file in the tree.</div>
                    </div>
                  </div>
                ) : diffLoadingByFile[fileDiffKey] ? (
                  <div className="h-full flex items-center justify-center text-sm text-zinc-600">Loading diff...</div>
                ) : diffErrorsByFile[fileDiffKey] ? (
                  <div className="h-full flex items-center justify-center text-sm text-red-300 px-6 text-center">{diffErrorsByFile[fileDiffKey]}</div>
                ) : !activeDiff || !String(activeDiff.patch || '').trim() ? (
                  <div className="h-full flex items-center justify-center text-center px-6">
                    <div>
                      <div className="text-sm text-zinc-400">no preview available</div>
                      <div className="mt-1 text-[10px] text-zinc-600">This file does not include a renderable patch.</div>
                    </div>
                  </div>
                ) : (
                  <div className="min-h-full">
                    {(generalComments.length > 0 || commentErrorsByPR[activePRKey] || commentsLoadingByPR[activePRKey]) && (
                      <div className="px-4 py-3 border-b border-zinc-800/60 space-y-2">
                        <div className="text-[10px] uppercase text-zinc-500">General comments</div>
                        {commentsLoadingByPR[activePRKey] && <div className="text-[10px] text-zinc-600">Refreshing comments...</div>}
                        {commentErrorsByPR[activePRKey] && <div className="text-[10px] text-red-300">{commentErrorsByPR[activePRKey]}</div>}
                        {generalComments.map((comment, index) => (
                          <ReviewCommentThread key={`general-${index}`} comments={[comment]} />
                        ))}
                      </div>
                    )}
                    {diffMode === 'unified'
                      ? parsedPatch.map(renderUnifiedLine)
                      : parsedPatch.map(renderSideBySideLine)}
                  </div>
                )}
              </div>
              {reviewError && (
                <div className="px-4 py-2 border-t border-zinc-900 bg-red-950/30 text-[11px] text-red-300 shrink-0">
                  {reviewError}
                </div>
              )}
              {activePR && selectedFilePath && reviewIntent && (
                <div className="px-4 py-3 border-t border-zinc-800 bg-zinc-900/60 shrink-0">
                  <div className="text-[10px] uppercase text-zinc-500 mb-2">{reviewIntent.toLowerCase().replace('_', ' ')}</div>
                  <textarea
                    value={reviewDraft}
                    onChange={event => setReviewDraftByPR(current => ({ ...current, [activePRKey]: event.target.value }))}
                    disabled={reviewBusy}
                    className="w-full min-h-[88px] resize-none rounded border border-zinc-800 bg-zinc-950 px-3 py-2 text-xs text-zinc-200 outline-none focus:border-zinc-700"
                    placeholder="Review body"
                  />
                  <div className="mt-2 flex items-center gap-2">
                    <div className="text-[10px] text-zinc-600 flex-1">Review body for {selectedFilePath}</div>
                    <button
                      onClick={() => {
                        setReviewIntentByPR(current => ({ ...current, [activePRKey]: '' }));
                        setReviewErrorByPR(current => ({ ...current, [activePRKey]: '' }));
                      }}
                      disabled={reviewBusy}
                      className="text-xs px-3 py-1.5 border border-zinc-700 text-zinc-400 rounded hover:bg-zinc-800 hover:text-zinc-200 disabled:opacity-50"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={submitReview}
                      disabled={reviewBusy}
                      className="text-xs px-3 py-1.5 bg-amber-500 text-zinc-950 rounded font-semibold hover:bg-amber-400 disabled:opacity-50"
                    >
                      Submit
                    </button>
                  </div>
                </div>
              )}
              {activePR && selectedFilePath && (
                <div className="px-4 py-3 border-t border-zinc-800 bg-zinc-900/30 flex items-center gap-2 shrink-0">
                  <span className="text-[10px] text-zinc-500 flex items-center gap-1.5">
                    <Icon name="GitPullRequest" className="w-3 h-3" /> {activePR.repo} #{activePR.index}
                  </span>
                  <div className="ml-auto flex items-center gap-2">
                    <button
                      onClick={() => setReviewIntentByPR(current => ({ ...current, [activePRKey]: 'COMMENT' }))}
                      disabled={reviewBusy}
                      className="text-xs px-3 py-1.5 border border-zinc-700 text-zinc-300 rounded hover:bg-zinc-800 disabled:opacity-50"
                    >
                      Comment
                    </button>
                    <button
                      onClick={() => setReviewIntentByPR(current => ({ ...current, [activePRKey]: 'REQUEST_CHANGES' }))}
                      disabled={reviewBusy}
                      className="text-xs px-3 py-1.5 border border-amber-500/30 text-amber-300 rounded hover:bg-amber-500/10 disabled:opacity-50"
                    >
                      Request Changes
                    </button>
                    <button
                      onClick={() => setReviewIntentByPR(current => ({ ...current, [activePRKey]: 'APPROVED' }))}
                      disabled={reviewBusy}
                      className="text-xs px-4 py-1.5 bg-emerald-500 text-zinc-950 rounded font-semibold hover:bg-emerald-400 disabled:opacity-50"
                    >
                      Approve
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
          <ActivityTimeline items={visibleTimeline} activityHeight={activityHeight} startDragActivity={startDragActivity} isDraggingActivity={isDraggingActivity} />
        </div>
      );
    }

    function ActionSurface({
      focused,
      plan,
      queueItem,
      timeline,
      leftRailWidth,
      startDragTree,
      isDraggingTree,
      activityHeight,
      startDragActivity,
      isDraggingActivity,
      approvalBusy,
      approvalError,
      revisionOpen,
      revisionNote,
      setRevisionNote,
      onApprove,
      onReject,
      onOpenRevise,
      onCancelRevise,
      onSubmitRevise,
    }) {
      const trigger = queueItem && queueItem.trigger;
      const triggerSource = trigger && typeof trigger.source === 'object' ? trigger.source : null;
      const triggerSummary = trigger && String(trigger.summary || '').trim();
      const triggerType = trigger && String(trigger.type || '').trim();
      const triggerFrom = triggerSourceField(triggerSource, 'from');
      const triggerSubject = triggerSourceField(triggerSource, 'subject');
      const triggerBody = triggerSourceField(triggerSource, 'body');
      const planSteps = Array.isArray(plan && plan.steps) ? plan.steps : [];
      const currentStep = Number(plan && plan.current_step);
      const actionTimeline = actionTimelineItems(timeline, plan, queueItem);
      const params = queueItem && typeof queueItem.params === 'object' && queueItem.params ? queueItem.params : {};
      const hasEmailArtifact = isEmailAction(queueItem);
      const hasCalendarArtifact = isCalendarAction(queueItem);
      const lockboxLabel = queueItem ? `destructive_write · ${queueItem.status === 'revising' ? 'revising' : 'awaiting approval'}` : '';
      const canSubmitRevision = queueItem && queueItem.status === 'pending' && String(revisionNote || '').trim() && !approvalBusy;
      return (
        <div className="flex-1 flex flex-col min-h-0">
          <div className="flex-1 flex min-h-0">
            <div style={{ width: `${leftRailWidth}px` }} className="border-r border-zinc-800 bg-zinc-900/30 overflow-y-auto shrink-0">
              <div className="p-3 border-b border-zinc-800/60">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-[10px] uppercase text-zinc-500">Trigger</span>
                  {triggerType && (
                    <span className="rounded border border-zinc-700 px-1.5 py-0.5 text-[9px] uppercase text-zinc-400">
                      {triggerType}
                    </span>
                  )}
                  <span className="ml-auto text-[9px] text-zinc-600">
                    {trigger && trigger.occurred_at ? relativeTime(trigger.occurred_at) : 'n/a'}
                  </span>
                </div>
                {trigger ? (
                  <>
                    <div className="text-[11px] text-zinc-200 leading-relaxed">
                      {triggerSummary || 'trigger received'}
                    </div>
                    {(triggerFrom || triggerSubject || triggerBody) && (
                      <div className="mt-3 space-y-2">
                        {triggerFrom && (
                          <div className="flex gap-2 text-[10px]">
                            <span className="w-12 shrink-0 text-zinc-600">From</span>
                            <span className="text-zinc-300 break-all">{triggerFrom}</span>
                          </div>
                        )}
                        {triggerSubject && (
                          <div className="flex gap-2 text-[10px]">
                            <span className="w-12 shrink-0 text-zinc-600">Subject</span>
                            <span className="text-zinc-300">{triggerSubject}</span>
                          </div>
                        )}
                        {triggerBody && (
                          <div className="mt-2 rounded border border-zinc-800 bg-zinc-950/60 p-2 text-[10px] leading-relaxed text-zinc-400 whitespace-pre-wrap">
                            {triggerBody}
                          </div>
                        )}
                      </div>
                    )}
                  </>
                ) : (
                  <div className="text-[11px] text-zinc-600">no trigger context</div>
                )}
              </div>
              <div className="px-3 py-3">
                <div className="text-[10px] uppercase text-zinc-500 mb-2">Plan</div>
                {planSteps.length > 0 ? (
                  <ul className="space-y-1.5">
                    {planSteps.map((step, index) => {
                      const completed = index < currentStep || currentStep >= planSteps.length;
                      const current = currentStep < planSteps.length && index === currentStep;
                      return (
                        <PlanStep
                          key={`${step}-${index}`}
                          icon={completed ? 'CheckCircle2' : current ? 'Clock' : 'Circle'}
                          iconClass={completed ? 'text-emerald-400' : current ? 'text-amber-400' : 'text-zinc-600'}
                          text={step}
                          textClass={completed ? 'text-zinc-300' : current ? 'text-amber-300' : 'text-zinc-600'}
                        />
                      );
                    })}
                  </ul>
                ) : (
                  <div className="text-[11px] text-zinc-600">no plan declared yet</div>
                )}
              </div>
            </div>
            <ResizeRailHandle startDragTree={startDragTree} isDraggingTree={isDraggingTree} />
            <div className="flex-1 flex flex-col min-w-0">
              <div className="px-4 py-1.5 border-b border-zinc-800 bg-zinc-900/30 flex items-center gap-2 shrink-0">
                <Icon name={hasEmailArtifact ? 'Mail' : hasCalendarArtifact ? 'Calendar' : 'FileCode'} className={`w-3.5 h-3.5 ${hasEmailArtifact ? 'text-blue-400' : hasCalendarArtifact ? 'text-emerald-400' : 'text-zinc-400'}`} />
                <span className="text-xs text-zinc-300">
                  {hasEmailArtifact ? 'Compose email' : hasCalendarArtifact ? 'Calendar event' : queueItem ? (queueItem.action || 'Queued action') : 'Action artifact'}
                </span>
                {queueItem && (
                  <span className="text-[10px] text-amber-400 ml-auto px-1.5 py-0.5 border border-amber-500/30 rounded flex items-center gap-1">
                    <Icon name="ShieldAlert" className="w-2.5 h-2.5" /> {lockboxLabel}
                  </span>
                )}
              </div>
              <div className="flex-1 overflow-y-auto bg-zinc-950 px-6 py-4 text-xs">
                {queueItem ? (
                  hasEmailArtifact ? (
                    <>
                      <div className="space-y-2 mb-4">
                        <div className="flex gap-3"><span className="text-zinc-500 w-16 shrink-0">To:</span><span className="text-zinc-300 break-all">{String(params.to || '-')}</span></div>
                        <div className="flex gap-3"><span className="text-zinc-500 w-16 shrink-0">Subject:</span><span className="text-zinc-300">{String(params.subject || '-')}</span></div>
                      </div>
                      <div className="border-t border-zinc-800 pt-4 text-zinc-300 leading-relaxed font-sans text-sm whitespace-pre-wrap">
                        {String(params.body || '').trim() || 'No body drafted yet.'}
                      </div>
                    </>
                  ) : hasCalendarArtifact ? (
                    <div className="space-y-3 text-[12px]">
                      <div className="text-sm text-zinc-200 font-semibold">{String(params.summary || 'Untitled event')}</div>
                      <div className="grid grid-cols-[72px_1fr] gap-y-2 gap-x-3 text-zinc-300">
                        <span className="text-zinc-500">Start</span>
                        <span>{String(params.start || '-')}</span>
                        <span className="text-zinc-500">End</span>
                        <span>{String(params.end || '-')}</span>
                        <span className="text-zinc-500">Location</span>
                        <span>{String(params.location || '-')}</span>
                      </div>
                      {params.description && (
                        <div className="border-t border-zinc-800 pt-4 text-zinc-300 leading-relaxed whitespace-pre-wrap">
                          {String(params.description)}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div className="text-sm text-zinc-200 font-semibold">{queueItem.action || 'Queued action'}</div>
                      <pre className="m-0 overflow-x-auto rounded border border-zinc-800 bg-zinc-900/50 p-3 text-[11px] leading-relaxed text-zinc-300">{JSON.stringify(params, null, 2)}</pre>
                    </div>
                  )
                ) : planSteps.length > 0 ? (
                  <div className="h-full flex items-center justify-center text-center">
                    <div>
                      <div className="text-sm text-zinc-400">no queued action — agent is still working</div>
                      {focused && <div className="mt-1 text-[10px] text-zinc-600">{focused.name} has declared a plan but has not queued a write yet.</div>}
                    </div>
                  </div>
                ) : (
                  <div className="h-full flex items-center justify-center text-center">
                    <div className="text-sm text-zinc-600">No action artifact available.</div>
                  </div>
                )}
              </div>
              {revisionOpen && queueItem && queueItem.status === 'pending' && (
                <div className="px-4 py-3 border-t border-zinc-800 bg-zinc-900/60 shrink-0">
                  <div className="text-[10px] uppercase text-zinc-500 mb-2">Revision note</div>
                  <textarea
                    value={revisionNote}
                    onChange={event => setRevisionNote(event.target.value)}
                    placeholder="Tell the agent what to revise before re-queuing."
                    disabled={approvalBusy}
                    className="w-full min-h-[88px] resize-none rounded border border-zinc-800 bg-zinc-950 px-3 py-2 text-xs text-zinc-200 outline-none focus:border-zinc-700"
                  />
                  <div className="mt-2 flex items-center gap-2">
                    <div className="text-[10px] text-zinc-600 flex-1">This sends the queued action back for refinement.</div>
                    <button onClick={onCancelRevise} disabled={approvalBusy} className="text-xs px-3 py-1.5 border border-zinc-700 text-zinc-400 rounded hover:bg-zinc-800 hover:text-zinc-200 disabled:opacity-50">
                      Cancel
                    </button>
                    <button onClick={onSubmitRevise} disabled={!canSubmitRevision} className="flex items-center gap-1.5 text-xs px-3 py-1.5 bg-amber-500 text-zinc-950 rounded font-semibold hover:bg-amber-400 disabled:opacity-50">
                      <Icon name="Edit3" className="w-3 h-3" /> Request revision
                    </button>
                  </div>
                </div>
              )}
              {approvalError && (
                <div className="px-4 py-2 border-t border-zinc-900 bg-red-950/30 text-[11px] text-red-300 shrink-0">
                  {approvalError}
                </div>
              )}
              {queueItem && queueItem.status === 'pending' && (
                <div className="px-4 py-3 border-t border-zinc-800 bg-zinc-900/30 flex items-center gap-2 shrink-0">
                  <span className="text-[10px] text-zinc-500 flex items-center gap-1.5">
                    <Icon name="ShieldAlert" className="w-3 h-3" /> Lockbox · {queueItem.queue_id || 'queue'}
                  </span>
                  <div className="ml-auto flex items-center gap-2">
                    <button onClick={onReject} disabled={approvalBusy} className="text-xs px-3 py-1.5 border border-zinc-700 text-zinc-400 rounded hover:bg-zinc-800 hover:text-zinc-200 disabled:opacity-50">Reject</button>
                    <button onClick={onOpenRevise} disabled={approvalBusy} className="flex items-center gap-1.5 text-xs px-3 py-1.5 border border-zinc-700 text-zinc-400 rounded hover:bg-zinc-800 hover:text-zinc-200 disabled:opacity-50">
                      <Icon name="Edit3" className="w-3 h-3" /> Revise
                    </button>
                    <button onClick={onApprove} disabled={approvalBusy} className="flex items-center gap-1.5 text-xs px-4 py-1.5 bg-amber-500 text-zinc-950 rounded font-semibold hover:bg-amber-400 disabled:opacity-50">
                      <Icon name="Send" className="w-3 h-3" /> Approve & send
                    </button>
                  </div>
                </div>
              )}
              {queueItem && queueItem.status === 'revising' && (
                <div className="px-4 py-3 border-t border-zinc-800 bg-zinc-900/30 flex items-start gap-2 shrink-0">
                  <Icon name="Edit3" className="w-3.5 h-3.5 text-amber-400 mt-0.5 shrink-0" />
                  <div className="min-w-0">
                    <div className="text-[10px] uppercase text-amber-400">Revision requested</div>
                    <div className="mt-1 text-[11px] text-zinc-400 whitespace-pre-wrap">{String(queueItem.note || 'Awaiting updated artifact from the agent.')}</div>
                  </div>
                </div>
              )}
            </div>
          </div>
          <ActivityTimeline items={actionTimeline} activityHeight={activityHeight} startDragActivity={startDragActivity} isDraggingActivity={isDraggingActivity} />
        </div>
      );
    }

    function ArchitectSurface({
      focused,
      workspace,
      timeline,
      leftRailWidth,
      startDragTree,
      isDraggingTree,
      activityHeight,
      startDragActivity,
      isDraggingActivity,
    }) {
      const [prs, setPRs] = useState([]);
      const [selectedTaskBySession, setSelectedTaskBySession] = useState({});
      const [delegationEvents, setDelegationEvents] = useState([]);

      const activeSessionID = String(workspace && workspace.current_session_id || '').trim();
      const activeObjective = String(workspace && workspace.current_objective || '').trim();
      const sessionEvents = Array.isArray(workspace && workspace.session_timeline) ? workspace.session_timeline : [];
      const architectTimeline = useMemo(() => architectTimelineItems(sessionEvents).slice(-30), [sessionEvents]);
      const prList = useMemo(() => asArrayPayload(prs, 'prs'), [prs]);

      useEffect(() => {
        if (!activeSessionID) {
          setDelegationEvents([]);
          return;
        }
        let cancelled = false;
        const load = () => {
          fetch(`/api/v1/delegation-timeline?session_id=${encodeURIComponent(activeSessionID)}`)
            .then(response => response.ok ? response.json() : { events: [] })
            .then(data => {
              if (cancelled) return;
              setDelegationEvents(Array.isArray(data && data.events) ? data.events : []);
            })
            .catch(() => {
              if (!cancelled) setDelegationEvents([]);
            });
        };
        load();
        const id = setInterval(load, 5000);
        return () => {
          cancelled = true;
          clearInterval(id);
        };
      }, [activeSessionID]);

      const sessionTasks = useMemo(() => {
        if (!activeSessionID) return [];
        const enrichProjected = task => {
          const parsed = parseDelegatedTask(task.content);
          const prNumber = Number(task && task.pr_number) || extractPRNumberFromText(collectTaskText(task));
          const prInfo = prList.find(pr => Number(pr.number) === prNumber) || null;
          return {
            ...task,
            parsed,
            prNumber,
            prInfo,
            issueRef: extractIssueRef(task, parsed),
            displayStatus: architectTaskStatus(task, prInfo),
            lifecycleState: architectLifecycleState(task, prInfo),
          };
        };
        const projected = (Array.isArray(workspace && workspace.session_tasks) ? workspace.session_tasks : [])
          .filter(task => String(task && task.session_id || '') === activeSessionID)
          .map(enrichProjected);
        if (projected.length > 0) {
          return projected.sort((a, b) => timeValue(a.created_at) - timeValue(b.created_at));
        }
        const taskIDOrder = [];
        const eventsByTaskID = new Map();
        const noIDEvents = [];
        delegationEvents.forEach(evt => {
          if (!evt) return;
          const meta = (evt && evt.metadata) || {};
          const taskID = String(meta.task_id || '');
          if (taskID) {
            if (!eventsByTaskID.has(taskID)) {
              taskIDOrder.push(taskID);
              eventsByTaskID.set(taskID, []);
            }
            eventsByTaskID.get(taskID).push(evt);
            return;
          }
          if (evt.type !== 'delegation_started' && evt.type !== 'task_dispatched') return;
          noIDEvents.push(evt);
        });

        const buildEntry = (id, primary, statusEvent, defaultStatus) => {
          const meta = (primary && primary.metadata) || {};
          const targetAgent = String(meta.target_agent || (primary && primary.agent) || '');
          const content = String(meta.content || meta.task || '');
          let status = defaultStatus;
          if (statusEvent && statusEvent.type === 'delegation_ended') {
            const stateStr = String(((statusEvent.metadata) || {}).state || 'completed').trim();
            status = stateStr || 'completed';
          } else if (statusEvent && statusEvent.type === 'task_dispatched') {
            status = 'dispatched';
          }
          const prNumber = Number(meta.pr_number) || extractPRNumberFromText(content);
          const prInfo = prList.find(pr => Number(pr.number) === prNumber) || null;
          return {
            id,
            agent: targetAgent || 'unknown',
            session_id: String(meta.session_id || activeSessionID),
            created_at: (primary && primary.timestamp) || '',
            content,
            parsed: parseDelegatedTask(content),
            prNumber,
            prInfo,
            issueRef: '',
            displayStatus: status,
            lifecycleState: status,
          };
        };

        const tasksFromIDs = taskIDOrder.map(taskID => {
          const events = eventsByTaskID.get(taskID) || [];
          const started = events.filter(e => e.type === 'delegation_started');
          const dispatched = events.filter(e => e.type === 'task_dispatched');
          const ended = events.filter(e => e.type === 'delegation_ended');
          let primary = started.find(e => {
            const meta = e.metadata || {};
            const eventAgent = String(e.agent || '');
            const targetAgent = String(meta.target_agent || '');
            return eventAgent && targetAgent && eventAgent !== targetAgent;
          }) || started[0] || dispatched[0] || ended[0];
          if (!primary) return null;
          const statusEvent = ended[ended.length - 1] || dispatched[dispatched.length - 1] || null;
          return buildEntry(taskID, primary, statusEvent, 'dispatched');
        }).filter(Boolean);

        const noIDSeen = new Map();
        noIDEvents.forEach(evt => {
          const meta = (evt && evt.metadata) || {};
          const targetAgent = String(meta.target_agent || evt.agent || '');
          const fallbackKey = `${targetAgent}-${evt.timestamp || ''}`;
          if (!fallbackKey || noIDSeen.has(fallbackKey)) return;
          noIDSeen.set(fallbackKey, buildEntry(fallbackKey, evt, evt, 'dispatched'));
        });

        return [...tasksFromIDs, ...Array.from(noIDSeen.values())]
          .sort((a, b) => timeValue(a.created_at) - timeValue(b.created_at));
      }, [activeSessionID, workspace, prList, delegationEvents]);
      const selectedTaskID = activeSessionID ? (selectedTaskBySession[activeSessionID] || '') : '';
      const selectedTask = sessionTasks.find(task => task.id === selectedTaskID) || null;
      const selectedTaskEvents = useMemo(() => taskEventsForAgent(sessionEvents, selectedTask), [sessionEvents, selectedTask]);

      useEffect(() => {
        let cancelled = false;
        const loadPRs = () => {
          fetch('/api/v1/gitea/prs')
            .then(response => {
              if (!response.ok) throw new Error('failed to load pull requests');
              return response.json();
            })
            .then(data => {
              if (!cancelled) setPRs(asArrayPayload(data, 'prs'));
            })
            .catch(() => {
              if (!cancelled) setPRs([]);
            });
        };
        loadPRs();
        const id = setInterval(loadPRs, 30000);
        return () => {
          cancelled = true;
          clearInterval(id);
        };
      }, []);

      useEffect(() => {
        if (!activeSessionID) return;
        if (!selectedTaskID) return;
        if (sessionTasks.some(task => task.id === selectedTaskID)) return;
        setSelectedTaskBySession(current => ({ ...current, [activeSessionID]: '' }));
      }, [activeSessionID, selectedTaskID, sessionTasks]);

      const narrativeItems = useMemo(() => {
        const items = [];
        if (activeObjective) {
          items.push({ icon: 'Target', text: activeObjective, t: 'objective' });
        }
        if (sessionTasks.length > 0) {
          items.push({ icon: 'GitBranch', text: `decomposed into ${sessionTasks.length} delegated task${sessionTasks.length === 1 ? '' : 's'}`, t: 'tasks' });
        }
        sessionEvents.slice(-6).forEach(evt => {
          items.push({
            icon: architectEventIcon(evt.type),
            text: architectEventText(evt),
            t: relativeTime(evt.timestamp),
          });
        });
        return items;
      }, [activeObjective, sessionTasks, sessionEvents]);

      return (
        <div className="flex-1 flex flex-col min-h-0">
          <div className="flex-1 flex min-h-0">
            <div style={{ width: `${leftRailWidth}px` }} className="border-r border-zinc-800 bg-zinc-900/30 overflow-y-auto shrink-0">
              <div className="p-3 border-b border-zinc-800/60">
                <div className="text-[10px] uppercase text-zinc-500">Strategic objective</div>
                <div className="mt-2 text-[11px] leading-relaxed text-zinc-300">
                  {activeObjective || 'No active objective yet.'}
                </div>
                {activeSessionID && (
                  <div className="mt-2 text-[9px] text-zinc-600">session {truncateMiddle(activeSessionID, 30)}</div>
                )}
              </div>
              <div className="px-3 py-2 border-b border-zinc-800/60 flex items-center gap-2 text-[10px] uppercase text-zinc-500">
                <Icon name="GitBranch" className="w-3 h-3" />
                <span>Dispatched Tasks</span>
                <span className="ml-auto text-zinc-600">{sessionTasks.length}</span>
              </div>
              {!activeSessionID ? (
                <div className="px-3 py-3 text-[11px] text-zinc-600">This surface activates when delegation activity establishes a current objective.</div>
              ) : sessionTasks.length === 0 ? (
                <div className="px-3 py-3 text-[11px] text-zinc-600">No delegated tasks found for this session yet.</div>
              ) : (
                <div className="relative px-3 py-3">
                  <div className="absolute left-6 top-0 bottom-0 border-l border-zinc-800/80" />
                  <div className="space-y-2">
                    {sessionTasks.map(task => (
                      <button
                        key={task.id}
                        type="button"
                        onClick={() => setSelectedTaskBySession(current => ({ ...current, [activeSessionID]: task.id }))}
                        className={`relative w-full text-left rounded border px-3 py-2 ml-4 ${selectedTask && selectedTask.id === task.id ? 'border-amber-500/40 bg-amber-500/5' : 'border-zinc-800 bg-zinc-900/40 hover:border-zinc-700'}`}
                      >
                        <span className="absolute -left-[15px] top-3 w-2 h-2 rounded-full bg-amber-400/80" />
                        <div className="flex items-center gap-2">
                          <span className="text-xs text-zinc-200 truncate">{task.agent}</span>
                          <span className={`rounded border px-1 py-px text-[8px] uppercase shrink-0 ${architectStatusClass(task.displayStatus)}`}>
                            {task.displayStatus}
                          </span>
                          {task.prNumber > 0 && <span className="ml-auto text-[10px] text-blue-300">PR #{task.prNumber}</span>}
                        </div>
                        <div className="mt-1 text-[11px] text-zinc-500 leading-relaxed">
                          {task.parsed.task || task.content}
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <ResizeRailHandle startDragTree={startDragTree} isDraggingTree={isDraggingTree} />
            <div className="flex-1 flex flex-col min-w-0">
              <div className="px-4 py-1.5 border-b border-zinc-800 bg-zinc-900/30 flex items-center gap-2 shrink-0">
                <Icon name="Workflow" className="w-3.5 h-3.5 text-amber-400" />
                <span className="text-xs text-zinc-300 truncate">
                  {selectedTask ? `${selectedTask.agent} · ${selectedTask.parsed.task || selectedTask.id}` : 'Decomposition view'}
                </span>
              </div>
              <div className="flex-1 overflow-y-auto bg-zinc-950">
                {!activeSessionID ? (
                  <div className="h-full flex items-center justify-center text-center px-6">
                    <div>
                      <div className="text-sm text-zinc-400">No active objective for {focused ? focused.name : 'this agent'}</div>
                      <div className="mt-1 text-[10px] text-zinc-600">The architect surface appears when delegate activity establishes a strategic objective.</div>
                    </div>
                  </div>
                ) : selectedTask ? (
                  <div className="p-4 space-y-4">
                    <div className="rounded border border-zinc-800 bg-zinc-900/40 p-4 space-y-3">
                      <div className="flex items-start gap-3">
                        <div className="min-w-0 flex-1">
                          <div className="text-[10px] uppercase text-zinc-500">Dispatch</div>
                          <div className="mt-1 text-sm text-zinc-200 leading-relaxed">{selectedTask.parsed.task || selectedTask.content}</div>
                        </div>
                        <span className={`rounded border px-2 py-1 text-[9px] uppercase shrink-0 ${architectStatusClass(selectedTask.displayStatus)}`}>
                          {selectedTask.lifecycleState}
                        </span>
                      </div>
                      <div className="grid grid-cols-2 gap-3 text-[11px] text-zinc-400">
                        <div><span className="text-zinc-600">assigned</span> · {selectedTask.agent}</div>
                        <div><span className="text-zinc-600">dispatched</span> · {relativeTime(selectedTask.created_at)}</div>
                        <div><span className="text-zinc-600">issue</span> · {selectedTask.issueRef || '-'}</div>
                        <div><span className="text-zinc-600">PR</span> · {selectedTask.prNumber > 0 ? `#${selectedTask.prNumber}` : '-'}</div>
                      </div>
                      <div className="space-y-2">
                        <div className="text-[10px] uppercase text-zinc-500">Acceptance criteria</div>
                        <div className="text-[11px] text-zinc-300 leading-relaxed">
                          {selectedTask.parsed.doneWhen || 'No explicit acceptance criteria declared.'}
                        </div>
                      </div>
                      {selectedTask.parsed.steps.length > 0 && (
                        <div className="space-y-2">
                          <div className="text-[10px] uppercase text-zinc-500">Decomposition</div>
                          <ol className="space-y-1">
                            {selectedTask.parsed.steps.map((step, index) => (
                              <PlanStep key={`${step}-${index}`} icon="ChevronRight" iconClass="text-zinc-600" text={step} />
                            ))}
                          </ol>
                        </div>
                      )}
                    </div>
                    <div className="rounded border border-zinc-800 bg-zinc-900/30 p-4">
                      <div className="text-[10px] uppercase text-zinc-500 mb-3">Live status feed</div>
                      {selectedTaskEvents.length === 0 ? (
                        <div className="text-[11px] text-zinc-600">No coordination events scoped to this assignee yet.</div>
                      ) : (
                        <div className="space-y-2">
                          {selectedTaskEvents.slice(-12).map((evt, index) => (
                            <div key={`${evt.type}-${evt.timestamp}-${index}`} className="flex items-start gap-2 text-[11px] text-zinc-400">
                              <span className="text-[9px] text-zinc-600 w-12 shrink-0">{relativeTime(evt.timestamp)}</span>
                              <Icon name={architectEventIcon(evt.type)} className="w-3 h-3 text-zinc-500 mt-0.5 shrink-0" />
                              <span className="leading-relaxed">{architectEventText(evt)}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="p-4 space-y-4">
                    <div className="rounded border border-zinc-800 bg-zinc-900/40 p-4">
                      <div className="text-[10px] uppercase text-zinc-500">Objective</div>
                      <div className="mt-2 text-sm text-zinc-200 leading-relaxed">{activeObjective || 'No objective available.'}</div>
                    </div>
                    <div className="rounded border border-zinc-800 bg-zinc-900/30 p-4">
                      <div className="text-[10px] uppercase text-zinc-500 mb-3">Coordination narrative</div>
                      {narrativeItems.length === 0 ? (
                        <div className="text-[11px] text-zinc-600">No coordination events captured for this session yet.</div>
                      ) : (
                        <div className="space-y-2">
                          {narrativeItems.map((item, index) => (
                            <div key={`${item.text}-${index}`} className="flex items-start gap-2 text-[11px] text-zinc-400">
                              <span className="text-[9px] text-zinc-600 w-12 shrink-0">{item.t || ''}</span>
                              <Icon name={item.icon} className="w-3 h-3 text-zinc-500 mt-0.5 shrink-0" />
                              <span className="leading-relaxed">{item.text}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
          <ActivityTimeline items={architectTimeline} activityHeight={activityHeight} startDragActivity={startDragActivity} isDraggingActivity={isDraggingActivity} />
        </div>
      );
    }

    function PlanStep({ icon, iconClass, text, textClass = 'text-zinc-400' }) {
      return (
        <li className="flex items-start gap-2 text-[11px]">
          <Icon name={icon} className={`w-3 h-3 shrink-0 mt-0.5 ${iconClass}`} />
          <span className={textClass}>{text}</span>
        </li>
      );
    }

    function ResizeRailHandle({ startDragTree, isDraggingTree }) {
      return (
        <div
          onMouseDown={startDragTree}
          className={`w-1 shrink-0 cursor-col-resize transition-colors ${isDraggingTree ? 'bg-zinc-700' : 'bg-transparent hover:bg-zinc-800'}`}
        />
      );
    }

    function IdleSurface({
      surface,
      focused,
      workspace,
      workspaces,
      timeline,
      plan,
      queueItem,
      cursorBlink,
      leftRailWidth,
      startDragTree,
      isDraggingTree,
      activityHeight,
      startDragActivity,
      isDraggingActivity,
    }) {
      return (
        <div className="relative flex-1 min-h-0 bg-zinc-950">
          <div className="absolute right-3 top-3 z-10 rounded border border-zinc-700 bg-zinc-950/90 px-2 py-0.5 text-[10px] uppercase text-zinc-400">
            idle
          </div>
          <div className="h-full flex flex-col opacity-40 pointer-events-none grayscale">
            {surface === 'action' ? (
              <ActionSurface
                focused={focused}
                plan={plan}
                queueItem={queueItem}
                timeline={timeline}
                leftRailWidth={leftRailWidth}
                startDragTree={startDragTree}
                isDraggingTree={isDraggingTree}
                activityHeight={activityHeight}
                startDragActivity={startDragActivity}
                isDraggingActivity={isDraggingActivity}
                approvalBusy={false}
                approvalError=""
                revisionOpen={false}
                revisionNote=""
                setRevisionNote={() => {}}
                onApprove={() => {}}
                onReject={() => {}}
                onOpenRevise={() => {}}
                onCancelRevise={() => {}}
                onSubmitRevise={() => {}}
              />
            ) : (
              <BuilderSurface focused={focused} workspace={workspace} workspaces={workspaces} timeline={timeline} cursorBlink={cursorBlink} leftRailWidth={leftRailWidth} startDragTree={startDragTree} isDraggingTree={isDraggingTree} activityHeight={activityHeight} startDragActivity={startDragActivity} isDraggingActivity={isDraggingActivity} />
            )}
          </div>
        </div>
      );
    }

    function HirdforgeUI() {
      const [activeAgent, setActiveAgent] = useState('');
      const [activeTab, setActiveTab] = useState('comms');
      const [agents, setAgents] = useState([]);
      const [agentsLoading, setAgentsLoading] = useState(true);
      const [agentsError, setAgentsError] = useState('');
      const [fleetStates, setFleetStates] = useState([]);
      const [pendingApprovals, setPendingApprovals] = useState(0);
      const [pendingQueueItems, setPendingQueueItems] = useState([]);
      const [approvalOverrides, setApprovalOverrides] = useState({});
      const [approvalBusy, setApprovalBusy] = useState(false);
      const [approvalError, setApprovalError] = useState('');
      const [approvalQueueID, setApprovalQueueID] = useState('');
      const [revisionQueueID, setRevisionQueueID] = useState('');
      const [revisionNote, setRevisionNote] = useState('');
      const [showApprovalShield, setShowApprovalShield] = useState(false);
      const [approvalPopupOpen, setApprovalPopupOpen] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [threads, setThreads] = useState({});
      const [inputByAgent, setInputByAgent] = useState({});
      const [sendingAgent, setSendingAgent] = useState('');
      const [cursorBlink, setCursorBlink] = useState(true);
      const [leftRailWidth, setLeftRailWidth] = useState(260);
      const [activityHeight, setActivityHeight] = useState(176);
      const [isDraggingTree, setIsDraggingTree] = useState(false);
      const [isDraggingActivity, setIsDraggingActivity] = useState(false);
      const [workspaces, setWorkspaces] = useState({});
      const [activityByAgent, setActivityByAgent] = useState({});
      const approvalPopupRef = useRef(null);

      useEffect(() => {

        fetch('/api/v1/agents')
          .then(response => {
            if (!response.ok) throw new Error(`agents request failed: ${response.status}`);
            return response.json();
          })
          .then(data => {
