            const nextAgents = Array.isArray(data) ? data.map(normalizeAgent).filter(agent => agent.name) : [];
            setAgents(nextAgents);
            setAgentsError('');
            setActiveAgent(current => current || (nextAgents[0] ? nextAgents[0].id : ''));
          })
          .catch(error => {
            if (cancelled) return;
            setAgentsError(error.message || 'failed to load agents');
          })
          .finally(() => {
            if (!cancelled) setAgentsLoading(false);
          });
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchFleetState = () => {
          fetch('/api/v1/fleet/state')
            .then(response => {
              if (!response.ok) throw new Error(`fleet state request failed: ${response.status}`);
              return response.json();
            })
            .then(data => {
              if (cancelled) return;
              const nextStates = Array.isArray(data) ? data.map(normalizeFleetState).filter(state => state.name) : [];
              setFleetStates(nextStates);
            })
            .catch(() => {
              if (!cancelled) setFleetStates([]);
            });
        };
        fetchFleetState();
        const id = setInterval(fetchFleetState, 5000);
        return () => {
          cancelled = true;
          clearInterval(id);
        };
      }, []);

      const loadApprovals = useCallback(async () => {
        const response = await fetch('/api/v1/approvals');
        if (!response.ok) throw new Error(`approvals request failed: ${response.status}`);
        const data = await response.json();
        const queues = approvalQueueItems(data);
        setPendingQueueItems(queues);
        setPendingApprovals(countPendingApprovals(queues));
        setShowApprovalShield(true);
        return queues;
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchApprovals = async () => {
          try {
            const queues = await loadApprovals();
            if (cancelled) return;
            const pendingIDs = new Set((queues || []).map(item => item && item.queue_id).filter(Boolean));
            setApprovalOverrides(current => {
              const next = { ...current };
              Object.keys(next).forEach(queueID => {
                if (pendingIDs.has(queueID) && next[queueID] && next[queueID].status !== 'revising') {
                  delete next[queueID];
                }
              });
              return next;
            });
          } catch (error) {
            if (cancelled) return;
            setPendingApprovals(0);
            setPendingQueueItems([]);
            setShowApprovalShield(false);
          }
        };
        fetchApprovals();
        const id = setInterval(fetchApprovals, 10000);
        return () => {
          cancelled = true;
          clearInterval(id);
        };
      }, [loadApprovals]);

      useEffect(() => {
        if (pendingApprovalList.length > 0) return;
        setApprovalPopupOpen(false);
      }, [pendingApprovalList]);

      useEffect(() => {
        if (agents.length === 0) return;
        let cancelled = false;
        Promise.allSettled(agents.map(agent =>
          fetch(`/api/v1/agents/${encodeURIComponent(agent.id)}/workspace`)
            .then(response => {
              if (!response.ok) throw new Error(`workspace request failed: ${response.status}`);
              return response.json();
            })
            .then(workspace => [agent.id, workspace])
        )).then(results => {
          if (cancelled) return;
          const next = {};
          results.forEach(result => {
            if (result.status === 'fulfilled' && result.value && result.value[1]) {
              next[result.value[0]] = result.value[1];
            }
          });
          if (Object.keys(next).length > 0) {
            setWorkspaces(current => ({ ...current, ...next }));
          }
        });
        return () => { cancelled = true; };
      }, [agents]);

      useEffect(() => {
        if (!activeAgent) return;
        let cancelled = false;
        fetch(`/api/v1/agents/${encodeURIComponent(activeAgent)}/workspace`)
          .then(response => {
            if (!response.ok) throw new Error(`workspace request failed: ${response.status}`);
            return response.json();
          })
          .then(workspace => {
            if (cancelled || !workspace) return;
            setWorkspaces(current => ({ ...current, [activeAgent]: workspace }));
          })
          .catch(() => {});
        return () => { cancelled = true; };
      }, [activeAgent]);

      useEffect(() => {
        let closed = false;
        let socket = null;
        let reconnectTimer = null;
        const connect = () => {
          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          socket = new WebSocket(`${protocol}//${window.location.host}/ws/events`);
          socket.onmessage = event => {
            let payload;
            try {
              payload = JSON.parse(event.data);
            } catch (error) {
              return;
            }
            const agent = payload && payload.agent;
            if (!agent) return;
            if (payload.type === 'workspace_update' && payload.workspace) {
              setWorkspaces(current => ({ ...current, [agent]: payload.workspace }));
              return;
            }
            if (typedToolEventTypes.has(payload.type)) {
              const entry = activityEntryFromEvent(payload);
              setActivityByAgent(current => {
                const existing = current[agent] || [];
                const completedPath = payload.type === 'file_write' && payload.status === 'complete' ? String(payload.path || '') : '';
                const normalized = existing.map(item => {
                  const completedSameFile = completedPath && item.type === 'file_write' && item.path === completedPath && item.current;
                  if (!item.current || (entry.current && !completedSameFile)) return item;
                  return { ...item, current: false };
                });
                const capped = [...normalized, entry].slice(-50);
                const ttlCutoff = Date.now() - 60000;
                const swept = capped.map(item => item.current && item.time < ttlCutoff ? { ...item, current: false } : item);
                return { ...current, [agent]: swept };
              });
            }
          };
          socket.onclose = () => {
            if (!closed) reconnectTimer = setTimeout(connect, 2000);
          };
          socket.onerror = () => {
            if (socket) socket.close();
          };
        };
        connect();
        return () => {
          closed = true;
          if (reconnectTimer) clearTimeout(reconnectTimer);
          if (socket) socket.close();
        };
      }, []);

      const updateThread = (agentID, updater) => {
        setThreads(current => {
          const thread = current[agentID] || [];
          return { ...current, [agentID]: updater(thread) };
        });
      };

      const updateAgentMessage = (agentID, messageIDValue, updater) => {
        updateThread(agentID, thread => thread.map(message => (
          message.id === messageIDValue ? updater(message) : message
        )));
      };

      const sendCommsMessage = async () => {
        const agent = focused;
        if (!agent || sendingAgent === agent.id) return;
        const content = (inputByAgent[agent.id] || '').trim();
        if (!content) return;

        const kitMessage = {
          id: messageID('kit'),
          who: 'kit',
          time: formatTime(),
          content,
        };
        const agentMessageID = messageID('agent');
        const agentMessage = {
          id: agentMessageID,
          who: 'agent',
          time: formatTime(),
          content: '',
          toolCalls: [],
          streaming: true,
        };

        updateThread(agent.id, thread => [...thread, kitMessage, agentMessage]);
        setInputByAgent(current => ({ ...current, [agent.id]: '' }));
        setSendingAgent(agent.id);

        try {
          const response = await fetch('/api/v1/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agent: agent.name, content }),
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `message request failed: ${response.status}`);
          }
          if (!response.body) throw new Error('streaming response unavailable');

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          const handleEvent = (evt) => {
            if (evt.type === 'content' || (typeof evt.content === 'string' && !evt.type)) {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                content: message.content + (evt.content || ''),
              }));
              return;
            }
            if (evt.type === 'replace') {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                content: evt.content || '',
              }));
              return;
            }
            if (evt.type === 'tool_call') {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                toolCalls: [...(message.toolCalls || []), { name: extractToolName(evt) }],
              }));
              return;
            }
            if (evt.type === 'done' || evt.done) {
              updateAgentMessage(agent.id, agentMessageID, message => ({ ...message, streaming: false }));
            }
          };

          const drainChunk = (chunk) => {
            buffer += chunk;
            const frames = buffer.split('\n\n');
            buffer = frames.pop() || '';
            frames.forEach(frame => {
              const dataLines = frame.split('\n')
                .filter(line => line.startsWith('data:'))
                .map(line => line.replace(/^data:\s?/, ''));
              if (dataLines.length === 0) return;
              try {
                handleEvent(JSON.parse(dataLines.join('\n')));
              } catch (error) {
                updateAgentMessage(agent.id, agentMessageID, message => ({
                  ...message,
                  content: message.content + dataLines.join('\n'),
                }));
              }
            });
          };

          while (true) {
            const { value, done } = await reader.read();
            if (value) drainChunk(decoder.decode(value, { stream: !done }));
            if (done) break;
          }
          if (buffer.trim()) drainChunk('\n\n');
          updateAgentMessage(agent.id, agentMessageID, message => ({ ...message, streaming: false }));
        } catch (error) {
          updateAgentMessage(agent.id, agentMessageID, message => ({
            ...message,
            streaming: false,
            error: error.message || 'message send failed',
          }));
        } finally {
          setSendingAgent(current => current === agent.id ? '' : current);
        }
      };

      const regenerateMessage = async () => {
        const agent = focused;
        if (!agent || sendingAgent === agent.id) return;
        const thread = threads[agent.id] || [];
        let lastIdx = -1;
        for (let i = thread.length - 1; i >= 0; i--) {
          if (thread[i].who !== 'kit') { lastIdx = i; break; }
        }
        if (lastIdx === -1) return;

        const agentMessageID = messageID('agent');
        const agentMessage = {
          id: agentMessageID,
          who: 'agent',
          time: formatTime(),
          content: '',
          toolCalls: [],
          streaming: true,
        };
        updateThread(agent.id, t => [...t.slice(0, lastIdx), agentMessage]);
        setSendingAgent(agent.id);

        try {
          const response = await fetch('/api/v1/message/regenerate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agent: agent.name }),
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `regenerate request failed: ${response.status}`);
          }
          if (!response.body) throw new Error('streaming response unavailable');

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          const handleEvent = (evt) => {
            if (evt.type === 'content' || (typeof evt.content === 'string' && !evt.type)) {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                content: message.content + (evt.content || ''),
              }));
              return;
            }
            if (evt.type === 'replace') {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                content: evt.content || '',
              }));
              return;
            }
            if (evt.type === 'tool_call') {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                toolCalls: [...(message.toolCalls || []), { name: extractToolName(evt) }],
              }));
              return;
            }
            if (evt.type === 'done' || evt.done) {
              updateAgentMessage(agent.id, agentMessageID, message => ({ ...message, streaming: false }));
            }
          };

          const drainChunk = (chunk) => {
            buffer += chunk;
            const frames = buffer.split('\n\n');
            buffer = frames.pop() || '';
            frames.forEach(frame => {
              const dataLines = frame.split('\n')
                .filter(line => line.startsWith('data:'))
                .map(line => line.replace(/^data:\s?/, ''));
              if (dataLines.length === 0) return;
              try {
                handleEvent(JSON.parse(dataLines.join('\n')));
              } catch (error) {
                updateAgentMessage(agent.id, agentMessageID, message => ({
                  ...message,
                  content: message.content + dataLines.join('\n'),
                }));
              }
            });
          };

          while (true) {
            const { value, done } = await reader.read();
            if (value) drainChunk(decoder.decode(value, { stream: !done }));
            if (done) break;
          }
          if (buffer.trim()) drainChunk('\n\n');
          updateAgentMessage(agent.id, agentMessageID, message => ({ ...message, streaming: false }));
        } catch (error) {
          updateAgentMessage(agent.id, agentMessageID, message => ({
            ...message,
            streaming: false,
            error: error.message || 'regenerate failed',
          }));
        } finally {
          setSendingAgent(current => current === agent.id ? '' : current);
        }
      };

      const resetSession = async () => {
        const agent = focused;
        if (!agent || sendingAgent === agent.id) return;
        try {
          const response = await fetch(`/api/v1/agents/${encodeURIComponent(agent.name)}/session/new`, {
            method: 'POST',
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `session reset failed: ${response.status}`);
          }
          setThreads(current => ({ ...current, [agent.id]: [] }));
        } catch (error) {
          console.error('session reset failed:', error);
        }
      };

      const startDragTree = (event) => {
        event.preventDefault();
        setIsDraggingTree(true);
        const startX = event.clientX;
        const startWidth = leftRailWidth;
        const onMove = (moveEvent) => {
          const next = Math.max(160, Math.min(500, startWidth + (moveEvent.clientX - startX)));
          setLeftRailWidth(next);
        };
        const onUp = () => {
          setIsDraggingTree(false);
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };

      const startDragActivity = (event) => {
        event.preventDefault();
        setIsDraggingActivity(true);
        const startY = event.clientY;
        const startHeight = activityHeight;
        const onMove = (moveEvent) => {
          const next = Math.max(60, Math.min(400, startHeight - (moveEvent.clientY - startY)));
          setActivityHeight(next);
        };
        const onUp = () => {
          setIsDraggingActivity(false);
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };

      const runApprovalAction = async (kind) => {
        const queueItem = focusedQueueItem;
        if (!queueItem || approvalBusy) return;
        setApprovalBusy(true);
        setApprovalQueueID(queueItem.queue_id || '');
        setApprovalError('');
        try {
          if (kind === 'approve' || kind === 'reject') {
            const response = await fetch(`/api/v1/approvals/${kind}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ queue_id: queueItem.queue_id }),
            });
            if (!response.ok) {
              const text = await response.text();
              throw new Error(text || `${kind} failed`);
            }
            setApprovalOverrides(current => {
              const next = { ...current };
              delete next[queueItem.queue_id];
              return next;
            });
            await loadApprovals();
            return;
          }
          const response = await fetch(`/api/v1/approvals/${encodeURIComponent(queueItem.queue_id)}/revise`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ note: String(revisionNote || '').trim() }),
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || 'revise failed');
          }
          setApprovalOverrides(current => ({
            ...current,
            [queueItem.queue_id]: {
              ...queueItem,
              status: 'revising',
              note: String(revisionNote || '').trim(),
            },
          }));
          setRevisionQueueID('');
          setRevisionNote('');
          await loadApprovals();
        } catch (error) {
          setApprovalError(error.message || 'approval request failed');
        } finally {
          setApprovalBusy(false);
          setApprovalQueueID('');
        }
      };

      const dragCursorClass = isDraggingTree ? 'cursor-col-resize select-none' : isDraggingActivity ? 'cursor-row-resize select-none' : '';
      const focusApprovalAgent = (item) => {
        const agentName = approvalAgentName(item);
        if (!agentName) return;
        setActiveAgent(agentName);
        setApprovalPopupOpen(false);
      };

      return (
        <div className={`h-screen w-screen bg-zinc-950 text-zinc-100 flex flex-col overflow-hidden font-mono text-xs ${dragCursorClass}`}>
          <div className="h-10 border-b border-zinc-800 bg-zinc-900 flex items-center px-3 gap-3 shrink-0">
            <div className="flex items-center gap-1.5">
              <div className="w-4 h-4 bg-amber-500 rounded-sm flex items-center justify-center">
                <span className="text-zinc-950 font-bold text-[10px]">H</span>
              </div>
              <span className="font-bold text-amber-400 text-xs">HIRDFORGE</span>
            </div>
            <div className="ml-2 flex items-center gap-0">
              {[
                { id: 'comms', label: 'Comms', icon: 'MessageSquare' },
                { id: 'warriors', label: 'Warriors', icon: 'Users' },
                { id: 'realm', label: 'Realm', icon: 'Server' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex items-center gap-1.5 px-3 py-1 text-xs transition-colors ${activeTab === tab.id ? 'text-amber-400 border-b border-amber-400 -mb-px' : 'text-zinc-500 hover:text-zinc-300'}`}
                >
                  <Icon name={tab.icon} className="w-3 h-3" />
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
            <div className="ml-auto flex items-center gap-3 relative">
              {showApprovalShield && (
                <>
                  <button
                    data-approval-shield-toggle="true"
                    onClick={() => setApprovalPopupOpen(open => !open)}
                    className="relative flex items-center gap-1 text-amber-400 hover:text-amber-300"
                    title="Pending approvals"
                  >
                    <Icon name="ShieldAlert" className="w-4 h-4" />
                    <span className="text-[10px] font-semibold">{pendingApprovals}</span>
                    {pendingApprovals > 0 && <span className="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse" />}
                  </button>
                  {approvalPopupOpen && (
                    <div ref={approvalPopupRef} className="absolute right-0 top-8 z-30 w-72 rounded border border-zinc-800 bg-zinc-950 shadow-2xl">
                      <div className="border-b border-zinc-800 px-3 py-2 text-[10px] uppercase tracking-wide text-zinc-500">
                        Pending approvals
                      </div>
                      <div className="max-h-72 overflow-y-auto p-1">
                        {pendingApprovalList.length === 0 ? (
                          <div className="px-2 py-2 text-[10px] text-zinc-600">No pending approvals.</div>
                        ) : pendingApprovalList.map(item => {
                          const agentName = approvalAgentName(item);
                          const clickable = Boolean(agentName) && agents.some(agent => agent.id === agentName);
                          return (
                            <button
                              key={item.queue_id || `${agentName}-${item.action}-${item.queued_at}`}
                              onClick={() => clickable && focusApprovalAgent(item)}
                              disabled={!clickable}
                              className={`w-full rounded px-2 py-2 text-left ${clickable ? 'hover:bg-zinc-900/80' : 'cursor-default opacity-70'}`}
                            >
                              <div className="flex items-center gap-2">
                                <span className="min-w-0 flex-1 truncate text-[11px] font-semibold text-zinc-200">{agentName || 'Unknown agent'}</span>
                                <span className="shrink-0 text-[10px] text-zinc-500">{item.queued_at || '-'}</span>
                              </div>
                              <div className="mt-1 text-[10px] text-zinc-400">{item.action || 'approval action'}</div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </>
              )}
              <button
                onClick={() => { if (window.confirm('Stop all agents?')) fetch('/api/v1/agents/stop-all', { method: 'POST', headers: { 'Content-Type': 'application/json' } }); }}
                className="flex items-center gap-1 px-2 py-1 rounded border border-red-500/30 text-red-400 text-[10px] hover:bg-red-500/10"
                title="Stop all agents"
              >
                <Icon name="Square" className="w-3 h-3" />
                <span>Stop All</span>
              </button>
              <button data-settings-toggle="true" onClick={() => setSettingsOpen(open => !open)} className="text-zinc-500 hover:text-zinc-300" title="Settings">
                <Icon name="Settings" className="w-4 h-4" />
              </button>
              <span className="text-zinc-500 text-[10px]">kit@hirdforge</span>
            </div>
          </div>

          <div className="flex-1 flex min-h-0">
            <div className="w-1/2 border-r border-zinc-800 flex flex-col min-h-0">
              {activeTab === 'comms' && (
                <CommsTab
                  agents={agents}
                  agentsLoading={agentsLoading}
                  agentsError={agentsError}
                  focused={focused}
                  activeAgent={activeAgent}
                  setActiveAgent={setActiveAgent}
                  threads={threads}
                  inputValue={inputByAgent[activeAgent] || ''}
                  setInputValue={value => setInputByAgent(current => ({ ...current, [activeAgent]: value }))}
                  onSend={sendCommsMessage}
                  onRegenerate={regenerateMessage}
                  onResetSession={resetSession}
                  sendingAgent={sendingAgent}
                />
              )}
              {activeTab === 'warriors' && <WarriorsTab agents={agents} fleetStates={fleetStates} setActiveTab={setActiveTab} setActiveAgent={setActiveAgent} />}
              {activeTab === 'realm' && <RealmTab />}
            </div>

            <div className="w-1/2 flex flex-col min-h-0">
              <div className="border-b border-zinc-800 bg-zinc-900/30 px-2 py-1.5 shrink-0">
                <div className="text-[9px] uppercase text-zinc-600 mb-1">Active - {fleetStates.filter(agent => agent.active).length}</div>
                <div className="flex flex-wrap gap-1">
                  {fleetStates.map(agent => (
                    <button
                      key={agent.id}
                      onClick={() => setActiveAgent(agent.id)}
                      className={`flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] border transition-colors ${activeAgent === agent.id ? 'border-amber-500/50 bg-amber-500/10 text-amber-300' : 'border-zinc-800 text-zinc-400 hover:border-zinc-700'}`}
                    >
                      <StatusDot status={agent.active ? 'active' : 'idle'} />
                      <span>{agent.name}</span>
                    </button>
                  ))}
                  {fleetStates.length === 0 && <span className="text-[10px] text-zinc-700">fleet state unavailable</span>}
                </div>
              </div>
              <div className="border-b border-zinc-800 bg-zinc-900/50 px-3 py-1.5 shrink-0 flex items-center gap-2">
                <span className="text-[10px] text-zinc-500">Watching</span>
                <StatusDot status={focusedStatusText} />
                <span className="text-zinc-200 text-xs font-semibold">{focused ? focused.name : 'No agent'}</span>
                <span className="text-[10px] text-zinc-600">-</span>
                {/* TODO: replace active/idle with fleet state's current_task_summary once §5.3 backend field lands. */}
                <span className="text-[10px] text-zinc-500 truncate flex-1">{focused ? focusedStatusText : 'idle'}</span>
                {focusedFleetState && focusedFleetState.active && (
                  <button
                    onClick={() => { if (window.confirm(`Stop ${focused.name}?`)) fetch(`/api/v1/agents/${encodeURIComponent(focused.name)}/stop`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }); }}
                    className="flex items-center gap-1 px-2 py-0.5 border border-red-500/30 rounded text-[10px] text-red-400 hover:bg-red-500/10 shrink-0"
                  >
                    <Icon name="Square" className="w-2.5 h-2.5" />
                    Stop
                  </button>
                )}
                <button className="flex items-center gap-1 px-2 py-0.5 border border-zinc-800 rounded text-[10px] text-zinc-500 hover:text-zinc-300 hover:border-zinc-700 shrink-0">
                  <Icon name="Hand" className="w-2.5 h-2.5" /> Interject
                </button>
              </div>
              {focused && focusedSurface === 'architect' ? (
                <ArchitectSurface
                  focused={focused}
                  workspace={focusedWorkspace}
                  timeline={focusedTimeline}
                  leftRailWidth={leftRailWidth}
                  startDragTree={startDragTree}
                  isDraggingTree={isDraggingTree}
                  activityHeight={activityHeight}
                  startDragActivity={startDragActivity}
                  isDraggingActivity={isDraggingActivity}
                />
              ) : focused && reviewerAgent ? (
                <ReviewerSurface
                  focused={focused}
                  workspace={focusedWorkspace}
                  timeline={focusedTimeline}
                  leftRailWidth={leftRailWidth}
                  startDragTree={startDragTree}
                  isDraggingTree={isDraggingTree}
                  activityHeight={activityHeight}
                  startDragActivity={startDragActivity}
                  isDraggingActivity={isDraggingActivity}
                />
              ) : focused && focusedSurface === 'builder' ? (
                <BuilderSurface focused={focused} workspace={focusedWorkspace} workspaces={workspaces} timeline={focusedTimeline} cursorBlink={cursorBlink} leftRailWidth={leftRailWidth} startDragTree={startDragTree} isDraggingTree={isDraggingTree} activityHeight={activityHeight} startDragActivity={startDragActivity} isDraggingActivity={isDraggingActivity} />
              ) : focused && focusedSurface === 'action' ? (
                <ActionSurface
                  focused={focused}
                  plan={focusedPlan}
                  queueItem={focusedQueueItem}
                  timeline={focusedTimeline}
                  leftRailWidth={leftRailWidth}
                  startDragTree={startDragTree}
                  isDraggingTree={isDraggingTree}
                  activityHeight={activityHeight}
                  startDragActivity={startDragActivity}
                  isDraggingActivity={isDraggingActivity}
                  approvalBusy={approvalBusy && approvalQueueID === (focusedQueueItem && focusedQueueItem.queue_id)}
                  approvalError={approvalError}
                  revisionOpen={revisionOpen}
                  revisionNote={revisionNote}
                  setRevisionNote={setRevisionNote}
                  onApprove={() => runApprovalAction('approve')}
                  onReject={() => runApprovalAction('reject')}
                  onOpenRevise={() => {
                    setApprovalError('');
                    setRevisionQueueID(focusedQueueItem ? focusedQueueItem.queue_id : '');
                    setRevisionNote(focusedQueueItem && focusedQueueItem.note ? String(focusedQueueItem.note) : '');
                  }}
                  onCancelRevise={() => {
                    setRevisionQueueID('');
                    setRevisionNote('');
                  }}
                  onSubmitRevise={() => runApprovalAction('revise')}
                />
              ) : (
                <IdleSurface
                  surface={focusedSurface}
                  focused={focused}
                  workspace={focusedWorkspace}
                  workspaces={workspaces}
                  timeline={focusedTimeline}
                  plan={focusedPlan}
                  queueItem={focusedQueueItem}
                  cursorBlink={cursorBlink}
                  leftRailWidth={leftRailWidth}
                  startDragTree={startDragTree}
                  isDraggingTree={isDraggingTree}
                  activityHeight={activityHeight}
                  startDragActivity={startDragActivity}
                  isDraggingActivity={isDraggingActivity}
                />
              )}
            </div>
          </div>

          <div className="h-6 border-t border-zinc-800 bg-zinc-900 flex items-center px-4 text-[10px] text-zinc-600 shrink-0">
            <span>v1.0 · scaffolding</span>
          </div>
          <SettingsDrawer open={settingsOpen} onClose={() => setSettingsOpen(false)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HirdforgeUI />);
  </script>
</body>
</html>
