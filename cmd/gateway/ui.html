<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hirdforge UI 1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgb(39 39 42); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(63 63 70); }
    * { scrollbar-width: thin; scrollbar-color: rgb(39 39 42) transparent; }
    body { margin: 0; background: rgb(9 9 11); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useCallback, useEffect, useMemo, useRef, useState } = React;

    function normalizeAgent(agent) {
      const name = String(agent.name || '').trim();
      return {
        ...agent,
        id: name,
        name,
        role: agent.role || 'Agent',
        model: agent.model || 'unknown',
        status: agent.healthy ? 'active' : 'idle',
      };
    }

    function normalizeFleetState(state) {
      const name = String(state.name || '').trim();
      return {
        ...state,
        id: name,
        name,
        status: state.active ? 'active' : 'idle',
      };
    }

    function approvalQueueItems(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.queues)) return data.queues;
      return [];
    }

    function countPendingApprovals(data) {
      const queues = approvalQueueItems(data);
      return queues.filter(item => item && item.status === 'pending').length;
    }

    function approvalAgentName(item) {
      const explicit = String(item && item.agent_name || '').trim();
      if (explicit) return explicit;
      const params = item && item.params;
      if (!params || typeof params !== 'object') return '';
      for (const key of ['agent', 'from', 'requested_by']) {
        const value = String(params[key] || '').trim();
        if (value) return value;
      }
      return '';
    }

    function isReviewerAgent(agent) {
      return String((agent && agent.role) || '').toLowerCase().includes('review');
    }

    function formatTime(date = new Date()) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function messageID(prefix) {
      if (window.crypto && window.crypto.randomUUID) return `${prefix}-${window.crypto.randomUUID()}`;
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function extractToolName(evt) {
      if (evt.name) return String(evt.name);
      const call = evt.tool_call || {};
      if (call.name) return String(call.name);
      if (call.function && call.function.name) return String(call.function.name);
      return 'tool_call';
    }

    function asArrayPayload(data, key) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data[key])) return data[key];
      return [];
    }

    function shortImage(image) {
      const value = String(image || '');
      const noDigest = value.split('@')[0];
      return noDigest.split('/').filter(Boolean).pop() || value || '-';
    }

    function shortSHA(value) {
      const text = String(value || '');
      return text ? text.slice(0, 7) : '-';
    }

    function formatPercent(value) {
      return Number.isFinite(Number(value)) ? `${Number(value).toFixed(0)}%` : '-';
    }

    function prAge(pr) {
      const raw = pr.updated_at || pr.created_at;
      if (!raw) return '-';
      const then = new Date(raw).getTime();
      if (!Number.isFinite(then)) return '-';
      const minutes = Math.max(0, Math.floor((Date.now() - then) / 60000));
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      if (hours < 48) return `${hours}h`;
      return `${Math.floor(hours / 24)}d`;
    }

    function prReviewStatus(pr) {
      const labels = Array.isArray(pr.labels) ? pr.labels.map(label => String(label).toLowerCase()) : [];
      if (labels.some(label => label.includes('draft'))) return 'draft';
      if (Number(pr.approvals || 0) > 0) return 'approved';
      if (pr.state && pr.state !== 'open') return pr.state;
      return 'awaiting-review';
    }

    const builderEventTypes = new Set(['file_read', 'file_write', 'git_clone', 'git_branch_create', 'git_commit', 'git_push', 'pr_create', 'exec']);
    const actionEventTypes = new Set(['plan', 'plan_step_complete', 'http_request']);
    const architectEventTypes = new Set(['delegate']);
    const typedToolEventTypes = new Set([...builderEventTypes, ...actionEventTypes, ...architectEventTypes]);

    function relativeTime(value) {
      if (!value) return 'now';
      const then = value instanceof Date ? value.getTime() : new Date(value).getTime();
      if (!Number.isFinite(then)) return 'now';
      const seconds = Math.max(0, Math.floor((Date.now() - then) / 1000));
      if (seconds < 5) return 'now';
      if (seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      if (hours < 48) return `${hours}h`;
      return `${Math.floor(hours / 24)}d`;
    }

    function truncateMiddle(value, max = 56) {
      const text = String(value || '');
      if (text.length <= max) return text;
      const head = Math.ceil((max - 1) / 2);
      const tail = Math.floor((max - 1) / 2);
      return `${text.slice(0, head)}…${text.slice(text.length - tail)}`;
    }

    function parseOwnerRepo(ownerValue, repoValue, htmlURL) {
      let owner = String(ownerValue || '').trim();
      let repo = String(repoValue || '').trim();
      if (!owner && repo.includes('/')) {
        const parts = repo.split('/').filter(Boolean);
        if (parts.length >= 2) {
          owner = parts[0];
          repo = parts.slice(1).join('/');
        }
      }
      if ((!owner || !repo) && htmlURL) {
        try {
          const parsed = new URL(String(htmlURL));
          const parts = parsed.pathname.split('/').filter(Boolean);
          if (parts.length >= 2) {
            owner = owner || parts[0];
            repo = repo || parts[1];
          }
        } catch (error) {}
      }
      return { owner, repo };
    }

    function normalizeReviewPR(pr) {
      if (!pr || typeof pr !== 'object') return null;
      const { owner, repo } = parseOwnerRepo(pr.owner, pr.repo, pr.html_url);
      const index = Number(pr.index != null ? pr.index : pr.number);
      if (!owner || !repo || !Number.isFinite(index) || index <= 0) return null;
      return {
        owner,
        repo,
        index,
        title: String(pr.title || '').trim(),
        state: String(pr.state || '').trim(),
        html_url: String(pr.html_url || '').trim(),
      };
    }

    function reviewPRKey(pr) {
      if (!pr) return '';
      return `${pr.owner}/${pr.repo}#${pr.index}`;
    }

    function buildReviewTree(files) {
      const folders = new Map();
      const root = [];
      const ensureFolder = (parts) => {
        let children = root;
        let prefix = '';
        let folder = null;
        parts.forEach(part => {
          prefix = prefix ? `${prefix}/${part}` : part;
          if (!folders.has(prefix)) {
            folder = { name: part, type: 'folder', path: prefix, expanded: true, children: [] };
            folders.set(prefix, folder);
            children.push(folder);
          }
          folder = folders.get(prefix);
          children = folder.children;
        });
        return folder;
      };
      (files || []).forEach(file => {
        const path = String(file.filename || file.path || '').trim();
        if (!path) return;
        const parts = path.split('/').filter(Boolean);
        const parent = ensureFolder(parts.slice(0, -1));
        const children = parent ? parent.children : root;
        children.push({
          type: 'file',
          path,
          name: parts[parts.length - 1],
          additions: Number(file.additions) || 0,
          deletions: Number(file.deletions) || 0,
        });
      });
      return root;
    }

    function parseUnifiedDiffPatch(patch) {
      const text = String(patch || '');
      if (!text.trim()) return [];
      let oldLine = 0;
      let newLine = 0;
      return text.split('\n').map(line => {
        const hunkMatch = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@.*$/);
        if (hunkMatch) {
          oldLine = Number(hunkMatch[1]);
          newLine = Number(hunkMatch[2]);
          return { kind: 'hunk', text: line };
        }
        if (line.startsWith('+') && !line.startsWith('+++')) {
          const entry = { kind: 'add', oldLine: '', newLine, text: line };
          newLine += 1;
          return entry;
        }
        if (line.startsWith('-') && !line.startsWith('---')) {
          const entry = { kind: 'remove', oldLine, newLine: '', text: line };
          oldLine += 1;
          return entry;
        }
        if (line.startsWith(' ')) {
          const entry = { kind: 'context', oldLine, newLine, text: line };
          oldLine += 1;
          newLine += 1;
          return entry;
        }
        return { kind: line.startsWith('\\') ? 'meta' : 'context', oldLine: '', newLine: '', text: line };
      });
    }

    function reviewFileState(state, selected) {
      if (state) return state;
      return selected ? 'viewing' : 'unread';
    }

    function activityIcon(type) {
      if (type === 'plan') return 'ListTodo';
      if (type === 'plan_step_complete') return 'CheckCircle2';
      if (type === 'delegate') return 'Send';
      if (type === 'git_clone') return 'FolderGit2';
      if (type === 'git_branch_create') return 'GitBranch';
      if (type === 'git_commit') return 'GitCommit';
      if (type === 'git_push') return 'UploadCloud';
      if (type === 'pr_create') return 'GitPullRequest';
      if (type === 'exec') return 'Terminal';
      if (type === 'http_request') return 'Globe2';
      return 'FileCode';
    }

    function activitySummary(evt) {
      const type = evt.type;
      if (type === 'plan') return `declared ${(evt.steps || []).length || 0}-step plan`;
      if (type === 'plan_step_complete') return `completed step ${Number(evt.step) || 1}`;
      if (type === 'file_read') return `read ${evt.path || 'file'}`;
      if (type === 'file_write') return `${evt.status === 'complete' ? 'wrote' : 'writing'} ${evt.path || 'file'}`;
      if (type === 'git_clone') return `cloned ${evt.repo || 'repo'}`;
      if (type === 'git_branch_create') return `created branch ${evt.branch_new || 'branch'}`;
      if (type === 'git_commit') return `committed ${evt.files_changed || 0} files`;
      if (type === 'git_push') return `pushed ${evt.branch || 'branch'} to ${evt.remote || 'origin'}`;
      if (type === 'pr_create') return `opened PR #${evt.number || ''} ${evt.title || ''}`.trim();
      if (type === 'delegate') return `delegated ${evt.objective_summary || 'task'} to ${evt.to_agent || 'agent'}`;
      if (type === 'exec') return `exec ${truncateMiddle(evt.command || 'command', 42)}`;
      if (type === 'http_request') return `${evt.method || 'GET'} ${truncateMiddle(evt.url || 'url', 44)} ${evt.status_code || ''}`.trim();
      return type;
    }

    function activityEntryFromEvent(evt) {
      return {
        time: Date.now(),
        type: evt.type,
        path: evt.path || '',
        text: activitySummary(evt),
        icon: activityIcon(evt.type),
        current: evt.type === 'file_write' && evt.status === 'writing',
      };
    }

    function hasWorkspaceContent(workspace) {
      return Boolean(workspace && (
        workspace.current_repo ||
        workspace.current_branch ||
        workspace.current_file ||
        Object.keys(workspace.files_touched || {}).length > 0
      ));
    }

    function hasBuilderActivity(timeline = []) {
      return timeline.some(item => builderEventTypes.has(item.type));
    }

    function hasActionActivity(timeline = []) {
      return timeline.some(item => actionEventTypes.has(item.type));
    }

    function hasArchitectActivity(workspace, timeline = []) {
      return Boolean(
        String(workspace && workspace.current_session_id || '').trim() ||
        timeline.some(item => architectEventTypes.has(item.type))
      );
    }

    function timeValue(value) {
      if (!value) return 0;
      if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
      const parsed = new Date(value).getTime();
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function latestTimelineTime(timeline = [], allowedTypes) {
      return timeline.reduce((latest, item) => {
        if (!item || !allowedTypes.has(item.type)) return latest;
        return Math.max(latest, timeValue(item.time));
      }, 0);
    }

    function queueSortTime(item) {
      return timeValue(item && item.queued_at);
    }

    function selectQueueForAgent(agentName, queueItems, queueOverrides) {
      const target = String(agentName || '').trim();
      if (!target) return null;
      const matchingPending = (queueItems || [])
        .filter(item => approvalAgentName(item) === target)
        .sort((a, b) => queueSortTime(a) - queueSortTime(b));
      if (matchingPending.length > 0) return matchingPending[0];
      const matchingOverrides = Object.values(queueOverrides || {})
        .filter(item => item && approvalAgentName(item) === target)
        .sort((a, b) => queueSortTime(a) - queueSortTime(b));
      return matchingOverrides[0] || null;
    }

    function determineSurface(workspace, queueItem, timeline = []) {
      // Architect mode is session-level state. Once current_session_id is
      // established by a delegate event, the surface stays architect until
      // a new session replaces it. Mirrors the Reviewer current_pr pattern.
      if (String(workspace && workspace.current_session_id || '').trim()) {
        return 'architect';
      }
      const architectTime = Math.max(
        hasArchitectActivity(workspace, timeline) ? timeValue(workspace && workspace.current_objective_at) : 0,
        latestTimelineTime(timeline, architectEventTypes)
      );
      const builderTime = Math.max(
        hasWorkspaceContent(workspace) ? timeValue(workspace && workspace.last_updated) : 0,
        latestTimelineTime(timeline, builderEventTypes)
      );
      const actionTime = Math.max(
        timeValue(workspace && workspace.plan && workspace.plan.started_at),
        timeValue(queueItem && queueItem.queued_at),
        latestTimelineTime(timeline, actionEventTypes)
      );
      if (architectTime === 0 && builderTime === 0 && actionTime === 0) {
        // Keep Action surface interactive when there's a pending approval item
        // for the focused agent, regardless of fleet active state.
        const hasPendingApproval = queueItem && queueItem.status === 'pending';
        if (hasPendingApproval) return 'action';
        return 'idle';
      }
      if (architectTime >= builderTime && architectTime >= actionTime) return 'architect';
      return actionTime >= builderTime ? 'action' : 'builder';
    }

    function parseDelegatedTask(content) {
      const text = String(content || '').replace(/\\n/g, '\n');
      const sections = {};
      const matches = [...text.matchAll(/^(TASK|ISSUE|STEPS|DONE WHEN|TASK_ID|FROM|GATES|GIT_IDENTITY|CLONE_URL)\s*:\s*(.*)$/gim)];
      matches.forEach((match, index) => {
        const header = String(match[1] || '').toUpperCase();
        const start = match.index + match[0].length;
        const end = index + 1 < matches.length ? matches[index + 1].index : text.length;
        const inline = String(match[2] || '').trim();
        const tail = text.slice(start, end).trim();
        sections[header] = [inline, tail].filter(Boolean).join(inline && tail ? '\n' : '');
      });
      const stepsRaw = String(sections['STEPS'] || '');
      const steps = stepsRaw.split('\n')
        .map(line => String(line || '').trim().replace(/^[-*]\s*/, '').replace(/^\d+\.\s*/, ''))
        .filter(Boolean);
      return {
        task: String(sections['TASK'] || text.trim()).trim(),
        issue: String(sections['ISSUE'] || '').trim(),
        steps,
        doneWhen: String(sections['DONE WHEN'] || '').trim(),
        from: String(sections['FROM'] || '').trim(),
      };
    }

    function extractPRNumberFromText(text) {
      const raw = String(text || '');
      let match = raw.match(/\/pulls\/(\d+)\b/i);
      if (match) return Number(match[1]);
      match = raw.match(/\bPR\s*#(\d+)\b/i) || raw.match(/\bpull request\s*#?(\d+)\b/i);
      if (match) return Number(match[1]);
      return 0;
    }

    function extractIssueRef(task, parsed) {
      const explicit = String(parsed && parsed.issue || '').trim();
      if (explicit) return explicit;
      const match = String(task && task.content || '').match(/#(\d+)/);
      return match ? `#${match[1]}` : '';
    }

    function collectTaskText(task) {
      const parts = [task && task.content, task && task.result];
      ((task && task.tools) || []).forEach(tool => {
        parts.push(tool && tool.input);
        parts.push(tool && tool.output);
      });
      return parts.filter(Boolean).join('\n');
    }

    function architectTaskStatus(task, prInfo) {
      const status = String(task && task.status || '').toLowerCase();
      if (status === 'failed') return 'failed';
      if (status === 'submitted') return 'queued';
      if (status === 'working') return 'running';
      if (status === 'completed') {
        if (prInfo && String(prInfo.state || '').toLowerCase() === 'open') return 'reviewing';
        if (prInfo && String(prInfo.state || '').toLowerCase() !== 'open') return 'merged';
        return 'running';
      }
      return status || 'queued';
    }

    function architectLifecycleState(task, prInfo) {
      const status = String(task && task.status || '').toLowerCase();
      if (status === 'failed') return 'ESCALATE';
      if (status === 'submitted') return 'DISPATCH';
      if (status === 'working') return 'BUILD';
      if (status === 'completed') {
        if (prInfo && String(prInfo.state || '').toLowerCase() === 'open') return 'REVIEW';
        if (prInfo && String(prInfo.state || '').toLowerCase() !== 'open') return 'CLOSE';
        return 'VERIFY';
      }
      return 'INTAKE';
    }

    function architectStatusClass(status) {
      if (status === 'merged') return 'border-emerald-400/30 text-emerald-300';
      if (status === 'reviewing') return 'border-blue-400/30 text-blue-300';
      if (status === 'running') return 'border-amber-400/30 text-amber-300';
      if (status === 'failed') return 'border-red-400/30 text-red-300';
      return 'border-zinc-800 text-zinc-500';
    }

    function architectEventText(evt) {
      const metadata = evt && evt.metadata && typeof evt.metadata === 'object' ? evt.metadata : {};
      if (evt.type === 'delegate') return `delegated ${metadata.objective_summary || 'task'} to ${metadata.to_agent || 'agent'}`;
      if (evt.type === 'delegation_started') return `opened delegation channel to ${metadata.target_agent || 'agent'}`;
      if (evt.type === 'delegation_ended') return `closed delegation channel to ${metadata.target_agent || 'agent'}`;
      if (evt.type === 'task_dispatched') return `dispatched ${metadata.summary || 'task'} to ${metadata.target_agent || 'agent'}`;
      if (evt.type === 'repo_cloned') return `cloned ${metadata.repo || 'repo'}`;
      if (evt.type === 'pr_created') return `opened PR ${metadata.pr_url || metadata.branch || ''}`.trim();
      if (evt.type === 'task') return String(metadata.message || 'task update');
      if (evt.type === 'task_completed') return `completed task ${metadata.task_id || ''}`.trim();
      return String(evt.type || 'event');
    }

    function architectEventIcon(type) {
      if (type === 'delegate' || type === 'task_dispatched') return 'Send';
      if (type === 'delegation_started' || type === 'delegation_ended') return 'Workflow';
      if (type === 'repo_cloned') return 'FolderGit2';
      if (type === 'pr_created') return 'GitPullRequest';
      if (type === 'task_completed') return 'CheckCircle2';
      return 'Activity';
    }

    function architectTimelineItems(events = []) {
      return (events || []).map(evt => ({
        time: evt.timestamp,
        type: evt.type,
        text: architectEventText(evt),
        icon: architectEventIcon(evt.type),
      }));
    }

    function taskEventsForAgent(events = [], task) {
      const targetAgent = String(task && task.agent || '').trim();
      if (!targetAgent) return [];
      return (events || []).filter(evt => {
        const metadata = evt && evt.metadata && typeof evt.metadata === 'object' ? evt.metadata : {};
        return String(evt.agent || '').trim() === targetAgent || String(metadata.target_agent || metadata.to_agent || '').trim() === targetAgent;
      });
    }

    function isEmailAction(queueItem) {
      const service = String(queueItem && queueItem.service || '').toLowerCase();
      const action = String(queueItem && queueItem.action || '').toLowerCase();
      return service === 'gmail' || /^gmail_send_/.test(action);
    }

    function isCalendarAction(queueItem) {
      const service = String(queueItem && queueItem.service || '').toLowerCase();
      const action = String(queueItem && queueItem.action || '').toLowerCase();
      return service === 'calendar' || /^calendar_create/.test(action);
    }

    function triggerSourceField(source, key) {
      if (!source || typeof source !== 'object') return '';
      const value = source[key];
      if (value == null) return '';
      return String(value).trim();
    }

    function actionTimelineItems(timeline = [], plan, queueItem) {
      const entries = [];
      const trigger = queueItem && queueItem.trigger;
      const triggerSummary = trigger && String(trigger.summary || '').trim();
      if (triggerSummary) {
        entries.push({
          time: timeValue(trigger.occurred_at),
          icon: trigger.type === 'email' ? 'Inbox' : trigger.type === 'schedule' ? 'Calendar' : trigger.type === 'webhook' ? 'Webhook' : 'Sparkles',
          text: triggerSummary,
        });
      }
      timeline
        .filter(item => actionEventTypes.has(item.type))
        .forEach(item => entries.push(item));
      if (entries.length === 0 && plan && Array.isArray(plan.steps)) {
        plan.steps.forEach((step, index) => {
          const completed = index < plan.current_step;
          const current = plan.current_step < plan.steps.length && index === plan.current_step;
          entries.push({
            time: timeValue(plan.started_at) + index,
            icon: completed ? 'CheckCircle2' : current ? 'Clock' : 'Circle',
            text: step,
            current,
            pending: !completed && !current,
          });
        });
      }
      if (queueItem && queueItem.status === 'pending') {
        entries.push({
          time: Math.max(Date.now(), queueSortTime(queueItem)),
          icon: 'ShieldAlert',
          text: `queued ${queueItem.action || 'action'} for approval`,
          current: true,
        });
      } else if (queueItem && queueItem.status === 'revising') {
        entries.push({
          time: Math.max(Date.now(), queueSortTime(queueItem)),
          icon: 'Edit3',
          text: 'revision requested',
          current: true,
        });
      }
      return entries
        .filter(item => item && item.text)
        .sort((a, b) => timeValue(a.time) - timeValue(b.time))
        .slice(-30);
    }

    function stateWeight(state) {
      if (state === 'writing') return 0;
      if (state === 'read') return 1;
      return 2;
    }

    function touchedFiles(workspace) {
      return Object.entries((workspace && workspace.files_touched) || {})
        .map(([path, state]) => ({ path, ...(state || {}) }))
        .sort((a, b) => stateWeight(a.state) - stateWeight(b.state) || a.path.localeCompare(b.path));
    }

    function buildTreeFromWorkspace(workspace) {
      const root = { name: workspace.current_repo || 'workspace', type: 'repo', branch: workspace.current_branch || '', children: [] };
      const folders = new Map();
      const ensureFolder = (parts) => {
        let parent = root;
        let prefix = '';
        parts.forEach(part => {
          prefix = prefix ? `${prefix}/${part}` : part;
          if (!folders.has(prefix)) {
            const folder = { name: part, type: 'folder', expanded: true, children: [] };
            folders.set(prefix, folder);
            parent.children.push(folder);
          }
          parent = folders.get(prefix);
        });
        return parent;
      };
      touchedFiles(workspace).forEach(file => {
        const parts = String(file.path || '').split('/').filter(Boolean);
        if (parts.length === 0) return;
        const parent = ensureFolder(parts.slice(0, -1));
        parent.children.push({
          name: parts[parts.length - 1],
          type: 'file',
          path: file.path,
          state: file.state || 'clean',
          age: relativeTime(file.last_access),
        });
      });
      return root;
    }

    function currentFileState(workspace) {
      const files = (workspace && workspace.files_touched) || {};
      if (workspace && workspace.current_file && files[workspace.current_file]) return files[workspace.current_file];
      return touchedFiles(workspace)[0] || null;
    }

    const realmSections = [

      { id: 'certs', title: 'Certs', icon: 'ShieldCheck', open: false, body: 'ingress certs valid · next expiry 31d' },

    function getIconNode(name) {
      const registry = window.lucide && window.lucide.icons ? window.lucide.icons : {};
      const icon = registry[name];
      if (Array.isArray(icon)) return icon;
      if (icon && Array.isArray(icon.iconNode)) return icon.iconNode;
      return null;

    function Icon({ name, className = '' }) {

      return (

          stroke="currentColor"
          strokeWidth="2"

    function Message({ who, name, time, children, headerActions }) {

          </div>
          <div className={`max-w-[85%] px-3 py-2 rounded text-zinc-300 leading-relaxed ${isKit ? 'bg-amber-500/10 border border-amber-500/20' : 'bg-zinc-900 border border-zinc-800'}`}>

          </div>
        </div>

    function ToolCallChip({ name }) {
      return (
        <div className="flex items-center gap-1.5 text-[10px] text-zinc-500 mb-1">
          <Icon name="FileCode" className="w-2.5 h-2.5 text-blue-400" />
          <span>tool: {name}</span>
        </div>
      );
    }

    function ChatMessage({ message, agentName, onRegenerate }) {
      const isKit = message.who === 'kit';
      const headerActions = !isKit && onRegenerate ? (
        <button

          <Icon name="RefreshCw" className="w-3 h-3" />

    function TreeNode({ node, depth = 0 }) {
      const indent = { paddingLeft: `${depth * 12 + 8}px` };
      if (node.type === 'repo') {
        return (
          <div>
            <div className="flex items-center gap-1.5 px-2 py-1 text-xs text-zinc-400 border-b border-zinc-800/60">

                </span>
              )}
            </div>
            {node.children.length === 0 ? (
              <div className="px-3 py-2 text-[10px] text-zinc-600">No touched files yet.</div>

    function ReviewTreeNode({ node, depth = 0, selectedPath, fileStates, onSelectFile }) {

                selectedPath={selectedPath}
                fileStates={fileStates}
                onSelectFile={onSelectFile}

        state === 'reviewed-approved' ? 'border-emerald-400/30 text-emerald-300'

    function ReviewCommentThread({ comments }) {
      return (
        <div className="rounded border-l border-zinc-700 bg-zinc-900/50 px-3 py-2 space-y-2">

    function ActivityTimeline({ items, activityHeight, startDragActivity, isDraggingActivity }) {
      return (
        <>
          <div
            onMouseDown={startDragActivity}
            className={`h-1 shrink-0 cursor-row-resize transition-colors ${isDraggingActivity ? 'bg-zinc-700' : 'bg-transparent hover:bg-zinc-800'}`}
          />
          <div style={{ height: `${activityHeight}px` }} className="border-t border-zinc-800 bg-zinc-900/50 shrink-0 flex flex-col">

              <Icon name="Activity" className="w-3 h-3" />

          </div>

    function CommsTab({
      agents,
      agentsLoading,
      agentsError,
      focused,
      activeAgent,
      setActiveAgent,
      threads,
      inputValue,
      setInputValue,
      onSend,
      onRegenerate,
      onResetSession,
      sendingAgent,
    }) {
      const activeThread = threads[activeAgent] || [];
      const canSend = focused && inputValue.trim() && sendingAgent !== activeAgent;
      const isStreaming = focused && sendingAgent === activeAgent;
      const canResetSession = focused && !isStreaming;
      const lastAgentMessageID = useMemo(() => {
        for (let i = activeThread.length - 1; i >= 0; i--) {
          if (activeThread[i].who !== 'kit') return activeThread[i].id;
        }
        return null;
      }, [activeThread]);
      return (
        <div className="flex-1 flex min-h-0">
          <div className="w-44 border-r border-zinc-800 bg-zinc-900/30 overflow-y-auto shrink-0">
            <div className="px-2 py-1.5 text-[10px] uppercase text-zinc-500 border-b border-zinc-800/60">
              Warband - {agentsLoading ? 'loading' : agents.length}
            </div>
            {agentsError && (
              <div className="m-2 rounded border border-red-900/60 bg-red-950/30 px-2 py-1.5 text-[10px] text-red-300">
                {agentsError}
              </div>
            )}
            {!agentsLoading && !agentsError && agents.length === 0 && (
              <div className="px-2 py-2 text-[10px] text-zinc-600">No agents returned.</div>
            )}
            {agentsLoading && (
              <div className="px-2 py-2 text-[10px] text-zinc-600">Loading agents...</div>
            )}
            {agents.map(agent => (
              <button
                key={agent.id}
                onClick={() => setActiveAgent(agent.id)}
                className={`w-full flex items-center gap-2 px-2 py-1.5 text-left transition-colors border-l-2 ${activeAgent === agent.id ? 'bg-zinc-900 border-amber-500' : 'border-transparent hover:bg-zinc-900/50'}`}
              >
                <StatusDot status={agent.status} flag={agent.flag} />
                <div className="flex-1 min-w-0">
                  <div className={`text-xs truncate ${activeAgent === agent.id ? 'text-zinc-100' : 'text-zinc-400'}`}>{agent.name}</div>
                  <div className="text-[9px] text-zinc-600 truncate">{agent.role}</div>
                </div>
              </button>
            ))}
          </div>

          <div className="flex-1 flex flex-col min-w-0">
            <div className="px-3 py-1.5 border-b border-zinc-800 bg-zinc-900/30 flex items-center gap-2 shrink-0">
              <StatusDot status={focused ? focused.status : 'idle'} />
              <span className="text-zinc-300 text-xs">{focused ? focused.name : 'No agent'}</span>
              <span className="text-zinc-600 text-[10px]">-</span>
              <span className="text-zinc-500 text-[10px]">{focused ? focused.role : 'Comms'}</span>
              <div className="ml-auto flex items-center gap-2 min-w-0">
                <button
                  onClick={onResetSession}
                  disabled={!canResetSession}
                  className="flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] border border-zinc-800 text-zinc-400 hover:border-zinc-700 hover:text-zinc-200 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                  title="Start a new session"
                >
                  <Icon name="RotateCcw" className="w-2.5 h-2.5" />
                  <span>New Session</span>
                </button>
                <span className="text-zinc-600 text-[10px] truncate">{focused ? focused.model : ''}</span>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto px-3 py-2 space-y-3 text-[11px]">
              {activeThread.length === 0 && (
                <div className="h-full flex items-center justify-center text-zinc-700 text-xs">
                  {focused ? `No messages with ${focused.name} yet.` : 'Select an agent to start a thread.'}
                </div>
              )}
              {activeThread.map(message => {
                const showRegenerate = !isStreaming && message.id === lastAgentMessageID && message.who !== 'kit' && !message.streaming;
                return (
                  <ChatMessage
                    key={message.id}
                    message={message}
                    agentName={focused ? focused.name : 'Agent'}
                    onRegenerate={showRegenerate ? onRegenerate : undefined}
                  />
                );
              })}
            </div>
            <div className="border-t border-zinc-800 bg-zinc-900/50 px-3 py-2 shrink-0">
              <div className="flex items-end gap-2">
                <textarea
                  rows="1"
                  value={inputValue}
                  disabled={!focused || sendingAgent === activeAgent}
                  onChange={event => setInputValue(event.target.value)}
                  onKeyDown={event => {
                    if (event.key === 'Enter' && !event.shiftKey) {
                      event.preventDefault();
                      if (canSend) onSend();
                    }
                  }}
                  placeholder={focused ? `Message ${focused.name}...` : 'No agent selected'}
                  className="flex-1 bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500 resize-none"
                />
                <button
                  onClick={onSend}
                  disabled={!canSend}
                  className={`rounded p-1.5 ${canSend ? 'bg-amber-500 hover:bg-amber-400 text-zinc-950' : 'bg-zinc-800 text-zinc-600 cursor-not-allowed'}`}
                  title="Send"
                >
                  <Icon name="Send" className="w-3.5 h-3.5" />
                </button>
              </div>
              <div className="mt-1 text-[9px] text-zinc-600 flex items-center justify-between">
                <span>Enter to send - Shift+Enter for newline</span>
                <span>{sendingAgent === activeAgent ? 'streaming' : focused && focused.status === 'active' ? 'ready' : 'idle'}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function WarriorsTab({ agents, fleetStates, setActiveTab, setActiveAgent }) {
      const fleetByName = useMemo(() => {
        const out = {};
        fleetStates.forEach(state => { out[state.id] = state; });

              <button
                key={agent.id}

                className="border border-zinc-800 rounded p-2 bg-zinc-900/30 text-left hover:border-zinc-700"
              >
                <div className="flex items-center gap-1.5 mb-1">
                  <StatusDot status={status} />
                  <span className="text-zinc-200 text-xs font-semibold">{agent.name}</span>
                  <span className="text-[9px] text-zinc-600 ml-auto">{agent.role}</span>
                </div>

                <div className="text-[10px] text-zinc-500">

    function RealmTab() {
      const [open, setOpen] = useState(() => Object.fromEntries(realmSections.map(section => [section.id, section.open])));
      const [cluster, setCluster] = useState({ pods: [], nodes: [], loading: true, podsError: '', nodesError: '' });
      const [gitops, setGitops] = useState({ data: null, loading: true, error: '', syncBusy: false });
      const [prs, setPRs] = useState({ rows: [], loading: true, error: '' });
      const [certs, setCerts] = useState({ rows: [], loading: true, error: '' });
      const [events, setEvents] = useState({ rows: [], loading: true, error: '' });

      useEffect(() => {
        let cancelled = false;
        const fetchCluster = async () => {
          const [podsResult, nodesResult] = await Promise.allSettled([
            fetch('/api/v1/cluster/pods').then(response => {
              if (!response.ok) throw new Error('failed to load cluster pods');
              return response.json();
            }),
            fetch('/api/v1/cluster/nodes').then(response => {
              if (!response.ok) throw new Error('failed to load cluster nodes');
              return response.json();
            }),
          ]);
          if (cancelled) return;
          setCluster({
            pods: podsResult.status === 'fulfilled' ? asArrayPayload(podsResult.value, 'pods') : [],
            nodes: nodesResult.status === 'fulfilled' ? asArrayPayload(nodesResult.value, 'nodes') : [],
            loading: false,
            podsError: podsResult.status === 'rejected' ? podsResult.reason.message : '',
            nodesError: nodesResult.status === 'rejected' ? nodesResult.reason.message : '',
          });
        };
        fetchCluster();
        const id = setInterval(fetchCluster, 30000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchGitops = () => {
          fetch('/api/v1/gitops/status')
            .then(response => {
              if (!response.ok) throw new Error('failed to load gitops status');
              return response.json();
            })
            .then(data => { if (!cancelled) setGitops(current => ({ ...current, data, loading: false, error: '' })); })
            .catch(error => { if (!cancelled) setGitops(current => ({ ...current, data: null, loading: false, error: error.message })); });
        };
        fetchGitops();
        const id = setInterval(fetchGitops, 30000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchPRs = () => {
          fetch('/api/v1/gitea/prs')
            .then(response => {
              if (!response.ok) throw new Error('failed to load gitea prs');
              return response.json();
            })
            .then(data => { if (!cancelled) setPRs({ rows: asArrayPayload(data, 'prs'), loading: false, error: '' }); })
            .catch(error => { if (!cancelled) setPRs({ rows: [], loading: false, error: error.message }); });
        };
        fetchPRs();
        const id = setInterval(fetchPRs, 60000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchCerts = () => {
          fetch('/api/v1/cluster/certs')
            .then(response => {
              if (response.status === 404) throw new Error('certs endpoint not available');
              if (!response.ok) throw new Error('failed to load certs');
              return response.json();
            })
            .then(data => { if (!cancelled) setCerts({ rows: asArrayPayload(data, 'certs'), loading: false, error: '' }); })
            .catch(error => { if (!cancelled) setCerts({ rows: [], loading: false, error: error.message }); });
        };
        fetchCerts();
        const id = setInterval(fetchCerts, 300000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchEvents = () => {
          fetch('/api/v1/k8s/events')
            .then(response => {
              if (!response.ok) throw new Error('failed to load k8s events');
              return response.json();
            })
            .then(data => { if (!cancelled) setEvents({ rows: asArrayPayload(data, 'events'), loading: false, error: '' }); })
            .catch(error => { if (!cancelled) setEvents({ rows: [], loading: false, error: error.message }); });
        };
        fetchEvents();
        const id = setInterval(fetchEvents, 30000);
        return () => { cancelled = true; clearInterval(id); };

    function SettingsDrawer({ open, onClose }) {
      const drawerRef = useRef(null);
      const [settings, setSettings] = useState({});
      const [drafts, setDrafts] = useState({});
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [saving, setSaving] = useState('');

      useEffect(() => {
        if (!open) return;
        setLoading(true);
        setError('');
        fetch('/api/v1/settings')
          .then(response => {
            if (!response.ok) throw new Error('failed to load settings');
            return response.json();
          })
          .then(data => {
            setSettings(data || {});
            setDrafts(data || {});
          })
          .catch(err => setError(err.message || 'failed to load settings'))
          .finally(() => setLoading(false));
      }, [open]);

      useEffect(() => {
        if (!open) return;
        const onKey = event => {
          if (event.key === 'Escape') onClose();
        };
        const onMouseDown = event => {
          if (event.target.closest && event.target.closest('[data-settings-toggle="true"]')) return;
          if (drawerRef.current && !drawerRef.current.contains(event.target)) onClose();
        };
        document.addEventListener('keydown', onKey);
        document.addEventListener('mousedown', onMouseDown);
        return () => {
          document.removeEventListener('keydown', onKey);
          document.removeEventListener('mousedown', onMouseDown);
        };
      }, [open, onClose]);

      if (!open) return null;

      const saveSetting = (key) => {
        setSaving(key);
        setError('');
        fetch(`/api/v1/settings/${encodeURIComponent(key)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: drafts[key] }),
        })
          .then(response => {
            if (!response.ok) throw new Error(`failed to save ${key}`);
            return response.json();
          })
          .then(data => {
            setSettings(data || {});
            setDrafts(data || {});
          })
          .catch(err => setError(err.message || `failed to save ${key}`))
          .finally(() => setSaving(''));
      };

      return (
        <div ref={drawerRef} className="fixed right-0 top-10 bottom-6 z-30 w-[360px] border-l border-zinc-800 bg-zinc-950 shadow-2xl flex flex-col">
          <div className="h-10 border-b border-zinc-800 bg-zinc-900 flex items-center px-3 gap-2 shrink-0">
            <Icon name="Settings" className="w-3.5 h-3.5 text-amber-400" />
            <span className="text-xs text-zinc-200 font-semibold">Settings</span>
            <button onClick={onClose} className="ml-auto text-zinc-500 hover:text-zinc-300" title="Close">
              <Icon name="X" className="w-3.5 h-3.5" />
            </button>
          </div>
          <div className="flex-1 overflow-y-auto p-3 space-y-2">
            {loading && <div className="text-[10px] text-zinc-600">Loading settings...</div>}
            {error && <div className="rounded border border-red-900/60 bg-red-950/30 px-2 py-1.5 text-[10px] text-red-300">{error}</div>}
            {!loading && Object.keys(settings).sort().map(key => {
              const value = drafts[key];
              const isBool = typeof settings[key] === 'boolean';
              return (
                <div key={key} className="border border-zinc-800 rounded bg-zinc-900/30 p-2">
                  <div className="text-[10px] text-zinc-500 mb-1">{key}</div>
                  <div className="flex items-center gap-2">
                    {isBool ? (
                      <input
                        type="checkbox"
                        checked={Boolean(value)}
                        onChange={event => setDrafts(current => ({ ...current, [key]: event.target.checked }))}
                        className="accent-amber-500"
                      />
                    ) : (
                      <input
                        value={value == null ? '' : String(value)}
                        onChange={event => {
                          const raw = event.target.value;
                          const next = typeof settings[key] === 'number' && raw !== '' ? Number(raw) : raw;
                          setDrafts(current => ({ ...current, [key]: next }));
                        }}
                        className="min-w-0 flex-1 bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-100 focus:outline-none focus:border-amber-500"
                      />
                    )}
                    <button
                      onClick={() => saveSetting(key)}
                      disabled={saving === key}
                      className="px-2 py-1 rounded border border-zinc-700 text-[10px] text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 disabled:text-zinc-700"
                    >
                      {saving === key ? 'Saving' : 'Save'}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
