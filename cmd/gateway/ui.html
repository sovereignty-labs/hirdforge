<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hirdforge — cockpit</title>
<style>
  /* ===================== Phosphor design system (locked 2026-07-25) =====================
     The law: COOL phosphor = the machine (alive/working/done); WARM ember-coral = you
     (needs-operator, held steps, the Lockbox gate). Ground carries a whisper of teal so it
     reads powered-on. Glow is a dark-mode gift; light settles to a calm deep-spring. */
  :root{
    --ground:#0E1417; --surface:#141D20; --surface-2:#1B2629; --raise:#202B2E;
    --line:#273A3B; --line-soft:#1E2B2D;
    --text:#E6F1EE; --text-2:#98ADA8; --text-3:#5E726D;
    --accent:#31E0A3; --accent-2:#5BEFBE; --accent-ink:#04231A; --accent-glow:rgba(49,224,163,.14);
    --good:#31E0A3; --good-bg:rgba(49,224,163,.13);
    --warn:#FF8B5A; --warn-bg:rgba(255,139,90,.15);
    --crit:#FF6B6B; --crit-bg:rgba(255,107,107,.13);
    --shadow:0 1px 2px rgba(0,0,0,.30),0 10px 30px rgba(0,0,0,.34);
    --shadow-lift:0 2px 8px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
    --r:11px; --r-sm:8px;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --ground:#EDF4F1; --surface:#FAFCFB; --surface-2:#E1EDE9; --raise:#FFFFFF;
    --line:#CFDFDA; --line-soft:#DEEAE6;
    --text:#0F201B; --text-2:#495C57; --text-3:#7B8F89;
    --accent:#0E9E72; --accent-2:#12B482; --accent-ink:#FFFFFF; --accent-glow:rgba(14,158,114,.12);
    --good:#0E9E72; --good-bg:rgba(14,158,114,.13);
    --warn:#D06A34; --warn-bg:rgba(208,106,52,.14);
    --crit:#CF4B37; --crit-bg:rgba(207,75,55,.12);
    --shadow:0 1px 2px rgba(20,30,26,.06),0 8px 24px rgba(20,30,26,.08);
    --shadow-lift:0 2px 6px rgba(20,30,26,.10),0 18px 48px rgba(20,30,26,.16);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);font-family:var(--ui);font-size:13px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums;overflow:hidden}
  button,input,textarea{font-family:inherit}
  button{cursor:pointer}
  .mono{font-family:var(--mono)}
  ::selection{background:var(--accent-glow)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

  /* shell */
  .app{display:grid;grid-template-rows:46px 1fr;height:100dvh}
  .topbar{display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.14em;text-transform:lowercase;font-size:13px}
  .ember{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-2),var(--accent));
    box-shadow:0 0 0 3px var(--accent-glow),0 0 13px var(--accent-glow)}
  .crumbs{display:flex;align-items:center;gap:7px;color:var(--text-3);font-size:12px}
  .crumbs b{color:var(--text-2);font-weight:500}.crumbs .sep{opacity:.5}
  .spacer{flex:1}
  .lanepill{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:12px;color:var(--text-2)}
  .lanepill .k{color:var(--text-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
  .lanepill b{color:var(--text);font-weight:600}
  .iconbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text-2)}
  .iconbtn:hover{background:var(--surface-2);color:var(--text);border-color:var(--line)}
  svg{display:block}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--good)}
  .dot.live{box-shadow:0 0 8px 0 var(--accent-glow)}
  @media (prefers-reduced-motion:no-preference){.dot.live{animation:pulse 2.1s ease-out infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 var(--good-bg)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}}
  .dot.warn{background:var(--warn)} .dot.off{background:var(--text-3)}

  .body{display:grid;grid-template-columns:232px 1fr 356px;min-height:0}
  @media (max-width:1080px){.body{grid-template-columns:210px 1fr}.inspector{display:none}}
  @media (max-width:760px){.body{grid-template-columns:1fr}.rail{display:none}}

  /* rail */
  .rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .rail .pad{padding:12px 12px 8px}
  .newbtn{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--text);font-weight:500;font-size:13px}
  .newbtn:hover{border-color:var(--accent);background:var(--accent-glow)}.newbtn svg{color:var(--accent)}
  .navsec{padding:4px 8px}
  .navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-2);font-size:13px}
  .navitem:hover{background:var(--surface-2);color:var(--text)}
  .navitem.on{background:var(--accent-glow);color:var(--text);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .navitem.on svg{color:var(--accent);filter:drop-shadow(0 0 5px var(--accent-glow))}
  .navitem svg{color:var(--text-3);flex:none}
  .navlabel{padding:10px 10px 5px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
  .threads{flex:1;overflow-y:auto;padding:2px 8px 8px}
  .thread{display:block;width:100%;text-align:left;padding:8px 9px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-2);margin-bottom:1px}
  .thread:hover{background:var(--surface-2)}.thread.on{background:var(--surface-2);border-color:var(--line)}
  .thread .t{font-size:12.5px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread.on .t{color:var(--accent)}
  .thread .m{font-size:11px;color:var(--text-3);margin-top:2px}
  .railfoot{border-top:1px solid var(--line);padding:9px 10px;display:flex;align-items:center;gap:9px}
  .avatar{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:12px;box-shadow:0 0 14px -4px var(--accent)}
  .railfoot .who{font-size:12.5px;font-weight:600}.railfoot .role{font-size:11px;color:var(--text-3)}

  /* center / conversation */
  .main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--ground);
    background-image:radial-gradient(130% 60% at 50% -8%,var(--accent-glow),transparent 60%)}
  .maincol{max-width:920px;width:100%;margin:0 auto;padding:22px 26px 0;flex:1;overflow-y:auto;min-height:0}
  .msg{display:flex;gap:12px;margin-bottom:22px}
  .msg .who{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700}
  .who.op{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
  .who.ai{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 0 16px -3px var(--accent)}
  .bubble{flex:1;min-width:0}
  .byline{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .byline .name{font-weight:600;font-size:12.5px}
  .byline .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .byline .time{font-size:11px;color:var(--text-3);margin-left:auto}
  .prose{color:var(--text);font-size:13.5px;line-height:1.62;white-space:pre-wrap;word-wrap:break-word}
  .prose code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px;border:1px solid var(--line-soft)}
  .empty{color:var(--text-3);text-align:center;padding:60px 20px;font-size:14px}
  .empty .big{font-size:17px;color:var(--text-2);margin-bottom:8px}
  .caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;box-shadow:0 0 8px var(--accent)}
  @media (prefers-reduced-motion:no-preference){.caret{animation:blink 1.1s step-end infinite}@keyframes blink{50%{opacity:0}}}
  /* markdown in interlocutor replies */
  .prose h1{font-size:17px;font-weight:650;margin:14px 0 8px}
  .prose h2{font-size:15px;font-weight:650;margin:14px 0 7px}
  .prose h3{font-size:13.5px;font-weight:650;margin:12px 0 6px}
  .prose ul,.prose ol{margin:6px 0 10px;padding-left:20px}
  .prose li{margin:3px 0}
  .prose strong{font-weight:650}
  .prose a{color:var(--accent);text-decoration:underline}
  .prose pre.cb{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:8px 0;font-family:var(--mono);font-size:12px;line-height:1.5}
  .prose pre.cb code{background:none;border:none;padding:0;font-size:12px}
  .prose table.md{border-collapse:collapse;margin:8px 0;font-size:12.5px;display:block;overflow-x:auto;max-width:100%}
  .prose table.md th,.prose table.md td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .prose table.md th{background:var(--surface-2);font-weight:600}
  .grounding{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin:8px 0 2px}
  .gspin{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);flex:none}
  @media (prefers-reduced-motion:no-preference){.gspin{animation:gpulse 1.1s ease-in-out infinite}@keyframes gpulse{50%{opacity:.3}}}
  .softerr{color:var(--warn);font-size:12px;margin-top:8px}

  /* plan card */
  .plan{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);margin:8px 0 6px;overflow:hidden}
  .plan-h{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
  .plan-h svg{color:var(--accent);filter:drop-shadow(0 0 5px var(--accent-glow))}
  .plan-h .ttl{font-weight:600;font-size:12.5px}.plan-h .meta{margin-left:auto;font-size:11px;color:var(--text-3)}
  .steps{padding:6px 13px 11px}
  .step{display:flex;gap:11px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line-soft)}
  .step:last-child{border-bottom:0}
  .step .n{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
  .step .s-t{font-size:12.5px;font-weight:500}
  .step .s-m{font-size:11px;color:var(--text-3);margin-top:2px;font-family:var(--mono)}
  .gate-chip{font-size:10.5px;color:var(--good);background:var(--good-bg);padding:1px 8px;border-radius:999px;margin-left:auto;white-space:nowrap;align-self:center}
  .gate-chip.you{color:var(--warn);background:var(--warn-bg)}
  .plan-f{display:flex;align-items:center;gap:9px;padding:10px 13px;border-top:1px solid var(--line-soft);background:var(--surface)}
  .plan-f .note{font-size:11.5px;color:var(--text-3);flex:1}
  .btn{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--text)}
  .btn:hover{border-color:var(--text-3)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px -6px var(--accent)}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.ghost{background:transparent}
  .btn.warn{background:var(--warn);border-color:var(--warn);color:#241004}
  .btn[disabled]{opacity:.5;pointer-events:none}

  /* composer */
  .composer{max-width:920px;width:100%;margin:0 auto;padding:12px 26px 20px}
  .inputwrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:11px 13px;display:flex;align-items:flex-end;gap:8px}
  .inputwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .inputwrap textarea{flex:1;border:none;background:transparent;color:var(--text);font-size:13.5px;resize:none;max-height:160px;line-height:1.5}
  .inputwrap textarea::placeholder{color:var(--text-3)}
  .send{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);border:none;display:grid;place-items:center;box-shadow:0 0 16px -5px var(--accent)}
  .send[disabled]{opacity:.4;box-shadow:none}

  /* inspector */
  .inspector{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .insp-h{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .insp-h .ttl{font-weight:600;font-size:12.5px}
  .insp-body{flex:1;overflow-y:auto;padding:12px}
  .sublabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin:4px 2px 8px;display:flex;align-items:center;gap:7px}
  .task{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);padding:10px 11px;margin-bottom:8px}
  .task .top{display:flex;align-items:center;gap:8px}
  .task .id{font-family:var(--mono);font-size:11px;color:var(--text-3)}
  .task .st{margin-left:auto;font-size:10.5px;padding:1px 8px;border-radius:999px;font-weight:600}
  .st.run{color:var(--good);background:var(--good-bg);box-shadow:0 0 10px -4px var(--accent)}
  .st.done{color:var(--good);background:var(--good-bg)}
  .st.wait{color:var(--text-3);background:var(--surface)}
  .st.fail{color:var(--crit);background:var(--crit-bg)}
  .task .name{font-size:12.5px;font-weight:500;margin:6px 0 7px}
  .task .foot{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-3);font-family:var(--mono);flex-wrap:wrap}
  .task .foot a{color:var(--accent)}
  .evi{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--good);background:var(--good-bg);border-radius:6px;padding:2px 8px;font-family:var(--mono);box-shadow:0 0 12px -5px var(--accent)}
  .cortex{margin-top:6px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--ground);overflow:hidden}
  .cortex .ch{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--text-2)}
  .cortex .ch svg{color:var(--accent)}.cortex .ch .d{margin-left:auto;font-size:10px;color:var(--text-3)}
  .cortex .log{padding:8px 10px;font-family:var(--mono);font-size:11px;line-height:1.85;max-height:200px;overflow-y:auto}
  .cortex .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
  .cortex .log .t{color:var(--text-3)}.cortex .log .g{color:var(--good);text-shadow:0 0 8px var(--accent-glow)}.cortex .log .w{color:var(--warn)}
  .approve{margin-top:10px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:var(--r-sm);background:var(--warn-bg);overflow:hidden}
  .approve .stripe{height:3px;background:var(--warn)}
  .approve .ap{padding:11px 12px}
  .approve .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);font-weight:700;display:flex;align-items:center;gap:6px}
  .approve .txt{font-size:12.5px;margin:6px 0 10px}
  .approve .row{display:flex;gap:8px}.approve .btn{flex:1;padding:7px}
  .insp-empty{color:var(--text-3);font-size:12px;padding:16px 4px;text-align:center}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);
    border-radius:9px;padding:10px 16px;font-size:12.5px;color:var(--text);box-shadow:var(--shadow-lift);z-index:80;opacity:0;transition:opacity .2s,transform .2s;transform:translateX(-50%) translateY(8px)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:color-mix(in srgb,var(--crit) 50%,var(--line))}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="ember"></span>hirdforge</div>
    <div class="crumbs"><span>workspace</span><span class="sep">/</span><b id="repoCrumb">kit/hirdforge</b><span class="sep">·</span><span class="mono">main</span></div>
    <div class="spacer"></div>
    <div class="lanepill" title="The model you're talking to"><span class="dot live" id="laneDot"></span><span class="k">interlocutor</span><b id="laneName">Steward</b><span class="mono" id="laneModel" style="color:var(--text-3)">qwen27b</span></div>
    <button class="iconbtn" id="themeBtn" title="Theme" aria-label="Toggle theme"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </div>
  <div class="body">
    <aside class="rail">
      <div class="pad"><button class="newbtn" id="newThread"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New thread</button></div>
      <div class="navsec">
        <button class="navitem on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>Cockpit</button>
      </div>
      <div class="navlabel">Threads</div>
      <div class="threads" id="threads"></div>
      <div class="railfoot"><div class="avatar" id="userAv">K</div><div><div class="who" id="userName">Operator</div><div class="role">Sovereign</div></div></div>
    </aside>

    <main class="main">
      <div class="maincol" id="stream"></div>
      <div class="composer">
        <div class="inputwrap">
          <textarea id="input" rows="1" placeholder="Tell the forge what needs doing…"></textarea>
          <button class="send" id="send" aria-label="Send"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </main>

    <aside class="inspector">
      <div class="insp-h"><span class="dot live"></span><span class="ttl">Pipeline</span></div>
      <div class="insp-body" id="inspector"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
  const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const fmtCode = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
  const now = () => new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const api = (p,opt) => fetch('/api/v1'+p,opt).then(async r=>{ if(!r.ok){ let t=''; try{t=(await r.json()).error||''}catch(e){} throw new Error(t||('HTTP '+r.status)); } return r.status===204?null:r.json(); });

  const root = document.documentElement;
  $('#themeBtn').addEventListener('click',()=>{ const cur=root.getAttribute('data-theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); root.setAttribute('data-theme',cur==='dark'?'light':'dark'); try{localStorage.setItem('hf_theme',root.getAttribute('data-theme'))}catch(e){} });
  try{ const t=localStorage.getItem('hf_theme'); if(t)root.setAttribute('data-theme',t); }catch(e){}

  let toastT;
  function toast(msg,err){ const t=$('#toast'); t.textContent=msg; t.className='toast on'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',3200); }

  function newSession(){ return 'ui-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6); }
  let sessionId = newSession();
  const plans = {};

  const stream = $('#stream');
  function emptyState(){ stream.innerHTML=''; stream.appendChild(el('div','empty','<div class="big">Talk to the forge.</div>Describe what needs doing. It grounds in live state, proposes a plan, and nothing runs until you bless it.')); }
  emptyState();

  function addMsg(role, name, tag, bodyNode){
    const empty=stream.querySelector('.empty'); if(empty)empty.remove();
    const m=el('div','msg');
    m.appendChild(el('div','who '+(role==='op'?'op':'ai'), role==='op'?(($('#userAv').textContent)||'K'):'◆'));
    const bub=el('div','bubble');
    const by=el('div','byline');
    by.appendChild(el('span','name',esc(name)));
    if(tag)by.appendChild(el('span','tag',esc(tag)));
    by.appendChild(el('span','time',now()));
    bub.appendChild(by);
    if(bodyNode)bub.appendChild(bodyNode);
    m.appendChild(bub);
    stream.appendChild(m);
    stream.scrollTop=stream.scrollHeight;
    return bub;
  }

  function planCard(plan){
    const steps=plan.steps||[];
    const nDisp = steps.filter(s=>!s.needs_operator).length;
    const nYou = steps.length - nDisp;
    const card=el('div','plan');
    const h=el('div','plan-h','<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3 8-8M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>');
    h.appendChild(el('span','ttl',esc(plan.title||'Plan')));
    h.appendChild(el('span','meta',steps.length+' step'+(steps.length===1?'':'s')+(nYou?' · '+nYou+' needs you':'')));
    card.appendChild(h);
    const sw=el('div','steps');
    steps.forEach((s,i)=>{
      const st=el('div','step');
      st.appendChild(el('span','n',String(i+1)));
      const mid=el('div');
      mid.appendChild(el('div','s-t',esc(s.title||'')));
      if(s.detail)mid.appendChild(el('div','s-m',esc(s.detail)));
      st.appendChild(mid);
      const held=!!s.needs_operator;
      st.appendChild(el('span','gate-chip'+(held?' you':''), held?'you':esc(s.gate||'gate')));
      sw.appendChild(st);
    });
    card.appendChild(sw);
    const f=el('div','plan-f');
    f.appendChild(el('span','note','Cortex routes each task; you merge. Nothing hits <code>main</code> without you.'));
    const revise=el('button','btn ghost','Revise'); revise.onclick=()=>{ $('#input').value='Revise the plan: '; $('#input').focus(); };
    const dispatch=el('button','btn primary', nDisp? 'Dispatch':'Held for you');
    if(!nDisp)dispatch.disabled=true;
    dispatch.onclick=()=>bless(plan.id,dispatch);
    f.appendChild(revise); f.appendChild(dispatch);
    card.appendChild(f);
    return card;
  }

  async function bless(planId,btn){
    btn.disabled=true; btn.textContent='Dispatching…';
    try{
      const r=await api('/steward/handoff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,plan_id:planId})});
      const n=(r.created_issues||[]).length;
      btn.textContent='Dispatched ✓';
      toast(n+' task'+(n===1?'':'s')+' dispatched to Cortex — watch the pipeline.');
      refreshInspector();
    }catch(e){ btn.disabled=false; btn.textContent='Dispatch'; toast('Blessing refused: '+e.message,true); }
  }

  // ---- markdown (the interlocutor writes headers, tables, bold, code) ----
  function renderTable(block){
    const rows=block.trim().split('\n').map(r=>r.trim()).filter(Boolean);
    if(rows.length<2) return block;
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>inlineMd(c.trim()));
    let h='<table class="md"><thead><tr>'+cells(rows[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
    for(const r of rows.slice(2)){ h+='<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>'; }
    return h+'</tbody></table>';
  }
  function inlineMd(s){
    return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
            .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
            .replace(/`([^`]+)`/g,'<code>$1</code>')
            .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  }
  function renderMarkdown(md){
    if(!md) return '';
    let s=esc(md);
    const blocks=[];
    s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,code)=>{blocks.push('<pre class="cb"><code>'+code.replace(/\n+$/,'')+'</code></pre>');return ''+(blocks.length-1)+'';});
    s=s.replace(/(?:^\|.*\|[ \t]*\n?)+/gm,b=>{blocks.push(renderTable(b));return ''+(blocks.length-1)+'';});
    const out=[];
    for(let para of s.split(/\n{2,}/)){
      para=para.trim(); if(!para) continue;
      const ph=para.match(/^(\d+)$/);
      if(ph){ out.push(blocks[+ph[1]]); continue; }
      if(/^### /.test(para)){ out.push('<h3>'+inlineMd(para.slice(4))+'</h3>'); continue; }
      if(/^## /.test(para)){ out.push('<h2>'+inlineMd(para.slice(3))+'</h2>'); continue; }
      if(/^# /.test(para)){ out.push('<h1>'+inlineMd(para.slice(2))+'</h1>'); continue; }
      if(/^\s*[-*] /.test(para)){ out.push('<ul>'+para.split('\n').map(l=>'<li>'+inlineMd(l.replace(/^\s*[-*] /,''))+'</li>').join('')+'</ul>'); continue; }
      if(/^\s*\d+\. /.test(para)){ out.push('<ol>'+para.split('\n').map(l=>'<li>'+inlineMd(l.replace(/^\s*\d+\. /,''))+'</li>').join('')+'</ol>'); continue; }
      out.push('<p>'+inlineMd(para).replace(/\n/g,'<br>')+'</p>');
    }
    return out.join('');
  }
  // hide reasoning + the plan JSON while streaming (both shown properly at the end).
  function cleanStream(t){
    if(!t) return '';
    return t.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/<think>[\s\S]*$/,'')
            // Hermes/Qwen tool-call XML streams in raw tokens before the agent's
            // cleaned snapshot arrives; hide it (closed and partial-at-tail) so it
            // never flashes in the reply.
            .replace(/<tool_call>[\s\S]*?<\/tool_call>/g,'').replace(/<tool_call>[\s\S]*$/,'')
            .replace(/<function=[\s\S]*?<\/function>/g,'').replace(/<function=[\s\S]*$/,'')
            .replace(/```json[\s\S]*?```/g,'').replace(/```json[\s\S]*$/,'').trim();
  }

  // A long grounding turn (minutes) can outlive the streaming connection — an
  // upstream proxy (the Cloudflare tunnel) may drop it before `done`. But the
  // gateway drives each turn on a background context and RECORDS it on completion
  // regardless of the client, so the answer still lands server-side. On a cut,
  // poll the session store until the turn appears and render it — the turn is
  // never lost, only its live stream.
  async function pollForTurn(text, proseEl, thinking){
    for(let i=0;i<160;i++){                 // ~8 min ceiling at 3s
      await new Promise(r=>setTimeout(r,3000));
      try{
        const s=await (await fetch('/api/v1/steward/sessions/'+encodeURIComponent(sessionId))).json();
        const turns=(s&&s.turns)||[];
        const t=turns[turns.length-1];
        if(t && t.message===text && (t.reply||'').trim()){
          proseEl.innerHTML=renderMarkdown(t.reply);
          if(t.plan){ plans[t.plan.id]=t.plan; thinking.appendChild(planCard(t.plan)); }
          stream.scrollTop=stream.scrollHeight;
          return true;
        }
      }catch(e){}
    }
    return false;
  }

  async function sendMessage(text){
    addMsg('op', $('#userName').textContent||'Operator', null, el('div','prose',fmtCode(text)));
    const thinking=addMsg('ai', $('#laneName').textContent||'Steward', $('#laneModel').textContent, el('div','prose','<span class="caret"></span>'));
    const proseEl=thinking.querySelector('.prose');
    let toolLine=null, lastText='', sawDone=false;
    const atBottom=()=> stream.scrollTop+stream.clientHeight >= stream.scrollHeight-40;
    const reconnecting=()=>{ if(!toolLine){ toolLine=el('div','grounding'); proseEl.after(toolLine); } toolLine.innerHTML='<span class="gspin"></span>reconnecting — the interlocutor is still working…'; };
    try{
      const resp=await fetch('/api/v1/steward/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text})});
      if(!resp.ok||!resp.body){ let m='HTTP '+resp.status; try{m=(await resp.json()).error||m}catch(e){} throw new Error(m); }
      const reader=resp.body.getReader(), dec=new TextDecoder();
      let sse='';
      for(;;){
        const {value,done}=await reader.read(); if(done) break;
        sse+=dec.decode(value,{stream:true});
        let i;
        while((i=sse.indexOf('\n\n'))>=0){
          const line=sse.slice(0,i); sse=sse.slice(i+2);
          if(!line.startsWith('data: ')) continue;
          let o; try{ o=JSON.parse(line.slice(6)); }catch(e){ continue; }
          const stick=atBottom();
          if(o.tool){ if(!toolLine){ toolLine=el('div','grounding'); proseEl.after(toolLine); } toolLine.innerHTML='<span class="gspin"></span>forging · '+esc(o.tool); }
          if(o.text!=null){ lastText=o.text; proseEl.innerHTML=renderMarkdown(cleanStream(lastText))+'<span class="caret"></span>'; }
          if(o.done){ sawDone=true; if(toolLine){toolLine.remove();toolLine=null;} proseEl.innerHTML=renderMarkdown(o.reply||cleanStream(lastText)); if(o.error){ proseEl.innerHTML+='<div class="softerr">('+esc(o.error)+')</div>'; } if(o.plan){ plans[o.plan.id]=o.plan; thinking.appendChild(planCard(o.plan)); } }
          if(stick) stream.scrollTop=stream.scrollHeight;
        }
      }
      // Ended without a terminal 'done' — the stream was cut. Recover the turn.
      if(!sawDone){
        reconnecting();
        const ok=await pollForTurn(text, proseEl, thinking);
        if(toolLine){ toolLine.remove(); toolLine=null; }
        if(!ok){ proseEl.innerHTML+='<div class="softerr">(lost the connection and the turn didn\'t land — try again)</div>'; }
      }
      refreshInspector();
    }catch(e){
      // A mid-stream network error throws here; the turn may still be completing
      // server-side, so attempt recovery before surfacing a hard error.
      if(!sawDone){
        reconnecting();
        const ok=await pollForTurn(text, proseEl, thinking);
        if(ok){ if(toolLine){toolLine.remove();toolLine=null;} refreshInspector(); return; }
      }
      if(toolLine)toolLine.remove();
      proseEl.innerHTML='<span style="color:var(--crit)">Couldn\'t reach the interlocutor — '+esc(e.message)+'</span>';
    }
  }

  const input=$('#input'), sendBtn=$('#send');
  function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,160)+'px'; }
  input.addEventListener('input',autosize);
  function submit(){ const t=input.value.trim(); if(!t)return; input.value=''; autosize(); sendMessage(t); }
  sendBtn.addEventListener('click',submit);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submit(); } });
  $('#newThread').addEventListener('click',()=>{ sessionId=newSession(); emptyState(); input.focus(); toast('New thread.'); });

  const insp=$('#inspector');
  const ACTIVE=t=>!['validated','failed'].includes(t.status);
  function taskCard(t){
    const c=el('div','task');
    const top=el('div','top');
    top.appendChild(el('span','id',esc(t.id? String(t.id).slice(-8):'task')));
    const cls = t.status==='failed'?'fail' : (t.status==='validated'||t.status==='merged')?'done' : (t.status==='building'||t.status==='dispatched'||t.status==='queued')?'run':'wait';
    top.appendChild(el('span','st '+cls, esc(t.status||'')));
    c.appendChild(top);
    c.appendChild(el('div','name', esc(t.issue_title || (t.issue_repo?('issue '+t.issue_repo+'#'+t.issue_number):('task '+(t.id||''))))));
    const foot=el('div','foot');
    if(t.pr_repo&&t.pr_number) foot.appendChild(el('span',null,'PR #'+t.pr_number));
    else if(t.issue_number) foot.appendChild(el('span',null,'#'+t.issue_number));
    if(t.agent) foot.appendChild(el('span',null,esc(t.agent)));
    c.appendChild(foot);
    return c;
  }
  async function refreshInspector(){
    try{
      const tasks=await api('/cortex/tasks');
      const list=Array.isArray(tasks)?tasks:(tasks.tasks||[]);
      insp.innerHTML='';
      const active=list.filter(ACTIVE);
      insp.appendChild(el('div','sublabel','<span class="dot live"></span>Active — '+active.length+' running'));
      if(!active.length && !list.length){ insp.appendChild(el('div','insp-empty','No tasks yet. Bless a plan and work will flow here.')); }
      else (active.length?active:list.slice(0,5)).forEach(t=>insp.appendChild(taskCard(t)));
      try{
        const log=await api('/cortex/log');
        const rows=Array.isArray(log)?log:(log.decisions||log.log||[]);
        if(rows&&rows.length){
          const box=el('div','cortex');
          box.appendChild(el('div','ch','<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Cortex log<span class="d">deterministic</span>'));
          const logEl=el('div','log');
          rows.slice(0,12).forEach(d=>{ const reason=esc(d.reason||d.Reason||''); const at=String(d.at||d.At||''); logEl.appendChild(el('div',null,'<span class="t">'+esc(at.slice(11,19))+'</span> '+reason)); });
          box.appendChild(logEl); insp.appendChild(box);
        }
      }catch(e){}
      try{
        const ap=await api('/approvals');
        const aps=Array.isArray(ap)?ap:(ap.approvals||ap.items||[]);
        (aps||[]).slice(0,3).forEach(a=>{
          const box=el('div','approve'); box.appendChild(el('div','stripe'));
          const inn=el('div','ap');
          inn.appendChild(el('div','lab','<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>Lockbox · your call'));
          inn.appendChild(el('div','txt', esc(a.note||a.summary||a.title||'Approve a pending action')));
          const row=el('div','row');
          const ok=el('button','btn warn','Approve'); ok.onclick=()=>decide(a,true,ok);
          const no=el('button','btn ghost','Reject'); no.onclick=()=>decide(a,false,no);
          row.appendChild(ok); row.appendChild(no); inn.appendChild(row); box.appendChild(inn); insp.appendChild(box);
        });
      }catch(e){}
    }catch(e){ insp.innerHTML=''; insp.appendChild(el('div','insp-empty','Pipeline unavailable — '+esc(e.message))); }
  }
  async function decide(a,approve,btn){
    const id=a.id||a.queue_id||a.request_id;
    btn.disabled=true;
    try{ await api('/approvals/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:approve?'approve':'reject'})}); toast(approve?'Approved.':'Rejected.'); refreshInspector(); }
    catch(e){ btn.disabled=false; toast('Could not record: '+e.message,true); }
  }

  refreshInspector();
  setInterval(refreshInspector,5000);

  try{
    const proto=location.protocol==='https:'?'wss':'ws';
    const ws=new WebSocket(proto+'://'+location.host+'/ws/events');
    ws.onmessage=()=>{ $('#laneDot').classList.add('live'); refreshInspector(); };
    ws.onerror=()=>{};
  }catch(e){}

  api('/agents').then(list=>{
    const arr=Array.isArray(list)?list:(list.agents||[]);
    const st=(arr||[]).find(a=>(a.name||'').toLowerCase()==='steward');
    if(st&&st.model)$('#laneModel').textContent=st.model;
  }).catch(e=>{});

  input.focus();
})();
</script>
</body>
</html>
