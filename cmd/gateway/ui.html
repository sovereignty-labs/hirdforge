<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hirdforge UI 1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgb(39 39 42); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(63 63 70); }
    * { scrollbar-width: thin; scrollbar-color: rgb(39 39 42) transparent; }
    body { margin: 0; background: rgb(9 9 11); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const mockAgents = [
      { id: 'ragnar', name: 'Ragnar', role: 'Architect', model: 'MiniMax M2.7', status: 'active', task: 'Coordinating #211 review', surface: 'idle' },
      { id: 'ivar', name: 'Ivar', role: 'Builder', model: 'Gemma 4 26B (local-builder)', status: 'active', task: 'Writing rbac/gateway-argocd.yaml', surface: 'builder' },
      { id: 'jeeves', name: 'Jeeves', role: 'PA', model: 'MiniMax M2.7', status: 'active', task: 'Drafting reply to Sarah Chen', pendingApproval: true, flag: true, surface: 'action' },
      { id: 'sindri', name: 'Sindri', role: 'Builder', model: 'MiniMax M2.7', status: 'active', task: 'Reading PR #210 diff', surface: 'idle' },
      { id: 'chuck', name: 'Chuck', role: 'Builder', model: 'MiniMax M2.7', status: 'idle', surface: 'idle' },
      { id: 'val', name: 'Val', role: 'Builder', model: 'MiniMax M2.7', status: 'idle', surface: 'idle' },
      { id: 'leif', name: 'Leif', role: 'Builder', model: 'MiniMax M2.7', status: 'idle', surface: 'idle' },
      { id: 'freya', name: 'Freya', role: 'Reviewer', model: 'GPT-5.2', status: 'idle', surface: 'idle' },
      { id: 'thane', name: 'Thane', role: 'Reviewer', model: 'MiniMax M2.7', status: 'idle', surface: 'idle' },
    ];

    function normalizeAgent(agent) {
      const name = String(agent.name || '').trim();
      return {
        ...agent,
        id: name,
        name,
        role: agent.role || 'Agent',
        model: agent.model || 'unknown',
        status: agent.healthy ? 'active' : 'idle',
      };
    }

    function normalizeFleetState(state) {
      const name = String(state.name || '').trim();
      return {
        ...state,
        id: name,
        name,
        status: state.active ? 'active' : 'idle',
      };
    }

    function countPendingApprovals(data) {
      const queues = Array.isArray(data) ? data : Array.isArray(data && data.queues) ? data.queues : [];
      return queues.filter(item => item && item.status === 'pending').length;
    }

    function mockSurfaceForAgent(agent) {
      const key = String((agent && (agent.id || agent.name)) || '').toLowerCase();
      const mock = mockAgents.find(item => item.id === key || item.name.toLowerCase() === key);
      if (mock && (mock.surface === 'builder' || mock.surface === 'action')) return mock.surface;
      const role = String((agent && agent.role) || '').toLowerCase();
      if (role.includes('pa') || role.includes('assistant') || role.includes('action')) return 'action';
      return 'builder';
    }

    function formatTime(date = new Date()) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function messageID(prefix) {
      if (window.crypto && window.crypto.randomUUID) return `${prefix}-${window.crypto.randomUUID()}`;
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function extractToolName(evt) {
      if (evt.name) return String(evt.name);
      const call = evt.tool_call || {};
      if (call.name) return String(call.name);
      if (call.function && call.function.name) return String(call.function.name);
      return 'tool_call';
    }

    function asArrayPayload(data, key) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data[key])) return data[key];
      return [];
    }

    function shortImage(image) {
      const value = String(image || '');
      const noDigest = value.split('@')[0];
      return noDigest.split('/').filter(Boolean).pop() || value || '-';
    }

    function shortSHA(value) {
      const text = String(value || '');
      return text ? text.slice(0, 7) : '-';
    }

    function formatPercent(value) {
      return Number.isFinite(Number(value)) ? `${Number(value).toFixed(0)}%` : '-';
    }

    function prAge(pr) {
      const raw = pr.updated_at || pr.created_at;
      if (!raw) return '-';
      const then = new Date(raw).getTime();
      if (!Number.isFinite(then)) return '-';
      const minutes = Math.max(0, Math.floor((Date.now() - then) / 60000));
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      if (hours < 48) return `${hours}h`;
      return `${Math.floor(hours / 24)}d`;
    }

    function prReviewStatus(pr) {
      const labels = Array.isArray(pr.labels) ? pr.labels.map(label => String(label).toLowerCase()) : [];
      if (labels.some(label => label.includes('draft'))) return 'draft';
      if (Number(pr.approvals || 0) > 0) return 'approved';
      if (pr.state && pr.state !== 'open') return pr.state;
      return 'awaiting-review';
    }

    const builderEventTypes = new Set(['file_read', 'file_write', 'git_clone', 'git_branch_create', 'git_commit', 'git_push', 'pr_create', 'exec']);
    const typedToolEventTypes = new Set([...builderEventTypes, 'http_request']);

    function relativeTime(value) {
      if (!value) return 'now';
      const then = value instanceof Date ? value.getTime() : new Date(value).getTime();
      if (!Number.isFinite(then)) return 'now';
      const seconds = Math.max(0, Math.floor((Date.now() - then) / 1000));
      if (seconds < 5) return 'now';
      if (seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      if (hours < 48) return `${hours}h`;
      return `${Math.floor(hours / 24)}d`;
    }

    function truncateMiddle(value, max = 56) {
      const text = String(value || '');
      if (text.length <= max) return text;
      const head = Math.ceil((max - 1) / 2);
      const tail = Math.floor((max - 1) / 2);
      return `${text.slice(0, head)}…${text.slice(text.length - tail)}`;
    }

    function activityIcon(type) {
      if (type === 'git_clone') return 'FolderGit2';
      if (type === 'git_branch_create') return 'GitBranch';
      if (type === 'git_commit') return 'GitCommit';
      if (type === 'git_push') return 'UploadCloud';
      if (type === 'pr_create') return 'GitPullRequest';
      if (type === 'exec') return 'Terminal';
      if (type === 'http_request') return 'Globe2';
      return 'FileCode';
    }

    function activitySummary(evt) {
      const type = evt.type;
      if (type === 'file_read') return `read ${evt.path || 'file'}`;
      if (type === 'file_write') return `${evt.status === 'complete' ? 'wrote' : 'writing'} ${evt.path || 'file'}`;
      if (type === 'git_clone') return `cloned ${evt.repo || 'repo'}`;
      if (type === 'git_branch_create') return `created branch ${evt.branch_new || 'branch'}`;
      if (type === 'git_commit') return `committed ${evt.files_changed || 0} files`;
      if (type === 'git_push') return `pushed ${evt.branch || 'branch'} to ${evt.remote || 'origin'}`;
      if (type === 'pr_create') return `opened PR #${evt.number || ''} ${evt.title || ''}`.trim();
      if (type === 'exec') return `exec ${truncateMiddle(evt.command || 'command', 42)}`;
      if (type === 'http_request') return `${evt.method || 'GET'} ${truncateMiddle(evt.url || 'url', 44)} ${evt.status_code || ''}`.trim();
      return type;
    }

    function activityEntryFromEvent(evt) {
      return {
        time: Date.now(),
        type: evt.type,
        path: evt.path || '',
        text: activitySummary(evt),
        icon: activityIcon(evt.type),
        current: evt.type === 'file_write' && evt.status === 'writing',
      };
    }

    function hasWorkspaceContent(workspace) {
      return Boolean(workspace && (
        workspace.current_repo ||
        workspace.current_branch ||
        workspace.current_file ||
        Object.keys(workspace.files_touched || {}).length > 0
      ));
    }

    function hasBuilderActivity(timeline = []) {
      return timeline.some(item => builderEventTypes.has(item.type));
    }

    function stateWeight(state) {
      if (state === 'writing') return 0;
      if (state === 'read') return 1;
      return 2;
    }

    function touchedFiles(workspace) {
      return Object.entries((workspace && workspace.files_touched) || {})
        .map(([path, state]) => ({ path, ...(state || {}) }))
        .sort((a, b) => stateWeight(a.state) - stateWeight(b.state) || a.path.localeCompare(b.path));
    }

    function buildTreeFromWorkspace(workspace) {
      const root = { name: workspace.current_repo || 'workspace', type: 'repo', branch: workspace.current_branch || '', children: [] };
      const folders = new Map();
      const ensureFolder = (parts) => {
        let parent = root;
        let prefix = '';
        parts.forEach(part => {
          prefix = prefix ? `${prefix}/${part}` : part;
          if (!folders.has(prefix)) {
            const folder = { name: part, type: 'folder', expanded: true, children: [] };
            folders.set(prefix, folder);
            parent.children.push(folder);
          }
          parent = folders.get(prefix);
        });
        return parent;
      };
      touchedFiles(workspace).forEach(file => {
        const parts = String(file.path || '').split('/').filter(Boolean);
        if (parts.length === 0) return;
        const parent = ensureFolder(parts.slice(0, -1));
        parent.children.push({
          name: parts[parts.length - 1],
          type: 'file',
          path: file.path,
          state: file.state || 'clean',
          age: relativeTime(file.last_access),
        });
      });
      return root;
    }

    function currentFileState(workspace) {
      const files = (workspace && workspace.files_touched) || {};
      if (workspace && workspace.current_file && files[workspace.current_file]) return files[workspace.current_file];
      return touchedFiles(workspace)[0] || null;
    }

    const ivarActivity = [
      { t: '2m ago', text: 'cloned kit/asgard-infra', icon: 'FolderGit2' },
      { t: '90s ago', text: 'created branch ivar/argocd-rbac-fix', icon: 'GitBranch' },
      { t: '70s ago', text: 'read rbac/agent-roles.yaml', icon: 'FileCode' },
      { t: '45s ago', text: 'read rbac/asgard-agent-binding.yaml', icon: 'FileCode' },
      { t: 'now', text: 'writing rbac/gateway-argocd.yaml', icon: 'FileCode', current: true },
      { t: 'next', text: 'validate yaml', icon: 'CheckCircle2', pending: true },
      { t: 'next', text: 'commit and push', icon: 'GitCommit', pending: true },
      { t: 'next', text: 'open PR', icon: 'GitPullRequest', pending: true },
    ];

    const jeevesActivity = [
      { t: '4m ago', text: 'received email from Sarah Chen', icon: 'Inbox' },
      { t: '3m ago', text: 'classified as response-needed', icon: 'Mail' },
      { t: '2m ago', text: 'checked calendar — Fri 2pm available', icon: 'Calendar' },
      { t: '90s ago', text: 'composed reply', icon: 'Edit3' },
      { t: 'now', text: 'queued send for Sovereign approval', icon: 'ShieldAlert', current: true },
      { t: 'next', text: 'send email', icon: 'Send', pending: true },
      { t: 'next', text: 'send calendar invite', icon: 'Calendar', pending: true },
    ];

    const tree = {
      name: 'kit/asgard-infra',
      type: 'repo',
      children: [
        { name: 'infrastructure', type: 'folder', collapsed: true },
        {
          name: 'rbac',
          type: 'folder',
          expanded: true,
          children: [
            { name: 'agent-roles.yaml', type: 'file', state: 'read', age: '70s' },
            { name: 'asgard-agent-binding.yaml', type: 'file', state: 'read', age: '45s' },
            { name: 'gateway-argocd.yaml', type: 'file', state: 'writing', age: 'now' },
          ],
        },
        { name: 'networkpolicies', type: 'folder', collapsed: true },
        { name: 'sealed-secrets', type: 'folder', collapsed: true },
        { name: 'README.md', type: 'file', state: 'clean' },
      ],
    };

    const yamlLines = [
      { n: 1, c: 'apiVersion: rbac.authorization.k8s.io/v1' },
      { n: 2, c: 'kind: ClusterRole' },
      { n: 3, c: 'metadata:' },
      { n: 4, c: '  name: gateway-argocd-reader' },
      { n: 5, c: '  labels:' },
      { n: 6, c: '    asgard.io/component: gateway' },
      { n: 7, c: 'rules:' },
      { n: 8, c: '  - apiGroups: ["argoproj.io"]' },
      { n: 9, c: '    resources: ["applications"]' },
      { n: 10, c: '    verbs: ["get", "list", "watch", "patch"]', writing: true },
    ];

    const realmSections = [
      { id: 'cluster', title: 'Cluster', icon: 'Server', open: true, body: '10 nodes · 47 pods · all green' },
      { id: 'gitops', title: 'GitOps · ArgoCD', icon: 'GitBranch', open: true, body: 'asgard · Synced · Healthy' },
      { id: 'gitea', title: 'Gitea PRs', icon: 'GitPullRequest', open: false, body: '3 open · 1 awaiting Sovereign merge' },
      { id: 'certs', title: 'Certs', icon: 'ShieldCheck', open: false, body: 'ingress certs valid · next expiry 31d' },
      { id: 'events', title: 'K8s Events', icon: 'Activity', open: false, body: 'No warning events in the last hour' },
    ];

    function getIconNode(name) {
      const registry = window.lucide && window.lucide.icons ? window.lucide.icons : {};
      const icon = registry[name];
      if (Array.isArray(icon)) return icon;
      if (icon && Array.isArray(icon.iconNode)) return icon.iconNode;
      return null;
    }

    function Icon({ name, className = '' }) {
      const iconNode = getIconNode(name);
      if (!iconNode) {
        return <span className={`inline-block rounded-sm border border-current ${className}`} aria-hidden="true" />;
      }
      return (
        <svg
          className={className}
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          aria-hidden="true"
        >
          {iconNode.map(([tag, attrs], index) => React.createElement(tag, { ...attrs, key: index }))}
        </svg>
      );
    }

    function StatusDot({ status, flag }) {
      return (
        <span className="relative inline-flex items-center justify-center shrink-0">
          <span className={`w-2 h-2 rounded-full ${status === 'active' ? 'bg-emerald-400' : 'bg-zinc-600'}`} />
          {status === 'active' && <span className="absolute w-2 h-2 rounded-full bg-emerald-400 animate-ping opacity-75" />}
          {flag && <span className="absolute -top-1 -right-1 w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse" />}
        </span>
      );
    }

    function Message({ who, name, time, children }) {
      const isKit = who === 'kit';
      return (
        <div className={`flex flex-col ${isKit ? 'items-end' : 'items-start'}`}>
          <div className="flex items-center gap-2 mb-1 text-[10px] text-zinc-500">
            {!isKit && <span className="font-semibold text-zinc-400">{name}</span>}
            <span>{time}</span>
            {isKit && <span className="font-semibold text-amber-400">{name}</span>}
          </div>
          <div className={`max-w-[85%] px-3 py-2 rounded text-zinc-300 leading-relaxed ${isKit ? 'bg-amber-500/10 border border-amber-500/20' : 'bg-zinc-900 border border-zinc-800'}`}>
            {children}
          </div>
        </div>
      );
    }

    function ToolCallChip({ name }) {
      return (
        <div className="flex items-center gap-1.5 text-[10px] text-zinc-500 mb-1">
          <Icon name="FileCode" className="w-2.5 h-2.5 text-blue-400" />
          <span>tool: {name}</span>
        </div>
      );
    }

    function ChatMessage({ message, agentName }) {
      const isKit = message.who === 'kit';
      return (
        <Message who={message.who} name={isKit ? 'Kit' : agentName} time={message.time}>
          {message.toolCalls && message.toolCalls.map((tool, index) => (
            <ToolCallChip key={`${tool.name}-${index}`} name={tool.name} />
          ))}
          {message.content && <span className="whitespace-pre-wrap">{message.content}</span>}
          {message.streaming && <span className="inline-block w-1.5 h-3 align-middle ml-1 bg-amber-400 animate-pulse" />}
          {message.error && <span className="text-red-300 whitespace-pre-wrap">{message.error}</span>}
        </Message>
      );
    }

    function TreeNode({ node, depth = 0 }) {
      const indent = { paddingLeft: `${depth * 12 + 8}px` };
      if (node.type === 'repo') {
        return (
          <div>
            <div className="flex items-center gap-1.5 px-2 py-1 text-xs text-zinc-400 border-b border-zinc-800/60">
              <Icon name="FolderGit2" className="w-3 h-3 text-amber-400 shrink-0" />
              <span className="text-zinc-300 truncate">{node.name}</span>
              {node.branch && (
                <span className="ml-auto text-[10px] text-zinc-600 flex items-center gap-1 shrink-0">
                  <Icon name="GitBranch" className="w-2.5 h-2.5" /> {node.branch}
                </span>
              )}
            </div>
            {node.children.length === 0 ? (
              <div className="px-3 py-2 text-[10px] text-zinc-600">No touched files yet.</div>
            ) : node.children.map((child, index) => <TreeNode key={`${child.path || child.name}-${index}`} node={child} depth={0} />)}
          </div>
        );
      }
      if (node.type === 'folder') {
        return (
          <div>
            <div style={indent} className="flex items-center gap-1 py-0.5 text-xs text-zinc-500 hover:text-zinc-300 cursor-pointer">
              <Icon name={node.expanded ? 'ChevronDown' : 'ChevronRight'} className="w-3 h-3 shrink-0" />
              <Icon name={node.expanded ? 'FolderOpen' : 'Folder'} className="w-3 h-3 shrink-0" />
              <span className="truncate">{node.name}</span>
            </div>
            {node.expanded && node.children.map((child, index) => <TreeNode key={`${child.path || child.name}-${index}`} node={child} depth={depth + 1} />)}
          </div>
        );
      }
      const stateClasses =
        node.state === 'writing' ? 'bg-amber-500/10 text-amber-200 border-l-2 border-amber-500'
        : node.state === 'read' ? 'text-zinc-300'
        : 'text-zinc-500';
      const dotClass =
        node.state === 'writing' ? 'bg-amber-400 animate-pulse'
        : node.state === 'read' ? 'bg-blue-400/60'
        : 'bg-transparent';
      return (
        <div style={indent} className={`flex items-center gap-1.5 py-0.5 text-xs cursor-pointer ${stateClasses}`}>
          <span className="w-3 shrink-0" />
          <Icon name="File" className="w-3 h-3 opacity-70 shrink-0" />
          <span className="flex-1 truncate">{node.name}</span>
          {node.state !== 'clean' && (
            <>
              <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${dotClass}`} />
              <span className="text-[9px] text-zinc-600 w-7 text-right shrink-0">{node.age}</span>
            </>
          )}
        </div>
      );
    }

    function ActivityTimeline({ items, activityHeight, startDragActivity, isDraggingActivity }) {
      return (
        <>
          <div
            onMouseDown={startDragActivity}
            className={`h-1 shrink-0 cursor-row-resize transition-colors ${isDraggingActivity ? 'bg-zinc-700' : 'bg-transparent hover:bg-zinc-800'}`}
          />
          <div style={{ height: `${activityHeight}px` }} className="border-t border-zinc-800 bg-zinc-900/50 shrink-0 flex flex-col">
            <div className="px-3 py-1.5 text-[10px] uppercase text-zinc-500 flex items-center gap-2 border-b border-zinc-800 shrink-0">
              <Icon name="Activity" className="w-3 h-3" />
              <span>Activity</span>
              <span className="ml-auto text-zinc-600">{items.length} events</span>
            </div>
            <div className="flex-1 overflow-y-auto px-3 py-2 space-y-1">
              {items.map((item, index) => {
                const textColor = item.current ? 'text-amber-300' : item.pending ? 'text-zinc-600' : 'text-zinc-400';
                const iconColor = item.current ? 'text-amber-400' : item.pending ? 'text-zinc-700' : 'text-zinc-500';
                const when = item.t || relativeTime(item.time);
                return (
                  <div key={`${item.text}-${index}`} className={`flex items-center gap-2 text-[11px] ${textColor}`}>
                    <span className="text-[9px] text-zinc-600 w-12 shrink-0">{when}</span>
                    <Icon name={item.icon} className={`w-3 h-3 shrink-0 ${iconColor}`} />
                    <span className="truncate">{item.text}</span>
                    {item.current && <span className="w-1 h-1 rounded-full bg-amber-400 animate-pulse shrink-0" />}
                  </div>
                );
              })}
            </div>
          </div>
        </>
      );
    }

    function CommsTab({
      agents,
      agentsLoading,
      agentsError,
      focused,
      activeAgent,
      setActiveAgent,
      threads,
      inputValue,
      setInputValue,
      onSend,
      sendingAgent,
    }) {
      const activeThread = threads[activeAgent] || [];
      const canSend = focused && inputValue.trim() && sendingAgent !== activeAgent;
      return (
        <div className="flex-1 flex min-h-0">
          <div className="w-44 border-r border-zinc-800 bg-zinc-900/30 overflow-y-auto shrink-0">
            <div className="px-2 py-1.5 text-[10px] uppercase text-zinc-500 border-b border-zinc-800/60">
              Warband - {agentsLoading ? 'loading' : agents.length}
            </div>
            {agentsError && (
              <div className="m-2 rounded border border-red-900/60 bg-red-950/30 px-2 py-1.5 text-[10px] text-red-300">
                {agentsError}
              </div>
            )}
            {!agentsLoading && !agentsError && agents.length === 0 && (
              <div className="px-2 py-2 text-[10px] text-zinc-600">No agents returned.</div>
            )}
            {agentsLoading && (
              <div className="px-2 py-2 text-[10px] text-zinc-600">Loading agents...</div>
            )}
            {agents.map(agent => (
              <button
                key={agent.id}
                onClick={() => setActiveAgent(agent.id)}
                className={`w-full flex items-center gap-2 px-2 py-1.5 text-left transition-colors border-l-2 ${activeAgent === agent.id ? 'bg-zinc-900 border-amber-500' : 'border-transparent hover:bg-zinc-900/50'}`}
              >
                <StatusDot status={agent.status} flag={agent.flag} />
                <div className="flex-1 min-w-0">
                  <div className={`text-xs truncate ${activeAgent === agent.id ? 'text-zinc-100' : 'text-zinc-400'}`}>{agent.name}</div>
                  <div className="text-[9px] text-zinc-600 truncate">{agent.role}</div>
                </div>
              </button>
            ))}
          </div>

          <div className="flex-1 flex flex-col min-w-0">
            <div className="px-3 py-1.5 border-b border-zinc-800 bg-zinc-900/30 flex items-center gap-2 shrink-0">
              <StatusDot status={focused ? focused.status : 'idle'} />

              <span className="text-zinc-600 text-[10px]">-</span>
              <span className="text-zinc-500 text-[10px]">{focused ? focused.role : 'Comms'}</span>
              <span className="text-zinc-600 text-[10px] ml-auto truncate">{focused ? focused.model : ''}</span>

                    if (event.key === 'Enter' && !event.shiftKey) {
                      event.preventDefault();

                  placeholder={focused ? `Message ${focused.name}...` : 'No agent selected'}

    function RealmTab() {
      const [open, setOpen] = useState(() => Object.fromEntries(realmSections.map(section => [section.id, section.open])));
      const [cluster, setCluster] = useState({ pods: [], nodes: [], loading: true, podsError: '', nodesError: '' });
      const [gitops, setGitops] = useState({ data: null, loading: true, error: '', syncBusy: false });
      const [prs, setPRs] = useState({ rows: [], loading: true, error: '' });
      const [certs, setCerts] = useState({ rows: [], loading: true, error: '' });
      const [events, setEvents] = useState({ rows: [], loading: true, error: '' });

      useEffect(() => {
        let cancelled = false;
        const fetchCluster = async () => {
          const [podsResult, nodesResult] = await Promise.allSettled([
            fetch('/api/v1/cluster/pods').then(response => {
              if (!response.ok) throw new Error('failed to load cluster pods');
              return response.json();
            }),
            fetch('/api/v1/cluster/nodes').then(response => {
              if (!response.ok) throw new Error('failed to load cluster nodes');
              return response.json();
            }),
          ]);
          if (cancelled) return;
          setCluster({
            pods: podsResult.status === 'fulfilled' ? asArrayPayload(podsResult.value, 'pods') : [],
            nodes: nodesResult.status === 'fulfilled' ? asArrayPayload(nodesResult.value, 'nodes') : [],
            loading: false,
            podsError: podsResult.status === 'rejected' ? podsResult.reason.message : '',
            nodesError: nodesResult.status === 'rejected' ? nodesResult.reason.message : '',
          });
        };
        fetchCluster();
        const id = setInterval(fetchCluster, 30000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchGitops = () => {
          fetch('/api/v1/gitops/status')
            .then(response => {
              if (!response.ok) throw new Error('failed to load gitops status');
              return response.json();
            })
            .then(data => { if (!cancelled) setGitops(current => ({ ...current, data, loading: false, error: '' })); })
            .catch(error => { if (!cancelled) setGitops(current => ({ ...current, data: null, loading: false, error: error.message })); });
        };
        fetchGitops();
        const id = setInterval(fetchGitops, 30000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchPRs = () => {
          fetch('/api/v1/gitea/prs')
            .then(response => {
              if (!response.ok) throw new Error('failed to load gitea prs');
              return response.json();
            })
            .then(data => { if (!cancelled) setPRs({ rows: asArrayPayload(data, 'prs'), loading: false, error: '' }); })
            .catch(error => { if (!cancelled) setPRs({ rows: [], loading: false, error: error.message }); });
        };
        fetchPRs();
        const id = setInterval(fetchPRs, 60000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchCerts = () => {
          fetch('/api/v1/cluster/certs')
            .then(response => {
              if (response.status === 404) throw new Error('certs endpoint not available');
              if (!response.ok) throw new Error('failed to load certs');
              return response.json();
            })
            .then(data => { if (!cancelled) setCerts({ rows: asArrayPayload(data, 'certs'), loading: false, error: '' }); })
            .catch(error => { if (!cancelled) setCerts({ rows: [], loading: false, error: error.message }); });
        };
        fetchCerts();
        const id = setInterval(fetchCerts, 300000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchEvents = () => {
          fetch('/api/v1/k8s/events')
            .then(response => {
              if (!response.ok) throw new Error('failed to load k8s events');
              return response.json();
            })
            .then(data => { if (!cancelled) setEvents({ rows: asArrayPayload(data, 'events'), loading: false, error: '' }); })
            .catch(error => { if (!cancelled) setEvents({ rows: [], loading: false, error: error.message }); });

        fetchEvents();
        const id = setInterval(fetchEvents, 30000);
        return () => { cancelled = true; clearInterval(id); };

      const forceSync = () => {

        setGitops(current => ({ ...current, syncBusy: true }));
        fetch('/api/v1/gitops/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
          .catch(() => {})
          .finally(() => setTimeout(() => setGitops(current => ({ ...current, syncBusy: false })), 5000));

                <tbody>
                  {visiblePods.map(pod => (
                    <tr key={`${pod.namespace}-${pod.name}`} className="border-t border-zinc-800/60 text-zinc-400">
                      <td className="max-w-[120px] truncate py-0.5">{pod.name}</td><td>{pod.namespace}</td><td>{pod.status}</td><td className="text-center">{pod.restarts}</td><td>{pod.age}</td><td>{pod.ready ? 'yes' : 'no'}</td><td className="max-w-[100px] truncate">{shortImage(pod.image)}</td>
                    </tr>

              </table>
              {!cluster.loading && cluster.pods.length === 0 && <div className="text-[10px] text-zinc-600">No pods returned.</div>}
              {cluster.pods.length > 50 && <div className="mt-1 text-[9px] text-zinc-600">showing 50 of {cluster.pods.length}</div>}
            </div>
            {cluster.nodesError && <div className="text-[10px] text-red-300">{cluster.nodesError}</div>}

          {gitops.data && (
            <>
              <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                <span className="text-zinc-600">App</span><span>{gitops.data.app || '-'}</span>
                <span className="text-zinc-600">Sync</span><span className="text-amber-300">{gitops.data.sync_status || '-'}</span>
                <span className="text-zinc-600">Health</span><span className="text-emerald-400">{gitops.data.health_status || '-'}</span>
                <span className="text-zinc-600">Last sync</span><span>{gitops.data.last_sync || '-'}</span>
                <span className="text-zinc-600">Deployed SHA</span><span>{shortSHA(gitops.data.deployed_sha)}</span>
              </div>
              <button onClick={forceSync} disabled={gitops.syncBusy} className={`mt-1 px-2 py-1 rounded border text-[10px] ${gitops.syncBusy ? 'border-zinc-800 text-zinc-600' : 'border-amber-500/40 text-amber-300 hover:bg-amber-500/10'}`}>
                Force Sync
              </button>
            </>
          )}
        </div>
      );

      const renderPRs = () => (
        <div>
          {prs.loading && <div className="text-[10px] text-zinc-600">Loading PRs...</div>}
          {prs.error && <div className="text-[10px] text-red-300">{prs.error}</div>}
          <table className="w-full text-[10px]">
            <thead className="text-zinc-600"><tr><th className="text-left">Repo</th><th>#</th><th className="text-left">Title</th><th>Author</th><th>Age</th><th>Status</th></tr></thead>
            <tbody>
              {prs.rows.map(pr => (
                <tr key={`${pr.repo}-${pr.number}`} className="border-t border-zinc-800/60 text-zinc-400">
                  <td className="max-w-[90px] truncate py-0.5">{pr.repo}</td><td>{pr.number}</td><td className="max-w-[170px] truncate">{pr.title}</td><td>{pr.user || '-'}</td><td>{prAge(pr)}</td><td>{prReviewStatus(pr)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {!prs.loading && prs.rows.length === 0 && <div className="text-[10px] text-zinc-600">No PRs returned.</div>}
        </div>
      );

      const renderCerts = () => (
        <div>
          {certs.loading && <div className="text-[10px] text-zinc-600">Loading certs...</div>}
          {certs.error && <div className="text-[10px] text-red-300">{certs.error}</div>}
          <table className="w-full text-[10px]">
            <thead className="text-zinc-600"><tr><th className="text-left">Name</th><th>Expiry</th><th>Days</th></tr></thead>
            <tbody>{certs.rows.map(cert => <tr key={cert.name} className="border-t border-zinc-800/60 text-zinc-400"><td>{cert.name}</td><td>{cert.expiry}</td><td>{cert.days_remaining}</td></tr>)}</tbody>
          </table>
          {!certs.loading && !certs.error && certs.rows.length === 0 && <div className="text-[10px] text-zinc-600">No certs returned.</div>}
        </div>

      const renderEvents = () => (
        <div>
          {events.loading && <div className="text-[10px] text-zinc-600">Loading events...</div>}
          {events.error && <div className="text-[10px] text-red-300">{events.error}</div>}
          <div className="space-y-1">
            {events.rows.slice(0, 20).map((event, index) => (
              <div key={`${event.time}-${event.reason}-${index}`} className={`grid grid-cols-[80px_52px_90px_1fr] gap-2 border-t border-zinc-800/60 py-0.5 text-[10px] ${event.type === 'Warning' ? 'text-amber-300' : 'text-zinc-400'}`}>
                <span className="truncate text-zinc-600">{event.time}</span><span>{event.type}</span><span className="truncate">{event.reason}</span><span className="truncate">{event.message}</span>

          {!events.loading && events.rows.length === 0 && <div className="text-[10px] text-zinc-600">No events returned.</div>}

        if (section.id === 'gitops') return renderGitops();
        if (section.id === 'gitea') return renderPRs();
        if (section.id === 'certs') return renderCerts();
        if (section.id === 'events') return renderEvents();
        return null;

      return (
        <div className="flex-1 overflow-y-auto p-3 space-y-3">
          {realmSections.map(section => (
            <div key={section.id} className="border border-zinc-800 rounded">
              <button
                onClick={() => setOpen(prev => ({ ...prev, [section.id]: !prev[section.id] }))}
                className="w-full px-2 py-1 text-[10px] uppercase text-zinc-500 border-b border-zinc-800 flex items-center gap-2 text-left"

            </div>
          ))}
        </div>
      );

    function SettingsDrawer({ open, onClose }) {
      const drawerRef = useRef(null);
      const [settings, setSettings] = useState({});
      const [drafts, setDrafts] = useState({});
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [saving, setSaving] = useState('');

      useEffect(() => {
        if (!open) return;
        setLoading(true);
        setError('');
        fetch('/api/v1/settings')
          .then(response => {
            if (!response.ok) throw new Error('failed to load settings');
            return response.json();
          })
          .then(data => {
            setSettings(data || {});
            setDrafts(data || {});
          })
          .catch(err => setError(err.message || 'failed to load settings'))
          .finally(() => setLoading(false));
      }, [open]);

      useEffect(() => {
        if (!open) return;
        const onKey = event => {
          if (event.key === 'Escape') onClose();
        };
        const onMouseDown = event => {
          if (event.target.closest && event.target.closest('[data-settings-toggle="true"]')) return;
          if (drawerRef.current && !drawerRef.current.contains(event.target)) onClose();
        };
        document.addEventListener('keydown', onKey);
        document.addEventListener('mousedown', onMouseDown);
        return () => {
          document.removeEventListener('keydown', onKey);
          document.removeEventListener('mousedown', onMouseDown);
        };
      }, [open, onClose]);

      if (!open) return null;

      const saveSetting = (key) => {
        setSaving(key);
        setError('');
        fetch(`/api/v1/settings/${encodeURIComponent(key)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: drafts[key] }),
        })
          .then(response => {
            if (!response.ok) throw new Error(`failed to save ${key}`);
            return response.json();
          })
          .then(data => {
            setSettings(data || {});
            setDrafts(data || {});
          })
          .catch(err => setError(err.message || `failed to save ${key}`))
          .finally(() => setSaving(''));
      };

      return (
        <div ref={drawerRef} className="fixed right-0 top-10 bottom-6 z-30 w-[360px] border-l border-zinc-800 bg-zinc-950 shadow-2xl flex flex-col">
          <div className="h-10 border-b border-zinc-800 bg-zinc-900 flex items-center px-3 gap-2 shrink-0">
            <Icon name="Settings" className="w-3.5 h-3.5 text-amber-400" />
            <span className="text-xs text-zinc-200 font-semibold">Settings</span>
            <button onClick={onClose} className="ml-auto text-zinc-500 hover:text-zinc-300" title="Close">
              <Icon name="X" className="w-3.5 h-3.5" />
            </button>
          </div>
          <div className="flex-1 overflow-y-auto p-3 space-y-2">
            {loading && <div className="text-[10px] text-zinc-600">Loading settings...</div>}
            {error && <div className="rounded border border-red-900/60 bg-red-950/30 px-2 py-1.5 text-[10px] text-red-300">{error}</div>}
            {!loading && Object.keys(settings).sort().map(key => {
              const value = drafts[key];
              const isBool = typeof settings[key] === 'boolean';
              return (
                <div key={key} className="border border-zinc-800 rounded bg-zinc-900/30 p-2">
                  <div className="text-[10px] text-zinc-500 mb-1">{key}</div>
                  <div className="flex items-center gap-2">
                    {isBool ? (
                      <input
                        type="checkbox"
                        checked={Boolean(value)}
                        onChange={event => setDrafts(current => ({ ...current, [key]: event.target.checked }))}
                        className="accent-amber-500"
                      />
                    ) : (
                      <input
                        value={value == null ? '' : String(value)}
                        onChange={event => {
                          const raw = event.target.value;
                          const next = typeof settings[key] === 'number' && raw !== '' ? Number(raw) : raw;
                          setDrafts(current => ({ ...current, [key]: next }));
                        }}
                        className="min-w-0 flex-1 bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-100 focus:outline-none focus:border-amber-500"
                      />
                    )}
                    <button
                      onClick={() => saveSetting(key)}
                      disabled={saving === key}
                      className="px-2 py-1 rounded border border-zinc-700 text-[10px] text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 disabled:text-zinc-700"
                    >
                      {saving === key ? 'Saving' : 'Save'}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function HirdforgeUI() {
      const [activeAgent, setActiveAgent] = useState('');
      const [activeTab, setActiveTab] = useState('comms');
      const [agents, setAgents] = useState([]);
      const [agentsLoading, setAgentsLoading] = useState(true);
      const [agentsError, setAgentsError] = useState('');
      const [fleetStates, setFleetStates] = useState([]);
      const [pendingApprovals, setPendingApprovals] = useState(0);
      const [showApprovalShield, setShowApprovalShield] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [threads, setThreads] = useState({});
      const [inputByAgent, setInputByAgent] = useState({});
      const [sendingAgent, setSendingAgent] = useState('');
      const [cursorBlink, setCursorBlink] = useState(true);
      const [leftRailWidth, setLeftRailWidth] = useState(260);
      const [activityHeight, setActivityHeight] = useState(176);
      const [isDraggingTree, setIsDraggingTree] = useState(false);
      const [isDraggingActivity, setIsDraggingActivity] = useState(false);
      const [workspaces, setWorkspaces] = useState({});
      const [activityByAgent, setActivityByAgent] = useState({});
      const focused = useMemo(() => agents.find(agent => agent.id === activeAgent) || null, [agents, activeAgent]);
      const focusedFleetState = useMemo(() => fleetStates.find(state => state.id === activeAgent) || null, [fleetStates, activeAgent]);
      const focusedWorkspace = workspaces[activeAgent] || null;
      const focusedTimeline = activityByAgent[activeAgent] || [];
      const focusedHasWorkspace = hasWorkspaceContent(focusedWorkspace);
      const focusedHasBuilderActivity = hasBuilderActivity(focusedTimeline);
      const focusedSurface = mockSurfaceForAgent(focused);
      const focusedStatusText = focusedFleetState && focusedFleetState.active ? 'active' : 'idle';

      useEffect(() => {
        const id = setInterval(() => setCursorBlink(blink => !blink), 530);
        return () => clearInterval(id);
      }, []);

      useEffect(() => {
        let cancelled = false;
        fetch('/api/v1/agents')
          .then(response => {
            if (!response.ok) throw new Error(`agents request failed: ${response.status}`);
            return response.json();
          })
          .then(data => {
            if (cancelled) return;
            const nextAgents = Array.isArray(data) ? data.map(normalizeAgent).filter(agent => agent.name) : [];
            setAgents(nextAgents);
            setAgentsError('');
            setActiveAgent(current => current || (nextAgents[0] ? nextAgents[0].id : ''));
          })
          .catch(error => {
            if (cancelled) return;
            setAgentsError(error.message || 'failed to load agents');
          })
          .finally(() => {
            if (!cancelled) setAgentsLoading(false);
          });
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchFleetState = () => {
          fetch('/api/v1/fleet/state')
            .then(response => {
              if (!response.ok) throw new Error(`fleet state request failed: ${response.status}`);
              return response.json();
            })
            .then(data => {
              if (cancelled) return;
              const nextStates = Array.isArray(data) ? data.map(normalizeFleetState).filter(state => state.name) : [];
              setFleetStates(nextStates);
            })
            .catch(() => {
              if (!cancelled) setFleetStates([]);
            });
        };
        fetchFleetState();
        const id = setInterval(fetchFleetState, 5000);
        return () => {
          cancelled = true;
          clearInterval(id);
        };
      }, []);

      useEffect(() => {
        let cancelled = false;
        const fetchApprovals = () => {
          fetch('/api/v1/approvals')
            .then(response => {
              if (!response.ok) throw new Error(`approvals request failed: ${response.status}`);
              return response.json();
            })
            .then(data => {
              if (cancelled) return;
              setPendingApprovals(countPendingApprovals(data));
              setShowApprovalShield(true);
            })
            .catch(() => {
              if (cancelled) return;
              setPendingApprovals(0);
              setShowApprovalShield(false);
            });
        };
        fetchApprovals();
        const id = setInterval(fetchApprovals, 10000);
        return () => {
          cancelled = true;
          clearInterval(id);
        };
      }, []);

      useEffect(() => {
        if (agents.length === 0) return;
        let cancelled = false;
        Promise.allSettled(agents.map(agent =>
          fetch(`/api/v1/agents/${encodeURIComponent(agent.id)}/workspace`)
            .then(response => {
              if (!response.ok) throw new Error(`workspace request failed: ${response.status}`);
              return response.json();
            })
            .then(workspace => [agent.id, workspace])
        )).then(results => {
          if (cancelled) return;
          const next = {};
          results.forEach(result => {
            if (result.status === 'fulfilled' && result.value && result.value[1]) {
              next[result.value[0]] = result.value[1];
            }
          });
          if (Object.keys(next).length > 0) {
            setWorkspaces(current => ({ ...current, ...next }));
          }
        });
        return () => { cancelled = true; };
      }, [agents]);

      useEffect(() => {
        if (!activeAgent) return;
        let cancelled = false;
        fetch(`/api/v1/agents/${encodeURIComponent(activeAgent)}/workspace`)
          .then(response => {
            if (!response.ok) throw new Error(`workspace request failed: ${response.status}`);
            return response.json();
          })
          .then(workspace => {
            if (cancelled || !workspace) return;
            setWorkspaces(current => ({ ...current, [activeAgent]: workspace }));
          })
          .catch(() => {});
        return () => { cancelled = true; };
      }, [activeAgent]);

      useEffect(() => {
        let closed = false;
        let socket = null;
        let reconnectTimer = null;
        const connect = () => {
          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          socket = new WebSocket(`${protocol}//${window.location.host}/ws/events`);
          socket.onmessage = event => {
            let payload;
            try {
              payload = JSON.parse(event.data);
            } catch (error) {
              return;
            }
            const agent = payload && payload.agent;
            if (!agent) return;
            if (payload.type === 'workspace_update' && payload.workspace) {
              setWorkspaces(current => ({ ...current, [agent]: payload.workspace }));
              return;
            }
            if (typedToolEventTypes.has(payload.type)) {
              const entry = activityEntryFromEvent(payload);
              setActivityByAgent(current => {
                const existing = current[agent] || [];
                const completedPath = payload.type === 'file_write' && payload.status === 'complete' ? String(payload.path || '') : '';
                const normalized = existing.map(item => {
                  const completedSameFile = completedPath && item.type === 'file_write' && item.path === completedPath && item.current;
                  if (!item.current || (entry.current && !completedSameFile)) return item;
                  return { ...item, current: false };
                });
                const capped = [...normalized, entry].slice(-50);
                const ttlCutoff = Date.now() - 60000;
                const swept = capped.map(item => item.current && item.time < ttlCutoff ? { ...item, current: false } : item);
                return { ...current, [agent]: swept };
              });
            }
          };
          socket.onclose = () => {
            if (!closed) reconnectTimer = setTimeout(connect, 2000);
          };
          socket.onerror = () => {
            if (socket) socket.close();
          };
        };
        connect();
        return () => {
          closed = true;
          if (reconnectTimer) clearTimeout(reconnectTimer);
          if (socket) socket.close();
        };
      }, []);

      const updateThread = (agentID, updater) => {
        setThreads(current => {
          const thread = current[agentID] || [];
          return { ...current, [agentID]: updater(thread) };
        });
      };

      const updateAgentMessage = (agentID, messageIDValue, updater) => {
        updateThread(agentID, thread => thread.map(message => (
          message.id === messageIDValue ? updater(message) : message
        )));
      };

      const sendCommsMessage = async () => {
        const agent = focused;
        if (!agent || sendingAgent === agent.id) return;
        const content = (inputByAgent[agent.id] || '').trim();
        if (!content) return;

        const kitMessage = {
          id: messageID('kit'),
          who: 'kit',
          time: formatTime(),
          content,
        };
        const agentMessageID = messageID('agent');
        const agentMessage = {
          id: agentMessageID,
          who: 'agent',
          time: formatTime(),
          content: '',
          toolCalls: [],
          streaming: true,
        };

        updateThread(agent.id, thread => [...thread, kitMessage, agentMessage]);
        setInputByAgent(current => ({ ...current, [agent.id]: '' }));
        setSendingAgent(agent.id);

        try {
          const response = await fetch('/api/v1/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agent: agent.name, content }),
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `message request failed: ${response.status}`);
          }
          if (!response.body) throw new Error('streaming response unavailable');

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          const handleEvent = (evt) => {
            if (evt.type === 'content' || (typeof evt.content === 'string' && !evt.type)) {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                content: message.content + (evt.content || ''),
              }));
              return;
            }
            if (evt.type === 'replace') {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                content: evt.content || '',
              }));
              return;
            }
            if (evt.type === 'tool_call') {
              updateAgentMessage(agent.id, agentMessageID, message => ({
                ...message,
                toolCalls: [...(message.toolCalls || []), { name: extractToolName(evt) }],
              }));
              return;
            }
            if (evt.type === 'done' || evt.done) {
              updateAgentMessage(agent.id, agentMessageID, message => ({ ...message, streaming: false }));
            }
          };

          const drainChunk = (chunk) => {
            buffer += chunk;
            const frames = buffer.split('\n\n');
            buffer = frames.pop() || '';
            frames.forEach(frame => {
              const dataLines = frame.split('\n')
                .filter(line => line.startsWith('data:'))
                .map(line => line.replace(/^data:\s?/, ''));
              if (dataLines.length === 0) return;
              try {
                handleEvent(JSON.parse(dataLines.join('\n')));
              } catch (error) {
                updateAgentMessage(agent.id, agentMessageID, message => ({
                  ...message,
                  content: message.content + dataLines.join('\n'),
                }));
              }
            });
          };

          while (true) {
            const { value, done } = await reader.read();
            if (value) drainChunk(decoder.decode(value, { stream: !done }));
            if (done) break;
          }
          if (buffer.trim()) drainChunk('\n\n');
          updateAgentMessage(agent.id, agentMessageID, message => ({ ...message, streaming: false }));
        } catch (error) {
          updateAgentMessage(agent.id, agentMessageID, message => ({
            ...message,
            streaming: false,
            error: error.message || 'message send failed',
          }));
        } finally {
          setSendingAgent(current => current === agent.id ? '' : current);
        }
      };

      const startDragTree = (event) => {
        event.preventDefault();
        setIsDraggingTree(true);
        const startX = event.clientX;
        const startWidth = leftRailWidth;
        const onMove = (moveEvent) => {
          const next = Math.max(160, Math.min(500, startWidth + (moveEvent.clientX - startX)));
          setLeftRailWidth(next);
        };
        const onUp = () => {
          setIsDraggingTree(false);
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };

      const startDragActivity = (event) => {
        event.preventDefault();
        setIsDraggingActivity(true);
        const startY = event.clientY;
        const startHeight = activityHeight;
        const onMove = (moveEvent) => {
          const next = Math.max(60, Math.min(400, startHeight - (moveEvent.clientY - startY)));
          setActivityHeight(next);
        };
        const onUp = () => {
          setIsDraggingActivity(false);
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };

      const dragCursorClass = isDraggingTree ? 'cursor-col-resize select-none' : isDraggingActivity ? 'cursor-row-resize select-none' : '';

      return (
        <div className={`h-screen w-screen bg-zinc-950 text-zinc-100 flex flex-col overflow-hidden font-mono text-xs ${dragCursorClass}`}>
          <div className="h-10 border-b border-zinc-800 bg-zinc-900 flex items-center px-3 gap-3 shrink-0">
            <div className="flex items-center gap-1.5">
              <div className="w-4 h-4 bg-amber-500 rounded-sm flex items-center justify-center">
                <span className="text-zinc-950 font-bold text-[10px]">H</span>
              </div>
              <span className="font-bold text-amber-400 text-xs">HIRDFORGE</span>
            </div>
            <div className="ml-2 flex items-center gap-0">
              {[
                { id: 'comms', label: 'Comms', icon: 'MessageSquare' },
                { id: 'warriors', label: 'Warriors', icon: 'Users' },
                { id: 'realm', label: 'Realm', icon: 'Server' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex items-center gap-1.5 px-3 py-1 text-xs transition-colors ${activeTab === tab.id ? 'text-amber-400 border-b border-amber-400 -mb-px' : 'text-zinc-500 hover:text-zinc-300'}`}
                >
                  <Icon name={tab.icon} className="w-3 h-3" />
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
            <div className="ml-auto flex items-center gap-3">
              {showApprovalShield && (
                <button className="relative flex items-center gap-1 text-amber-400 hover:text-amber-300" title="Pending approvals">
                  <Icon name="ShieldAlert" className="w-4 h-4" />
                  <span className="text-[10px] font-semibold">{pendingApprovals}</span>
                  {pendingApprovals > 0 && <span className="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse" />}
                </button>
              )}
              <button data-settings-toggle="true" onClick={() => setSettingsOpen(open => !open)} className="text-zinc-500 hover:text-zinc-300" title="Settings">
                <Icon name="Settings" className="w-4 h-4" />
              </button>
              <span className="text-zinc-500 text-[10px]">kit@hirdforge</span>
            </div>
          </div>

          <div className="flex-1 flex min-h-0">
            <div className="w-1/2 border-r border-zinc-800 flex flex-col min-h-0">
              {activeTab === 'comms' && (
                <CommsTab
                  agents={agents}
                  agentsLoading={agentsLoading}
                  agentsError={agentsError}
                  focused={focused}
                  activeAgent={activeAgent}
                  setActiveAgent={setActiveAgent}
                  threads={threads}
                  inputValue={inputByAgent[activeAgent] || ''}
                  setInputValue={value => setInputByAgent(current => ({ ...current, [activeAgent]: value }))}
                  onSend={sendCommsMessage}
                  sendingAgent={sendingAgent}
                />
              )}
              {activeTab === 'warriors' && <WarriorsTab agents={agents} fleetStates={fleetStates} setActiveTab={setActiveTab} setActiveAgent={setActiveAgent} />}
              {activeTab === 'realm' && <RealmTab />}
            </div>

            <div className="w-1/2 flex flex-col min-h-0">
              <div className="border-b border-zinc-800 bg-zinc-900/30 px-2 py-1.5 shrink-0">
                <div className="text-[9px] uppercase text-zinc-600 mb-1">Active - {fleetStates.filter(agent => agent.active).length}</div>
                <div className="flex flex-wrap gap-1">
                  {fleetStates.map(agent => (
                    <button
                      key={agent.id}
                      onClick={() => setActiveAgent(agent.id)}
                      className={`flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] border transition-colors ${activeAgent === agent.id ? 'border-amber-500/50 bg-amber-500/10 text-amber-300' : 'border-zinc-800 text-zinc-400 hover:border-zinc-700'}`}
                    >
                      <StatusDot status={agent.active ? 'active' : 'idle'} />
                      <span>{agent.name}</span>
                    </button>
                  ))}
                  {fleetStates.length === 0 && <span className="text-[10px] text-zinc-700">fleet state unavailable</span>}
                </div>
              </div>
              <div className="border-b border-zinc-800 bg-zinc-900/50 px-3 py-1.5 shrink-0 flex items-center gap-2">
                <span className="text-[10px] text-zinc-500">Watching</span>
                <StatusDot status={focusedStatusText} />
                <span className="text-zinc-200 text-xs font-semibold">{focused ? focused.name : 'No agent'}</span>
                <span className="text-[10px] text-zinc-600">-</span>
                {/* TODO: replace active/idle with fleet state's current_task_summary once §5.3 backend field lands. */}
                <span className="text-[10px] text-zinc-500 truncate flex-1">{focused ? focusedStatusText : 'idle'}</span>
                <button className="flex items-center gap-1 px-2 py-0.5 border border-zinc-800 rounded text-[10px] text-zinc-500 hover:text-zinc-300 hover:border-zinc-700 shrink-0">
                  <Icon name="Hand" className="w-2.5 h-2.5" /> Interject
                </button>
              </div>
              {focused && focusedFleetState && focusedFleetState.active && (focusedHasBuilderActivity || focusedHasWorkspace) ? (
                <BuilderSurface focused={focused} workspace={focusedWorkspace} workspaces={workspaces} timeline={focusedTimeline} cursorBlink={cursorBlink} leftRailWidth={leftRailWidth} startDragTree={startDragTree} isDraggingTree={isDraggingTree} activityHeight={activityHeight} startDragActivity={startDragActivity} isDraggingActivity={isDraggingActivity} />
              ) : focused && focusedFleetState && focusedFleetState.active && focusedSurface === 'action' ? (
                <ActionSurface leftRailWidth={leftRailWidth} startDragTree={startDragTree} isDraggingTree={isDraggingTree} activityHeight={activityHeight} startDragActivity={startDragActivity} isDraggingActivity={isDraggingActivity} />
              ) : (
                <IdleSurface surface={(focusedHasBuilderActivity || focusedHasWorkspace) ? 'builder' : focusedSurface} focused={focused} workspace={focusedWorkspace} workspaces={workspaces} timeline={focusedTimeline} cursorBlink={cursorBlink} leftRailWidth={leftRailWidth} startDragTree={startDragTree} isDraggingTree={isDraggingTree} activityHeight={activityHeight} startDragActivity={startDragActivity} isDraggingActivity={isDraggingActivity} />
              )}
            </div>
          </div>

          <div className="h-6 border-t border-zinc-800 bg-zinc-900 flex items-center px-4 text-[10px] text-zinc-600 shrink-0">
            <span>v1.0 · scaffolding</span>
          </div>
          <SettingsDrawer open={settingsOpen} onClose={() => setSettingsOpen(false)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HirdforgeUI />);
  </script>
</body>
</html>
