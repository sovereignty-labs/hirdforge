<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hirdforge</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden}
#root{display:flex;flex-direction:column}
body{background:#08090f;color:#c8cdd5;font-family:'IBM Plex Mono','SF Mono',monospace;font-size:13px}
::selection{background:rgba(99,102,241,0.3);color:#e2e8f0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;outline:none}
a{color:inherit;text-decoration:none}

:root{
--bg:#08090f;--bg-header:#0a0b12;--bg-surface:rgba(255,255,255,0.02);
--border:rgba(255,255,255,0.06);--border-strong:rgba(255,255,255,0.1);
--text:#c8cdd5;--text-bright:#e2e8f0;--text-dim:rgba(255,255,255,0.35);--text-muted:rgba(255,255,255,0.2);
--accent:#818cf8;--accent-dim:rgba(129,140,248,0.1);--accent-border:rgba(129,140,248,0.25);
--green:#34d399;--green-dim:rgba(52,211,153,0.1);--green-border:rgba(52,211,153,0.2);
--amber:#fbbf24;--amber-dim:rgba(251,191,36,0.1);--amber-border:rgba(251,191,36,0.15);
--red:#ef4444;--red-dim:rgba(239,68,68,0.08);--red-border:rgba(239,68,68,0.15);
--cyan:#22d3ee;--cyan-dim:rgba(34,211,238,0.1);
--radius:8px;--radius-lg:10px;
}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;border-bottom:1px solid var(--border);background:var(--bg-header);flex-shrink:0;z-index:5}
.header-left{display:flex;align-items:center;gap:14px}
.logo{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--text-bright);letter-spacing:-0.02em;display:flex;align-items:center;gap:6px}
.logo-mark{color:var(--accent)}
.nav{display:flex;gap:2px}
.nav button{padding:6px 12px;border-radius:7px;font-size:12px;color:var(--text-dim);transition:all 0.12s}
.nav button:hover{color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.04)}
.nav button.active{color:var(--text-bright);background:var(--accent-dim)}
.status-bar{display:flex;gap:6px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--radius);font-size:11px;cursor:pointer;transition:all 0.15s;background:rgba(255,255,255,0.03);border:1px solid var(--border)}
.pill:hover{background:rgba(255,255,255,0.06)}
.pill.active{background:var(--accent-dim);border-color:var(--accent-border)}
.pill-text{color:rgba(255,255,255,0.5)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green)}.dot-amber{background:var(--amber)}.dot-red{background:var(--red);animation:pulse 2s infinite}
.dot-idle{background:rgba(255,255,255,0.15)}.dot-sm{width:6px;height:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.badge{min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;padding:0 5px}
.badge-accent{background:rgba(99,102,241,0.2);color:#a5b4fc}
.badge-red{background:rgba(239,68,68,0.2);color:#fca5a5}
.main{display:flex;flex:1;overflow:hidden;position:relative}
.sidebar{width:240px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width 0.2s}
.sidebar.collapsed{width:0;overflow:hidden;border:none}
.sidebar-hdr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.04)}
.sidebar-title{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
.sessions{flex:1;overflow-y:auto;padding:6px}
.session{padding:10px;border-radius:var(--radius);cursor:pointer;margin-bottom:2px;transition:background 0.12s}
.session:hover{background:rgba(255,255,255,0.04)}
.session.active{background:var(--accent-dim)}
.session-agent{font-size:12px;font-weight:500;color:var(--text-bright);display:flex;align-items:center;gap:6px}
.session-task{font-size:11px;color:var(--text-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-time{font-size:10px;color:var(--text-muted);margin-top:2px}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-hdr{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-agent{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--text-bright)}
.chat-role{font-size:11px;color:var(--text-dim)}
.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;max-width:92%}
.avatar{width:28px;height:28px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.avatar-user{background:rgba(52,211,153,0.12);color:var(--green);border:1px solid rgba(52,211,153,0.15)}
.avatar-agent{background:rgba(129,140,248,0.12);color:var(--accent);border:1px solid rgba(129,140,248,0.15)}
.msg-body{flex:1;min-width:0}
.msg-name{font-size:11px;font-weight:500;margin-bottom:4px}
.msg-name-user{color:var(--green)}.msg-name-agent{color:var(--accent)}
.msg-text{font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
.msg-text code{background:rgba(255,255,255,0.06);padding:1px 5px;border-radius:4px;font-size:12px}
.msg-text pre{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:8px 0;overflow-x:auto;font-size:12px}
.deleg-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-top:10px}
.deleg-title{font-size:12px;font-weight:500;color:var(--text-bright);display:flex;align-items:center;justify-content:space-between}
.deleg-rows{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.deleg-row{display:flex;align-items:center;gap:8px;font-size:12px}
.deleg-agent{color:var(--text-bright);font-weight:500;min-width:52px}
.deleg-task{color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phase{font-size:10px;font-weight:500;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.04em}
.phase-building{background:var(--cyan-dim);color:var(--cyan)}
.phase-pr{background:var(--green-dim);color:var(--green)}
.phase-review{background:var(--amber-dim);color:var(--amber)}
.phase-waiting{background:rgba(255,255,255,0.04);color:var(--text-dim)}
.phase-done{background:var(--green-dim);color:var(--green)}
.pr-card{display:inline-flex;align-items:center;gap:8px;background:rgba(52,211,153,0.06);border:1px solid var(--green-border);border-radius:var(--radius);padding:8px 12px;margin-top:8px;font-size:12px;color:var(--green)}
.pr-card .pr-num{font-weight:600}
.pr-card .pr-title-text{color:rgba(52,211,153,0.7)}
.btn-sm{padding:3px 10px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer;transition:all 0.12s}
.btn-merge{background:rgba(52,211,153,0.15);border:1px solid var(--green-border);color:var(--green)}
.btn-merge:hover{background:rgba(52,211,153,0.25)}
.btn-close-pr{background:var(--red-dim);border:1px solid var(--red-border);color:#f87171}
.btn-approve{background:rgba(52,211,153,0.12);border:1px solid var(--green-border);color:var(--green);padding:5px 14px;border-radius:6px;font-size:11px}
.btn-reject{background:var(--red-dim);border:1px solid var(--red-border);color:#f87171;padding:5px 14px;border-radius:6px;font-size:11px}
.tools-toggle{font-size:11px;color:var(--text-muted);cursor:pointer;margin-top:6px;display:flex;align-items:center;gap:4px}
.tools-toggle:hover{color:var(--text-dim)}
.tools-content{margin-top:6px;padding:8px 10px;background:var(--bg-surface);border-radius:6px;font-size:11px;color:rgba(255,255,255,0.25);line-height:1.6}
.elapsed{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.chat-input{flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-lg);padding:10px 14px;color:var(--text-bright);font-size:13px;transition:border-color 0.15s;resize:none;min-height:40px;max-height:120px}
.chat-input:focus{border-color:rgba(129,140,248,0.4)}
.chat-input::placeholder{color:var(--text-muted)}
.send-btn{background:var(--accent);border-radius:var(--radius-lg);padding:10px 18px;color:#08090f;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;transition:all 0.12s;letter-spacing:0.02em;align-self:flex-end}
.send-btn:hover{background:#a5b4fc}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}
.slideout{position:absolute;top:0;right:0;bottom:0;width:340px;background:#0c0d15;border-left:1px solid rgba(255,255,255,0.08);transform:translateX(100%);transition:transform 0.2s ease;z-index:10;display:flex;flex-direction:column}
.slideout.open{transform:translateX(0)}
.slideout-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.slideout-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--text-bright)}
.close-btn{color:var(--text-dim);font-size:18px;padding:4px 8px;border-radius:6px;transition:all 0.12s}
.close-btn:hover{color:var(--text-bright);background:rgba(255,255,255,0.06)}
.slideout-body{flex:1;overflow-y:auto;padding:12px}
.agent-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);margin-bottom:4px;transition:background 0.12s}
.agent-row:hover{background:rgba(255,255,255,0.03)}
.agent-name{font-size:12px;font-weight:500;color:var(--text-bright);flex:1}
.agent-model{font-size:10px;color:var(--text-muted)}
.agent-status{font-size:10px;color:var(--text-dim)}
.pr-row{padding:10px 12px;border-radius:var(--radius);margin-bottom:4px;border:1px solid rgba(255,255,255,0.04)}
.pr-row:hover{background:rgba(255,255,255,0.02)}
.pr-title{font-size:12px;color:var(--text-bright);margin-bottom:4px}
.pr-meta{font-size:10px;color:var(--text-muted);display:flex;gap:8px;align-items:center}
.pr-actions{display:flex;gap:6px;margin-top:8px}
.approval-item{padding:12px;border-radius:var(--radius);border:1px solid var(--red-border);background:var(--red-dim);margin-bottom:6px}
.approval-action{font-size:12px;color:var(--text-bright);margin-bottom:4px}
.approval-detail{font-size:11px;color:var(--text-dim);margin-bottom:8px}
.approval-btns{display:flex;gap:6px}
.toggle-btn{background:none;color:var(--text-dim);font-size:14px;padding:2px 6px;border-radius:4px}
.toggle-btn:hover{color:var(--text-bright);background:rgba(255,255,255,0.05)}
.node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:24px}
.node-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.node-card.unhealthy{border-color:var(--red-border)}
.node-name{font-size:13px;font-weight:500;color:var(--text-bright);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.node-stats{display:flex;gap:12px;font-size:11px;color:var(--text-dim)}
.node-val{color:rgba(255,255,255,0.6);font-weight:500}
.pod-list{display:flex;flex-direction:column;gap:2px}
.pod-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);font-size:12px;transition:background 0.12s}
.pod-row:hover{background:rgba(255,255,255,0.02)}
.pod-name{color:var(--text-bright);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-ns{color:var(--text-muted);font-size:11px;min-width:50px}
.pod-status{font-size:10px;font-weight:500;padding:2px 8px;border-radius:6px}
.pod-running{background:var(--green-dim);color:var(--green)}
.pod-pending{background:var(--amber-dim);color:var(--amber)}
.pod-failed{background:var(--red-dim);color:#f87171}
.pod-detail{font-size:11px;color:var(--text-muted);min-width:28px;text-align:right}
.filter-bar{display:flex;gap:6px;margin-bottom:14px}
.filter-chip{padding:5px 10px;border-radius:7px;font-size:11px;color:var(--text-dim);background:rgba(255,255,255,0.02);border:1px solid var(--border);font-family:inherit;transition:all 0.12s}
.filter-chip:hover{background:rgba(255,255,255,0.04)}
.filter-chip.active{color:var(--text-bright);background:var(--accent-dim);border-color:var(--accent-border)}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--text-bright);margin-bottom:14px}
.settings-body{flex:1;overflow-y:auto;padding:20px;max-width:800px}
.settings-section{margin-bottom:28px}
.settings-section-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--text-bright);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.setting-label{font-size:12px;color:var(--text)}
.setting-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
.setting-value{font-size:12px;color:rgba(255,255,255,0.5);text-align:right}
.agent-setting{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);margin-bottom:4px;border:1px solid rgba(255,255,255,0.04)}
.agent-setting-name{font-size:12px;font-weight:500;color:var(--text-bright);min-width:60px}
.agent-setting-role{font-size:11px;color:var(--text-dim);flex:1}
.agent-setting select{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:4px 8px;color:var(--text);font-size:11px;cursor:pointer;-webkit-appearance:none}
.toggle{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);position:relative;cursor:pointer;transition:background 0.15s;flex-shrink:0}
.toggle.on{background:rgba(129,140,248,0.4)}
.toggle-knob{width:16px;height:16px;border-radius:8px;background:var(--text-bright);position:absolute;top:2px;left:2px;transition:transform 0.15s}
.toggle.on .toggle-knob{transform:translateX(16px)}
.view-scroll{flex:1;overflow-y:auto;padding:20px}
.empty{text-align:center;padding:40px;color:var(--text-dim);font-size:12px}
.streaming-indicator{display:inline-flex;gap:3px;align-items:center;padding:4px 0}
.streaming-indicator span{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.streaming-indicator span:nth-child(2){animation-delay:0.15s}
.streaming-indicator span:nth-child(3){animation-delay:0.3s}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:1}}
.review-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--amber-dim);border:1px solid var(--amber-border);border-radius:var(--radius);margin-top:6px;font-size:12px;color:var(--amber)}
.new-chat-btn{width:100%;padding:8px;border-radius:var(--radius);font-size:11px;color:var(--text-dim);border:1px dashed var(--border);transition:all 0.12s;margin-bottom:6px}
.new-chat-btn:hover{color:var(--text-bright);border-color:var(--border-strong);background:rgba(255,255,255,0.02)}
.agent-select{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,0.04);flex-wrap:wrap}
.agent-chip{padding:4px 8px;border-radius:6px;font-size:11px;color:var(--text-dim);border:1px solid transparent;transition:all 0.12s}
.agent-chip:hover{color:var(--text-bright);background:rgba(255,255,255,0.04)}
.agent-chip.active{color:var(--accent);background:var(--accent-dim);border-color:var(--accent-border)}
.restart-btn{font-size:10px;color:var(--text-muted);padding:2px 6px;border-radius:4px;transition:all 0.12s}
.restart-btn:hover{color:var(--amber);background:var(--amber-dim)}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const{useState,useEffect,useRef,useCallback,useMemo}=React;
const h=React.createElement;

/* ── helpers ── */
const api=async(path,opts={})=>{const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});return r.ok?r.json():null};
const apiPost=async(path,body)=>api(path,{method:'POST',body:body?JSON.stringify(body):undefined});
const ago=ts=>{if(!ts)return'';const s=Math.floor((Date.now()/1000)-ts);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'};
const fmtAge=a=>{if(!a)return'';if(typeof a==='number')return ago(a);return a};

/* ── hooks ── */
function usePoll(url,interval=10000){
  const[data,setData]=useState(null);
  const[err,setErr]=useState(false);
  useEffect(()=>{
    let live=true;
    const go=async()=>{try{const d=await api(url);if(live)setData(d);setErr(false)}catch(e){if(live)setErr(true)}};
    go();const t=setInterval(go,interval);return()=>{live=false;clearInterval(t)};
  },[url,interval]);
  return[data,err];
}

function useWS(){
  const[events,setEvents]=useState([]);
  const[ok,setOk]=useState(false);
  const wsRef=useRef(null);
  useEffect(()=>{
    const proto=location.protocol==='https:'?'wss:':'ws:';
    let ws;let retryT;
    const connect=()=>{
      ws=new WebSocket(`${proto}//${location.host}/ws/events`);
      ws.onopen=()=>setOk(true);
      ws.onclose=()=>{setOk(false);retryT=setTimeout(connect,3000)};
      ws.onmessage=e=>{try{const d=JSON.parse(e.data);setEvents(prev=>[d,...prev].slice(0,200))}catch(ex){}};
      wsRef.current=ws;
    };
    connect();
    return()=>{clearTimeout(retryT);if(ws)ws.close()};
  },[]);
  return{events,ok};
}

/* ── stream message via SSE ── */
function streamMessage(agent,message,sessionId,onChunk,onDone){
  const body=JSON.stringify({agent,message,session_id:sessionId});
  fetch('/api/v1/message',{method:'POST',headers:{'Content-Type':'application/json'},body})
    .then(res=>{
      const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
      function pump(){
        reader.read().then(({done,value})=>{
          if(done){onDone();return}
          buf+=dec.decode(value,{stream:true});
          const lines=buf.split('\n');buf=lines.pop()||'';
          for(const line of lines){
            if(line.startsWith('data: ')){
              const raw=line.slice(6);
              if(raw==='[DONE]'){onDone();return}
              try{const j=JSON.parse(raw);if(j.content)onChunk(j.content);if(j.tool_call)onChunk(`\n[tool: ${j.tool_call.name}]\n`)}catch(e){onChunk(raw)}
            }
          }
          pump();
        });
      }
      pump();
    }).catch(()=>onDone());
}

/* ── SlidePanel ── */
function SlidePanel({open,title,onClose,children}){
  return h('div',{className:`slideout${open?' open':''}`},
    h('div',{className:'slideout-hdr'},
      h('span',{className:'slideout-title'},title),
      h('button',{className:'close-btn',onClick:onClose},'×')),
    h('div',{className:'slideout-body'},children)
  );
}

/* ── Fleet Panel ── */
function FleetPanel({agents,fleetState,onRestart}){
  const stateMap=useMemo(()=>{const m={};(fleetState||[]).forEach(a=>m[a.name]=a);return m},[fleetState]);
  return (agents||[]).map(a=>{
    const fs=stateMap[a.name]||{};
    const isActive=fs.active;
    const dotCls=isActive?'dot dot-green dot-sm':(a.status==='online'?'dot dot-idle dot-sm':'dot dot-idle dot-sm');
    return h('div',{key:a.name,className:'agent-row'},
      h('div',{className:dotCls}),
      h('div',{style:{flex:1}},
        h('div',{className:'agent-name'},a.name),
        h('div',{className:'agent-model'},(a.model||'unknown'),' · ',a.role||'agent')),
      h('div',{style:{display:'flex',alignItems:'center',gap:8}},
        h('span',{className:'agent-status',style:{color:isActive?'var(--green)':'var(--text-muted)'}},isActive?'active · '+ago(fs.since):'idle'),
        h('button',{className:'restart-btn',onClick:()=>onRestart(a.name),title:'Restart'},'↻'))
    );
  });
}

/* ── PR Panel ── */
function PRPanel({prs,onMerge,onClose}){
  const[filter,setFilter]=useState('open');
  const filtered=useMemo(()=>{
    if(filter==='open')return(prs||[]).filter(pr=>!pr.pull_request?.merged);
    if(filter==='merged')return(prs||[]).filter(pr=>pr.pull_request?.merged);
    return prs||[];
  },[prs,filter]);
  return [
    h('div',{key:'chips',className:'filter-bar'},
      ['open','merged','all'].map(f=>h('button',{key:f,className:`filter-chip${filter===f?' active':''}`,onClick:()=>setFilter(f)},f))),
    filtered.length===0
      ? h('div',{key:'empty',className:'empty'},'No ',filter,' pull requests')
      : filtered.map(pr=>h('div',{key:pr.number,className:'pr-row'},
          h('div',{className:'pr-title'},'#',pr.number,' ',pr.title),
          h('div',{className:'pr-meta'},
            h('span',null,pr.repository?.full_name||''),
            h('span',null,'·'),
            h('span',null,pr.user?.login||''),
          ),
          h('div',{className:'pr-actions'},
            h('a',{className:'btn-sm',style:{color:'var(--accent)'},href:pr.html_url,target:'_blank',rel:'noopener noreferrer'},'Open in Gitea'),
            h('button',{className:'btn-sm btn-close-pr',onClick:()=>onClose&&onClose(pr)},'Close'),
            h('button',{className:'btn-sm btn-merge',onClick:()=>onMerge&&onMerge(pr)},'Merge'),
          )
        ))
  ];
}

/* ── Approval Panel ── */
function ApprovalPanel({approvals,onDecide}){
  const pending=(Array.isArray(approvals)?approvals:[]).filter(a=>a&&a.status==='pending');
  if(!pending.length)return h('div',{className:'empty'},'No pending approvals');
  return pending.map(a=>h('div',{key:a.id,className:'approval-item'},
    h('div',{className:'approval-action'},a.tool_name||a.action||'Action requested'),
    h('div',{className:'approval-detail'},
      a.description||JSON.stringify(a.params||{}).slice(0,120)),
    h('div',{className:'approval-btns'},
      h('button',{className:'btn-approve',onClick:()=>onDecide(a.id,'approve')},'Approve'),
      h('button',{className:'btn-reject',onClick:()=>onDecide(a.id,'reject')},'Reject'))
  ));
}

/* ── CommsView ── */
function CommsView({agents,fleetState,prs,approvals,events,wsOk,showToast,onMergePR,onClosePR,onApproval,onRestart}){
  const[target,setTarget]=useState('ragnar');
  const[msg,setMsg]=useState('');
  const[sending,setSending]=useState(false);
  const[history,setHistory]=useState([]);
  const[sessionId,setSessionId]=useState(()=>`hirdforge-ragnar-${Date.now()}`);
  const[sidebarOpen,setSidebarOpen]=useState(true);
  const[panel,setPanel]=useState(null);
  const[sessions,setSessions]=useState([]);
  const msgsEnd=useRef(null);
  const inputRef=useRef(null);
  const initialPRs=useRef(null);

  // Track initial PRs on mount — only show new PRs as notifications
  useEffect(()=>{
    if(initialPRs.current===null&&prs){
      initialPRs.current=new Set((prs||[]).map(pr=>pr.number));
    }
  },[prs]);

  const newPRs=useMemo(()=>{
    if(!initialPRs.current||!prs)return[];
    return(prs||[]).filter(pr=>!initialPRs.current.has(pr.number));
  },[prs]);

  useEffect(()=>{if(msgsEnd.current)msgsEnd.current.scrollIntoView({behavior:'smooth'})},[history]);

  // Load previous sessions on mount
  useEffect(()=>{
    let live=true;
    api('/api/v1/sessions').then(data=>{if(live&&data)setSessions(Array.isArray(data)?data:[])});
    return()=>{live=false};
  },[]);

  const loadSession=async(sid)=>{
    setSessionId(sid);
    const msgs=await api(`/api/v1/sessions/${sid}/messages`);
    if(msgs&&Array.isArray(msgs)){
      setHistory(msgs.map(m=>({role:m.role||'user',content:m.content||'',ts:m.created_at?new Date(m.created_at).getTime():Date.now()})));
    } else {
      setHistory([]);
    }
  };

  const agentList=useMemo(()=>(agents||[]).filter(a=>a.status==='online').map(a=>a.name),[agents]);
  const online=useMemo(()=>(agents||[]).filter(a=>a.status==='online').length,[agents]);
  const pendingApprovals=useMemo(()=>(Array.isArray(approvals)?approvals:[]).filter(a=>a&&a.status==='pending'),[approvals]);

  const switchAgent=(name)=>{
    setTarget(name);
    const sid=`hirdforge-${name}-${Date.now()}`;
    setSessionId(sid);
    setHistory([]);
  };

  const send=()=>{
    if(!msg.trim()||sending)return;
    const userMsg={role:'user',content:msg.trim(),ts:Date.now()};
    setHistory(h=>[...h,userMsg]);
    setMsg('');setSending(true);
    let buf='';
    streamMessage(target,userMsg.content,sessionId,
      chunk=>{buf+=chunk;setHistory(h=>{const n=[...h];const last=n[n.length-1];if(last&&last.role==='assistant'&&last.streaming){last.content=buf;return[...n]}else{return[...n,{role:'assistant',content:buf,ts:Date.now(),agent:target,streaming:true}]}})},
      ()=>{setSending(false);setHistory(h=>{const n=[...h];const last=n[n.length-1];if(last&&last.streaming)last.streaming=false;return[...n]})}
    );
  };

  const handleKey=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  const togglePanel=name=>setPanel(p=>p===name?null:name);

  const mergePR=async(pr)=>{
    const parts=pr.repository?.full_name?.split('/')||[];
    if(parts.length===2){
      await apiPost(`/api/v1/gitea/prs/${parts[0]}/${parts[1]}/${pr.number}/merge`);
      showToast&&showToast('PR merged','success');
    }
  };

  const curAgent=useMemo(()=>(agents||[]).find(a=>a.name===target)||{name:target},[agents,target]);

  return h('div',{className:'main'},
    /* Sidebar */
    h('div',{className:`sidebar${sidebarOpen?'':' collapsed'}`},
      h('div',{className:'sidebar-hdr'},
        h('span',{className:'sidebar-title'},'Sessions')),
      h('div',{style:{padding:'6px'}},
        h('button',{className:'new-chat-btn',onClick:()=>{const sid=`hirdforge-${target}-${Date.now()}`;setSessionId(sid);setHistory([])}},'+ New conversation')),
      h('div',{className:'agent-select'},
        agentList.map(name=>h('button',{key:name,className:`agent-chip${target===name?' active':''}`,onClick:()=>switchAgent(name)},name))
      ),
      h('div',{className:'sessions'},
        history.length>0&&h('div',{className:'session active'},
          h('div',{className:'session-agent'},h('div',{className:'dot dot-green dot-sm'}),target),
          h('div',{className:'session-task'},history[0]?.content?.slice(0,60)||'Active session'),
          h('div',{className:'session-time'},'now')
        ),
        sessions.filter(s=>s.id!==sessionId).map(s=>h('div',{key:s.id,className:'session',onClick:()=>loadSession(s.id)},
          h('div',{className:'session-agent'},h('div',{className:'dot dot-idle dot-sm'}),s.agent||'Session'),
          h('div',{className:'session-task'},s.summary||s.id),
          h('div',{className:'session-time'},s.updated_at?ago(new Date(s.updated_at).getTime()):'')
        ))
      )
    ),
    /* Chat Area */
    h('div',{className:'chat-area'},
      h('div',{className:'chat-hdr'},
        h('button',{className:'toggle-btn',onClick:()=>setSidebarOpen(!sidebarOpen)},'☰'),
        h('div',{className:'avatar avatar-agent'},curAgent.name?curAgent.name[0].toUpperCase():'?'),
        h('div',null,
          h('div',{className:'chat-agent'},curAgent.name||'Select agent'),
          h('div',{className:'chat-role'},curAgent.model||'',' · ',curAgent.role||'agent')
        )
      ),
      h('div',{className:'messages'},
        history.length===0&&h('div',{className:'empty',style:{marginTop:60}},'Send a message to ',target,' to get started.'),
        // Inline PR notification cards for new PRs
        newPRs.length>0&&newPRs.map(pr=>h('div',{key:'pr-'+pr.number,className:'pr-card',style:{display:'flex',flexDirection:'column',gap:6}},
          h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
            h('span',{style:{fontWeight:600}},pr.repository?.full_name||'PR #',pr.number,' — ',pr.title),
          ),
          h('div',{style:{display:'flex',gap:6}},
            h('a',{className:'btn-sm',style:{color:'var(--accent)'},href:pr.html_url,target:'_blank',rel:'noopener noreferrer'},'Open in Gitea'),
            h('button',{className:'btn-sm btn-merge',onClick:()=>{mergePR(pr)}},pr.pull_request?.merged?'Merged':'Merge')
          )
        )),
        history.map((m,i)=>h('div',{key:i,className:'msg'},
          h('div',{className:`avatar ${m.role==='user'?'avatar-user':'avatar-agent'}`},
            m.role==='user'?'K':(m.agent||target)[0].toUpperCase()),
          h('div',{className:'msg-body'},
            h('div',{className:`msg-name ${m.role==='user'?'msg-name-user':'msg-name-agent'}`},
              m.role==='user'?'Kit':m.agent||target),
            h('div',{className:'msg-text'},m.content),
            m.streaming&&h('div',{className:'streaming-indicator'},h('span'),h('span'),h('span'))
          )
        )),
        h('div',{ref:msgsEnd})
      ),
      h('div',{className:'input-area'},
        h('textarea',{ref:inputRef,className:'chat-input',placeholder:`Message ${target}...`,value:msg,onChange:e=>setMsg(e.target.value),onKeyDown:handleKey,rows:1}),
        h('button',{className:'send-btn',onClick:send,disabled:sending||!msg.trim()},sending?'···':'Send')
      )
    ),
    /* Slide-over panels */
    h(SlidePanel,{open:panel==='fleet',title:'Fleet',onClose:()=>setPanel(null)},
      h(FleetPanel,{agents,fleetState,onRestart})),
    h(SlidePanel,{open:panel==='prs',title:'Pull requests',onClose:()=>setPanel(null)},
      h(PRPanel,{prs,onMerge:mergePR,onClose:onClosePR})),
    h(SlidePanel,{open:panel==='approvals',title:'Approvals',onClose:()=>setPanel(null)},
      h(ApprovalPanel,{approvals,onDecide:onApproval})),
    /* Status pills rendered in parent header — panel toggle passed up */
    null
  );
}

/* ── RealmView ── */
function RealmView({nodes,pods,gitops}){
  const[nsFilter,setNsFilter]=useState('asgard');
  const nodeList=nodes||[];
  const podList=(pods||[]).filter(p=>nsFilter==='all'||p.namespace===nsFilter);
  const namespaces=useMemo(()=>{const s=new Set((pods||[]).map(p=>p.namespace));return['all',...s]},[pods]);

  return h('div',{className:'view-scroll'},
    h('div',{className:'section-title'},'Nodes'),
    h('div',{className:'node-grid'},
      nodeList.map(n=>{
        const ready=n.status==='Ready'||(n.conditions||[]).some(c=>c.type==='Ready'&&c.status==='True');
        return h('div',{key:n.name,className:`node-card${ready?'':' unhealthy'}`},
          h('div',{className:'node-name'},
            h('div',{className:`dot dot-sm ${ready?'dot-green':'dot-red'}`}),
            ready?n.name:h('span',{style:{color:'var(--text-dim)'}},n.name)),
          h('div',{className:'node-stats'},
            ready?[
              h('span',{key:'r'},'Roles: ',h('span',{className:'node-val'},n.roles||'worker')),
              h('span',{key:'v'},'K8s ',h('span',{className:'node-val'},n.version||''))
            ]:h('span',{style:{color:'rgba(239,68,68,0.6)'}},'Not ready'))
        );
      })
    ),
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}},
      h('div',{className:'section-title',style:{marginBottom:0}},'GitOps'),
      h('button',{className:'btn-sm',style:{background:'var(--accent-dim)',border:'1px solid var(--accent-border)',color:'var(--accent)'},onClick:async()=>{await apiPost('/api/v1/gitops/sync')}},'Sync')
    ),
    gitops?h('div',{style:{display:'flex',flexDirection:'column',gap:10,marginBottom:24}},
      (Array.isArray(gitops)?gitops:[gitops]).map(app=>{
        const health=(app.health||'unknown').toLowerCase();
        const sync=(app.sync||'unknown').toLowerCase();
        const healthDot=health==='healthy'?'dot-green':(health==='progressing'?'dot-amber':'dot-red');
        const syncDot=sync==='synced'?'dot-green':(sync==='outofsync'?'dot-amber':'dot-red');
        return h('div',{key:app.name,className:'node-card'},
          h('div',{className:'node-name'},
            h('div',{className:`dot dot-sm ${healthDot}`}),
            app.name),
          h('div',{className:'node-stats'},
            h('span',null,'Health: ',h('span',{className:'node-val'},health)),
            h('span',null,'Sync: ',h('span',{className:'node-val'},sync)),
          ),
          h('div',{className:'node-stats',style:{marginTop:4}},
            h('span',null,'Revision: ',h('span',{className:'node-val',style:{fontSize:10}},(app.revision||'—').slice(0,12)),
            ' · ',h('span',null,'Last: ',h('span',{className:'node-val',style:{fontSize:10}},fmtAge(app.lastSync))))
        ));
      })
    ):h('div',{style:{marginBottom:24,fontSize:12,color:'var(--text-dim)'}},'No GitOps data'),
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}},
      h('div',{className:'section-title',style:{marginBottom:0}},'Pods'),
      h('div',{className:'filter-bar',style:{marginBottom:0}},
        namespaces.map(ns=>h('button',{key:ns,className:`filter-chip${nsFilter===ns?' active':''}`,onClick:()=>setNsFilter(ns)},ns))
      )
    ),
    h('div',{className:'pod-list'},
      podList.length===0&&h('div',{className:'empty'},'No pods in this namespace'),
      podList.map(p=>{
        const phase=(p.status||p.phase||'unknown').toLowerCase();
        const statusCls=phase==='running'?'pod-running':(phase==='pending'?'pod-pending':'pod-failed');
        return h('div',{key:p.name,className:'pod-row'},
          h('div',{className:`dot dot-sm ${phase==='running'?'dot-green':(phase==='pending'?'dot-amber':'dot-red')}`}),
          h('div',{className:'pod-name'},p.name),
          h('div',{className:'pod-ns'},p.namespace),
          h('div',{className:`pod-status ${statusCls}`},phase),
          h('div',{className:'pod-detail'},p.restarts!=null?p.restarts+'↻':''),
          h('div',{className:'pod-detail'},fmtAge(p.age)||'')
        );
      })
    )
  );
}

/* ── SettingsView ── */
function SettingsView({agents,fleetState}){
  const stateMap=useMemo(()=>{const m={};(fleetState||[]).forEach(a=>m[a.name]=a);return m},[fleetState]);
  return h('div',{className:'settings-body'},
    h('div',{className:'settings-section'},
      h('div',{className:'settings-section-title'},'Warband'),
      (agents||[]).map(a=>{
        const fs=stateMap[a.name]||{};
        const isOnline=a.status==='online';
        return h('div',{key:a.name,className:'agent-setting'},
          h('div',{className:`dot dot-sm ${isOnline?'dot-green':'dot-idle'}`}),
          h('div',{className:'agent-setting-name'},a.name),
          h('div',{className:'agent-setting-role'},a.role||'builder'),
          h('div',{style:{fontSize:11,color:'var(--text-dim)'}},a.model||''),
          h('div',{className:`toggle ${isOnline?'on':''}`,title:isOnline?'Enabled':'Disabled'},
            h('div',{className:'toggle-knob'}))
        );
      })
    ),
    h('div',{className:'settings-section'},
      h('div',{className:'settings-section-title'},'Platform'),
      [['Domain','Base domain for all services','hirdforge.com'],
       ['TLS','Certificate issuer','Self-signed CA'],
       ['Secrets','Credential management','Sealed Secrets'],
       ['Git','Source control','Gitea (self-hosted)'],
       ['Memory','Seidr cognitive backend','PostgreSQL + pgvector']
      ].map(([label,desc,val])=>h('div',{key:label,className:'setting-row'},
        h('div',null,h('div',{className:'setting-label'},label),h('div',{className:'setting-desc'},desc)),
        h('div',{className:'setting-value'},val)
      ))
    )
  );
}

/* ── ToastContainer ── */
function ToastContainer({toasts}){
  const style={
    position:'fixed',bottom:20,right:20,zIndex:1000,
    display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'
  };
  const styleMsg={display:'flex',alignItems:'center',gap:8,padding:'9px 14px',borderRadius:8,fontSize:12,fontFamily:'inherit',pointerEvents:'none',animation:'fadeIn 0.2s ease'};
  return h('div',{style},
    toasts.map(t=>{
      const isSucc=t.type==='success';
      const isErr=t.type==='error';
      const bg=isSucc?'var(--green-dim)':isErr?'var(--red-dim)':'var(--accent-dim)';
      const bd=isSucc?'var(--green-border)':isErr?'var(--red-border)':'var(--accent-border)';
      const col=isSucc?'var(--green)':isErr?'var(--red)':'var(--accent)';
      return h('div',{key:t.id,style:{...styleMsg,background:bg,border:`1px solid ${bd}`,color:col}},
        h('span',null,isSucc?'✓':isErr?'✕':'ℹ'),
        h('span',null,t.msg)
      );
    }),
    h('style',null,'@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}')
  );
}

/* ── App ── */
function App(){
  const[tab,setTab]=useState('comms');
  const[agents]=usePoll('/api/v1/agents',10000);
  const[fleetState]=usePoll('/api/v1/fleet/state',8000);
  const[nodes]=usePoll('/api/v1/cluster/nodes',30000);
  const[pods]=usePoll('/api/v1/cluster/pods',15000);
  const[gitops]=usePoll('/api/v1/gitops/status',30000);
  const[prs]=usePoll('/api/v1/gitea/prs',15000);
  const[approvals]=usePoll('/api/v1/approvals',10000);
  const{events,ok:wsOk}=useWS();
  const[panel,setPanel]=useState(null);
  const[toasts,setToasts]=useState([]);

  const showToast=useCallback((msg,type='info')=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000);
  },[]);

  const online=useMemo(()=>(agents||[]).filter(a=>a.status==='online').length,[agents]);
  const totalAgents=(agents||[]).length;
  const pendingApprovals=useMemo(()=>(Array.isArray(approvals)?approvals:[]).filter(a=>a&&a.status==='pending').length,[approvals]);
  const prCount=(prs||[]).length;
  const togglePanel=name=>setPanel(p=>p===name?null:name);

  const onRestart=async(name)=>{await apiPost(`/api/v1/agents/${name}/restart`);showToast&&showToast(`Restarting ${name}`,'info')};
  const onApproval=async(id,action)=>{await apiPost(`/api/v1/approvals/${action}`,{id})};

  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%'}},
    /* Header */
    h('div',{className:'header'},
      h('div',{className:'header-left'},
        h('div',{className:'logo'},h('span',{className:'logo-mark'},'⚒'),' Hirdforge'),
        h('div',{className:'nav'},
          ['comms','realm','settings'].map(t=>
            h('button',{key:t,className:tab===t?'active':'',onClick:()=>{setTab(t);setPanel(null)}},
              t==='comms'?'Comms':t==='realm'?'Realm':'Settings'))
        )
      ),
      h('div',{className:'status-bar'},
        h('div',{className:`pill${panel==='fleet'?' active':''}`,onClick:()=>togglePanel('fleet')},
          h('div',{className:`dot dot-sm ${online>0?'dot-green':'dot-red'}`}),
          h('span',{className:'pill-text'},online,'/',totalAgents,' agents')),
        h('div',{className:`pill${panel==='prs'?' active':''}`,onClick:()=>togglePanel('prs')},
          h('span',{className:'pill-text'},'PRs'),
          prCount>0&&h('span',{className:'badge badge-accent'},prCount)),
        pendingApprovals>0&&h('div',{className:`pill${panel==='approvals'?' active':''}`,onClick:()=>togglePanel('approvals')},
          h('div',{className:'dot dot-sm dot-red'}),
          h('span',{className:'pill-text'},'Approvals'),
          h('span',{className:'badge badge-red'},pendingApprovals)),
        h('button',{className:'btn-sm',style:{background:'var(--red-dim)',border:'1px solid var(--red-border)',color:'var(--red)',fontSize:11,padding:'3px 10px',borderRadius:6,cursor:'pointer',fontFamily:'inherit',transition:'all 0.12s'},onClick:()=>{if(window.confirm('Stop all agents?'))apiPost('/api/v1/agents/stop-all')}},'⏹ Stop All')
      )
    ),
    /* Body */
    tab==='comms'&&h(CommsView,{agents,fleetState,prs,approvals,events,wsOk,showToast,
      onMergePR:()=>{showToast('PR merged','success')},onClosePR:async(pr)=>{
        const parts=pr.repository?.full_name?.split('/')||[];
        if(parts.length===2)await apiPost(`/api/v1/gitea/prs/${parts[0]}/${parts[1]}/${pr.number}/close`);
      },onApproval,onRestart}),
    tab==='realm'&&h(RealmView,{nodes,pods,gitops}),
    tab==='settings'&&h(SettingsView,{agents,fleetState}),
    /* Global slide-overs (visible on any tab) */
    h(SlidePanel,{open:panel==='fleet',title:'Fleet',onClose:()=>setPanel(null)},
      h(FleetPanel,{agents:agents||[],fleetState,onRestart})),
    h(SlidePanel,{open:panel==='prs',title:'Pull requests',onClose:()=>setPanel(null)},
      h(PRPanel,{prs:prs||[],onMerge:async(pr)=>{
        const parts=pr.repository?.full_name?.split('/')||[];
        if(parts.length===2)await apiPost(`/api/v1/gitea/prs/${parts[0]}/${parts[1]}/${pr.number}/merge`);
        showToast('PR merged','success');
      },onClose:async(pr)=>{
        const parts=pr.repository?.full_name?.split('/')||[];
        if(parts.length===2)await apiPost(`/api/v1/gitea/prs/${parts[0]}/${parts[1]}/${pr.number}/close`);
        showToast('PR closed','info');
      }})),
    h(SlidePanel,{open:panel==='approvals',title:'Approvals',onClose:()=>setPanel(null)},
      h(ApprovalPanel,{approvals:approvals||[],onDecide:async(id,action)=>{await apiPost(`/api/v1/approvals/${action}`,{id});showToast(action==='approve'?'Approved':'Rejected',action==='approve'?'success':'error')}})),
    h(ToastContainer,{toasts})
  );
}

ReactDOM.render(h(App),document.getElementById('root'));
</script>
</body>
