<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    font-family: 'IBM Plex Mono', 'SF Mono', monospace;
    font-size: 13px;
  }
  ::selection { background: rgba(99,102,241,0.3); color: #e2e8f0; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.18); }
  button { font-family: inherit; }
  button:hover { filter: brightness(1.2); }
  textarea { resize: none; }

  @keyframes glow-pulse { 0%,100%{opacity:0.15;transform:scale(1)} 50%{opacity:0.3;transform:scale(1.3)} }
  @keyframes avatar-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes typing-bounce { 0%,60%,100%{transform:translateY(0);opacity:0.3} 30%{transform:translateY(-4px);opacity:0.8} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes rec-pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes msg-slide-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes event-fade-in { from{opacity:0;transform:translateX(-4px)} to{opacity:1;transform:translateX(0)} }
  @keyframes forge-pulse { 0%,100%{box-shadow:0 0 8px rgba(34,211,238,0.4)} 50%{box-shadow:0 0 16px rgba(34,211,238,0.7)} }

  .grain { position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.025;mix-blend-mode:overlay; }
  .scanlines { position:fixed;inset:0;pointer-events:none;z-index:9998;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px); }

  /* Scroll fix: min-height:0 for flex containers */
  .messages-container { min-height: 0; display: flex; flex-direction: column; }
  .messages-wrapper { min-height: 0; display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  .messages-scroll { min-height: 0; flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  
  /* Message bubble word wrap */
  .chat-bubble-text { overflow-wrap: break-word; word-wrap: break-word; word-break: break-word; }
  
  /* Forging indicator */
  .forging-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(34,211,238,0.08);
    border: 1px solid rgba(34,211,238,0.2);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #22d3ee;
    animation: forge-pulse 1.5s ease-in-out infinite;
  }
  
  /* Collapsible activity stream */
  .activity-stream details {
    margin-top: 8px;
  }
  .activity-stream summary {
    cursor: pointer;
    padding: 6px 10px;
    background: rgba(34,211,238,0.06);

  .activity-stream summary:hover { background: rgba(34,211,238,0.1); }
  .activity-stream-content {
    margin-top: 4px;
    padding-left: 4px;

  /* ============================================
     MOBILE-RESPONSIVE CSS (max-width: 767px)
     ============================================ */
  @media (max-width: 767px) {
    /* Base font size - prevents iOS zoom on input focus */
    body {
      font-size: 16px;
    }

    /* Hide grain and scanlines on mobile for performance */

      display: none;

    }

    /* Chat container full width */
    .chat-container {

      border-bottom: 1px solid rgba(255,255,255,0.04) !important;
    }

    /* Messages area full width */
    .messages-area {
      width: 100% !important;
      padding: 12px !important;
    }

    /* Event stream sidebar - collapsible below */
    .event-sidebar {
      width: 100% !important;
      max-height: 200px !important;
      overflow-y: auto !important;
    }

    /* Fleet View: Stack agent list and detail */
    .fleet-view {
      grid-template-columns: 1fr !important;
      grid-template-rows: 1fr 1fr !important;
    }

    /* Realm View: Stack metrics and content */
    .realm-view {
      grid-template-columns: 1fr !important;
    }

    .realm-metrics {
      grid-template-columns: 1fr 1fr !important;
    }

    .realm-content {
      grid-template-columns: 1fr !important;
    }

    /* Touch-friendly buttons - minimum 44px tap target */
    button {
      min-height: 44px !important;
      min-width: 44px !important;
      padding: 12px 16px !important;
      font-size: 14px !important;
    }

    /* Action buttons */
    .action-btn {
      min-height: 44px !important;
      padding: 12px 16px !important;
    }

    /* Send button */
    .send-btn {
      min-height: 56px !important;
      padding: 14px 20px !important;
    }

    /* Textarea input */
    textarea {
      min-height: 56px !important;
      font-size: 16px !important;
      padding: 14px 16px !important;
    }

    /* Readable font sizes */
    .message-text {
      font-size: 15px !important;
      line-height: 1.6 !important;
    }

    .agent-name {
      font-size: 12px !important;
    }

    .timestamp {
      font-size: 11px !important;
    }

    /* Tab labels */
    .tab-label {
      font-size: 12px !important;
      padding: 12px 8px !important;
    }

    /* Headers and titles - minimum 14px */
    h1, h2, h3, .header-title {
      font-size: 14px !important;
    }

    /* Metric cards */
    .metric-value {
      font-size: 20px !important;
    }

    .metric-label {
      font-size: 10px !important;
    }

    /* Agent avatar buttons */
    .agent-tab-btn {
      padding: 10px 12px !important;
    }

    /* Session items */
    .session-item {
      padding: 10px 12px !important;
    }

    /* Event entries */
    .event-entry {
      padding: 10px 12px !important;
    }

    /* Modal adjustments */
    .modal-content {
      width: 95% !important;
      max-height: 80vh !important;
    }

    /* Badge text */
    .badge {
      font-size: 10px !important;
      padding: 4px 8px !important;
    }

    /* Scrollable areas */
    .scroll-area {
      -webkit-overflow-scrolling: touch;
    }

    /* Flex containers need min-height: 0 for proper scrolling */
    .flex-container {
      min-height: 0 !important;
    }
  }

  /* Extra small screens (under 480px) */
  @media (max-width: 480px) {
    /* Further reduce padding */
    body {
      font-size: 14px;
    }

    /* Single column layouts */
    .comms-view,
    .fleet-view,
    .realm-view {
      grid-template-columns: 1fr !important;
    }

    /* Smaller metrics */
    .metric-card {
      padding: 10px 12px !important;
    }

    .metric-value {
      font-size: 18px !important;
    }

    /* Agent list compact */
    .agent-row {
      padding: 8px 10px !important;
      grid-template-columns: 30px 1fr 60px !important;
    }

    /* Hide less important elements on very small screens */
    .hide-xs {
      display: none !important;
    }
  }
</style>

<body>
<div class="grain"><svg width="100%" height="100%"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg></div>
<div class="scanlines"></div>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const CONFIG = { API_BASE:'', WS_URL:'', POLL_INTERVAL:5000, USE_MOCK:false };

const AGENT_COLORS = { ragnar:"#818cf8", chuck:"#f472b6", knut:"#34d399", ivar:"#fbbf24", orm:"#22d3ee", val:"#c084fc", freya:"#f59e0b", system:"#6b7280", kit:"#10b981" };
const statusColor = s => s==="online"?"#34d399":s==="degraded"?"#fbbf24":"#ef4444";

const FALLBACK_AGENTS = [
  {id:"ragnar",name:"Ragnar Codebrok",role:"Architect / PM",model:"—",backend:"—",status:"offline",tools:[],uptime_seconds:0,tasks_completed:0,last_action:"—",ping_ms:null,cpu_percent:0,memory_percent:0,initial:"R"},
  {id:"chuck",name:"Chuck Norse",role:"Primary Builder",model:"—",backend:"—",status:"offline",tools:[],uptime_seconds:0,tasks_completed:0,last_action:"—",ping_ms:null,cpu_percent:0,memory_percent:0,initial:"C"},
  {id:"knut",name:"Knut the Swift",role:"Secondary Builder",model:"—",backend:"—",status:"offline",tools:[],uptime_seconds:0,tasks_completed:0,last_action:"—",ping_ms:null,cpu_percent:0,memory_percent:0,initial:"K"},
  {id:"ivar",name:"Ivar the Branchless",role:"Code Reviewer",model:"—",backend:"—",status:"offline",tools:[],uptime_seconds:0,tasks_completed:0,last_action:"—",ping_ms:null,cpu_percent:0,memory_percent:0,initial:"I"},
  {id:"orm",name:"Orm the Scribe",role:"Documentation",model:"—",backend:"—",status:"offline",tools:[],uptime_seconds:0,tasks_completed:0,last_action:"—",ping_ms:null,cpu_percent:0,memory_percent:0,initial:"O"},
  {id:"val",name:"Val Kyrie",role:"Operations",model:"—",backend:"—",status:"offline",tools:[],uptime_seconds:0,tasks_completed:0,last_action:"—",ping_ms:null,cpu_percent:0,memory_percent:0,initial:"V"},
];
const FALLBACK_NODES = [
  {name:"node-cp-1",ip:"203.0.113.26",role:"Control+Worker",status:"Ready",pods:0,cpu_percent:0,memory_percent:0},
  {name:"node-worker-1",ip:"203.0.113.27",role:"Worker",status:"Ready",pods:0,cpu_percent:0,memory_percent:0},
  {name:"node-worker-2",ip:"203.0.113.28",role:"Worker",status:"Ready",pods:0,cpu_percent:0,memory_percent:0},
];

// ═══════════════════════════════════════════════════════════
//  API LAYER
// ═══════════════════════════════════════════════════════════
async function apiFetch(path, fallback) {
  if (CONFIG.USE_MOCK) return fallback;
  try {
    const res = await fetch(CONFIG.API_BASE + path);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (path.includes('cluster/nodes') && data.items) {
      return data.items.map(n => ({
        name: n.metadata?.name||"unknown",
        ip: (n.status?.addresses?.find(a=>a.type==="InternalIP")||{}).address||"—",
        role: Object.keys(n.metadata?.labels||{}).filter(l=>l.startsWith("node-role")).map(l=>l.split("/")[1]).join("+")||"worker",
        status: n.status?.conditions?.find(c=>c.type==="Ready")?.status==="True"?"Ready":"NotReady",
        pods:0, cpu_percent:0, memory_percent:0,
      }));
    }
    return data;
  } catch(e) { console.warn(`API ${path} failed:`,e.message); return fallback; }
}
async function apiPost(path) { try { const r=await fetch(CONFIG.API_BASE+path,{method:'POST'}); return await r.json(); } catch(e) { return {error:e.message}; } }
async function apiFetchText(path) { try { const r=await fetch(CONFIG.API_BASE+path); if(!r.ok) throw new Error(r.status); return await r.text(); } catch(e) { return `Failed to fetch: ${e.message}`; } }

function usePolledData(path, fallback, interval) {
  const [data, setData] = useState(fallback);
  useEffect(() => {
    let mounted = true;
    const poll = async () => {
      const d = await apiFetch(path, fallback);
      if (mounted) {
        if (path==='/api/v1/agents' && Array.isArray(d)) {
          const normalized = d.map(a => ({
            id:a.name||a.id, name:a.display_name||a.name||a.id, role:a.role||"Agent", model:a.model||"unknown", backend:a.backend||"unknown",
            status:a.healthy===false?"offline":(a.healthy?"online":(a.status||"offline")),
            tools:a.tools||[], uptime_seconds:a.uptime_seconds||0, tasks_completed:a.tasks_completed||0,
            last_action:a.last_action||"—", ping_ms:a.ping_ms||a.latency_ms||null,
            cpu_percent:a.cpu_percent||0, memory_percent:a.memory_percent||0,
            initial:(a.display_name||a.name||a.id||"?")[0].toUpperCase(),
          }));
          setData(normalized.length>0?normalized:fallback);
        } else setData(d);
      }
    };
    poll();
    const id = setInterval(poll, interval||CONFIG.POLL_INTERVAL);
    return () => { mounted=false; clearInterval(id); };
  }, [path]);
  return data;
}

function useEventStream() {
  const [events, setEvents] = useState([]);
  const [connected, setConnected] = useState(false);
  useEffect(() => {
    if (CONFIG.USE_MOCK) return;
    const wsUrl = CONFIG.WS_URL||`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/events`;
    let ws, retryDelay=3000;
    const connect = () => {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => { setConnected(true); retryDelay=3000; };
      ws.onclose = () => { setConnected(false); retryDelay=Math.min(retryDelay*2,30000); setTimeout(connect,retryDelay); };
      ws.onmessage = (e) => { try { const evt=JSON.parse(e.data); setEvents(prev=>[evt,...prev].slice(0,100)); } catch{} };
    };
    connect();
    return () => ws?.close();
  }, []);
  return { events, connected };
}

// ═══════════════════════════════════════════════════════════
//  CHAT API
// ═══════════════════════════════════════════════════════════
async function streamChat(agentId, message, sessionId, signal, onChunk, onReplace, onToolCall, onToolResult, onDone, onError) {
  try {
    const res = await fetch(`${CONFIG.API_BASE}/api/v1/message`, { method:'POST', signal, headers:{'Content-Type':'application/json'}, body:JSON.stringify({agent:agentId,content:message,session_id:sessionId}) });
    if (!res.ok) { const err=await res.json().catch(()=>({error:res.statusText})); onError(`Error: ${err.error||res.statusText}`); return; }
    const reader=res.body.getReader(); const decoder=new TextDecoder(); let buffer='';
    while (true) {
      const {done,value}=await reader.read(); if(done) break;
      buffer+=decoder.decode(value,{stream:true}); const lines=buffer.split('\n'); buffer=lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const chunk=JSON.parse(line.slice(6));
          if(chunk.type==='content'&&chunk.content) onChunk(chunk.content);
          else if(chunk.type==='replace'&&chunk.content) onReplace(chunk.content);
          else if(chunk.type==='tool_call') onToolCall(chunk.tool||'tool',chunk.args);
          else if(chunk.type==='tool_result') onToolResult(chunk.tool||'tool',chunk.result);
          if(chunk.done){onDone(chunk.session_id||sessionId);return;}
        } catch{}
      }
    }
    onDone(sessionId);
  } catch(e) {
    if (e && e.name === 'AbortError') {
      onError('[Stopped by Sovereign]');
      return;
    }
    onError(`Failed to reach ${agentId}: ${e.message}`);
  }
}

// ═══════════════════════════════════════════════════════════
//  PRIMITIVES
// ═══════════════════════════════════════════════════════════
const GlowPip = ({status, size=7}) => { const c=statusColor(status); return React.createElement('span',{style:{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center",width:size,height:size,flexShrink:0}}, status==="online"&&React.createElement('span',{style:{position:"absolute",width:size*2.5,height:size*2.5,borderRadius:"50%",background:c,opacity:0.15,animation:"glow-pulse 2s ease-in-out infinite"}}), React.createElement('span',{style:{position:"relative",width:size,height:size,borderRadius:"50%",background:c,boxShadow:`0 0 ${size}px ${c}60`}})); };

const Glass = ({children, style={}, glow, onClick}) => (
  <div onClick={onClick} style={{background:"linear-gradient(135deg,rgba(255,255,255,0.025) 0%,rgba(255,255,255,0.005) 100%)",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",border:"1px solid rgba(255,255,255,0.04)",position:"relative",overflow:"hidden",...style}}>
    {glow && <div style={{position:"absolute",top:0,left:0,right:0,height:1,background:`linear-gradient(90deg,transparent,${glow}35,transparent)`}} />}

);

const Bar = ({value, max=100, color="#818cf8", h=3}) => (
  <div style={{height:h,background:"rgba(255,255,255,0.04)",position:"relative",overflow:"hidden"}}>
    <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${(value/max)*100}%`,background:`linear-gradient(90deg,${color}60,${color})`,boxShadow:`0 0 8px ${color}20`,transition:"width 1s cubic-bezier(0.16,1,0.3,1)"}} />

);

const Badge = ({text, color="rgba(255,255,255,0.4)"}) => (<span style={{display:"inline-block",padding:"2px 7px",fontSize:9,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color,background:`${color}12`,border:`1px solid ${color}20`}}>{text}</span>);

const Sparkline = ({data, color="#818cf8", w=64, h=20}) => { const max=Math.max(...data),min=Math.min(...data),r=max-min||1; const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/r)*h}`).join(" "); return <svg width={w} height={h} style={{display:"block"}}><polyline points={`${pts} ${w},${h} 0,${h}`} fill={`${color}08`} stroke="none"/><polyline points={pts} fill="none" stroke={color} strokeWidth="1.2" opacity="0.6"/></svg>; };

const MetricCard = ({label,value,sub,color="#e2e8f0"}) => (
  <Glass glow={color!=="#e2e8f0"?color:null} style={{padding:"14px 16px",display:"flex",flexDirection:"column",gap:4}}>
    <span style={{fontSize:10,fontWeight:600,letterSpacing:"0.16em",textTransform:"uppercase",color:"rgba(255,255,255,0.25)"}}>{label}</span>
    <div style={{fontSize:24,fontWeight:800,color,fontFamily:"'Space Grotesk',sans-serif",lineHeight:1,letterSpacing:"-0.02em"}}>{value}</div>
    {sub && <span style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{sub}</span>}
  </Glass>
);

const ActionBtn = ({label, icon, color="#818cf8", onClick, disabled, small}) => (
  <button onClick={onClick} disabled={disabled} className="action-btn" style={{padding:small?"4px 8px":"6px 12px",fontSize:small?8:9,fontWeight:700,letterSpacing:"0.1em",background:`linear-gradient(135deg,${color}15,${color}08)`,border:`1px solid ${color}30`,color:disabled?`${color}40`:color,cursor:disabled?"not-allowed":"pointer",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace",opacity:disabled?0.5:1,display:"inline-flex",alignItems:"center",gap:4,transition:"all 0.15s"}}>{icon&&<span style={{fontSize:small?9:11}}>{icon}</span>}{label}</button>
);

const makeSparkline = (n=16,base=30,v=25) => Array.from({length:n},()=>base+Math.random()*v);
const fmtUptime = s => s<=0?"—":`${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
const fmtTime = ts => { try { return new Date(ts).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch { return ts; } };
const fmtTimeAgo = ts => { try { const s=(Date.now()-new Date(ts).getTime())/1000; if(s<60) return `${Math.floor(s)}s ago`; if(s<3600) return `${Math.floor(s/60)}m ago`; if(s<86400) return `${Math.floor(s/3600)}h ago`; return `${Math.floor(s/86400)}d ago`; } catch { return "—"; } };

// ═══════════════════════════════════════════════════════════
//  AGENT AVATAR
// ═══════════════════════════════════════════════════════════
const AgentAvatar = ({agent, size=32, showStatus=true}) => {
  const c=AGENT_COLORS[agent.id]||"#818cf8"; const sc=statusColor(agent.status); const initial=agent.initial||agent.name?.[0]||"?";
  return (
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <div style={{position:"absolute",inset:-2,borderRadius:"50%",background:`conic-gradient(from 0deg, ${c}00, ${c}40, ${c}00, ${c}30, ${c}00)`,animation:agent.status==="online"?"avatar-spin 8s linear infinite":"none",opacity:agent.status==="online"?1:0.3}} />
      <div style={{position:"absolute",inset:0,borderRadius:"50%",background:`linear-gradient(135deg, ${c}25, ${c}08)`,border:`1px solid ${c}30`,display:"flex",alignItems:"center",justifyContent:"center"}}>

};

// ═══════════════════════════════════════════════════════════
//  LOG VIEWER MODAL
// ═══════════════════════════════════════════════════════════
const LogModal = ({podName, onClose}) => {
  const [logs, setLogs] = useState("Loading logs...");
  const [lines, setLines] = useState(100);
  const logRef = useRef(null);
  useEffect(() => {
    let mounted = true;
    const fetchLogs = async () => {
      const text = await apiFetchText(`/api/v1/cluster/pods/${podName}/logs?lines=${lines}`);
      if (mounted) { setLogs(text); if(logRef.current) logRef.current.scrollTop=logRef.current.scrollHeight; }
    };
    fetchLogs();
    const id = setInterval(fetchLogs, 5000);
    return () => { mounted=false; clearInterval(id); };
  }, [podName, lines]);

  return (
    <div style={{position:"fixed",inset:0,zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.7)",backdropFilter:"blur(4px)"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="modal-content" style={{width:"80%",maxWidth:900,height:"70vh",background:"linear-gradient(135deg,#0d0d1a,#08080f)",border:"1px solid rgba(255,255,255,0.08)",display:"flex",flexDirection:"column"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 18px",borderBottom:"1px solid rgba(255,255,255,0.06)",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:13,fontWeight:700,color:"#22d3ee",fontFamily:"'Space Grotesk',sans-serif"}}>⬡ {podName}</span>
            <Badge text="logs" color="#22d3ee" />
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {[50,100,500].map(n=>(
              <button key={n} onClick={()=>setLines(n)} style={{padding:"3px 8px",fontSize:9,fontWeight:lines===n?700:400,background:lines===n?"rgba(34,211,238,0.12)":"transparent",border:`1px solid ${lines===n?"rgba(34,211,238,0.3)":"rgba(255,255,255,0.06)"}`,color:lines===n?"#22d3ee":"rgba(255,255,255,0.3)",cursor:"pointer",fontFamily:"'IBM Plex Mono',monospace"}}>{n}L</button>
            ))}
            <button onClick={onClose} style={{padding:"3px 10px",fontSize:12,background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",color:"#ef4444",cursor:"pointer",fontFamily:"'IBM Plex Mono',monospace",fontWeight:700}}>✕</button>
          </div>
        </div>
        <div ref={logRef} style={{flex:1,overflow:"auto",padding:"12px 18px",fontFamily:"'IBM Plex Mono',monospace",fontSize:11,lineHeight:1.6,color:"rgba(255,255,255,0.5)",whiteSpace:"pre-wrap",wordBreak:"break-all"}}>
          {logs}
        </div>
      </div>
    </div>
  );
};

const TypingIndicator = ({color="#818cf8"}) => (<div style={{display:"flex",gap:3,alignItems:"center",padding:"6px 0"}}>{[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:"50%",background:color,opacity:0.4,animation:`typing-bounce 1.2s ease-in-out ${i*0.15}s infinite`}} />)}</div>);

const ToolCallChip = ({tool,args}) => (<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 10px",marginTop:6,background:"rgba(34,211,238,0.06)",border:"1px solid rgba(34,211,238,0.12)",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",maxWidth:"100%",overflow:"hidden",borderRadius:4}}><span style={{color:"#22d3ee",fontWeight:700,fontSize:9,letterSpacing:"0.1em"}}>TOOL</span><span style={{color:"rgba(255,255,255,0.5)"}}>{tool}</span>{args&&<span style={{color:"rgba(255,255,255,0.2)",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{typeof args==='string'?args:JSON.stringify(args)}</span>}</div>);

const ToolResultChip = ({tool,result}) => (<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 10px",marginTop:2,background:"rgba(52,211,153,0.04)",border:"1px solid rgba(52,211,153,0.10)",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",maxWidth:"100%",overflow:"hidden",borderRadius:4}}><span style={{color:"#34d399",fontWeight:700,fontSize:9,letterSpacing:"0.1em"}}>RESULT</span><span style={{color:"rgba(255,255,255,0.4)",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{typeof result==='string'?result:JSON.stringify(result)}</span></div>);

// Forging Indicator Component
const ForgingIndicator = ({count = 0}) => {
  if (count === 0) return null;
  return React.createElement('div', { className: 'forging-indicator' },
    React.createElement('span', { style: { animation: 'spin 1s linear infinite' } }, '⚒'),
    React.createElement('span', null, `Forging... ${count} tool call${count !== 1 ? 's' : ''}`)
  );
};

const ChatBubble = ({msg}) => {
  const isSelf=msg.from==="kit"; const c=AGENT_COLORS[msg.from]||"#818cf8";
  const shouldAnimate = !msg.streaming;
  const elRef=useRef(null); const [animated,setAnimated]=useState(!shouldAnimate);
  useEffect(()=>{if(!animated&&elRef.current){const t=setTimeout(()=>setAnimated(true),400);return()=>clearTimeout(t);}},[]);
  
  const toolCallCount = (msg.toolCalls || []).length;
  const hasToolActivity = toolCallCount > 0 || (msg.toolResults || []).length > 0;
  
  return (
    <div ref={elRef} className="chat-bubble" style={{display:"flex",gap:12,maxWidth:"85%",overflow:"hidden",alignSelf:isSelf?"flex-end":"flex-start",flexDirection:isSelf?"row-reverse":"row",animation:!animated?"msg-slide-in 0.4s cubic-bezier(0.16,1,0.3,1) forwards":"none"}}>
      <AgentAvatar agent={msg.agent} size={28} />
      <div style={{display:"flex",flexDirection:"column",gap:3,maxWidth:"calc(100% - 44px)"}}>
        <div style={{display:"flex",gap:8,alignItems:"center",justifyContent:isSelf?"flex-end":"flex-start"}}>
          <span className="agent-name" style={{fontSize:11,fontWeight:700,color:c}}>{msg.agent.name}</span>
          <span className="timestamp" style={{fontSize:10,color:"rgba(255,255,255,0.15)"}}>{msg.time}</span>
        </div>
        <div style={{padding:"12px 16px",overflow:"hidden",background:isSelf?"linear-gradient(135deg, rgba(16,185,129,0.08), rgba(16,185,129,0.03))":"linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01))",border:`1px solid ${isSelf?"rgba(16,185,129,0.12)":"rgba(255,255,255,0.04)"}`,position:"relative"}}>
          <div style={{position:"absolute",top:0,left:0,right:0,height:1,background:`linear-gradient(90deg,transparent,${c}15,transparent)`}} />
          
          {/* Forging indicator - show when streaming */}
          {msg.streaming && React.createElement(ForgingIndicator, { count: toolCallCount })}
          
          <span className="chat-bubble-text message-text" style={{fontSize:13,color:"rgba(255,255,255,0.75)",lineHeight:1.7,display:"block",whiteSpace:"pre-wrap",wordBreak:"break-word",overflowWrap:"break-word"}}>{msg.text}</span>
          
          {/* Collapsible activity stream for tool calls/results */}
          {hasToolActivity && React.createElement('div', { className: 'activity-stream' },
            React.createElement('details', { open: false },
              React.createElement('summary', null, `⚒ Forging — ${toolCallCount} tool call${toolCallCount !== 1 ? 's' : ''}`),
              React.createElement('div', { className: 'activity-stream-content' },
                (msg.toolCalls || []).map((tc, i) => 
                  React.createElement(ToolCallChip, { key: `tc-${i}`, tool: tc.tool, args: tc.args })
                ),
                (msg.toolResults || []).map((tr, i) => 
                  React.createElement(ToolResultChip, { key: `tr-${i}`, tool: tr.tool, result: tr.result })
                )
              )
            )
          )}
        </div>
      </div>
    </div>
  );
};

const EventEntry = ({event, idx}) => {
  const typeColors={delegate:"#818cf8",git:"#34d399",exec:"#22d3ee",alert:"#fbbf24",sync:"#34d399",pulse:"#c084fc",infra:"#6b7280"};
  const accent=typeColors[event.type]||"#6b7280"; const src=(event.source||"SYS").slice(0,3).toUpperCase();
  return (
    <div className="event-entry" style={{display:"flex",gap:8,padding:"8px 16px",borderBottom:"1px solid rgba(255,255,255,0.02)",animation:`event-fade-in 0.3s ease ${Math.min(idx,10)*0.03}s both`,position:"relative"}}>
      <div style={{position:"absolute",left:0,top:0,bottom:0,width:2,background:`${accent}20`}} />
      <span style={{fontSize:10,color:"rgba(255,255,255,0.18)",fontFamily:"'IBM Plex Mono',monospace",minWidth:56,flexShrink:0,paddingTop:1}}>{fmtTime(event.timestamp)}</span>
      <div style={{width:5,height:5,borderRadius:"50%",background:accent,marginTop:5,flexShrink:0,boxShadow:`0 0 6px ${accent}40`}} />

      </div>
    </div>
  );
};

const CommsView = ({agents, events, wsConnected, chatHistory, setChatHistory, msg, setMsg, target, setTarget, sending, setSending, sessionId, setSessionId, sessionItems, onLoadSession, onNewConversation, onClearHistory, onEmergencyStop}) => {
  const messagesEl=useRef(null); const textareaEl=useRef(null); const streamControllerRef=useRef(null);
  const ta=agents.find(a=>a.id===target)||FALLBACK_AGENTS[0]; const tc=AGENT_COLORS[target]||"#818cf8";
  const scrollBottom=useCallback(()=>{if(messagesEl.current) messagesEl.current.scrollTop=messagesEl.current.scrollHeight;},[]);
  useEffect(()=>{requestAnimationFrame(scrollBottom);},[chatHistory]);

  const markStopped = () => {
    setChatHistory(prev=>{
      if (!prev.length) return prev;
      const u=[...prev];
      const last={...u[u.length-1]};
      if (last.from===target && last.streaming) {
        last.streaming=false;
        last.text = (last.text ? `${last.text}\n` : "") + "[Stopped by Sovereign]";
        u[u.length-1]=last;
      }
      return u;
    });
  };

  const stopCurrent = async () => {
    if (streamControllerRef.current) {
      streamControllerRef.current.abort();
      streamControllerRef.current = null;
    }
    markStopped();
    setSending(false);
    await apiPost(`/api/v1/agents/${target}/stop`);
  };

  const handleSend = async () => {
    if(!msg.trim()||sending) return;
    const userMsg={from:"kit",agent:{id:"kit",name:"Kit (Sovereign)",initial:"K",status:"online"},text:msg,time:new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}),toolCalls:[],toolResults:[]};
    const sentMsg=msg; setChatHistory(prev=>[...prev,userMsg]); setMsg(""); setSending(true);
    if(textareaEl.current) textareaEl.current.style.height='56px';
    const timeStr=new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'});
    setChatHistory(prev=>[...prev,{from:target,agent:ta,text:"",time:timeStr,streaming:true,toolCalls:[],toolResults:[]}]);
    const ctrl = new AbortController();
    streamControllerRef.current = ctrl;
    await streamChat(target,sentMsg,sessionId,ctrl.signal,
      (chunk)=>{setChatHistory(prev=>{const u=[...prev];const l={...u[u.length-1]};l.text=(l.text||"")+chunk;u[u.length-1]=l;return u;});requestAnimationFrame(scrollBottom);},
      (cleaned)=>{setChatHistory(prev=>{const u=[...prev];const l={...u[u.length-1]};l.text=cleaned;u[u.length-1]=l;return u;});},
      (tool,args)=>{setChatHistory(prev=>{const u=[...prev];const l={...u[u.length-1]};l.toolCalls=[...(l.toolCalls||[]),{tool,args}];u[u.length-1]=l;return u;});requestAnimationFrame(scrollBottom);},
      (tool,result)=>{setChatHistory(prev=>{const u=[...prev];const l={...u[u.length-1]};l.toolResults=[...(l.toolResults||[]),{tool,result}];u[u.length-1]=l;return u;});requestAnimationFrame(scrollBottom);},
      (sid)=>{if(sid) setSessionId(sid);setChatHistory(prev=>{const u=[...prev];const l={...u[u.length-1]};l.streaming=false;if(!l.text&&!(l.toolCalls||[]).length)l.text="(empty response)";u[u.length-1]=l;return u;});setSending(false);streamControllerRef.current=null;},
      (err)=>{setChatHistory(prev=>{const u=[...prev];const l={...u[u.length-1]};if(err&&err!=="[Stopped by Sovereign]") l.text=err;l.streaming=false;u[u.length-1]=l;return u;});setSending(false);streamControllerRef.current=null;}
    );
  };

  return (
    <div className="comms-view" style={{display:"grid",gridTemplateColumns:"1fr 420px",height:"100%"}}>
      <div className="chat-container messages-wrapper" style={{display:"flex",flexDirection:"column",borderRight:"1px solid rgba(255,255,255,0.04)",height:"100%"}}>
        <div className="nav-bar" style={{display:"flex",alignItems:"center",gap:0,borderBottom:"1px solid rgba(255,255,255,0.04)",background:"rgba(0,0,0,0.15)",flexShrink:0,flexWrap:"wrap"}}>
          {agents.map(a=>{const ac=AGENT_COLORS[a.id];const sel=target===a.id;return(
            <button key={a.id} className="agent-tab-btn" onClick={()=>setTarget(a.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"10px 16px",background:sel?`${ac}08`:"transparent",border:"none",borderBottom:sel?`2px solid ${ac}`:"2px solid transparent",cursor:"pointer",transition:"all 0.15s"}}>
              <AgentAvatar agent={a} size={22} showStatus={false} />
              <span style={{fontSize:11,fontWeight:sel?700:400,color:sel?ac:"rgba(255,255,255,0.3)",fontFamily:"'IBM Plex Mono',monospace"}}>{(a.name||a.id).split(' ')[0]}</span>
            </button>
          );})}
          <div style={{marginLeft:"auto",padding:"0 14px"}}><button className="action-btn" style={{padding:"6px 14px",fontSize:9,fontWeight:700,letterSpacing:"0.12em",background:"linear-gradient(135deg,rgba(251,191,36,0.12),rgba(251,191,36,0.04))",border:"1px solid rgba(251,191,36,0.2)",color:"#fbbf24",cursor:"pointer",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>⚡ Broadcast</button></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12,padding:"8px 18px",background:`linear-gradient(90deg, ${tc}06, transparent)`,borderBottom:"1px solid rgba(255,255,255,0.03)",flexShrink:0}}>
          <AgentAvatar agent={ta} size={26} />
          <div style={{flex:1}}><span style={{fontSize:12,fontWeight:700,color:tc}}>{ta.name}</span><span style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginLeft:8}}>{ta.role}</span></div>
          <ActionBtn label="Clear" icon="⌫" color="#ef4444" small onClick={onClearHistory} />
          <Badge text={ta.model} color={tc} /><span style={{fontSize:10,color:"rgba(255,255,255,0.25)",fontFamily:"'IBM Plex Mono',monospace"}}>{ta.ping_ms?`${ta.ping_ms}ms`:"—"}</span>
        </div>
        <div className="messages-area messages-scroll scroll-area flex-container" ref={messagesEl} style={{flex:1,overflowY:"auto",scrollBehavior:"smooth",padding:"20px",display:"flex",flexDirection:"column",gap:20}}>
          {chatHistory.length===0&&<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:12,opacity:0.3}}><span style={{fontSize:32,fontFamily:"'Space Grotesk',sans-serif",fontWeight:800,color:tc}}>⚔</span><span style={{fontSize:12,color:"rgba(255,255,255,0.3)"}}>Command the warband</span></div>}
          {chatHistory.map((m,i)=><ChatBubble key={i} msg={m} />)}
          {sending&&chatHistory.length>0&&chatHistory[chatHistory.length-1].text===""&&!(chatHistory[chatHistory.length-1].toolCalls||[]).length&&(
            <div style={{display:"flex",gap:12,alignItems:"center",opacity:0.6,paddingLeft:4}}><AgentAvatar agent={ta} size={22} showStatus={false} /><Glass style={{padding:"8px 14px",display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:10,color:tc,fontWeight:600}}>{ta.name.split(' ')[0]}</span><TypingIndicator color={tc} /></Glass></div>
          )}
        </div>
        <div style={{padding:"12px 18px",borderTop:"1px solid rgba(255,255,255,0.04)",background:"linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.25))",display:"flex",gap:8,flexShrink:0,alignItems:"flex-end"}}>
          <textarea ref={textareaEl} value={msg} onChange={e=>{setMsg(e.target.value);const el=e.target;el.style.height='56px';el.style.height=Math.min(el.scrollHeight,140)+'px';}} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}}} placeholder={`Command ${ta.name}...`} rows={2}
            style={{flex:1,background:"rgba(255,255,255,0.02)",border:`1px solid ${tc}15`,padding:"14px 18px",color:"#e2e8f0",fontSize:13,fontFamily:"'IBM Plex Mono',monospace",outline:"none",lineHeight:1.5,minHeight:56,maxHeight:140,overflowY:"auto"}} />
          {sending ? (
            <button onClick={stopCurrent} className="send-btn" style={{padding:"14px 22px",background:"linear-gradient(135deg, rgba(239,68,68,0.35), rgba(239,68,68,0.2))",border:"1px solid rgba(239,68,68,0.7)",color:"#ef4444",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",fontWeight:800,cursor:"pointer",letterSpacing:"0.14em",textTransform:"uppercase",boxShadow:"0 0 24px rgba(239,68,68,0.35)",alignSelf:"stretch",minHeight:56}}>STOP</button>
          ) : (
            <button onClick={handleSend} disabled={sending} className="send-btn" style={{padding:"14px 28px",background:`linear-gradient(135deg, ${tc}30, ${tc}15)`,border:`1px solid ${tc}40`,color:tc,fontSize:11,fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,cursor:sending?"wait":"pointer",letterSpacing:"0.14em",textTransform:"uppercase",boxShadow:`0 0 24px ${tc}15`,alignSelf:"stretch",minHeight:56,opacity:sending?0.5:1}}>SEND</button>
          )}
        </div>
      </div>
      {/* EVENT STREAM - Sidebar */}
      <div className="event-sidebar" style={{display:"flex",flexDirection:"column",background:"rgba(0,0,0,0.2)",height:"100%"}}>
        <div style={{padding:"10px 12px",borderBottom:"1px solid rgba(255,255,255,0.04)",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.14em",color:"rgba(255,255,255,0.25)",textTransform:"uppercase"}}>Sessions</span>
            <div style={{display:"flex",gap:6}}>
              <ActionBtn label="New" icon="＋" color={tc} small onClick={onNewConversation} />
              <ActionBtn label="Stop All" icon="■" color="#ef4444" small onClick={onEmergencyStop} />
            </div>
          </div>
          <div style={{maxHeight:170,overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
            {sessionItems.map((s)=>(
              <div key={s.id} className="session-item" onClick={()=>onLoadSession(s.id)} style={{padding:"7px 8px",border:`1px solid ${sessionId===s.id?`${tc}50`:"rgba(255,255,255,0.06)"}`,background:sessionId===s.id?`${tc}10`:"rgba(255,255,255,0.01)",cursor:"pointer"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <span style={{fontSize:10,color:sessionId===s.id?tc:"rgba(255,255,255,0.35)",fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.id}</span>
                  <span style={{fontSize:9,color:"rgba(255,255,255,0.18)"}}>{fmtTimeAgo((s.updated_at||0)*1000)}</span>
                </div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.28)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.last_preview||"(empty)"}</div>
              </div>
            ))}
            {sessionItems.length===0 && <div style={{fontSize:10,color:"rgba(255,255,255,0.2)",padding:"8px"}}>No sessions yet</div>}
          </div>
        </div>
        <div style={{padding:"12px 16px",borderBottom:"1px solid rgba(255,255,255,0.04)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:6,height:6,borderRadius:"50%",background:wsConnected?"#ef4444":"#6b7280",animation:wsConnected?"rec-pulse 1.5s ease infinite":"none"}} /><span style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.35)",letterSpacing:"0.16em",textTransform:"uppercase"}}>{wsConnected?"Live Feed":"Disconnected"}</span></div>
          <span style={{fontSize:10,color:"rgba(255,255,255,0.15)",fontFamily:"'IBM Plex Mono',monospace"}}>{events.length} events</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:1,padding:"1px",borderBottom:"1px solid rgba(255,255,255,0.04)",flexShrink:0}}>
          {[{l:"DELEGATES",val:events.filter(e=>e.type==="delegate").length,c:"#818cf8"},{l:"GIT OPS",val:events.filter(e=>e.type==="git").length,c:"#34d399"},{l:"ALERTS",val:events.filter(e=>e.type==="alert").length,c:"#fbbf24"}].map(s=>(
            <div key={s.l} style={{padding:"10px 12px",background:"rgba(0,0,0,0.15)",textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:s.c,fontFamily:"'Space Grotesk',sans-serif"}}>{s.val}</div><div style={{fontSize:8,color:"rgba(255,255,255,0.2)",letterSpacing:"0.14em",marginTop:2}}>{s.l}</div></div>
          ))}
        </div>
        <div className="scroll-area" style={{flex:1,overflowY:"auto"}}>{events.length===0?<div style={{padding:20,textAlign:"center",color:"rgba(255,255,255,0.12)",fontSize:11}}>Waiting for events...</div>:events.map((e,i)=><EventEntry key={i} event={e} idx={i} />)}</div>
      </div>
    </div>
  );
};

const Tab = ({active,label,count,onClick}) => (<button onClick={onClick} className="tab-label" style={{background:"none",border:"none",position:"relative",color:active?"#e2e8f0":"rgba(255,255,255,0.25)",padding:"14px 0",marginRight:28,cursor:"pointer",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",fontWeight:active?700:400,letterSpacing:"0.14em",textTransform:"uppercase",transition:"all 0.15s"}}><span>{label}</span>{count&&<span style={{marginLeft:6,fontSize:10,fontWeight:700,color:active?"#818cf8":"rgba(255,255,255,0.12)"}}>{count}</span>}{active&&<div style={{position:"absolute",bottom:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#818cf8,#818cf800)",boxShadow:"0 0 8px rgba(129,140,248,0.3)"}} />}</button>);

const localChatKey = (agent) => `hirdforge-chat-${agent}`;
const localSessionKey = (agent) => `hirdforge-session-${agent}`;
const uiToStored = (m) => ({ role: m.from==="kit"?"user":"assistant", content: m.text||"", timestamp: Date.now() });
const storedToUI = (agentId, m) => {
  const isUser = m.role === "user";
  const from = isUser ? "kit" : agentId;
  const agent = isUser ? {id:"kit",name:"Kit (Sovereign)",initial:"K",status:"online"} : {id:agentId,name:agentId,initial:(agentId||"?")[0]?.toUpperCase()||"?",status:"online"};
  return { from, agent, text: m.content||"", time: new Date((m.timestamp||Date.now())).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}), streaming:false, toolCalls:[], toolResults:[] };
};
const serverSessionToUI = (session) => (session.messages||[]).map((m)=>storedToUI(session.agent||"unknown", m));

function App() {
  const [tab,setTab]=useState("comms"); const [selected,setSelected]=useState(0);
  const [chatHistory,setChatHistory]=useState([]); const [msg,setMsg]=useState(""); const [target,setTarget]=useState("ragnar"); const [sending,setSending]=useState(false);
  const [sessionIdByAgent,setSessionIdByAgent]=useState({});
  const [sessionItems,setSessionItems]=useState([]);
  const [toast,setToast]=useState("");
  const agents=usePolledData('/api/v1/agents',FALLBACK_AGENTS,CONFIG.POLL_INTERVAL);
  const nodes=usePolledData('/api/v1/cluster/nodes',FALLBACK_NODES,CONFIG.POLL_INTERVAL*2);
  const pods=usePolledData('/api/v1/cluster/pods',[],CONFIG.POLL_INTERVAL*2);
  const commits=usePolledData('/api/v1/gitea/commits',[],CONFIG.POLL_INTERVAL*3);
  const k8sEvents=usePolledData('/api/v1/k8s/events',[],CONFIG.POLL_INTERVAL*2);
  const {events,connected:wsConnected}=useEventStream();
  const online=agents.filter(a=>a.status==="online").length;

  const currentSessionId = sessionIdByAgent[target] || localStorage.getItem(localSessionKey(target)) || `hirdforge-${target}-${Date.now()}`;

  useEffect(() => {
    if (!target) return;
    const raw = localStorage.getItem(localChatKey(target));
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) setChatHistory(parsed.map(m => storedToUI(target, m)));
        else setChatHistory([]);
      } catch { setChatHistory([]); }
    } else {
      setChatHistory([]);
    }
    const sid = localStorage.getItem(localSessionKey(target));
    if (sid) {
      setSessionIdByAgent(prev => ({...prev, [target]: sid}));
      apiFetch(`/api/v1/sessions/${sid}`, null).then((sess)=>{
        if (sess && sess.messages) setChatHistory(serverSessionToUI(sess));
      });
    }
  }, [target]);

  useEffect(() => {
    if (!target) return;
    localStorage.setItem(localChatKey(target), JSON.stringify(chatHistory.map(uiToStored)));
  }, [chatHistory, target]);

  useEffect(() => {
    if (!target) return;
    if (sessionIdByAgent[target]) {
      localStorage.setItem(localSessionKey(target), sessionIdByAgent[target]);
    }
  }, [sessionIdByAgent, target]);

  useEffect(() => {
    let mounted = true;
    const load = async () => {
      const all = await apiFetch('/api/v1/sessions', []);
      if (!mounted || !Array.isArray(all)) return;
      setSessionItems(all.filter(s => s.agent === target));
    };
    load();
    const id = setInterval(load, 5000);
    return () => { mounted = false; clearInterval(id); };
  }, [target, sending]);

  const setCurrentSessionId = (sid) => {
    setSessionIdByAgent(prev => ({...prev, [target]: sid}));
  };

  const loadSession = async (sid) => {
    const sess = await apiFetch(`/api/v1/sessions/${sid}`, null);
    if (!sess || !sess.messages) return;
    setCurrentSessionId(sid);
    setChatHistory(serverSessionToUI(sess));
  };

  const newConversation = () => {
    const sid = `hirdforge-${target}-${Date.now()}`;
    setCurrentSessionId(sid);
    setChatHistory([]);
  };

  const clearHistory = () => {
    setChatHistory([]);
    localStorage.removeItem(localChatKey(target));
  };

  const emergencyStop = async () => {
    await apiPost('/api/v1/agents/stop-all');
    setSending(false);
    setChatHistory(prev=>{
      if (!prev.length) return prev;
      const u=[...prev];
      const last={...u[u.length-1]};
      if (last.streaming) {
        last.streaming=false;
        last.text = (last.text ? `${last.text}\n` : "") + "[Stopped by Sovereign]";
        u[u.length-1]=last;
      }
      return u;
    });
    setToast("All agents stopped");
    setTimeout(()=>setToast(""), 1800);
  };

  return (
    <div className="main-content" style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",height:48,minHeight:48,borderBottom:"1px solid rgba(255,255,255,0.04)",background:"linear-gradient(90deg,rgba(10,10,20,0.95),rgba(6,6,16,0.95))",position:"relative"}}>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:1,background:"linear-gradient(90deg,transparent,rgba(99,102,241,0.12),transparent)"}} />
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:9,height:9,background:"#818cf8",boxShadow:"0 0 14px rgba(129,140,248,0.5)",borderRadius:1}} /><span style={{fontSize:14,fontWeight:800,letterSpacing:"0.22em",color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>HIRDFORGE</span></div>
          <div style={{width:1,height:20,background:"rgba(255,255,255,0.05)"}} /><span style={{fontSize:10,color:"rgba(255,255,255,0.18)",letterSpacing:"0.12em"}}>VALHALLA CLUSTER</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:18}}>
          {[{l:"CLUSTER",s:"online"},{l:"ARGOCD",s:"online"},{l:"GITEA",s:"online"}].map(x=>(<div key={x.l} style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"rgba(255,255,255,0.25)"}}><GlowPip status={x.s} size={5} /><span>{x.l}</span></div>))}
          <button onClick={emergencyStop} title="Emergency Stop — Cancel all agent operations" style={{width:28,height:28,borderRadius:"50%",border:"1px solid rgba(239,68,68,0.6)",background:"rgba(239,68,68,0.15)",color:"#ef4444",cursor:"pointer",fontWeight:900,boxShadow:sending?"0 0 12px rgba(239,68,68,0.6)":"none",animation:sending?"rec-pulse 1.2s ease infinite":"none"}}>■</button>
          <div style={{width:1,height:20,background:"rgba(255,255,255,0.05)"}} />
          <span style={{fontSize:12,fontFamily:"'Space Grotesk',sans-serif"}}><span style={{color:"#34d399",fontWeight:700}}>{online}</span><span style={{color:"rgba(255,255,255,0.15)"}}> / {agents.length}</span></span>
        </div>
      </div>
      <div style={{display:"flex",padding:"0 20px",borderBottom:"1px solid rgba(255,255,255,0.04)",background:"rgba(0,0,0,0.12)",flexShrink:0}}>
        <Tab active={tab==="comms"} label="Comms" count={String(events.length)} onClick={()=>setTab("comms")} />
        <Tab active={tab==="fleet"} label="Warriors" count={String(agents.length)} onClick={()=>setTab("fleet")} />
        <Tab active={tab==="realm"} label="Realm" onClick={()=>setTab("realm")} />
      </div>
      <div style={{flex:1,overflow:"hidden"}}>
        {tab==="fleet"&&<FleetView agents={agents} selected={selected} setSelected={setSelected} />}
        {tab==="realm"&&<RealmView agents={agents} nodes={nodes} pods={pods} commits={commits} k8sEvents={k8sEvents} />}
        {tab==="comms"&&<CommsView agents={agents} events={events} wsConnected={wsConnected} chatHistory={chatHistory} setChatHistory={setChatHistory} msg={msg} setMsg={setMsg} target={target} setTarget={setTarget} sending={sending} setSending={setSending} sessionId={currentSessionId} setSessionId={setCurrentSessionId} sessionItems={sessionItems} onLoadSession={loadSession} onNewConversation={newConversation} onClearHistory={clearHistory} onEmergencyStop={emergencyStop} />}
      </div>
      {toast && <div style={{position:"fixed",top:58,right:20,padding:"10px 14px",background:"rgba(239,68,68,0.16)",border:"1px solid rgba(239,68,68,0.45)",color:"#ef4444",fontSize:11,fontWeight:700,zIndex:20000}}>{toast}</div>}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",height:28,minHeight:28,borderTop:"1px solid rgba(255,255,255,0.03)",background:"rgba(0,0,0,0.3)",fontSize:10,color:"rgba(255,255,255,0.2)",flexShrink:0}}>
        <div style={{display:"flex",gap:18}}><span>{(pods||[]).length} pods</span><span>{nodes.length} nodes</span><span>{agents.length} agents</span></div>
        <div style={{display:"flex",gap:18}}><span>WS: <span style={{color:wsConnected?"#34d399":"#ef4444"}}>{wsConnected?"connected":"reconnecting"}</span></span><span>ArgoCD: <span style={{color:"#34d399"}}>Healthy</span></span><span style={{color:"rgba(255,255,255,0.12)"}}>v0.7.5-s7</span></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
