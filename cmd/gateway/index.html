  useEffect(()=>{if(!memoryAgent&&agents[0])setMemoryAgent(agents[0].id);},[agents,memoryAgent]);
  useEffect(()=>{
    let live=true;
    (async()=>{
      const res=await apiGetJSONDetailed('/api/v1/settings');
      if(!live)return;
      if(res.ok){setSettings(res.data||{});setSettingsStatus("ready");}
      else setSettingsStatus("error");
    })();
    return()=>{live=false;};
  },[]);
  useEffect(()=>{
    const agent=agents.find(item=>item.id===selectedAgent);
    if(agent)setModelValue(agent.model||"");
  },[selectedAgent,agents]);
  useEffect(()=>{setWebhookURL(settings["notifications.discord_webhook_url"]||"");},[settings]);
  const patchSetting=async(key,value)=>{
    const res=await apiPatchJSON(`/api/v1/settings/${encodeURIComponent(key)}`,{value});
    if(!res.ok){toast(res.data?.error||"Settings update failed");return;}
    setSettings(res.data||settings);
    toast("Settings saved");
  };
  const updateModel=async()=>{
    if(!selectedAgent)return;
    setSaveBusy(true);
    try{
      const res=await fetch(`/api/v1/settings/agents/${encodeURIComponent(selectedAgent)}/model`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:modelValue})});
      if(res.status===404)toast("Agent model endpoint not available yet.");
      else if(!res.ok)toast((await res.text())||`HTTP ${res.status}`);

    }catch(e){toast(e.message||"Model update failed");}
    setSaveBusy(false);
  };
  const searchMemories=async()=>{
    if(!memoryAgent)return;
    setMemoryBusy(true);
    const res=await apiGetJSONDetailed(`/api/v1/seidr/memories?agent=${encodeURIComponent(memoryAgent)}&query=${encodeURIComponent(memoryQuery)}&limit=20`);
    if(!res.ok){
      toast(res.data?.error||"Memory search failed");

      setMemoryBusy(false);
      return;
    }
    setMemoryResults(memoryListFromResponse(res.data));
    setMemoryBusy(false);
  };
  const deleteMemory=async memory=>{
    const id=memoryId(memory);
    if(!id||!memoryAgent)return;
    if(!window.confirm("Delete this memory?"))return;
    const res=await apiDelete(`/api/v1/seidr/memories/${encodeURIComponent(id)}?agent=${encodeURIComponent(memoryAgent)}`);
    if(!res.ok){toast(res.data?.error||"Memory delete failed");return;}
    setMemoryResults(prev=>prev.filter(item=>memoryId(item)!==id));
    toast("Memory deleted");
  };
  const selected=agents.find(item=>item.id===selectedAgent);
  return <div className="settings-shell">
    <div className="settings-layout">
      <aside className="settings-nav">
        {["agents","notifications","task board","display","credentials"].map(item=>{
          const key=item.replace(" ","_");
          return <button key={key} className={section===key?"active":""} onClick={()=>setSection(key)}>{item}</button>;
        })}
        <div className="settings-note">Forgedoc config requires helm upgrade</div>
      </aside>
      <section className="settings-panel">
        <div className="panel-head">
          <div><div className="panel-title">Settings</div><div className="panel-subtitle">Operational controls and gateway preferences.</div></div>
          <div className="subtle">{settingsStatus==="ready"?"live":"loading"}</div>
        </div>
        <div className="settings-content">
          {section==="agents"&&<>
            <div className="settings-table">
              <div className="settings-head"><span>Name</span><span>Role</span><span>Backend</span><span>Model</span><span>Enabled</span></div>
              {agents.map(agent=>{const paused=!!(fleetState||[]).find(item=>item.name===agent.id)?.paused;return <div key={agent.id} className={`settings-row ${selectedAgent===agent.id?"active":""}`} onClick={()=>setSelectedAgent(agent.id)}>
                <span>{agent.id}</span><span>{agent.role}</span><span>{agent.backend||"—"}</span><span>{agent.model||"—"}</span>
                <button className={`flat-btn ${paused?"amber":"green"}`} onClick={async e=>{e.stopPropagation();const path=paused?`/api/v1/agents/${encodeURIComponent(agent.id)}/resume`:`/api/v1/agents/${encodeURIComponent(agent.id)}/pause`;const out=await apiPost(path);toast(out?.error||`${agent.id} ${paused?"resumed":"paused"}`);}}>{paused?"Disabled":"Enabled"}</button>
              </div>;})}
            </div>
            {selected&&<div className="agent-detail">
              <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"center"}}>

                <div className="detail-actions">
                  {personaRepo&&<a className="flat-btn blue" href={personaRepo.html_url} target="_blank" rel="noreferrer">Persona repo</a>}
                  {personaRepo&&<a className="flat-btn" href={`${personaRepo.html_url}/src/branch/main`} target="_blank" rel="noreferrer">Edit persona</a>}
                </div>
              </div>
              <div className="field-grid">
                <div className="field"><label>Model selector</label><select value={modelValue} onChange={e=>setModelValue(e.target.value)}><option value={modelValue}>{modelValue||"current"}</option><option value="gpt-5">gpt-5</option><option value="gpt-5-mini">gpt-5-mini</option><option value="claude">claude</option></select></div>
                <div className="field"><label>Last persona update SHA</label><input value={settings[`agents.${selected.id}.persona_sha`]||"Unavailable"} readOnly/></div>
                <div className="field"><label>Max context</label><input value={settings[`agents.${selected.id}.max_context`]||"—"} readOnly/></div>
                <div className="field"><label>Max tool rounds</label><input value={settings[`agents.${selected.id}.max_tool_rounds`]||"—"} readOnly/></div>

            <div className="memory-browser">

              <div className="memory-search">

                  {agents.map(agent=><option key={agent.id} value={agent.id}>{agent.id}</option>)}
                </select>
                <input value={memoryQuery} onChange={e=>setMemoryQuery(e.target.value)} placeholder="Search memory text"/>
                <button className="flat-btn blue" disabled={memoryBusy} onClick={searchMemories}>{memoryBusy?"Searching…":"Search"}</button>
              </div>
              <div className="kv-list">
                {memoryResults.map((item,index)=>{const score=memoryScore(item);return <div key={memoryId(item)||index} className="memory-result">
                  <div className="memory-result-main">
                    <div className="memory-result-text">{truncateText(memoryText(item),200)||"Empty memory content"}</div>
                    <div className="memory-result-meta">
                      <Badge text={`score ${score.toFixed(2)}`} color={scoreTone(score)}/>
                      <Badge text={memoryType(item)} color="rgba(34,211,238,0.16)"/>
                      <span className="subtle">{memoryAge(item)?fAgo(memoryAge(item)):"unknown age"}</span>

function ChatPanel({open,onClose,agents,target,setTarget,chatHistory,setChatHistory,msg,setMsg,sending,setSending,sessionId,setSessionId,sessionItems,sessionFilter,setSessionFilter,onLoadSession,onNewConversation,onClearHistory,auth,showTools,setShowTools,sessionMeta}){
  const listRef=useRef(null);
  const inputRef=useRef(null);
  const ctrlRef=useRef(null);
  const agent=agents.find(item=>item.id===target)||agents[0]||FA[0];
  const scrollBottom=()=>{if(listRef.current)listRef.current.scrollTop=listRef.current.scrollHeight;};
  useEffect(()=>{requestAnimationFrame(scrollBottom);},[chatHistory]);
  const stopCurrent=async()=>{
    if(ctrlRef.current){ctrlRef.current.abort();ctrlRef.current=null;}
    setChatHistory(prev=>{if(!prev.length)return prev;const next=prev.slice();const last={...next[next.length-1]};if(last.from===target&&last.streaming){last.streaming=false;last.text=`${last.text?`${last.text}\n`:""}[Stopped by Sovereign]`;next[next.length-1]=last;}return next;});
    setSending(false);
    await apiPost(`/api/v1/agents/${target}/stop`);
  };
  const send=async()=>{
    if(!msg.trim()||sending||!agent)return;
    const now=new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'});
    setChatHistory(prev=>prev.concat([{from:"kit",agent:{id:"kit",name:`${auth.user} (${auth.role})`,initial:(auth.user||"S")[0].toUpperCase(),status:"online"},text:msg,time:now,toolCalls:[],toolResults:[]}]));
    const outbound=msg;
    setMsg("");
    setSending(true);
    setChatHistory(prev=>prev.concat([{from:target,agent,text:"",time:now,streaming:true,toolCalls:[],toolResults:[]}]));
    const ctrl=new AbortController();
    ctrlRef.current=ctrl;
    await streamChat(target,outbound,sessionId,ctrl.signal,
      chunk=>{setChatHistory(prev=>{const next=prev.slice();const last={...next[next.length-1]};last.text=(last.text||"")+chunk;next[next.length-1]=last;return next;});requestAnimationFrame(scrollBottom);},
      clean=>{setChatHistory(prev=>{const next=prev.slice();next[next.length-1]={...next[next.length-1],text:clean};return next;});},
      (tool,args)=>{setChatHistory(prev=>{const next=prev.slice();const last={...next[next.length-1]};last.toolCalls=(last.toolCalls||[]).concat([{tool,args}]);next[next.length-1]=last;return next;});requestAnimationFrame(scrollBottom);},
      (tool,result)=>{setChatHistory(prev=>{const next=prev.slice();const last={...next[next.length-1]};last.toolResults=(last.toolResults||[]).concat([{tool,result}]);next[next.length-1]=last;return next;});requestAnimationFrame(scrollBottom);},
      sid=>{if(sid)setSessionId(sid);setChatHistory(prev=>{const next=prev.slice();const last={...next[next.length-1]};last.streaming=false;if(!last.text&&!(last.toolCalls||[]).length)last.text="(empty response)";next[next.length-1]=last;return next;});setSending(false);ctrlRef.current=null;},
      err=>{setChatHistory(prev=>{const next=prev.slice();const last={...next[next.length-1]};last.streaming=false;if(err!=="[Stopped by Sovereign]")last.text=err;next[next.length-1]=last;return next;});setSending(false);ctrlRef.current=null;}
    );
  };
  return <aside className={`chat-panel ${open?"open":""}`}>
    <div className="chat-panel-head">
      <select value={target} onChange={e=>setTarget(e.target.value)}>{agents.map(item=><option key={item.id} value={item.id}>{item.id}</option>)}</select>
      <button className="flat-btn" onClick={onClose}>Close</button>
    </div>
    <div className="chat-panel-body">
      <div className="chat-toolbar">
        <button className={`toggle-chip ${showTools?"active":""}`} onClick={()=>setShowTools(!showTools)}>{showTools?"Tool calls visible":"Tool calls hidden"}</button>
        <button className="toggle-chip" onClick={onNewConversation}>New session</button>
        <button className="toggle-chip" onClick={onClearHistory}>Clear local</button>
        <span className="subtle" style={{marginLeft:"auto"}}>{sessionMeta?.source||"comms"}</span>
      </div>
      <div className="session-list-compact">
        <div className="inline-list">
          {[{key:"all",label:"all"},{key:"comms",label:"comms"},{key:"cronjob",label:"autonomous"}].map(item=><button key={item.key} className={`toggle-chip ${sessionFilter===item.key?"active":""}`} onClick={()=>setSessionFilter(item.key)}>{item.label}</button>)}
        </div>
        {sessionItems.map(item=><button key={item.id} className={`session-item ${sessionId===item.id?"active":""}`} onClick={()=>onLoadSession(item.id,item)}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}><span>{item.id}</span><span className="subtle">{fAgo((item.updated_at||0)*1000)}</span></div>
          <div className="subtle" style={{marginTop:4}}>{item.last_preview||"…"}</div>
        </button>)}
        {!sessionItems.length&&<div className="subtle">No saved sessions for this agent.</div>}
      </div>
      <div className="chat-shell">
        <div ref={listRef} className="chat-scroll">
          <div className="spacer"/>
          {!chatHistory.length&&<div className="empty-state">Select an agent and start issuing commands.</div>}
          {chatHistory.map((item,index)=><ChatBubble key={index} msg={item} showTools={showTools}/>)}
        </div>
        <div className="chat-input">
          <textarea ref={inputRef} value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder={`Command ${agent?.id||"agent"}...`}/>
          <div className="chat-input-actions">
            {sending?<button className="flat-btn red" onClick={stopCurrent}>Stop</button>:<button className="flat-btn blue" onClick={send}>Send</button>}
          </div>
        </div>
      </div>
    </div>
  </aside>;
}

// ═══════════ METRICS VIEW ═══════════
function MetricsView({}){
  const[metrics,setMetrics]=useState(null);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  const[lastRefresh,setLastRefresh]=useState(null);

  const fetchMetrics=useCallback(async()=>{
    try{
      const r=await fetch('/api/v1/metrics/fleet');
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const d=await r.json();
      setMetrics(d);
      setError(null);
      setLastRefresh(new Date());
    }catch(e){
      setError(e.message||'Failed to load metrics');
    }finally{
      setLoading(false);
    }
  },[]);

  useEffect(()=>{
    fetchMetrics();
    const id=setInterval(fetchMetrics,30000);
    return()=>clearInterval(id);
  },[fetchMetrics]);

  const totalAgents=metrics?.total_agents||0;
  const reachableAgents=metrics?.reachable||0;
  const agentList=metrics?.agents||[];
  const healthyCount=agentList.filter(a=>a.reachable).length;
  const unhealthyCount=agentList.length-healthyCount;

  return <div style={{padding:"16px",overflowY:"auto",height:"100%",boxSizing:"border-box"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
      <div>
        <span style={{fontSize:11,fontWeight:700,color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>Fleet Metrics</span>
        <span style={{fontSize:10,color:"rgba(255,255,255,0.2)",marginLeft:8}}>Auto-refreshes every 30s</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {lastRefresh&&<span style={{fontSize:9,color:"rgba(255,255,255,0.15)"}}>Last: {lastRefresh.toLocaleTimeString('en-US',{hour12:false})}</span>}
        <button onClick={fetchMetrics} disabled={loading} style={{padding:"4px 10px",fontSize:9,fontWeight:700,background:"rgba(129,140,248,0.08)",border:"1px solid rgba(129,140,248,0.2)",color:"#a5b4fc",borderRadius:3,cursor:"pointer",fontFamily:"'IBM Plex Mono',monospace"}}>Refresh</button>
      </div>
    </div>

    {/* Summary bar */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8,marginBottom:16}}>
      <div className="glass metric" style={{padding:"12px 14px"}}>
        <span className="metric-label">Healthy</span>
        <span className="metric-value" style={{color:"#34d399"}}>{healthyCount}/{agentList.length}</span>
        <span className="metric-sub">agents reachable</span>
      </div>
      <div className="glass metric" style={{padding:"12px 14px"}}>
        <span className="metric-label">Unreachable</span>
        <span className="metric-value" style={{color:unhealthyCount>0?"#ef4444":"#34d399"}}>{unhealthyCount}</span>
        <span className="metric-sub">agents down</span>
      </div>
      <div className="glass metric" style={{padding:"12px 14px"}}>
        <span className="metric-label">Checked</span>
        <span className="metric-value" style={{color:"#818cf8"}}>{metrics?.timestamp?"":"—"}</span>
        <span className="metric-sub">{metrics?.timestamp?new Date(metrics.timestamp).toLocaleTimeString('en-US',{hour12:false}):"pending"}</span>
      </div>
    </div>

    {/* Agent cards grid */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
      {loading&&!metrics&&<div style={{gridColumn:"1/-1",padding:"40px",textAlign:"center",color:"rgba(255,255,255,0.2)"}}>Loading fleet metrics...</div>}
      {error&&!metrics&&<div style={{gridColumn:"1/-1",padding:"40px",textAlign:"center",color:"#f87171"}}>Error: {error}</div>}
      {!loading&&!error&&agentList.length===0&&<div style={{gridColumn:"1/-1",padding:"40px",textAlign:"center",color:"rgba(255,255,255,0.2)"}}>No agents found in fleet</div>}
      {agentList.map((agent,i)=>{
        const reachable=!!agent.reachable;
        const dotColor=reachable?"#34d399":"#ef4444";
        const cardBg=reachable?"rgba(52,211,153,0.03)":"rgba(239,68,68,0.03)";
        const cardBorder=reachable?"rgba(52,211,153,0.15)":"rgba(239,68,68,0.15)";
        return <div key={agent.name||i} style={{background:cardBg,border:`1px solid ${cardBorder}`,borderRadius:8,padding:"14px 16px",display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{width:10,height:10,borderRadius:"50%",background:dotColor,boxShadow:`0 0 8px ${dotColor}60`,flexShrink:0}}/>
              <span style={{fontSize:14,fontWeight:700,color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>{agent.name||"unknown"}</span>
            </div>
            <span style={{fontSize:10,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:dotColor}}>{reachable?"UP":"DOWN"}</span>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
              <span style={{color:"rgba(255,255,255,0.35)"}}>Status</span>
              <span style={{color:reachable?"#34d399":"#ef4444",fontWeight:600}}>{reachable?"Reachable":"Unreachable"}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
              <span style={{color:"rgba(255,255,255,0.35)"}}>Response</span>
              <span style={{color:"rgba(255,255,255,0.6)"}}>{agent.metrics_bytes>0?`${agent.metrics_bytes} bytes`:"—"}</span>
            </div>
          </div>
        </div>;
      })}
    </div>

    {/* Error state when metrics load fails */}
    {error&&metrics&&<div style={{marginTop:16,padding:"12px 14px",background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.15)",borderRadius:6}}>
      <span style={{fontSize:11,color:"#f87171"}}>Warning: {error} — displaying cached data</span>
    </div>}
  </div>;
}

function App(){
  const[tab,setTab]=useState("mission");
  const[viewportWidth,setViewportWidth]=useState(window.innerWidth);
  const[chatOpen,setChatOpen]=useState(false);
  const[tgt,setTgt]=useState("ragnar");
  const[ch,setCh]=useState([]);
  const[msg,setMsg]=useState("");
  const[busy,setBusy]=useState(false);
  const[sidByA,setSidByA]=useState({});
  const[sItems,setSItems]=useState([]);
  const[sessionFilter,setSessionFilter]=useState("all");
  const[sessionMeta,setSessionMeta]=useState(null);
  const[showTools,setShowTools]=useState(false);
  const[feedCollapsed,setFeedCollapsed]=useState(false);
  const[approvals,setApprovals]=useState([]);
  const[approvalStatus,setApprovalStatus]=useState("loading");
  const[approvalBusy,setApprovalBusy]=useState({});
  const[prActionBusy,setPRActionBusy]=useState({});
  const[toast,setToast]=useState("");
  const auth=useAuth();
  const agents=usePoll('/api/v1/agents',FA,CFG.POLL);
  const fleetState=usePoll('/api/v1/fleet/state',[],5000);
  const nodes=usePoll('/api/v1/cluster/nodes',FN,10000);
  const pods=usePoll('/api/v1/cluster/pods',[],10000);
  const repos=useRepos();
  const{prs}=usePRs();
  const{data:gitops,status:gitopsStatus,refresh:refreshGitops}=useSimplePoll('/api/v1/gitops/status',{},15000);
  const{data:taskHistory,status:taskHistoryStatus}=useSimplePoll('/api/v1/history/tasks',[],15000);
  const{data:deployHistory,status:deployHistoryStatus}=useSimplePoll('/api/v1/history/deployments',[],15000);
  const{events,ok:wsOk}=useBufferedWS(tab==="mission"&&!feedCollapsed);
  const online=agents.filter(agent=>agent.status==="online").length;
  const pendingApprovals=(approvals||[]).filter(item=>item&&item.status==="pending");
  const curSid=sidByA[tgt]||localStorage.getItem(lsk(auth.user,tgt))||`hirdforge-${tgt}-${Date.now()}`;
  useEffect(()=>{const onResize=()=>setViewportWidth(window.innerWidth);window.addEventListener('resize',onResize);return()=>window.removeEventListener('resize',onResize);},[]);
  useEffect(()=>{if(!agents.some(agent=>agent.id===tgt)&&agents[0])setTgt(agents[0].id);},[agents,tgt]);
  useEffect(()=>{if(!tgt)return;setSessionMeta(null);const raw=localStorage.getItem(lck(auth.user,tgt));if(raw){try{const parsed=JSON.parse(raw);setCh(Array.isArray(parsed)?parsed.map(item=>s2u(tgt,item,auth.user)):[]);}catch{setCh([]);}}else setCh([]);
    const sid=localStorage.getItem(lsk(auth.user,tgt));if(sid){setSidByA(prev=>({...prev,[tgt]:sid}));api(`/api/v1/sessions/${sid}`,null).then(session=>{if(session?.messages){setSessionMeta({source:session.source||"",task_ref:session.task_ref||"",id:session.id||sid});setCh(session.messages.map(item=>s2u(tgt,item,auth.user,session.source)));}});}
  },[tgt,auth.user]);
  useEffect(()=>{if(tgt)localStorage.setItem(lck(auth.user,tgt),JSON.stringify(ch.map(u2s)));},[ch,tgt,auth.user]);
  useEffect(()=>{if(tgt&&sidByA[tgt])localStorage.setItem(lsk(auth.user,tgt),sidByA[tgt]);},[sidByA,tgt,auth.user]);
  useEffect(()=>{let live=true;const go=async()=>{const src=sessionFilter==="all"?"":sessionFilter;const qp=`/api/v1/sessions?agent=${encodeURIComponent(tgt)}${src?`&source=${encodeURIComponent(src)}`:""}`;const data=await api(qp,[]);if(live&&Array.isArray(data))setSItems(data);};go();const id=setInterval(go,5000);return()=>{live=false;clearInterval(id);};},[tgt,busy,sessionFilter]);
  useEffect(()=>{const event=events[0];if(!event||!event.delegated_by)return;if(event.type!=="task_complete"&&event.type!=="task_failed")return;
    const owner=event.delegated_by;const completing=(event.agent||"system").toLowerCase();const ts=Date.parse(event.timestamp||"")||Date.now();
    const cap=completing.charAt(0).toUpperCase()+completing.slice(1);
    const text=event.type==="task_complete"?`✅ ${cap} completed task: ${event.result||"(no result)"}`:`❌ ${cap} failed task: ${event.error||"unknown error"}`;
    const entry={from:owner,agent:{id:completing,name:cap,initial:cap.charAt(0),status:"online"},text,time:new Date(ts).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}),timestamp:ts,streaming:false,toolCalls:[],toolResults:[],kind:"notification",noticeLevel:event.type==="task_complete"?"success":"error",noticeAgent:completing};
    const key=lck(auth.user,owner);
    let existing=[];try{const raw=localStorage.getItem(key);if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed))existing=parsed;}}catch{}
    const serialized=u2s(entry);
    const already=existing.some(item=>item.kind==="notification"&&item.noticeAgent===serialized.noticeAgent&&item.timestamp===serialized.timestamp&&item.content===serialized.content);
    if(already)return;
    localStorage.setItem(key,JSON.stringify(existing.concat([serialized])));
    if(owner===tgt)setCh(prev=>prev.concat([entry]));
  },[events,tgt,auth.user]);
  useEffect(()=>{let live=true;const go=async()=>{try{const res=await fetch('/api/v1/approvals');if(!res.ok){if(live){setApprovals([]);setApprovalStatus("unavailable");}return;}const data=await res.json();if(live){setApprovals(Array.isArray(data?.queues)?data.queues:[]);setApprovalStatus("ready");}}catch{if(live){setApprovals([]);setApprovalStatus("unavailable");}}};go();const id=setInterval(go,10000);return()=>{live=false;clearInterval(id);};},[]);
  const showToast=text=>{setToast(text);setTimeout(()=>setToast(""),1800);};
  const setCurSid=sid=>setSidByA(prev=>({...prev,[tgt]:sid}));
  const loadSession=async(sid,meta)=>{const data=await api(`/api/v1/sessions/${sid}`,null);if(data?.messages){setCurSid(sid);setSessionMeta({source:data.source||meta?.source||"",task_ref:data.task_ref||meta?.task_ref||"",id:data.id||sid});setCh(data.messages.map(item=>s2u(tgt,item,auth.user,data.source||meta?.source)));}};
  const newConversation=()=>{setCurSid(`hirdforge-${tgt}-${Date.now()}`);setSessionMeta(null);setCh([]);};
  const clearHistory=()=>{setCh([]);localStorage.removeItem(lck(auth.user,tgt));};
  const refreshApprovals=async()=>{try{const res=await fetch('/api/v1/approvals');if(!res.ok){setApprovals([]);setApprovalStatus("unavailable");return;}const data=await res.json();setApprovals(Array.isArray(data?.queues)?data.queues:[]);setApprovalStatus("ready");}catch{setApprovals([]);setApprovalStatus("unavailable");}};
  const decideApproval=async(queueID,approved)=>{if(!queueID)return;setApprovalBusy(prev=>({...prev,[queueID]:true}));const path=approved?'/api/v1/approvals/approve':'/api/v1/approvals/reject';const out=await apiPostJSON(path,{queue_id:queueID});showToast(out?.error||(approved?"Approval granted":"Approval rejected"));await refreshApprovals();setApprovalBusy(prev=>({...prev,[queueID]:false}));};
  const handlePRAction=async(repo,index,action)=>{const key=`${repo}-${index}-${action}`;setPRActionBusy(prev=>({...prev,[key]:true}));const out=await prAction(repo,index,action);showToast(out.ok?`${action} completed for ${repo}#${index}`:(out.data?.error||`${action} failed`));setPRActionBusy(prev=>({...prev,[key]:false}));};
  if(viewportWidth<900){
    return <div className="screen-warning"><div className="screen-warning-card">Use a larger screen. Hirdforge mission control requires at least 900px of width and is designed for 1200px and above.</div></div>;
  }
  return <div className="mc-app">
    <header className="topbar">
      <div className="brand-stack">
        <div className="brand-mark"/>
        <div className="brand-copy">
          <div className="brand-title">Hirdforge</div>
          <div className="brand-sub">Valhalla cluster</div>
        </div>
      </div>
      <nav className="topnav">
        {[["mission","Mission Control"],["metrics","Metrics"],["cluster","Cluster"],["history","History"],["settings","Settings"]].map(item=><button key={item[0]} className={tab===item[0]?"active":""} onClick={()=>setTab(item[0])}>{item[1]}</button>)}
      </nav>
      <div className="hud-strip">
        <div className="hud-card"><span className={`status-dot ${wsOk?"green":"red"}`}/><div className="hud-meta"><span className="hud-label">Cluster health</span><span className="hud-note">{wsOk?"live control plane":"reconnecting events"}</span></div></div>
        <div className="hud-card"><div className="hud-value" style={{color:"var(--green)"}}>{online}/{agents.length}</div><div className="hud-meta"><span className="hud-label">Agents</span><span className="hud-note">{agents.length-online} unavailable</span></div></div>
        <div className="hud-card"><div className="hud-value" style={{color:approvalStatus==="unavailable"?"var(--amber)":(pendingApprovals.length?"var(--amber)":"var(--blue)")}}>{approvalStatus==="unavailable"?"—":pendingApprovals.length}</div><div className="hud-meta"><span className="hud-label">Awaiting sovereign</span><span className="hud-note">{approvalStatus==="unavailable"?"approval queue unavailable":`${auth.user} · ${auth.role}`}</span></div></div>
      </div>
    </header>
    <div className="main-shell">
      {tab==="mission"&&<MissionControlView agents={agents} fleetState={fleetState} approvals={approvals} approvalStatus={approvalStatus} approvalBusy={approvalBusy} onApproval={decideApproval} prs={prs} prActionBusy={prActionBusy} onPRAction={handlePRAction} events={events} feedCollapsed={feedCollapsed} onToggleFeed={()=>setFeedCollapsed(!feedCollapsed)} onOpenChat={agentName=>{setTgt(agentName);setChatOpen(true);}}/>}
      {tab==="metrics"&&<MetricsView/>}
      {tab==="cluster"&&<ClusterView nodes={nodes} pods={pods} gitops={gitops} gitopsStatus={gitopsStatus} onRefreshGitops={refreshGitops} toast={showToast}/>}
      {tab==="history"&&<HistoryView tasks={taskHistory} taskStatus={taskHistoryStatus} deployments={deployHistory} deployStatus={deployHistoryStatus} agents={agents}/>}
      {tab==="settings"&&<SettingsViewNext agents={agents} repos={repos} fleetState={fleetState} toast={showToast}/>}
    </div>
    <ChatPanel open={chatOpen} onClose={()=>setChatOpen(false)} agents={agents} target={tgt} setTarget={setTgt} chatHistory={ch} setChatHistory={setCh} msg={msg} setMsg={setMsg} sending={busy} setSending={setBusy} sessionId={curSid} setSessionId={setCurSid} sessionItems={sItems} sessionFilter={sessionFilter} setSessionFilter={setSessionFilter} onLoadSession={loadSession} onNewConversation={newConversation} onClearHistory={clearHistory} auth={auth} showTools={showTools} setShowTools={setShowTools} sessionMeta={sessionMeta}/>
    {toast&&<div style={{position:"fixed",top:76,right:20,padding:"8px 12px",background:"var(--bg-panel-2)",border:"1px solid var(--line-strong)",color:"var(--text)",zIndex:60}}>{toast}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
