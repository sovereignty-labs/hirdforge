// ═══════════════════════════════════════════════════════════
//  API LAYER
// ═══════════════════════════════════════════════════════════
async function apiFetch(path, fallback) {
  if (CONFIG.USE_MOCK) return fallback;
  try {
    const res = await fetch(CONFIG.API_BASE + path);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (path.includes('cluster/nodes') && data.items) {
      return data.items.map(n => ({
        name: n.metadata?.name || "unknown",
        ip: (n.status?.addresses?.find(a => a.type === "InternalIP") || {}).address || "—",
        role: Object.keys(n.metadata?.labels || {}).filter(l => l.startsWith("node-role")).map(l => l.split("/")[1]).join("+") || "worker",
        status: n.status?.conditions?.find(c => c.type === "Ready")?.status === "True" ? "Ready" : "NotReady",
        pods: 0, cpu_percent: 0, memory_percent: 0,
      }));
    }
    return data;
  } catch (e) {
    console.warn(`API ${path} failed:`, e.message);
    return fallback;
  }
}

function usePolledData(path, fallback, interval) {
  const [data, setData] = useState(fallback);
  useEffect(() => {
    let mounted = true;
    const poll = async () => {
      const d = await apiFetch(path, fallback);
      if (mounted) {
        if (path === '/api/v1/agents' && Array.isArray(d)) {
          const normalized = d.map(a => ({
            id: a.name || a.id,
            name: a.display_name || a.name || a.id,
            role: a.role || "Agent",
            model: a.model || "unknown",
            backend: a.backend || "unknown",
            status: a.healthy === false ? "offline" : (a.healthy ? "online" : (a.status || "offline")),
            tools: a.tools || [],
            uptime_seconds: a.uptime_seconds || 0,
            tasks_completed: a.tasks_completed || 0,
            last_action: a.last_action || "—",
            ping_ms: a.ping_ms || a.latency_ms || null,
            cpu_percent: a.cpu_percent || 0,
            memory_percent: a.memory_percent || 0,
            initial: (a.display_name || a.name || a.id || "?")[0].toUpperCase(),
          }));
          setData(normalized.length > 0 ? normalized : fallback);
        } else {
          setData(d);
        }
      }
    };
    poll();
    const id = setInterval(poll, interval || CONFIG.POLL_INTERVAL);
    return () => { mounted = false; clearInterval(id); };
  }, [path]);
  return data;
}

function useEventStream() {
  const [events, setEvents] = useState([]);
  const [connected, setConnected] = useState(false);
  useEffect(() => {
    if (CONFIG.USE_MOCK) return;
    const wsUrl = CONFIG.WS_URL || `${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/events`;
    let ws;
    let retryDelay = 3000;
    const connect = () => {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => { setConnected(true); retryDelay = 3000; };
      ws.onclose = () => { setConnected(false); retryDelay = Math.min(retryDelay * 2, 30000); setTimeout(connect, retryDelay); };
      ws.onmessage = (e) => {
        try {
          const evt = JSON.parse(e.data);
          setEvents(prev => [evt, ...prev].slice(0, 100));
        } catch {}
      };
    };
    connect();
    return () => ws?.close();
  }, []);
  return { events, connected };
}

// ═══════════════════════════════════════════════════════════
//  CHAT API — with replace event support
// ═══════════════════════════════════════════════════════════
async function streamChat(agentId, message, onChunk, onReplace, onToolCall, onToolResult, onDone, onError) {
  try {
    const res = await fetch(`${CONFIG.API_BASE}/api/v1/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent: agentId, content: message, session_id: "hirdforge-" + Date.now() }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({error: res.statusText}));
      onError(`Error: ${err.error || res.statusText}`);
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const chunk = JSON.parse(line.slice(6));
          if (chunk.type === 'content' && chunk.content) onChunk(chunk.content);
          else if (chunk.type === 'replace' && chunk.content) onReplace(chunk.content);
          else if (chunk.type === 'tool_call') onToolCall(chunk.tool || 'tool', chunk.args);
          else if (chunk.type === 'tool_result') onToolResult(chunk.tool || 'tool', chunk.result);
          if (chunk.done) { onDone(); return; }
        } catch {}
      }
    }
    onDone();
  } catch (e) {
    onError(`Failed to reach ${agentId}: ${e.message}`);
  }
}

};

const CommsView = ({agents, events, wsConnected, chatHistory, setChatHistory, msg, setMsg, target, setTarget, sending, setSending}) => {

  const ta = agents.find(a => a.id === target) || FALLBACK_AGENTS[0];
  const tc = AGENT_COLORS[target] || "#818cf8";

  const scrollBottom = useCallback(() => {
    if (messagesEl.current) {
      messagesEl.current.scrollTop = messagesEl.current.scrollHeight;
    }
  }, []);

  useEffect(() => { requestAnimationFrame(scrollBottom); }, [chatHistory]);

  const handleSend = async () => {
    if (!msg.trim() || sending) return;
    const userMsg = {from:"kit",agent:{id:"kit",name:"Kit (Sovereign)",initial:"K",status:"online"},text:msg,time:new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}),toolCalls:[],toolResults:[]};

    setChatHistory(prev => [...prev, userMsg]);
    setMsg("");
    setSending(true);
    if (textareaEl.current) { textareaEl.current.style.height = '56px'; }
    const timeStr = new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'});
    setChatHistory(prev => [...prev, {from:target,agent:ta,text:"",time:timeStr,streaming:true,toolCalls:[],toolResults:[]}]);

    await streamChat(target, sentMsg,
      // onChunk
      (chunk) => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.text = (last.text||"") + chunk;
          u[u.length-1] = last; return u;
        });
        requestAnimationFrame(scrollBottom);
      },
      // onReplace — swap entire content (think tag cleanup)
      (cleaned) => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.text = cleaned;
          u[u.length-1] = last; return u;
        });
      },
      // onToolCall
      (tool, args) => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.toolCalls = [...(last.toolCalls||[]), {tool, args}];
          u[u.length-1] = last; return u;
        });
        requestAnimationFrame(scrollBottom);
      },
      // onToolResult
      (tool, result) => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.toolResults = [...(last.toolResults||[]), {tool, result}];
          u[u.length-1] = last; return u;
        });
        requestAnimationFrame(scrollBottom);
      },
      // onDone
      () => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.streaming = false;
          if (!last.text && !(last.toolCalls||[]).length) last.text = "(empty response)";
          u[u.length-1] = last; return u;
        });
        setSending(false);
      },
      // onError
      (err) => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.text = err; last.streaming = false;
          u[u.length-1] = last; return u;
        });
        setSending(false);
      }
    );
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  const handleInput = (e) => {
    setMsg(e.target.value);
    // Auto-resize textarea
    const el = e.target;
    el.style.height = '56px';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  };

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 420px",height:"100%"}}>
      {/* CHAT PANE */}
      <div style={{display:"flex",flexDirection:"column",borderRight:"1px solid rgba(255,255,255,0.04)",height:"100%",minHeight:0}}>
        {/* Agent selector — STICKY */}
        <div style={{display:"flex",alignItems:"center",gap:0,borderBottom:"1px solid rgba(255,255,255,0.04)",background:"rgba(0,0,0,0.15)",flexShrink:0,flexWrap:"wrap"}}>
          {agents.map(a => {
            const ac = AGENT_COLORS[a.id]; const sel = target===a.id;
            return (
              <button key={a.id} onClick={()=>setTarget(a.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"10px 16px",background:sel?`${ac}08`:"transparent",border:"none",borderBottom:sel?`2px solid ${ac}`:"2px solid transparent",cursor:"pointer",transition:"all 0.15s"}}>
                <AgentAvatar agent={a} size={22} showStatus={false} />
                <span style={{fontSize:11,fontWeight:sel?700:400,color:sel?ac:"rgba(255,255,255,0.3)",fontFamily:"'IBM Plex Mono',monospace"}}>{(a.name||a.id).split(' ')[0]}</span>
              </button>
            );
          })}
          <div style={{marginLeft:"auto",padding:"0 14px"}}>
            <button style={{padding:"6px 14px",fontSize:9,fontWeight:700,letterSpacing:"0.12em",background:"linear-gradient(135deg,rgba(251,191,36,0.12),rgba(251,191,36,0.04))",border:"1px solid rgba(251,191,36,0.2)",color:"#fbbf24",cursor:"pointer",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>⚡ Broadcast</button>
          </div>
        </div>

        {/* Context strip */}
        <div style={{display:"flex",alignItems:"center",gap:12,padding:"8px 18px",background:`linear-gradient(90deg, ${tc}06, transparent)`,borderBottom:"1px solid rgba(255,255,255,0.03)",flexShrink:0}}>
          <AgentAvatar agent={ta} size={26} />
          <div style={{flex:1}}><span style={{fontSize:12,fontWeight:700,color:tc}}>{ta.name}</span><span style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginLeft:8}}>{ta.role}</span></div>
          <Badge text={ta.model} color={tc} />
          <span style={{fontSize:10,color:"rgba(255,255,255,0.25)",fontFamily:"'IBM Plex Mono',monospace"}}>{ta.ping_ms?`${ta.ping_ms}ms`:"—"}</span>
        </div>

        {/* Messages — SCROLLABLE */}
        <div ref={messagesEl} style={{flex:1,overflowY:"auto",scrollBehavior:"smooth",padding:"20px",display:"flex",flexDirection:"column",gap:20,minHeight:0}}>
          {chatHistory.length === 0 && (
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:12,opacity:0.3}}>
              <span style={{fontSize:32,fontFamily:"'Space Grotesk',sans-serif",fontWeight:800,color:tc}}>⚔</span>
              <span style={{fontSize:12,color:"rgba(255,255,255,0.3)"}}>Command the warband</span>
            </div>
          )}
          {chatHistory.map((m,i) => <ChatBubble key={i} msg={m} />)}
          {sending && chatHistory.length > 0 && chatHistory[chatHistory.length-1].text === "" && !(chatHistory[chatHistory.length-1].toolCalls||[]).length && (
            <div style={{display:"flex",gap:12,alignItems:"center",opacity:0.6,paddingLeft:4}}>
              <AgentAvatar agent={ta} size={22} showStatus={false} />
              <Glass style={{padding:"8px 14px",display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:10,color:tc,fontWeight:600}}>{ta.name.split(' ')[0]}</span>
                <TypingIndicator color={tc} />
              </Glass>
            </div>
          )}
        </div>

        {/* Input — TALLER TEXTAREA */}
        <div style={{padding:"12px 18px",borderTop:"1px solid rgba(255,255,255,0.04)",background:"linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.25))",display:"flex",gap:8,flexShrink:0,alignItems:"flex-end"}}>
          <textarea ref={textareaEl} value={msg} onChange={handleInput} onKeyDown={handleKeyDown} placeholder={`Command ${ta.name}...`} rows={2}
            style={{flex:1,background:"rgba(255,255,255,0.02)",border:`1px solid ${tc}15`,padding:"14px 18px",color:"#e2e8f0",fontSize:13,fontFamily:"'IBM Plex Mono',monospace",outline:"none",lineHeight:1.5,minHeight:56,maxHeight:140,overflowY:"auto"}} />
          <button onClick={handleSend} disabled={sending} style={{padding:"14px 28px",background:`linear-gradient(135deg, ${tc}30, ${tc}15)`,border:`1px solid ${tc}40`,color:tc,fontSize:11,fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,cursor:sending?"wait":"pointer",letterSpacing:"0.14em",textTransform:"uppercase",boxShadow:`0 0 24px ${tc}15`,alignSelf:"stretch",minHeight:56,opacity:sending?0.5:1}}>SEND</button>
        </div>
      </div>

      {/* EVENT STREAM — WIDER */}
      <div style={{display:"flex",flexDirection:"column",background:"rgba(0,0,0,0.2)",height:"100%",minHeight:0}}>
        <div style={{padding:"12px 16px",borderBottom:"1px solid rgba(255,255,255,0.04)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:wsConnected?"#ef4444":"#6b7280",animation:wsConnected?"rec-pulse 1.5s ease infinite":"none"}} />
            <span style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.35)",letterSpacing:"0.16em",textTransform:"uppercase"}}>{wsConnected?"Live Feed":"Disconnected"}</span>
          </div>
          <span style={{fontSize:10,color:"rgba(255,255,255,0.15)",fontFamily:"'IBM Plex Mono',monospace"}}>{events.length} events</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:1,padding:"1px",borderBottom:"1px solid rgba(255,255,255,0.04)",flexShrink:0}}>
          {[{l:"DELEGATES",val:events.filter(e=>e.type==="delegate").length,c:"#818cf8"},{l:"GIT OPS",val:events.filter(e=>e.type==="git").length,c:"#34d399"},{l:"ALERTS",val:events.filter(e=>e.type==="alert").length,c:"#fbbf24"}].map(s=>(
            <div key={s.l} style={{padding:"10px 12px",background:"rgba(0,0,0,0.15)",textAlign:"center"}}>

            </div>

        ) : events.map((e,i)=><EventEntry key={i} event={e} idx={i} />)}</div>
      </div>
    </div>
  );
};

          </div>
        </div>
      </div>
    </div>
  </div>
);

// ═══════════════════════════════════════════════════════════
//  MAIN APP
// ═══════════════════════════════════════════════════════════
const Tab = ({active,label,count,onClick}) => (
  <button onClick={onClick} style={{background:"none",border:"none",position:"relative",color:active?"#e2e8f0":"rgba(255,255,255,0.25)",padding:"14px 0",marginRight:28,cursor:"pointer",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",fontWeight:active?700:400,letterSpacing:"0.14em",textTransform:"uppercase",transition:"all 0.15s"}}>
    <span>{label}</span>
    {count && <span style={{marginLeft:6,fontSize:10,fontWeight:700,color:active?"#818cf8":"rgba(255,255,255,0.12)"}}>{count}</span>}
    {active && <div style={{position:"absolute",bottom:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#818cf8,#818cf800)",boxShadow:"0 0 8px rgba(129,140,248,0.3)"}} />}
  </button>
);

function App() {
  const [tab, setTab] = useState("comms");
  const [selected, setSelected] = useState(0);
  const [chatHistory, setChatHistory] = useState([]);
  const [msg, setMsg] = useState("");
  const [target, setTarget] = useState("ragnar");
  const [sending, setSending] = useState(false);

  const agents = usePolledData('/api/v1/agents', FALLBACK_AGENTS, CONFIG.POLL_INTERVAL);
  const nodes = usePolledData('/api/v1/cluster/nodes', FALLBACK_NODES, CONFIG.POLL_INTERVAL * 2);
  const pods = usePolledData('/api/v1/cluster/pods', [], CONFIG.POLL_INTERVAL * 2);
  const commits = usePolledData('/api/v1/gitea/commits', [], CONFIG.POLL_INTERVAL * 3);
  const { events, connected: wsConnected } = useEventStream();

  const online = agents.filter(a => a.status === "online").length;

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* TOP BAR */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",height:48,minHeight:48,borderBottom:"1px solid rgba(255,255,255,0.04)",background:"linear-gradient(90deg,rgba(10,10,20,0.95),rgba(6,6,16,0.95))",position:"relative"}}>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:1,background:"linear-gradient(90deg,transparent,rgba(99,102,241,0.12),transparent)"}} />
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:9,height:9,background:"#818cf8",boxShadow:"0 0 14px rgba(129,140,248,0.5)",borderRadius:1}} />
            <span style={{fontSize:14,fontWeight:800,letterSpacing:"0.22em",color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>HIRDFORGE</span>
          </div>
          <div style={{width:1,height:20,background:"rgba(255,255,255,0.05)"}} />
          <span style={{fontSize:10,color:"rgba(255,255,255,0.18)",letterSpacing:"0.12em"}}>VALHALLA CLUSTER</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:18}}>
          {[{l:"CLUSTER",s:"online"},{l:"ARGOCD",s:"online"},{l:"GITEA",s:"online"}].map(x=>(
            <div key={x.l} style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"rgba(255,255,255,0.25)"}}>
              <GlowPip status={x.s} size={5} /><span>{x.l}</span>
            </div>
          ))}
          <div style={{width:1,height:20,background:"rgba(255,255,255,0.05)"}} />
          <span style={{fontSize:12,fontFamily:"'Space Grotesk',sans-serif"}}>
            <span style={{color:"#34d399",fontWeight:700}}>{online}</span>
            <span style={{color:"rgba(255,255,255,0.15)"}}> / {agents.length}</span>
          </span>
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",padding:"0 20px",borderBottom:"1px solid rgba(255,255,255,0.04)",background:"rgba(0,0,0,0.12)",flexShrink:0}}>
        <Tab active={tab==="comms"} label="Comms" count={String(events.length)} onClick={()=>setTab("comms")} />
        <Tab active={tab==="fleet"} label="Warriors" count={String(agents.length)} onClick={()=>setTab("fleet")} />
        <Tab active={tab==="ops"} label="Realm" onClick={()=>setTab("ops")} />
      </div>

      {/* CONTENT */}
      <div style={{flex:1,overflow:"hidden",minHeight:0}}>
        {tab==="fleet" && <FleetView agents={agents} selected={selected} setSelected={setSelected} />}
        {tab==="ops" && <OpsView agents={agents} nodes={nodes} pods={pods} commits={commits} />}
        {tab==="comms" && <CommsView agents={agents} events={events} wsConnected={wsConnected} chatHistory={chatHistory} setChatHistory={setChatHistory} msg={msg} setMsg={setMsg} target={target} setTarget={setTarget} sending={sending} setSending={setSending} />}
      </div>

      {/* STATUS BAR */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",height:28,minHeight:28,borderTop:"1px solid rgba(255,255,255,0.03)",background:"rgba(0,0,0,0.3)",fontSize:10,color:"rgba(255,255,255,0.2)",flexShrink:0}}>
        <div style={{display:"flex",gap:18}}>
          <span>{(pods||[]).length} pods</span>
          <span>{nodes.length} nodes</span>
          <span>{agents.length} agents</span>
        </div>
        <div style={{display:"flex",gap:18}}>
          <span>WS: <span style={{color:wsConnected?"#34d399":"#ef4444"}}>{wsConnected?"connected":"reconnecting"}</span></span>
          <span>ArgoCD: <span style={{color:"#34d399"}}>Healthy</span></span>
          <span style={{color:"rgba(255,255,255,0.12)"}}>v0.7.0-s7</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
