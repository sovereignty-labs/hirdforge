        {[{l:"Submitted",v:byStatus.submitted||0,c:"#818cf8"},{l:"Working",v:byStatus.working||0,c:"#22d3ee"},{l:"Completed",v:byStatus.completed||0,c:"#34d399"},{l:"Failed",v:byStatus.failed||0,c:"#ef4444"},{l:"Cancelled",v:byStatus.cancelled||0,c:"#fbbf24"}].map(m=><div key={m.l} className="metric" style={{padding:"8px 10px"}}><span className="metric-label">{m.l}</span><span className="metric-value" style={{color:m.c}}>{m.v}</span></div>)}
      </div>
      {byAgent.length>0&&<div><div style={{fontSize:9,color:"rgba(255,255,255,0.2)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:4}}>By Agent</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{byAgent.map(a=><Badge key={a.agent||a.name||"?"} text={`${a.agent||a.name}: ${a.count||0}`} color="#818cf8"/> )}</div></div>}
    </div>;
  };

  const renderPRs=d=>{
    const byAuthor=(d?.by_author||[]);
    return<div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))",gap:6,marginBottom:10}}>
        {[{l:"Open",v:d?.open||0,c:"#fbbf24"},{l:"Merged Today",v:d?.merged_today||0,c:"#34d399"},{l:"This Week",v:d?.merged_this_week||0,c:"#22d3ee"}].map(m=><div key={m.l} className="metric" style={{padding:"8px 10px"}}><span className="metric-label">{m.l}</span><span className="metric-value" style={{color:m.c}}>{m.v}</span></div>)}
      </div>
      {byAuthor.length>0&&<div><div style={{fontSize:9,color:"rgba(255,255,255,0.2)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:4}}>By Author</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{byAuthor.map(a=><Badge key={a.author||"?"} text={`${a.author}: ${a.count||0}`} color="#c084fc"/> )}</div></div>}
    </div>;
  };

  const renderBranches=d=>{
    const byRepo=(d?.by_repo||[]);
    if(byRepo.length===0)return<div style={{fontSize:11,color:"rgba(255,255,255,0.2)"}}>No stale branch data available.</div>;
    return<div>
      {byRepo.map(r=>{
        const total=r.total||0;const stale=r.stale||0;const pct=total>0?Math.round((stale/total)*100):0;
        return<div key={r.repo||r.name||"?"} style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
            <span style={{fontSize:11,color:"#e2e8f0",fontWeight:600}}>{r.repo||r.name}</span>
            <span style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>{stale} stale / {total} total</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div className="bar-track" style={{flex:1}}><div className="bar-fill" style={{width:`${pct}%`,background:pct>50?"#ef4444":pct>25?"#fbbf24":"#34d399"}}/></div>
            <span style={{fontSize:9,color:"rgba(255,255,255,0.3)",minWidth:30,textAlign:"right"}}>{pct}%</span>
          </div>
        </div>;
      })}
    </div>;
  };

  const renderFleetState=d=>{
    const states=Array.isArray(d)?d:(d?.agents||[]);
    return<div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:6,marginBottom:10}}>
        {[{l:"Active",v:states.filter(s=>s.active&&!s.paused).length,c:"#22c55e"},{l:"Idle",v:states.filter(s=>!s.active&&!s.paused).length,c:"#6b7280"},{l:"Paused",v:states.filter(s=>s.paused).length,c:"#f59e0b"}].map(m=><div key={m.l} className="metric" style={{padding:"8px 10px"}}><span className="metric-label">{m.l}</span><span className="metric-value" style={{color:m.c}}>{m.v}</span></div>)}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:3}}>{states.map(s=><div key={s.name||s.id||"?"} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",background:"rgba(255,255,255,0.015)",borderRadius:4}}>
        <Pip status={s.active&&!s.paused?"online":s.paused?"degraded":"offline"} size={5}/>
        <span style={{fontSize:11,color:"#e2e8f0",fontWeight:600,flex:1}}>{s.name||s.id}</span>
        <span style={{fontSize:9,color:"rgba(255,255,255,0.25)"}}>{s.active&&!s.paused?"Active":s.paused?"Paused":"Idle"}</span>
        {s.task_ref&&<span style={{fontSize:9,color:"rgba(255,255,255,0.15)",overflow:"hidden",textOverflow:"ellipsis",maxWidth:100}}>{s.task_ref}</span>}
      </div>)}</div>
    </div>;
  };

  return<div style={{padding:"16px",overflowY:"auto",height:"100%",boxSizing:"border-box"}}>
    <div style={{marginBottom:16}}><span style={{fontSize:11,fontWeight:700,color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>Platform Health</span><span style={{fontSize:10,color:"rgba(255,255,255,0.2)",marginLeft:8}}>Auto-refreshes every 30s</span></div>
    <HealthCard title="Fleet + Cluster" endpoint="/health/summary" render={renderSummary}/>
    <HealthCard title="Seidr Memory" endpoint="/health/seidr" render={renderSeidr}/>
    <HealthCard title="Task Board" endpoint="/health/tasks" render={renderTasks}/>
    <HealthCard title="PR Velocity" endpoint="/health/prs" render={renderPRs}/>
    <HealthCard title="Stale Branches" endpoint="/health/branches" render={renderBranches}/>
    <HealthCard title="Agent State" endpoint="/fleet/state" render={renderFleetState}/>
  </div>;
};

// ═══════════ APP ═══════════
const Tab=({active,label,count,onClick})=><button onClick={onClick} style={{background:"none",border:"none",color:active?"#e2e8f0":"rgba(255,255,255,0.22)",padding:"10px 0",marginRight:22,fontSize:11,fontFamily:"'IBM Plex Mono',monospace",fontWeight:active?700:400,letterSpacing:".1em",textTransform:"uppercase",borderBottom:active?"2px solid #818cf8":"2px solid transparent"}}>{label}{count!=null&&<span style={{marginLeft:4,fontSize:10,color:active?"#818cf8":"rgba(255,255,255,0.1)"}}>{count}</span>}</button>;


const lck=(u,a)=>`hirdforge-chat-${u}-${a}`;const lsk=(u,a)=>`hirdforge-session-${u}-${a}`;
const u2s=m=>({role:m.from==="kit"?"user":"assistant",content:m.text||"",timestamp:m.timestamp||Date.now(),kind:m.kind,noticeLevel:m.noticeLevel,noticeAgent:m.noticeAgent});
const s2u=(a,m,uname,source)=>{const u=m.role==="user";const aid=u?"kit":(m.noticeAgent||a);const auto=source==="cronjob";
  return{from:u?"kit":a,agent:u?{id:"kit",name:auto?"CronJob":`${uname||'Sovereign'}`,initial:auto?"C":((uname||'S')[0]?.toUpperCase()||"S"),status:"online"}:{id:aid,name:aid,initial:(aid||"?")[0]?.toUpperCase()||"?",status:"online"},text:m.content||"",time:new Date(m.timestamp||Date.now()).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}),timestamp:m.timestamp||Date.now(),streaming:false,toolCalls:[],toolResults:[],kind:m.kind,noticeLevel:m.noticeLevel,noticeAgent:m.noticeAgent};};

function App(){
  const[tab,setTab]=useState("comms");const[sel,setSel]=useState(0);
  const[ch,setCh]=useState([]);const[msg,setMsg]=useState("");const[tgt,setTgt]=useState("ragnar");const[busy,setBusy]=useState(false);
  const[sidByA,setSidByA]=useState({});const[sItems,setSItems]=useState([]);const[toast,setToast]=useState("");
  const[sessionFilter,setSessionFilter]=useState("all");const[sessionMeta,setSessionMeta]=useState(null);
  const[approvals,setApprovals]=useState([]);const[approvalsOpen,setApprovalsOpen]=useState(false);const[approvalBusy,setApprovalBusy]=useState({});
  const[termOpen,setTermOpen]=useState(true);const[termH,setTermH]=useState(200);
  const auth=useAuth();

  const agents=usePoll('/api/v1/agents',FA,CFG.POLL);
  const fleetState=usePoll('/api/v1/fleet/state',[],5000);
  const nodes=usePoll('/api/v1/cluster/nodes',FN,CFG.POLL*2);
  const pods=usePoll('/api/v1/cluster/pods',[],CFG.POLL*2);
  const commits=usePoll('/api/v1/gitea/commits',[],CFG.POLL*3);
  const k8sEvents=usePoll('/api/v1/k8s/events',[],CFG.POLL*2);
  const{ev:events,ok:wsOk}=useWS();
  const{prs}=usePRs();const repos=useRepos();
  const online=agents.filter(a=>a.status==="online").length;
  const openPRCount=(prs||[]).filter(p=>p.state==='open').length;
  const pendingApprovals=(approvals||[]).filter(q=>q&&q.status==="pending");
  const approvalsCount=pendingApprovals.length;
  const curSid=sidByA[tgt]||localStorage.getItem(lsk(auth.user,tgt))||`hirdforge-${tgt}-${Date.now()}`;

  useEffect(()=>{if(!tgt)return;setSessionMeta(null);const r=localStorage.getItem(lck(auth.user,tgt));if(r){try{const p=JSON.parse(r);setCh(Array.isArray(p)?p.map(m=>s2u(tgt,m,auth.user)):[]);}catch{setCh([]);}}else setCh([]);
    const sid=localStorage.getItem(lsk(auth.user,tgt));if(sid){setSidByA(p=>({...p,[tgt]:sid}));api(`/api/v1/sessions/${sid}`,null).then(s=>{if(s?.messages){setSessionMeta({source:s.source||"",task_ref:s.task_ref||"",id:s.id||sid});setCh(s.messages.map(m=>s2u(tgt,m,auth.user,s.source)));}});}
  },[tgt,auth.user]);
  useEffect(()=>{if(tgt)localStorage.setItem(lck(auth.user,tgt),JSON.stringify(ch.map(u2s)));},[ch,tgt,auth.user]);
  useEffect(()=>{if(tgt&&sidByA[tgt])localStorage.setItem(lsk(auth.user,tgt),sidByA[tgt]);},[sidByA,tgt,auth.user]);
  useEffect(()=>{let m=true;const go=async()=>{const src=sessionFilter==="all"?"":sessionFilter;const qp=`/api/v1/sessions?agent=${encodeURIComponent(tgt)}${src?`&source=${encodeURIComponent(src)}`:""}`;const a=await api(qp,[]);if(m&&Array.isArray(a))setSItems(a);};go();const id=setInterval(go,5000);return()=>{m=false;clearInterval(id);};},[tgt,busy,sessionFilter]);
  useEffect(()=>{const e=events[0];if(!e||!e.delegated_by)return;if(e.type!=="task_complete"&&e.type!=="task_failed")return;
    const owner=e.delegated_by;const completing=(e.agent||"system").toLowerCase();const ts=Date.parse(e.timestamp||"")||Date.now();
    const cap=completing.charAt(0).toUpperCase()+completing.slice(1);
    const text=e.type==="task_complete"?`✅ ${cap} completed task: ${e.result||"(no result)"}`:`❌ ${cap} failed task: ${e.error||"unknown error"}`;
    const entry={from:owner,agent:{id:completing,name:cap,initial:cap.charAt(0),status:"online"},text,time:new Date(ts).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}),timestamp:ts,streaming:false,toolCalls:[],toolResults:[],kind:"notification",noticeLevel:e.type==="task_complete"?"success":"error",noticeAgent:completing};
    const key=lck(auth.user,owner);
    let existing=[];try{const raw=localStorage.getItem(key);if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed))existing=parsed;}}catch{}
    const serialized=u2s(entry);
    const already=existing.some(m=>m.kind==="notification"&&m.noticeAgent===serialized.noticeAgent&&m.timestamp===serialized.timestamp&&m.content===serialized.content);
    if(already)return;
    localStorage.setItem(key,JSON.stringify([...existing,serialized]));
    if(owner===tgt)setCh(p=>[...p,entry]);
  },[events,tgt,auth.user]);
  useEffect(()=>{let m=true;const go=async()=>{try{const r=await fetch('/api/v1/approvals');if(!r.ok)throw new Error();const d=await r.json();if(!m)return;const qs=Array.isArray(d?.queues)?d.queues:[];setApprovals(qs);}catch{if(m)setApprovals([]);}};go();const id=setInterval(go,10000);return()=>{m=false;clearInterval(id);};},[]);

  const setCurSid=s=>setSidByA(p=>({...p,[tgt]:s}));
  const loadSess=async(s,meta)=>{const d=await api(`/api/v1/sessions/${s}`,null);if(d?.messages){setCurSid(s);setSessionMeta({source:d.source||meta?.source||"",task_ref:d.task_ref||meta?.task_ref||"",id:d.id||s});setCh(d.messages.map(m=>s2u(tgt,m,auth.user,d.source||meta?.source)));}};
  const newConv=()=>{setCurSid(`hirdforge-${tgt}-${Date.now()}`);setSessionMeta(null);setCh([]);};
  const clearH=()=>{setCh([]);localStorage.removeItem(lck(auth.user,tgt));};
  const eStop=async()=>{await apiPost('/api/v1/agents/stop-all');setBusy(false);setCh(p=>{if(!p.length)return p;const u=[...p];const l={...u[u.length-1]};if(l.streaming){l.streaming=false;l.text=(l.text?l.text+"\n":"")+"[Stopped by Sovereign]";u[u.length-1]=l;}return u;});setToast("All agents stopped");setTimeout(()=>setToast(""),1800);};
  const refreshApprovals=async()=>{try{const r=await fetch('/api/v1/approvals');if(!r.ok)throw new Error();const d=await r.json();setApprovals(Array.isArray(d?.queues)?d.queues:[]);}catch{setApprovals([]);}};
  const decideApproval=async(queueID,approved)=>{if(!queueID)return;setApprovalBusy(p=>({...p,[queueID]:true}));const path=approved?'/api/v1/approvals/approve':'/api/v1/approvals/reject';const out=await apiPostJSON(path,{queue_id:queueID});if(out?.error){setToast(out.error);}else{setToast(approved?"Approval granted":"Approval rejected");setTimeout(()=>setToast(""),1500);}await refreshApprovals();setApprovalBusy(p=>({...p,[queueID]:false}));};
  const summarizeApprovalParams=params=>{try{const txt=JSON.stringify(params||{});return txt.length>120?txt.slice(0,120)+"…":txt;}catch{return "{}";}};
  const queueInjection=(agent,content,session_id)=>apiPostJSON(`/api/v1/agents/${encodeURIComponent(agent)}/inject`,{content,session_id});
  const togglePause=async(agentName,isPaused)=>{if(!agentName)return;const path=isPaused?`/api/v1/agents/${encodeURIComponent(agentName)}/resume`:`/api/v1/agents/${encodeURIComponent(agentName)}/pause`;const out=await apiPost(path);if(out?.error){setToast(out.error);}else{setToast(`${agentName} ${isPaused?"resumed":"paused"}`);}setTimeout(()=>setToast(""),1400);};
  const showToast=t=>{setToast(t);setTimeout(()=>setToast(""),1800);};

  return<div className="app">
    <div className="header">
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:8,height:8,background:"#818cf8",boxShadow:"0 0 12px rgba(129,140,248,0.5)",borderRadius:1}}/><span style={{fontSize:14,fontWeight:800,letterSpacing:".18em",color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>HIRDFORGE</span></div>
        <div style={{width:1,height:16,background:"rgba(255,255,255,0.06)"}}/><span style={{fontSize:10,color:"rgba(255,255,255,0.18)",letterSpacing:".1em"}}>VALHALLA CLUSTER</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        {[{l:"CLUSTER",s:"online"},{l:"ARGOCD",s:"online"},{l:"GITEA",s:"online"}].map(x=><div key={x.l} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"rgba(255,255,255,0.22)"}}><Pip status={x.s} size={4}/><span>{x.l}</span></div>)}
        {approvalsCount>0&&<button onClick={()=>setApprovalsOpen(v=>!v)} style={{display:"flex",alignItems:"center",gap:5,padding:"3px 8px",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:3,fontSize:10,fontWeight:700,color:"#f87171",fontFamily:"'IBM Plex Mono',monospace"}} title="Pending write approvals">🛡 {approvalsCount}</button>}
        {openPRCount>0&&<button onClick={()=>{setTab('realm');}} style={{display:"flex",alignItems:"center",gap:4,padding:"3px 8px",background:"rgba(251,191,36,0.08)",border:"1px solid rgba(251,191,36,0.25)",borderRadius:3,fontSize:10,fontWeight:700,color:"#fbbf24",fontFamily:"'IBM Plex Mono',monospace",animation:"forge-glow 2s ease infinite"}} title="Open pull requests awaiting review">⚔ {openPRCount} PR{openPRCount>1?'s':''}</button>}

        <div style={{width:1,height:16,background:"rgba(255,255,255,0.06)"}}/>
        <div style={{display:"flex",alignItems:"center",gap:6}}>

        <div style={{width:1,height:16,background:"rgba(255,255,255,0.06)"}}/><span style={{fontSize:12,fontFamily:"'Space Grotesk',sans-serif"}}><span style={{color:"#34d399",fontWeight:700}}>{online}</span><span style={{color:"rgba(255,255,255,0.12)"}}> / {agents.length}</span></span>
      </div>
      {approvalsOpen&&<div style={{position:"absolute",top:44,right:16,width:420,maxHeight:420,overflowY:"auto",background:"rgba(7,9,16,0.98)",border:"1px solid rgba(248,113,113,0.28)",borderRadius:6,boxShadow:"0 12px 32px rgba(0,0,0,0.45)",padding:10,zIndex:200}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><span style={{fontSize:11,fontWeight:700,color:"#fca5a5",letterSpacing:".08em",textTransform:"uppercase"}}>Pending Approvals</span><button onClick={()=>setApprovalsOpen(false)} style={{background:"transparent",border:"none",color:"rgba(255,255,255,0.35)",fontSize:14}}>×</button></div>
        {pendingApprovals.length===0&&<div style={{fontSize:11,color:"rgba(255,255,255,0.32)",padding:"6px 2px"}}>No pending approvals.</div>}
        {pendingApprovals.map((q,idx)=><div key={q.queue_id||idx} style={{border:"1px solid rgba(255,255,255,0.07)",background:"rgba(255,255,255,0.02)",borderRadius:5,padding:8,marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8,marginBottom:4}}><span style={{fontSize:11,color:"#e5e7eb",fontWeight:700}}>{q.action||"unknown_tool"}</span><span style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>{fAgo(q.queued_at)}</span></div>

          </div>
        </div>)}
      </div>}
    </div>
    <div className="tabs">
      <Tab active={tab==="comms"} label="Comms" count={events.length} onClick={()=>setTab("comms")}/>
      <Tab active={tab==="fleet"} label="Warriors" count={agents.length} onClick={()=>setTab("fleet")}/>
      <Tab active={tab==="realm"} label="Realm" onClick={()=>setTab("realm")}/>
      <Tab active={tab==="health"} label="Health" onClick={()=>setTab("health")}/>
      <Tab active={tab==="settings"} label="⚙ Settings" onClick={()=>setTab("settings")}/>

        <button onClick={()=>setTermOpen(!termOpen)} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 10px",background:termOpen?"rgba(34,211,238,0.06)":"transparent",border:`1px solid ${termOpen?"rgba(34,211,238,0.15)":"rgba(255,255,255,0.05)"}`,borderRadius:3,fontSize:9,fontWeight:700,color:termOpen?"#22d3ee":"rgba(255,255,255,0.25)",letterSpacing:".06em",fontFamily:"'IBM Plex Mono',monospace"}}>⚡ TERMINAL</button>
      </div>
    </div>
    <div className="body">

        {tab==="comms"&&<CommsView agents={agents} events={events} wsConnected={wsOk} chatHistory={ch} setChatHistory={setCh} msg={msg} setMsg={setMsg} target={tgt} setTarget={setTgt} sending={busy} setSending={setBusy} sessionId={curSid} setSessionId={setCurSid} sessionItems={sItems} sessionFilter={sessionFilter} setSessionFilter={setSessionFilter} onLoadSession={loadSess} onNewConversation={newConv} onClearHistory={clearH} onEmergencyStop={eStop} auth={auth} fleetState={fleetState} onTogglePause={togglePause} onQueueInjection={queueInjection} showToast={showToast} sessionMeta={sessionMeta}/>}
        {tab==="fleet"&&<FleetView agents={agents} selected={sel} setSelected={setSel} fleetState={fleetState} onTogglePause={togglePause}/>}
        {tab==="realm"&&<RealmView agents={agents} nodes={nodes} pods={pods} commits={commits} k8sEvents={k8sEvents} prs={prs} repos={repos}/>}
        {tab==="health"&&<HealthView agents={agents} fleetState={fleetState}/>}
        {tab==="settings"&&<SettingsView agents={agents}/>}
      </div>

        <div className="terminal-header" onClick={()=>setTermOpen(false)}>
          <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:9,fontWeight:700,color:"#22d3ee",letterSpacing:".1em"}}>⚡ FORGE TERMINAL</span><span style={{fontSize:9,color:"rgba(255,255,255,0.12)"}}>forge@valhalla</span></div>
          <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:9,color:"rgba(255,255,255,0.12)"}}>@{tgt}</span><span style={{fontSize:11,color:"rgba(255,255,255,0.2)",cursor:"pointer"}}>×</span></div>
        </div>
        <ForgeTerminal agents={agents} pods={pods} nodes={nodes} commits={commits} k8sEvents={k8sEvents} target={tgt}/>
      </div>}
    </div>
    <div className="status-bar">
      <div style={{display:"flex",gap:14}}><span>{(pods||[]).length} pods</span><span>{nodes.length} nodes</span><span>{agents.length} agents</span></div>
      <div style={{display:"flex",gap:14}}><span>WS: <span style={{color:wsOk?"#34d399":"#ef4444"}}>{wsOk?"connected":"reconnecting"}</span></span><span>ArgoCD: <span style={{color:"#34d399"}}>Healthy</span></span><span style={{color:"rgba(255,255,255,0.08)"}}>v1.0.0</span></div>
    </div>
    {toast&&<div style={{position:"fixed",top:52,right:20,padding:"6px 12px",background:"rgba(239,68,68,0.12)",border:"1px solid rgba(239,68,68,0.35)",color:"#ef4444",fontSize:11,fontWeight:700,zIndex:20000,borderRadius:3}}>{toast}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
