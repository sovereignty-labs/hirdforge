<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hirdforge — Valhalla Command</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;overflow:hidden}
  #root{display:flex;flex-direction:column}
  body{background:#08090f;color:#c8cdd5;font-family:'IBM Plex Mono','SF Mono',monospace;font-size:13px}
  ::selection{background:rgba(99,102,241,0.3);color:#e2e8f0}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.25)}
  *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.14) transparent}
  input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.22)}
  button{font-family:inherit;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  textarea{resize:none}
  a{color:#818cf8;text-decoration:none}a:hover{text-decoration:underline}

  @keyframes glow-pulse{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.35;transform:scale(1.3)}}
  @keyframes avatar-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rec-pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes forge-glow{0%,100%{opacity:.6}50%{opacity:1}}
  @keyframes cursor-blink{0%,100%{opacity:1}50%{opacity:0}}
  @keyframes term-in{from{opacity:0}to{opacity:1}}

  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:46px;min-height:46px;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(6,6,14,0.95);flex-shrink:0;position:relative;z-index:10}
  .header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,0.15),transparent)}
  .tabs{display:flex;align-items:center;padding:0 20px;border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.2);flex-shrink:0}
  .body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .tab-content{flex:1;overflow:hidden;min-height:0}
  .status-bar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:24px;min-height:24px;border-top:1px solid rgba(255,255,255,0.04);background:rgba(0,0,0,0.35);font-size:10px;color:rgba(255,255,255,0.2);flex-shrink:0}

  /* Terminal panel */
  .terminal-wrapper{border-top:1px solid rgba(34,211,238,0.15);background:#050508;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;transition:height 0.2s ease}
  .terminal-header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:28px;min-height:28px;background:rgba(34,211,238,0.04);border-bottom:1px solid rgba(34,211,238,0.08);flex-shrink:0;cursor:pointer;user-select:none}
  .terminal-body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .terminal-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6}
  .terminal-region{flex:1;position:relative;min-height:0}
  .term-line{color:rgba(255,255,255,0.6);white-space:pre-wrap;word-break:break-all;animation:term-in 0.15s ease}
  .term-line.cmd{color:#22d3ee}
  .term-line.err{color:#ef4444}
  .term-line.info{color:#34d399}
  .term-line.warn{color:#fbbf24}
  .term-line.system{color:rgba(255,255,255,0.25);font-style:italic}
  .term-line.header{color:#818cf8;font-weight:700}
  .term-table{border-collapse:collapse;font-size:11px;margin:4px 0}
  .term-table th{color:rgba(255,255,255,0.4);text-align:left;padding:2px 12px 2px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-weight:700}
  .term-table td{color:rgba(255,255,255,0.6);padding:2px 12px 2px 0}
  .term-input-row{display:flex;align-items:center;padding:4px 14px 8px;flex-shrink:0;gap:0}
  .term-prompt{color:#34d399;font-weight:700;font-size:12px;white-space:nowrap;margin-right:8px}
  .term-input{flex:1;background:transparent;border:none;color:#e2e8f0;font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;caret-color:#22d3ee}

  /* Comms layout */
  .comms{display:grid;grid-template-columns:1fr 360px;height:100%;overflow:hidden}
  .chat-col{display:flex;flex-direction:column;height:100%;overflow:hidden;border-right:1px solid rgba(255,255,255,0.04)}
  .agent-bar{display:flex;align-items:center;gap:2px;padding:4px 10px;border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.25);flex-shrink:0;overflow-x:auto}
  .agent-tab{display:flex;align-items:center;gap:5px;padding:7px 12px;background:transparent;border:none;border-radius:5px;transition:all .15s;white-space:nowrap;border-bottom:2px solid transparent}
  .agent-tab:hover{background:rgba(255,255,255,0.03)}
  .agent-tab.active{background:rgba(255,255,255,0.04)}
  .agent-info{display:flex;align-items:center;gap:10px;padding:5px 16px;border-bottom:1px solid rgba(255,255,255,0.04);background:rgba(0,0,0,0.1);flex-shrink:0}
  .messages-region{flex:1;position:relative;min-height:0}
  .messages-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .messages-scroll>.spacer{flex:1 0 auto}
  .msg{display:flex;gap:10px;max-width:80%;animation:msg-in .3s ease both}
  .msg.self{align-self:flex-end;flex-direction:row-reverse}
  .msg-body{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%}
  .msg-meta{display:flex;gap:8px;align-items:baseline}
  .msg.self .msg-meta{justify-content:flex-end}
  .msg-bubble{padding:10px 14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:2px 8px 8px 8px;position:relative;overflow:hidden}
  .msg.self .msg-bubble{background:rgba(16,185,129,0.05);border-color:rgba(16,185,129,0.1);border-radius:8px 2px 8px 8px}
  .msg-text{font-size:13px;color:rgba(255,255,255,0.82);line-height:1.7;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
  .msg-text h1,.msg-text h2,.msg-text h3{font-family:'Space Grotesk',sans-serif;color:rgba(255,255,255,0.9);margin:10px 0 4px}
  .msg-text h1{font-size:16px;font-weight:800}.msg-text h2{font-size:14px;font-weight:700}.msg-text h3{font-size:13px;font-weight:700}
  .msg-text strong{color:rgba(255,255,255,0.92);font-weight:700}
  .msg-text em{color:rgba(255,255,255,0.7)}
  .msg-text code{background:rgba(255,255,255,0.06);padding:1px 5px;border-radius:3px;font-size:12px;color:#22d3ee}
  .msg-text pre{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.06);padding:10px 12px;margin:8px 0;overflow-x:auto;border-radius:4px}
  .msg-text pre code{background:none;padding:0;color:rgba(255,255,255,0.65)}
  .msg-text ul,.msg-text ol{padding-left:18px;margin:4px 0}.msg-text li{margin:2px 0}
  .msg-text table{border-collapse:collapse;margin:6px 0;width:100%;font-size:12px}
  .msg-text th,.msg-text td{border:1px solid rgba(255,255,255,0.07);padding:3px 8px;text-align:left}
  .msg-text th{background:rgba(255,255,255,0.03);font-weight:700;color:rgba(255,255,255,0.6)}
  .msg-text hr{border:none;border-top:1px solid rgba(255,255,255,0.08);margin:10px 0}
  .tool-toggle{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 8px;background:rgba(34,211,238,0.04);border:1px solid rgba(34,211,238,0.1);border-radius:3px;font-size:10px;font-weight:700;color:#22d3ee;cursor:pointer;letter-spacing:.06em;user-select:none}
  .tool-toggle::-webkit-details-marker{display:none}
  .tool-chip{display:flex;align-items:center;gap:5px;padding:3px 7px;margin-top:2px;font-size:10px;border-radius:3px;overflow:hidden}
  .tool-chip.call{background:rgba(34,211,238,0.03);border:1px solid rgba(34,211,238,0.07)}
  .tool-chip.result{background:rgba(52,211,153,0.02);border:1px solid rgba(52,211,153,0.06)}
  .tool-chip-body{color:rgba(255,255,255,0.3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .forging{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;margin-bottom:4px;background:rgba(34,211,238,0.05);border:1px solid rgba(34,211,238,0.12);border-radius:4px;font-size:11px;font-weight:700;color:#22d3ee}
  .forging .dot{width:5px;height:5px;border-radius:50%;background:#22d3ee;animation:forge-glow 1.2s ease infinite}
  .input-bar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.25);flex-shrink:0;align-items:flex-end}
  .input-bar textarea{flex:1;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);padding:10px 14px;color:#e2e8f0;font-size:13px;font-family:'IBM Plex Mono',monospace;outline:none;line-height:1.5;min-height:44px;max-height:120px;border-radius:5px;transition:border-color .15s}
  .input-bar textarea:focus{border-color:rgba(129,140,248,0.25)}
  .btn-send{padding:10px 22px;border:1px solid;border-radius:5px;font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:.1em;text-transform:uppercase;min-height:44px;transition:all .15s}
  .btn-stop{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.5);color:#ef4444;box-shadow:0 0 18px rgba(239,68,68,0.2)}

  /* Sidebar */
  .sidebar{display:flex;flex-direction:column;background:rgba(0,0,0,0.25);height:100%;overflow:hidden}
  .sidebar-section{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.04);flex-shrink:0}
  .sidebar-title{font-size:9px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:6px}
  .session-item{padding:5px 7px;border:1px solid rgba(255,255,255,0.04);border-radius:3px;cursor:pointer;margin-bottom:2px;transition:all .1s}
  .session-item:hover{background:rgba(255,255,255,0.02)}
  .session-item.active{border-color:rgba(129,140,248,0.3);background:rgba(129,140,248,0.05)}
  .session-tabs{display:flex;gap:4px;padding:8px 0 6px}
  .session-tab{padding:3px 9px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.35);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:3px}
  .session-tab.active{border-color:rgba(129,140,248,0.35);background:rgba(129,140,248,0.1);color:#a5b4fc}
  .session-browser{padding:8px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.04);background:rgba(0,0,0,0.18);flex-shrink:0}
  .session-list{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .source-badge{display:inline-flex;align-items:center;padding:1px 5px;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.55);margin-left:5px}
  .autonomous-banner{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid rgba(245,158,11,0.35);background:rgba(245,158,11,0.14);color:#fcd34d;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
  .injection-wrap{padding:8px 16px;border-top:1px solid rgba(245,158,11,0.22);background:rgba(245,158,11,0.05);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .injection-row{display:flex;gap:8px;align-items:flex-end}
  .injection-input{flex:1;background:rgba(0,0,0,0.22);border:1px solid rgba(245,158,11,0.35);padding:8px 10px;color:#fde68a;font-size:12px;font-family:'IBM Plex Mono',monospace;outline:none;border-radius:4px}
  .injection-btn{padding:8px 12px;border:1px solid rgba(245,158,11,0.55);border-radius:4px;background:rgba(245,158,11,0.2);color:#f59e0b;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(0.95)}50%{opacity:1;transform:scale(1.15)}}

  /* Fleet */
  .fleet{display:grid;grid-template-columns:1fr 300px;height:100%;overflow:hidden}
  .fleet-list{border-right:1px solid rgba(255,255,255,0.04);overflow-y:auto}
  .fleet-detail{overflow-y:auto;background:rgba(0,0,0,0.2);padding:18px}
  .fleet-row{display:grid;grid-template-columns:32px 1fr 70px 44px;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.02);cursor:pointer;transition:background .1s}
  .fleet-row:hover{background:rgba(255,255,255,0.015)}
  .fleet-row.active{background:rgba(129,140,248,0.04);border-left:2px solid #818cf8}

  /* Realm */
  .realm{display:flex;flex-direction:column;height:100%;overflow:hidden}
  .realm-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 16px;flex-shrink:0}
  .realm-body{display:grid;grid-template-columns:220px 1fr 340px;flex:1;min-height:0;overflow:hidden}
  .realm-nav{border-right:1px solid rgba(255,255,255,0.04);overflow-y:auto;background:rgba(0,0,0,0.15);padding:10px 0}
  .realm-main{overflow-y:auto;padding:14px 16px}
  .realm-right{display:flex;flex-direction:column;overflow-y:auto;background:rgba(0,0,0,0.15);border-left:1px solid rgba(255,255,255,0.04)}
  .nav-group{margin-bottom:4px}
  .nav-group-title{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;user-select:none}
  .nav-group-title:hover{color:rgba(255,255,255,0.5)}
  .nav-item{display:flex;align-items:center;gap:6px;padding:5px 14px 5px 28px;font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer;transition:all .1s;border-left:2px solid transparent}
  .nav-item:hover{background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.6)}
  .nav-item.active{color:#22d3ee;border-left-color:#22d3ee;background:rgba(34,211,238,0.04)}
  .pod-row{display:grid;grid-template-columns:6px 1fr 80px 60px 70px;gap:6px;padding:6px 10px;align-items:center;border-bottom:1px solid rgba(255,255,255,0.02);font-size:11px}
  .node-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}

  /* Settings View - Agent Configuration Cards */
  .settings{display:flex;flex-direction:column;height:100%;overflow:hidden;background:rgba(0,0,0,0.15)}
  .settings-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.04);flex-shrink:0}
  .settings-title{font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#e2e8f0;margin-bottom:4px}
  .settings-subtitle{font-size:11px;color:rgba(255,255,255,0.25)}
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:16px 20px;overflow-y:auto;flex:1}
  .agent-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;overflow:hidden;transition:all .15s}
  .agent-card:hover{border-color:rgba(255,255,255,0.1);background:rgba(255,255,255,0.025)}
  .agent-card-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);background:rgba(0,0,0,0.2)}
  .agent-card-body{padding:14px}
  .agent-card-row{display:flex;margin-bottom:10px}
  .agent-card-row:last-child{margin-bottom:0}
  .agent-card-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.25);width:100px;flex-shrink:0}
  .agent-card-value{font-size:12px;color:rgba(255,255,255,0.7);word-break:break-all}
  .agent-card-value.missing{color:rgba(255,255,255,0.15);font-style:italic}
  .agent-card-section{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.03)}
  .agent-card-section:first-of-type{margin-top:0;padding-top:0;border-top:none}
  .agent-card-section-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.2);margin-bottom:8px}
  .agent-card-chips{display:flex;flex-wrap:wrap;gap:4px}

  /* Primitives */
  .badge{display:inline-block;padding:2px 6px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:2px}
  .glass{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05)}
  .bar-track{height:3px;background:rgba(255,255,255,0.04);position:relative;overflow:hidden;border-radius:2px}
  .bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:2px;transition:width 1s ease}
  .metric{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .metric-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.3)}
  .metric-value{font-size:20px;font-weight:800;font-family:'Space Grotesk',sans-serif;line-height:1;letter-spacing:-.02em}
  .metric-sub{font-size:10px;color:rgba(255,255,255,0.22)}

  /* Topology */
  .topo{padding:14px}
  .topo-box{rx:4;stroke-width:1;fill-opacity:0.06}
  .topo-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;fill:rgba(255,255,255,0.5)}
  .topo-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:rgba(255,255,255,0.3)}
  .topo-line{stroke-width:1;stroke-dasharray:4,3;opacity:0.3}
  .topo-wall{stroke-width:2;stroke-dasharray:6,3;opacity:0.5}

  /* Mobile */
  @media(max-width:767px){
    body{font-size:15px}
    .comms{grid-template-columns:1fr!important}.sidebar{display:none}
    .fleet{grid-template-columns:1fr!important}.fleet-detail{display:none}
    .realm-body{grid-template-columns:1fr!important}.realm-nav,.realm-right{display:none}
    .realm-metrics{grid-template-columns:1fr 1fr!important}
    .node-grid{grid-template-columns:1fr!important}
    .agent-bar{overflow-x:auto;flex-wrap:wrap;gap:4px;padding:8px}
    .agent-tab{min-height:44px;min-width:44px;padding:8px 10px}
    button{min-height:44px!important;min-width:44px!important}
    textarea{font-size:16px!important;min-height:48px!important}
    .terminal-wrapper{height:140px!important}
    .settings-grid{grid-template-columns:1fr!important;padding:12px}

    /* 1. Tab bar — tappable on small screens */
    .tabs{flex-wrap:wrap!important;gap:0;padding:0 8px}
    .tabs>button,.tabs>div{flex-shrink:0}
    .tabs button:not(.Tab){min-height:44px;min-width:44px;padding:10px 12px}

    /* 2. Chat input row — visible and usable on mobile */
    .input-bar{flex-wrap:nowrap!important;gap:8px;padding:10px 12px;position:sticky;bottom:0;left:0;right:0;background:rgba(0,0,0,0.95);z-index:100}
    .input-bar textarea{flex:1;min-height:44px;max-height:100px;padding:8px 12px}
    .input-bar .btn-send{min-height:44px;padding:8px 16px;flex-shrink:0}
    .injection-wrap{flex-wrap:wrap;padding:8px 12px}
    .injection-row{flex-wrap:wrap}
    .injection-input{flex:1 1 100%;min-height:40px}
    .injection-btn{min-height:40px}

    /* 3. Main content area — no horizontal overflow, appropriate padding */
    .body{overflow-x:hidden}
    .tab-content{overflow-x:hidden!important;padding:0}
    .chat-col{overflow-x:hidden}
    .messages-scroll{padding:12px 10px!important}
    .agent-info{padding:6px 10px!important;flex-wrap:wrap;gap:6px}
    .session-browser{padding:6px 10px!important}
    .header{padding:0 10px!important;height:52px;flex-wrap:wrap;gap:6px}
    .header>div:last-child{flex-wrap:wrap;gap:8px}

    /* 4. Message bubbles — do not overflow viewport width */
    .msg{max-width:90%!important}
    .msg-bubble{max-width:100%;overflow-wrap:break-word;word-break:break-word}
    .msg-text{overflow-wrap:break-word;word-break:break-word}
    .msg-text pre{overflow-x:auto;max-width:100%}
    .msg-text table{display:block;overflow-x:auto;max-width:100%}

<script type="text/babel" data-type="module">
const{useState,useEffect,useRef,useMemo,useCallback}=React;
const CFG={API:'',WS:'',POLL:5000,MOCK:false};

// ═══════════ API ═══════════
async function api(path,fb){
  if(CFG.MOCK)return fb;
  try{const r=await fetch(CFG.API+path);if(!r.ok)throw new Error(r.status);const d=await r.json();
    if(path.includes('cluster/nodes')&&d.items)return d.items.map(n=>({name:n.metadata?.name||"?",ip:(n.status?.addresses?.find(a=>a.type==="InternalIP")||{}).address||"—",role:Object.keys(n.metadata?.labels||{}).filter(l=>l.startsWith("node-role")).map(l=>l.split("/")[1]).join("+")||"worker",status:n.status?.conditions?.find(c=>c.type==="Ready")?.status==="True"?"Ready":"NotReady",pods:0,cpu_percent:0,memory_percent:0}));
    return d;
  }catch(e){return fb;}
}
async function apiPost(p){try{const r=await fetch(CFG.API+p,{method:'POST'});return await r.json();}catch(e){return{error:e.message};}}
async function apiPostJSON(p,b){try{const r=await fetch(CFG.API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});return await r.json();}catch(e){return{error:e.message};}}
async function apiText(p){try{const r=await fetch(CFG.API+p);if(!r.ok)throw new Error(r.status);return await r.text();}catch(e){return`Error: ${e.summary||e.message}`;}}

function usePoll(path,fb,iv){
  const[d,set]=useState(fb);
  useEffect(()=>{let m=true;const go=async()=>{const r=await api(path,fb);if(!m)return;
    if(path==='/api/v1/agents'&&Array.isArray(r)){const n=r.map(a=>({id:a.name||a.id,name:a.display_name||a.name||a.id,role:a.role||"Agent",model:a.model||"?",backend:a.backend||"?",status:a.healthy===false?"offline":(a.healthy?"online":(a.status||"offline")),tools:a.tools||[],uptime_seconds:a.uptime_seconds||0,tasks_completed:a.tasks_completed||0,last_action:a.last_action||"—",ping_ms:a.ping_ms||a.latency_ms||null,cpu_percent:a.cpu_percent||0,memory_percent:a.memory_percent||0,initial:(a.display_name||a.name||a.id||"?")[0].toUpperCase(),
      // Extended fields for Settings view
      inference_url:a.inference_url||a.backend||null,
      memory_url:a.memory_url||null,
      peers:a.peers||[],

function useBufferedWS(visible){
  const bufferRef=useRef([]);
  const timerRef=useRef(null);
  const[events,setEvents]=useState([]);
  const[ok,setOk]=useState(false);
  const flush=useCallback(()=>{setEvents(bufferRef.current.slice());},[]);
  useEffect(()=>{if(visible)flush();},[visible,flush]);
  useEffect(()=>{
    if(CFG.MOCK)return undefined;
    const u=CFG.WS||`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/events`;
    let ws;let backoff=3000;let cancelled=false;
    const schedule=()=>{
      if(visible){
        flush();
        return;
      }
      if(timerRef.current)return;
      timerRef.current=setTimeout(()=>{timerRef.current=null;flush();},500);
    };
    const connect=()=>{
      ws=new WebSocket(u);
      ws.onopen=()=>{setOk(true);backoff=3000;};
      ws.onclose=()=>{setOk(false);if(cancelled)return;backoff=Math.min(backoff*2,30000);setTimeout(connect,backoff);};
      ws.onmessage=e=>{
        try{
          const item=JSON.parse(e.data);
          if(!item.timestamp)item.timestamp=new Date().toISOString();
          bufferRef.current=[item].concat(bufferRef.current).slice(0,200);
          schedule();
        }catch{}
      };
    };
    connect();
    return()=>{
      cancelled=true;
      if(timerRef.current){clearTimeout(timerRef.current);timerRef.current=null;}
      if(ws)ws.close();
    };
  },[flush,visible]);
  return{events,ok,bufferRef};
}
function useSimplePoll(path,fallback,interval){
  const[data,setData]=useState(fallback);
  const[status,setStatus]=useState('loading');
  const refresh=useCallback(async()=>{
    const res=await apiGetJSONDetailed(path);
    if(res.ok){
      setData(res.data==null?fallback:res.data);
      setStatus('ready');
      return res.data;
    }
    if(res.status===404){
      setData(fallback);
      setStatus('missing');
      return fallback;
    }
    setStatus('error');
    return fallback;
  },[path,fallback]);
  useEffect(()=>{
    let live=true;
    const go=async()=>{
      const res=await apiGetJSONDetailed(path);
      if(!live)return;
      if(res.ok){
        setData(res.data==null?fallback:res.data);
        setStatus('ready');
        return;
      }
      if(res.status===404){
        setData(fallback);
        setStatus('missing');
        return;
      }
      setStatus('error');
    };
    go();
    const id=setInterval(go,interval||CFG.POLL);
    return()=>{live=false;clearInterval(id);};
  },[path]);
  return{data,status,refresh};
}

function md(text){if(!text)return'';
  let h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^---$/gm,'<hr/>')
    .replace(/^\|(.+)\|$/gm,m=>{const c=m.split('|').filter(x=>x.trim());if(c.every(x=>/^[-:\s]+$/.test(x)))return'<!--sep-->';return'<tr>'+c.map(x=>`<td>${x.trim()}</td>`).join('')+'</tr>';})
    .replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/((?:<tr>.*<\/tr>\n?)+)/g,m=>'<table>'+m.replace(/<!--sep-->\n?/g,'')+'</table>');
  h=h.replace(/\n/g,'<br/>').replace(/(<\/(h[1-3]|pre|ul|ol|table|hr)>)<br\/>/g,'$1').replace(/<br\/>(<(h[1-3]|pre|ul|ol|table|hr))/g,'$1');
  return h;
}

      addLine('',text);return;
    }

    if(cmd.startsWith('restart ')){
      const pod=cmd.split(/\s+/)[1];addLine('warn',`  Restarting ${pod}...`);
      await apiPost(`/api/v1/cluster/pods/${pod}/restart`);addLine('info',`  ✓ Restart triggered for ${pod}`);return;
    }

    if(cmd.startsWith('stop-all')){await apiPost('/api/v1/agents/stop-all');addLine('err','  ■ All agents stopped');return;}
    if(cmd.startsWith('stop ')){const a=cmd.split(/\s+/)[1];await apiPost(`/api/v1/agents/${a}/stop`);addLine('warn',`  ■ Stopped ${a}`);return;}

    // Agent-routed command: @agent message
    if(cmd.startsWith('@')){
      const sp=cmd.indexOf(' ');const ag=cmd.slice(1,sp>0?sp:undefined);const msg=sp>0?cmd.slice(sp+1):'';
      if(!msg){addLine('err',`  Usage: @${ag} <message>`);return;}
      setBusy(true);
      const sid=`term-${ag}-${Date.now()}`;let resp='';
      const ctrl=new AbortController();ctrlRef.current=ctrl;
      await streamChat(ag,msg,sid,ctrl.signal,
        chunk=>{resp+=chunk;setLines(p=>{const u=[...p];if(u.length&&u[u.length-1]._stream){u[u.length-1]={t:'',text:resp,_stream:true};}else{u.push({t:'',text:resp,_stream:true});}return u;});if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},
        cleaned=>{resp=cleaned;setLines(p=>{const u=[...p];if(u.length&&u[u.length-1]._stream)u[u.length-1]={t:'',text:resp,_stream:true};return u;});},
        ()=>{},()=>{},
        ()=>{setBusy(false);ctrlRef.current=null;setLines(p=>{const u=[...p];if(u.length&&u[u.length-1]._stream)delete u[u.length-1]._stream;return u;});},
        err=>{addLine('err',`  ${err}`);setBusy(false);ctrlRef.current=null;}
      );
      return;
    }

    // P0 #39 Fix: Validate input before routing to agent
    // Check if it's a known command or @agent prefix
    const firstWord=cmd.split(/\s+/)[0].toLowerCase();
    const isKnownCommand=KNOWN_COMMANDS.includes(firstWord);
    const isAgentPrefix=cmd.startsWith('@');
    
    if(!isKnownCommand&&!isAgentPrefix){
      addLine('err',`  command not found: ${cmd} — type help for available commands`);
      return;
    }

    // Default: route to current target
    addLine('system',`  Routing to ${target}...`);
    setBusy(true);const sid=`term-${target}-${Date.now()}`;let resp='';
    const ctrl=new AbortController();ctrlRef.current=ctrl;
    await streamChat(target,cmd,sid,ctrl.signal,
      chunk=>{resp+=chunk;setLines(p=>{const u=[...p];if(u.length&&u[u.length-1]._stream){u[u.length-1]={t:'',text:resp,_stream:true};}else{u.push({t:'',text:resp,_stream:true});}return u;});if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},
      cleaned=>{resp=cleaned;setLines(p=>{const u=[...p];if(u.length&&u[u.length-1]._stream)u[u.length-1]={t:'',text:resp,_stream:true};return u;});},
      ()=>{},()=>{},
      ()=>{setBusy(false);ctrlRef.current=null;setLines(p=>{const u=[...p];if(u.length&&u[u.length-1]._stream)delete u[u.length-1]._stream;return u;});},
      err=>{addLine('err',`  ${err}`);setBusy(false);ctrlRef.current=null;}
    );
  };

  return<div className="terminal-body">
    <div className="terminal-region"><div className="terminal-scroll" ref={scrollRef}>
      {lines.map((l,i)=>l.html?<div key={i} className="term-line" dangerouslySetInnerHTML={{__html:l.html}}/>:<div key={i} className={`term-line ${l.t||''}`}>{l.text}</div>)}
    </div></div>
    <div className="term-input-row">
      <span className="term-prompt">forge@valhalla:~$</span>
      <input ref={inputRef} className="term-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!busy){exec(input);setInput('');}}} placeholder={busy?"processing...":"enter command"} disabled={busy} autoFocus={false}/>
    </div>
  </div>;
}

      <div className="msg-bubble" style={{background:ok?"rgba(16,185,129,0.06)":"rgba(239,68,68,0.08)",borderColor:ok?"rgba(16,185,129,0.16)":"rgba(239,68,68,0.18)",padding:"10px 12px"}}>

      <div style={{position:"absolute",top:0,left:0,bottom:0,width:2,background:self?"#10b981":c,opacity:.35,borderRadius:1}}/>
      {msg.streaming&&!msg.text&&<div className="forging"><span className="dot"/>Forging response...</div>}
      <div className="msg-text" dangerouslySetInnerHTML={{__html:md(msg.text)}}/>
      {showTools&&tc&&<details><summary className="tool-toggle">⚒ {(msg.toolCalls||[]).length} tool call{(msg.toolCalls||[]).length!==1?'s':''}</summary><div style={{paddingTop:3}}>
        {(msg.toolCalls||[]).map((t,i)=><div key={`c${i}`} className="tool-chip call"><span style={{color:"#22d3ee",fontWeight:800,fontSize:9,letterSpacing:".06em"}}>TOOL</span><span style={{color:"rgba(255,255,255,0.45)"}}>{t.tool}</span><span className="tool-chip-body">{typeof t.args==='string'?t.args:JSON.stringify(t.args)}</span></div>)}
        {(msg.toolResults||[]).map((t,i)=><div key={`r${i}`} className="tool-chip result"><span style={{color:"#34d399",fontWeight:800,fontSize:9,letterSpacing:".06em"}}>RESULT</span><span className="tool-chip-body">{typeof t.result==='string'?t.result:JSON.stringify(t.result)}</span></div>)}
      </div></details>}
    </div>
  </div></div>;
};

// ═══════════ COMMS VIEW ═══════════
const CommsView=({agents,events,wsConnected,chatHistory,setChatHistory,msg,setMsg,target,setTarget,sending,setSending,sessionId,setSessionId,sessionItems,sessionFilter,setSessionFilter,onLoadSession,onNewConversation,onClearHistory,onEmergencyStop,auth,fleetState,onTogglePause,onQueueInjection,showToast,sessionMeta})=>{
  const mRef=useRef(null);const tRef=useRef(null);const cRef=useRef(null);const feedRef=useRef(null);
  const[injection,setInjection]=useState("");
  const ta=agents.find(a=>a.id===target)||FA[0];const tc=C[target]||"#818cf8";
  const userName=auth?.user||'Sovereign';const userRole=auth?.role||'sovereign';
  const targetState=(fleetState||[]).find(s=>s.name===target)||{};
  const isAutonomousSession=(sessionMeta?.source==="cronjob");

  const feedItems=useMemo(()=>[...(events||[])].slice(0,50).reverse(),[events]);
  const scrollB=useCallback(()=>{if(mRef.current)mRef.current.scrollTop=mRef.current.scrollHeight;},[]);
  useEffect(()=>{requestAnimationFrame(scrollB);},[chatHistory,scrollB]);
  useEffect(()=>{if(feedRef.current)feedRef.current.scrollTop=feedRef.current.scrollHeight;},[feedItems]);
  useEffect(()=>{setInjection("");},[target,sessionId]);

  const formatMissionEvent=e=>{
    const type=(e?.type||"").toLowerCase();
    const agent=e?.agent||"system";
    const summary=e?.summary||e?.message||"";
    if(type==="skill_loaded")return{txt:`📋 ${agent} loaded skill file`,color:"#22d3ee"};
    if(type==="recon_started")return{txt:`🔍 ${agent} cloning repository`,color:"#34d399"};
    if(type==="recon_reading")return{txt:`📖 ${agent} reading ARCHITECTURE.md`,color:"#818cf8"};
    if(type==="pr_created")return{txt:`🎉 ${agent} created pull request`,color:"#10b981"};
    if(type==="injection_queued")return{txt:`💉 Sovereign queued injection for ${agent}`,color:"#f59e0b"};
    if(type==="injection_sent")return{txt:`💉 Injection delivered to ${agent}`,color:"#f59e0b"};
    if(type==="agent_paused")return{txt:`⏸️ ${agent} paused`,color:"#f59e0b"};
    if(type==="agent_resumed")return{txt:`▶️ ${agent} resumed`,color:"#34d399"};
    if(type==="agent_paused_skip")return{txt:`⏭️ ${agent} skipped (paused)`,color:"#fbbf24"};
    if(type==="tool_call")return{txt:`⚒ ${agent} tool call`,color:"#22d3ee"};
    if(type==="message")return{txt:`✉ ${summary||`Message sent to ${agent}`}`,color:"#6b7280"};
    return{txt:summary||`${type||"event"}: ${agent}`,color:"#6b7280"};
  };

  const runInjection=async()=>{
    const content=injection.trim();
    if(!content)return;
    const out=await onQueueInjection(target,content,sessionId);
    if(out?.error){showToast(out.error);return;}
    setInjection("");
    showToast(`Injection queued for ${target}`);
  };

  const stopCur=async()=>{if(cRef.current){cRef.current.abort();cRef.current=null;}setChatHistory(p=>{if(!p.length)return p;const u=[...p];const l={...u[u.length-1]};if(l.from===target&&l.streaming){l.streaming=false;l.text=(l.text?l.text+"\n":"")+"[Stopped by Sovereign]";u[u.length-1]=l;}return u;});setSending(false);await apiPost(`/api/v1/agents/${target}/stop`);};

  const send=async()=>{if(!msg.trim()||sending)return;const now=new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'});
    setChatHistory(p=>[...p,{from:"kit",agent:{id:"kit",name:`${userName} (${userRole})`,initial:userName[0]?.toUpperCase()||"S",status:"online"},text:msg,time:now,toolCalls:[],toolResults:[]}]);
    const sent=msg;setMsg('');setSending(true);if(tRef.current)tRef.current.style.height='44px';
    setChatHistory(p=>[...p,{from:target,agent:ta,text:"",time:now,streaming:true,toolCalls:[],toolResults:[]}]);
    const ctrl=new AbortController();cRef.current=ctrl;
    await streamChat(target,sent,sessionId,ctrl.signal,
      ch=>{setChatHistory(p=>{const u=[...p];const l={...u[u.length-1]};l.text=(l.text||"")+ch;u[u.length-1]=l;return u;});requestAnimationFrame(scrollB);},
      cl=>{setChatHistory(p=>{const u=[...p];u[u.length-1]={...u[u.length-1],text:cl};return u;});},
      (t,a)=>{setChatHistory(p=>{const u=[...p];const l={...u[u.length-1]};l.toolCalls=[...(l.toolCalls||[]),{tool:t,args:a}];u[u.length-1]=l;return u;});requestAnimationFrame(scrollB);},
      (t,r)=>{setChatHistory(p=>{const u=[...p];const l={...u[u.length-1]};l.toolResults=[...(l.toolResults||[]),{tool:t,result:r}];u[u.length-1]=l;return u;});requestAnimationFrame(scrollB);},
      sid=>{if(sid)setSessionId(sid);setChatHistory(p=>{const u=[...p];const l={...u[u.length-1]};l.streaming=false;if(!l.text&&!(l.toolCalls||[]).length)l.text="(empty response)";u[u.length-1]=l;return u;});setSending(false);cRef.current=null;},
      err=>{setChatHistory(p=>{const u=[...p];const l={...u[u.length-1]};if(err!=="[Stopped by Sovereign]")l.text=err;l.streaming=false;u[u.length-1]=l;return u;});setSending(false);cRef.current=null;}
    );
  };

  return<div className="comms">

        <div style={{marginLeft:"auto",paddingRight:6}}><Btn label="Broadcast" icon="⚡" color="#fbbf24" small/></div>
      </div>
      <div className="agent-info"><Av agent={ta} size={22}/><div style={{flex:1}}><span style={{fontSize:12,fontWeight:700,color:tc}}>{ta.name}</span><span style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginLeft:8}}>{ta.role}</span></div><Btn label="Clear" icon="⌫" color="#ef4444" small onClick={onClearHistory}/><Badge text={ta.model} color={tc}/></div>
      <div className="session-browser">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span className="sidebar-title" style={{margin:0}}>Sessions</span>
          <div style={{display:"flex",gap:3}}><Btn label="New" icon="＋" color={tc} small onClick={onNewConversation}/><Btn label="Stop All" icon="■" color="#ef4444" small onClick={onEmergencyStop}/></div>

        <div className="session-tabs">

      </div>
      {isAutonomousSession&&<div className="autonomous-banner">
        <span>Autonomous Session — {target}{sessionMeta?.task_ref?` — ${sessionMeta.task_ref}`:""}</span>
        <span>{sessionMeta?.source||"cronjob"}</span>

      <div className="messages-region"><div className="messages-scroll" ref={mRef}>

        {chatHistory.length===0&&<div style={{textAlign:"center",padding:"30px 0",opacity:.25}}><div style={{fontSize:24,fontFamily:"'Space Grotesk',sans-serif",fontWeight:800,color:tc,marginBottom:6}}>⚔</div><div style={{fontSize:12}}>Command the warband</div></div>}

          <span style={{fontSize:9,fontWeight:700,color:"#f59e0b",letterSpacing:".1em",textTransform:"uppercase"}}>Sovereign Injection</span>

        </div>

          <button className="injection-btn" onClick={runInjection}>Send Injection</button>

    <div className="sidebar">
      <div className="sidebar-section" style={{paddingBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><span className="sidebar-title" style={{margin:0}}>Mission Control</span><span style={{fontSize:9,color:"rgba(255,255,255,0.2)"}}>{fleetState.length} agents</span></div>
        <div style={{maxHeight:300,overflowY:"auto",display:"flex",flexDirection:"column",gap:5}}>
          {(fleetState||[]).map(st=>{
            const ag=agents.find(a=>a.id===st.name)||{id:st.name,name:st.name,status:"offline"};
            const dot=C[st.name]||"#818cf8";
            const offline=ag.status==="offline";
            const status=offline?"Offline":(st.paused?"Paused":(st.active?"Active":"Idle"));
            const statusColor=offline?"#ef4444":(st.paused?"#f59e0b":(st.active?"#22c55e":"#6b7280"));
            return <div key={st.name} className="glass" style={{padding:"6px 8px",borderColor:st.paused?"rgba(245,158,11,0.35)":"rgba(255,255,255,0.07)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
                <div style={{display:"flex",alignItems:"center",gap:6,minWidth:0}}>

            </div>;
          })}
        </div>
      </div>
      <div className="sidebar-section" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:5,height:5,borderRadius:"50%",background:wsConnected?"#ef4444":"#6b7280",animation:wsConnected?"rec-pulse 1.5s ease infinite":"none"}}/><span style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.25)",letterSpacing:".1em",textTransform:"uppercase"}}>{wsConnected?"Live":"Offline"}</span></div><span style={{fontSize:9,color:"rgba(255,255,255,0.1)"}}>{events.length}</span></div>

  </div>;
};

  </div><div className="fleet-detail" style={statesByName[a?.id]?.paused?{border:"1px solid rgba(245,158,11,0.3)"}:undefined}>
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}><Av agent={a} size={38}/><div style={{flex:1}}><div style={{fontSize:16,fontWeight:800,color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>{a.name}</div><div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{a.role}</div></div><Badge text={statesByName[a?.id]?.paused?"PAUSED":a.status} color={statesByName[a?.id]?.paused?"#f59e0b":sc(a.status)}/><button onClick={()=>onTogglePause(a?.id,!!statesByName[a?.id]?.paused)} style={{padding:"4px 9px",fontSize:10,fontWeight:700,background:statesByName[a?.id]?.paused?"rgba(34,197,94,0.12)":"rgba(245,158,11,0.16)",border:`1px solid ${statesByName[a?.id]?.paused?"rgba(34,197,94,0.35)":"rgba(245,158,11,0.4)"}`,color:statesByName[a?.id]?.paused?"#34d399":"#f59e0b",borderRadius:3,fontFamily:"'IBM Plex Mono',monospace"}}>{statesByName[a?.id]?.paused?"Resume":"Pause"}</button></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14}}>{[{l:"CPU",v:`${a.cpu_percent||0}%`,c:a.cpu_percent>60?"#fbbf24":"#34d399"},{l:"Memory",v:`${a.memory_percent||0}%`,c:"#818cf8"},{l:"Latency",v:a.ping_ms?`${a.ping_ms}ms`:"—",c:"#22d3ee"},{l:"Uptime",v:fUp(a.uptime_seconds||0),c:"#e2e8f0"}].map(m=><div key={m.l} className="glass metric"><span className="metric-label">{m.l}</span><span className="metric-value" style={{color:m.c}}>{m.v}</span></div>)}</div>

// ═══════════ SETTINGS VIEW (Agent Config Cards) ═══════════
const SettingsView=({agents})=>{
  const defaultSettings={ "callbacks.enabled":true, "callbacks.session_routing":"active", "delegation.timeout_seconds":120, "ui.theme":"dark" };
  const[platform,setPlatform]=useState(defaultSettings);
  const[platformLoading,setPlatformLoading]=useState(true);
  const[platformSaving,setPlatformSaving]=useState(false);
  const[platformSaved,setPlatformSaved]=useState(false);
  const[platformError,setPlatformError]=useState("");
  const[editing,setEditing]=useState({});
  const[forms,setForms]=useState({});
  const[applyState,setApplyState]=useState({});

  const getAgentColor=(agentId)=>{
    if(C[agentId])return C[agentId];
    let hash=0;
    for(let i=0;i<agentId.length;i++)hash=agentId.charCodeAt(i)+((hash<<5)-hash);
    const colors=['#818cf8','#f472b6','#34d399','#fbbf24','#22d3ee','#c084fc','#f59e0b','#ef4444'];
    return colors[Math.abs(hash)%colors.length];
  };

  const renderValue=value=>{
    if(value===null||value===undefined||value===''||(Array.isArray(value)&&value.length===0))return <span className="agent-card-value missing">Not configured</span>;
    return <span className="agent-card-value">{String(value)}</span>;
  };

  const renderChips=(items,color)=>{
    if(!items||!Array.isArray(items)||items.length===0)return <span className="agent-card-value missing">Not configured</span>;
    return <div className="agent-card-chips">{items.map((item,i)=>{const label=typeof item==='string'?item:(item.name||item.id||JSON.stringify(item).slice(0,20));return <Badge key={i} text={label} color={color||"rgba(255,255,255,0.3)"} />;})}</div>;
  };

  const inputStyle={width:"100%",background:"rgba(5,8,18,0.68)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:6,color:"#e2e8f0",padding:"8px 10px",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",outline:"none",boxShadow:"inset 0 1px 0 rgba(255,255,255,0.02)"};
  const labelStyle={display:"block",fontSize:9,color:"rgba(255,255,255,0.18)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:4};
  const fieldBox={display:"flex",flexDirection:"column",gap:4};

  useEffect(()=>{let live=true;(async()=>{setPlatformLoading(true);setPlatformError("");try{const r=await fetch('/api/v1/settings');if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();if(live)setPlatform({...defaultSettings,...d});}catch(e){if(live)setPlatformError(e.message||'Failed to load settings');}finally{if(live)setPlatformLoading(false);}})();return()=>{live=false;};},[]);

  const setField=(agentId,key,value)=>setForms(p=>({...p,[agentId]:{...(p[agentId]||{}),[key]:value}}));
  const startEdit=agent=>setEditing(p=>({...p,[agent.id]:true}))||setForms(p=>({...p,[agent.id]:{model:agent.model||"",inference_url:agent.inference_url||agent.backend||"",tools:Array.isArray(agent.tools)?agent.tools.join(','):(agent.tools||""),peers:Array.isArray(agent.peers)?agent.peers.join(','):(agent.peers||"")}}));
  const cancelEdit=agentId=>{setEditing(p=>({...p,[agentId]:false}));setApplyState(p=>({...p,[agentId]:{}}));};

  const savePlatform=async()=>{setPlatformSaving(true);setPlatformSaved(false);setPlatformError("");try{const r=await fetch('/api/v1/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(platform)});if(!r.ok){const t=await r.text();throw new Error(t||`HTTP ${r.status}`);}const d=await r.json();setPlatform({...defaultSettings,...d});setPlatformSaved(true);setTimeout(()=>setPlatformSaved(false),1800);}catch(e){setPlatformError(e.message||'Save failed');}finally{setPlatformSaving(false);}};

  const applyAgent=async agent=>{
    const form=forms[agent.id]||{};
    const payload={};
    if((form.model||"").trim()!==String(agent.model||"").trim()&&(form.model||"").trim()!=="")payload.model=form.model.trim();
    if((form.inference_url||"").trim()!==String(agent.inference_url||agent.backend||"").trim()&&(form.inference_url||"").trim()!=="")payload.inference_url=form.inference_url.trim();
    if((form.tools||"").trim()!==((Array.isArray(agent.tools)?agent.tools.join(','):(agent.tools||""))).trim())payload.tools=form.tools.trim();
    if((form.peers||"").trim()!==((Array.isArray(agent.peers)?agent.peers.join(','):(agent.peers||""))).trim())payload.peers=form.peers.trim();
    if(Object.keys(payload).length===0){setApplyState(p=>({...p,[agent.id]:{error:"No changes to apply"}}));return;}
    setApplyState(p=>({...p,[agent.id]:{loading:true,error:"",pr_url:""}}));
    try{
      const r=await fetch(`/api/v1/agents/${agent.id}/configure`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);
      setApplyState(p=>({...p,[agent.id]:{loading:false,error:"",pr_url:d.pr_url||""}}));
    }catch(e){
      setApplyState(p=>({...p,[agent.id]:{loading:false,error:e.message||'Apply failed',pr_url:""}}));
    }
  };

  return<div className="settings">
    <div className="settings-header">
      <div className="settings-title">⚙ Settings</div>
      <div className="settings-subtitle">Runtime platform controls and GitOps-backed agent configuration changes.</div>
    </div>

    <div className="glass" style={{padding:"14px 16px",marginBottom:14,border:"1px solid rgba(255,255,255,0.05)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>Platform Settings</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.24)"}}>Live runtime settings applied without restart.</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {platformSaved&&<Badge text="Saved" color="#34d399"/>}
          <Btn label={platformSaving?"Saving":"Save"} icon="⤴" color="#34d399" onClick={savePlatform} disabled={platformLoading||platformSaving} />
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1.1fr 1fr 1fr",gap:10}}>
        <div className="glass" style={{padding:"10px 12px",background:"rgba(255,255,255,0.015)"}}>
          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
            <input type="checkbox" checked={!!platform["callbacks.enabled"]} onChange={e=>setPlatform(p=>({...p,"callbacks.enabled":e.target.checked}))}/>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"#e2e8f0"}}>Task Callbacks</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.22)"}}>Enable task completion pushbacks to delegating agents.</div>
            </div>
          </label>
        </div>
        <div style={fieldBox}>
          <label style={labelStyle}>Callback Routing</label>
          <select value={platform["callbacks.session_routing"]||"active"} onChange={e=>setPlatform(p=>({...p,"callbacks.session_routing":e.target.value}))} style={inputStyle}>
            <option value="active">active</option>
            <option value="dedicated">dedicated</option>
          </select>
        </div>
        <div style={fieldBox}>
          <label style={labelStyle}>Delegation Timeout (s)</label>
          <input type="number" min="1" value={platform["delegation.timeout_seconds"]??120} onChange={e=>setPlatform(p=>({...p,"delegation.timeout_seconds":Number(e.target.value||120)}))} style={inputStyle}/>
        </div>
      </div>
      {platformError&&<div style={{marginTop:10,fontSize:10,color:"#fca5a5"}}>{platformError}</div>}
    </div>

    <div className="settings-grid">
      {agents.map(agent=>{
        const agentColor=getAgentColor(agent.id);
        const isEditing=!!editing[agent.id];
        const form=forms[agent.id]||{};
        const state=applyState[agent.id]||{};
        return <div key={agent.id} className="agent-card" style={{borderLeft:`3px solid ${agentColor}`}}>
          <div className="agent-card-header">
            <Av agent={{...agent,initial:agent.name?.[0]||agent.id?.[0]}} size={28}/>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>{agent.name}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>{agent.role}</div>
            </div>
            <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
              <Badge text={agent.status} color={sc(agent.status)}/>
              {!isEditing?<Btn label="Edit" icon="✎" color={agentColor} small onClick={()=>startEdit(agent)}/>:<Btn label="Cancel" icon="×" color="#6b7280" small onClick={()=>cancelEdit(agent.id)}/>}
            </div>
          </div>
          <div className="agent-card-body">
            {!isEditing&&<>
              <div className="agent-card-row"><span className="agent-card-label">Model</span>{renderValue(agent.model)}</div>
              <div className="agent-card-row"><span className="agent-card-label">Inference URL</span>{renderValue(agent.inference_url||agent.backend)}</div>
              <div className="agent-card-row"><span className="agent-card-label">Memory URL</span>{renderValue(agent.memory_url)}</div>
              <div className="agent-card-section"><div className="agent-card-section-title">Tools</div>{renderChips(agent.tools,agentColor)}</div>
              <div className="agent-card-section"><div className="agent-card-section-title">Peers</div>{renderChips(agent.peers,'#c084fc')}</div>
              {(agent.mcp_servers||agent.mcp||[]).length>0&&<div className="agent-card-section"><div className="agent-card-section-title">MCP Servers</div>{renderChips(agent.mcp_servers||agent.mcp,'#22d3ee')}</div>}
            </>}
            {isEditing&&<div style={{display:"grid",gap:10}}>
              <div style={fieldBox}><label style={labelStyle}>Model</label><input value={form.model||""} onChange={e=>setField(agent.id,"model",e.target.value)} style={inputStyle} placeholder="gpt-4o-mini"/></div>
              <div style={fieldBox}><label style={labelStyle}>Inference URL</label><input value={form.inference_url||""} onChange={e=>setField(agent.id,"inference_url",e.target.value)} style={inputStyle} placeholder="https://api.openai.com"/></div>
              <div style={fieldBox}><label style={labelStyle}>Tools</label><input value={form.tools||""} onChange={e=>setField(agent.id,"tools",e.target.value)} style={inputStyle} placeholder="exec,read,write"/></div>
              <div style={fieldBox}><label style={labelStyle}>Peers</label><input value={form.peers||""} onChange={e=>setField(agent.id,"peers",e.target.value)} style={inputStyle} placeholder="chuck=http://chuck...,knut=http://knut..."/></div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:2}}>
                <Btn label={state.loading?"Applying":"Apply"} icon="↗" color="#34d399" onClick={()=>applyAgent(agent)} disabled={!!state.loading}/>
                <Btn label="Cancel" icon="×" color="#6b7280" onClick={()=>cancelEdit(agent.id)}/>
                {state.pr_url&&<><Badge text="PR Created" color="#34d399"/><a href={state.pr_url} target="_blank" rel="noreferrer" style={{fontSize:10,color:"#86efac",textDecoration:"underline"}}>{state.pr_url}</a></>}
              </div>
              {state.error&&<div style={{fontSize:10,color:"#fca5a5"}}>{state.error}</div>}
            </div>}
          </div>
        </div>;
      })}
    </div>
  </div>;
};

// ═══════════ REALM VIEW ═══════════
const RealmView=({agents,nodes,pods,commits,k8sEvents,prs,repos})=>{
  const[logPod,setLogPod]=useState(null);const[restarting,setRestarting]=useState(null);const[section,setSection]=useState('pods');
  const[merging,setMerging]=useState(null);const[mergeResult,setMergeResult]=useState(null);
  const restart=async n=>{setRestarting(n);await apiPost(`/api/v1/cluster/pods/${n}/restart`);setTimeout(()=>setRestarting(null),3000);};
  const doMerge=async(repo,idx)=>{setMerging(`${repo}/${idx}`);const r=await mergePR(repo,idx);setMergeResult(r.ok?'Merged!':r.error);setMerging(null);setTimeout(()=>setMergeResult(null),3000);};

// ═══════════ HEALTH VIEW ═══════════
const HealthCard=({title,endpoint,render})=>{
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  const fetch_=useCallback(async()=>{
    try{
      const r=await fetch(`/api/v1${endpoint}`);
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const d=await r.json();
      setData(d);setError(null);
    }catch(e){setError(e.message||'Failed to load');}
    finally{setLoading(false);}
  },[endpoint]);
  useEffect(()=>{fetch_();const id=setInterval(fetch_,30000);return()=>clearInterval(id);},[fetch_]);
  return<div className="glass" style={{padding:"14px 16px",marginBottom:8,border:"1px solid rgba(255,255,255,0.05)"}}>
    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
      <span style={{fontSize:10,fontWeight:700,color:"#818cf8",letterSpacing:".1em",textTransform:"uppercase"}}>{title}</span>
      <span style={{fontSize:8,color:"rgba(255,255,255,0.1)",fontFamily:"'IBM Plex Mono',monospace"}}>{endpoint}</span>
    </div>
    {loading&&<div style={{fontSize:11,color:"rgba(255,255,255,0.15)"}}>Loading...</div>}
    {error&&<div style={{fontSize:11,color:"#f87171"}}>{error}</div>}
    {!loading&&!error&&data&&render(data)}
  </div>;
};

    </div>;
  };

  const renderBranches=d=>{
    const byRepo=(d?.by_repo||[]);
    if(byRepo.length===0)return<div style={{fontSize:11,color:"rgba(255,255,255,0.2)"}}>No stale branch data available.</div>;
    return<div>
      {byRepo.map(r=>{

        return<div key={r.repo||r.name||"?"} style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>

            <div className="bar-track" style={{flex:1}}><div className="bar-fill" style={{width:`${pct}%`,background:pct>50?"#ef4444":pct>25?"#fbbf24":"#34d399"}}/></div>
            <span style={{fontSize:9,color:"rgba(255,255,255,0.3)",minWidth:30,textAlign:"right"}}>{pct}%</span>
          </div>
        </div>;
      })}
    </div>;
  };

  const renderFleetState=d=>{
    const states=Array.isArray(d)?d:(d?.agents||[]);
    return<div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:6,marginBottom:10}}>
        {[{l:"Active",v:states.filter(s=>s.active&&!s.paused).length,c:"#22c55e"},{l:"Idle",v:states.filter(s=>!s.active&&!s.paused).length,c:"#6b7280"},{l:"Paused",v:states.filter(s=>s.paused).length,c:"#f59e0b"}].map(m=><div key={m.l} className="metric" style={{padding:"8px 10px"}}><span className="metric-label">{m.l}</span><span className="metric-value" style={{color:m.c}}>{m.v}</span></div>)}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:3}}>{states.map(s=><div key={s.name||s.id||"?"} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",background:"rgba(255,255,255,0.015)",borderRadius:4}}>
        <Pip status={s.active&&!s.paused?"online":s.paused?"degraded":"offline"} size={5}/>
        <span style={{fontSize:11,color:"#e2e8f0",fontWeight:600,flex:1}}>{s.name||s.id}</span>
        <span style={{fontSize:9,color:"rgba(255,255,255,0.25)"}}>{s.active&&!s.paused?"Active":s.paused?"Paused":"Idle"}</span>
        {s.task_ref&&<span style={{fontSize:9,color:"rgba(255,255,255,0.15)",overflow:"hidden",textOverflow:"ellipsis",maxWidth:100}}>{s.task_ref}</span>}
      </div>)}</div>
    </div>;
  };

  return<div style={{padding:"16px",overflowY:"auto",height:"100%",boxSizing:"border-box"}}>
    <div style={{marginBottom:16}}><span style={{fontSize:11,fontWeight:700,color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>Platform Health</span><span style={{fontSize:10,color:"rgba(255,255,255,0.2)",marginLeft:8}}>Auto-refreshes every 30s</span></div>
    <HealthCard title="Fleet + Cluster" endpoint="/health/summary" render={renderSummary}/>
    <HealthCard title="Seidr Memory" endpoint="/health/seidr" render={renderSeidr}/>
    <HealthCard title="Task Board" endpoint="/health/tasks" render={renderTasks}/>
    <HealthCard title="PR Velocity" endpoint="/health/prs" render={renderPRs}/>
    <HealthCard title="Stale Branches" endpoint="/health/branches" render={renderBranches}/>
    <HealthCard title="Agent State" endpoint="/fleet/state" render={renderFleetState}/>
  </div>;
};

const lck=(u,a)=>`hirdforge-chat-${u}-${a}`;const lsk=(u,a)=>`hirdforge-session-${u}-${a}`;
const u2s=m=>({role:m.from==="kit"?"user":"assistant",content:m.text||"",timestamp:m.timestamp||Date.now(),kind:m.kind,noticeLevel:m.noticeLevel,noticeAgent:m.noticeAgent});
const s2u=(a,m,uname,source)=>{const u=m.role==="user";const aid=u?"kit":(m.noticeAgent||a);const auto=source==="cronjob";
  return{from:u?"kit":a,agent:u?{id:"kit",name:auto?"CronJob":`${uname||'Sovereign'}`,initial:auto?"C":((uname||'S')[0]?.toUpperCase()||"S"),status:"online"}:{id:aid,name:aid,initial:(aid||"?")[0]?.toUpperCase()||"?",status:"online"},text:m.content||"",time:new Date(m.timestamp||Date.now()).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}),timestamp:m.timestamp||Date.now(),streaming:false,toolCalls:[],toolResults:[],kind:m.kind,noticeLevel:m.noticeLevel,noticeAgent:m.noticeAgent};};
const eventColor=type=>{
  const t=(type||"").toLowerCase();
  if(t.includes("failed")||t.includes("error"))return "red";
  if(t.includes("approval")||t.includes("pause")||t.includes("review"))return "amber";
  if(t.includes("merge")||t.includes("complete")||t.includes("sync"))return "green";
  if(t.includes("dispatch")||t.includes("message")||t.includes("tool")||t.includes("recon"))return "blue";
  return "blue";
};
const barTone=v=>v>80?"var(--red)":v>=60?"var(--amber)":"var(--green)";
const safePct=v=>`${Math.max(0,Math.round(Number(v)||0))}%`;
const summarizeApprovalParams=params=>{try{const txt=JSON.stringify(params||{});return txt.length>160?`${txt.slice(0,160)}…`:txt;}catch{return "{}";}};
const extractFileName=text=>{const m=(text||"").match(/([A-Za-z0-9_./-]+\.[A-Za-z0-9]+)/);return m?m[1]:"working set";};
const summarizeEvent=e=>e?.summary||e?.message||e?.result||e?.error||e?.type||"event";
const progressFromEventType=type=>({recon_started:18,recon_reading:28,tool_call:55,message:62,injection_sent:66,webhook_peer_review:78,webhook_freya_review:88,pr_created:100,task_complete:100,task_failed:100})[(type||"").toLowerCase()]||45;

function MissionControlView({agents,fleetState,approvals,approvalStatus,approvalBusy,onApproval,prs,prActionBusy,onPRAction,events,feedCollapsed,onToggleFeed,onOpenChat}){
  const openPRs=useMemo(()=>prs.filter(pr=>pr.state==="open"),[prs]);
  const[ciStatusByPR,setCiStatusByPR]=useState({});
  const[openToolCalls,setOpenToolCalls]=useState({});
  const activeGroups=useMemo(()=>{
    const byTask={};
    (fleetState||[]).filter(item=>item.active).forEach(item=>{
      const key=item.task_ref||item.session_id||item.name;
      if(!byTask[key])byTask[key]={key,title:item.task_ref||`Session ${item.session_id||item.name}`,agents:[]};
      const latest=(events||[]).find(ev=>(ev.agent||"").toLowerCase()===item.name);
      const toolCalls=(events||[]).filter(ev=>ev.type==="tool_call"&&(ev.agent||"").toLowerCase()===item.name).slice(0,10);
      byTask[key].agents.push({
        name:item.name,
        status:summarizeEvent(latest),
        file:extractFileName(summarizeEvent(latest)),
        progress:progressFromEventType(latest?.type),
        since:item.since,
        toolCalls
      });
    });
    return Object.values(byTask);
  },[fleetState,events]);
  useEffect(()=>{
    const activeAgents=new Set((fleetState||[]).filter(item=>item.active).map(item=>item.name));
    setOpenToolCalls(prev=>{
      const next={...prev};
      Object.keys(next).forEach(name=>{if(!activeAgents.has(name))delete next[name];});
      return next;
    });
  },[fleetState]);
  useEffect(()=>{
    let cancelled=false;
    openPRs.forEach(pr=>{
      const key=`${pr.repo}-${pr.number}`;
      if(ciStatusByPR[key])return;
      prAction(pr.repo,pr.number,"status").then(out=>{
        if(cancelled)return;
        setCiStatusByPR(prev=>({...prev,[key]:out.ok?(out.data||{status:"unknown"}):{status:"unknown"}}));
      });
    });
    return()=>{cancelled=true;};
  },[openPRs,ciStatusByPR]);
  return <div className="mission-grid" style={{gridTemplateColumns:feedCollapsed?"180px minmax(0,1fr) 32px":"180px minmax(0,1fr) 240px"}}>
    <aside className="warband-sidebar">
      <div className="sidebar-head">
        <div className="section-kicker">Warband</div>
        <div className="section-title">Builders</div>
      </div>
      <div className="agent-rail">
        {agents.map(agent=>{
          const state=(fleetState||[]).find(item=>item.name===agent.id)||{};
          const isActive=!!state.active;
          return <button key={agent.id} className="agent-row" onClick={()=>onOpenChat(agent.id)}>
            <span className={`status-dot ${agent.status==="online"?"green":"red"} ${isActive?"pulse":""}`}/>
            <span>
              <div className="agent-row-name">{agent.id}</div>
              <div className="agent-row-task">{state.task_ref||state.source||agent.last_action||"idle"}</div>
            </span>
          </button>;
        })}
      </div>
    </aside>
    <main className="mission-center">
      <section className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">Sovereign required</div>
            <div className="panel-subtitle">Pending Lockbox decisions and merge-ready pull requests.</div>
            {approvalStatus==="unavailable"&&<div className="subtle" style={{marginTop:4,color:"var(--amber)"}}>Approval queue temporarily unavailable.</div>}
          </div>
          <div className="subtle">{approvals.filter(item=>item.status==="pending").length+openPRs.length} items</div>
        </div>
        <div className="queue-grid">
          {approvals.filter(item=>item.status==="pending").map(item=><div key={item.queue_id} className="queue-card warning">
            <div className="queue-header">
              <div>
                <div className="queue-type">Approval queue</div>
                <div className="queue-title">{item.action||"pending action"}</div>
              </div>
              <div className="subtle">{fAgo(item.queued_at)}</div>
            </div>
            <div className="queue-meta">{summarizeApprovalParams(item.params)}</div>
            <div className="queue-actions">
              <button className="flat-btn green" disabled={!!approvalBusy[item.queue_id]} onClick={()=>onApproval(item.queue_id,true)}>Approve</button>
              <button className="flat-btn red" disabled={!!approvalBusy[item.queue_id]} onClick={()=>onApproval(item.queue_id,false)}>Reject</button>
            </div>
          </div>)}
          {openPRs.map(pr=>{const key=`${pr.repo}-${pr.number}`;const ci=ciStatusByPR[key]||{status:"unknown"};const mergeDisabled=!pr.mergeable||ci.status==="failure"||!!prActionBusy[`${key}-merge`];
            return <div key={key} className="queue-card info">
            <div className="queue-header">
              <div>
                <div className="queue-type">Pull request</div>
                <div className="queue-title">#{pr.number} {pr.title}</div>
                <div className="queue-badges">
                  <Badge text={`${pr.approvals||0} approvals`} color="rgba(34,211,238,0.16)"/>
                  <Badge text={pr.mergeable?"mergeable":"blocked"} color={pr.mergeable?"rgba(52,211,153,0.16)":"rgba(239,68,68,0.16)"}/>
                  <Badge text={`${ciGlyph(ci.status)} ${ci.status||"unknown"}`} color={ciTone(ci.status)} />
                </div>
              </div>
              <div className="subtle">{pr.repo}</div>
            </div>
            <div className="queue-meta">{pr.user} · {pr.base} ← {pr.head}{ci.workflow?` · ${ci.workflow}`:""}{ci.duration?` · ${ci.duration}`:""}</div>
            <div className="queue-actions">
              <button className="flat-btn blue" disabled={mergeDisabled} onClick={()=>onPRAction(pr.repo,pr.number,"merge")}>Merge</button>
              <button className="flat-btn green" disabled={!!prActionBusy[`${key}-approve`]} onClick={()=>onPRAction(pr.repo,pr.number,"approve")}>Approve</button>
              <button className="flat-btn red" disabled={!!prActionBusy[`${key}-close`]} onClick={()=>onPRAction(pr.repo,pr.number,"close")}>Close</button>
              <a className="flat-btn" style={{display:"inline-flex",alignItems:"center",textDecoration:"none"}} href={pr.html_url} target="_blank" rel="noreferrer">Open in Gitea</a>
            </div>
          </div>;})}
          {!approvals.filter(item=>item.status==="pending").length&&!openPRs.length&&<div className="empty-state">No approvals or pull requests are waiting on sovereign action.</div>}
        </div>
      </section>
      <section className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">Active operations</div>
            <div className="panel-subtitle">Live task execution grouped by current assignment.</div>
          </div>
          <div className="subtle">{activeGroups.length} active task{activeGroups.length===1?"":"s"}</div>
        </div>
        <div className="operations-list">
          {activeGroups.map(group=><div key={group.key} className="operation-group">
            <div className="operation-head">
              <div>
                <div className="operation-title">{group.title}</div>
                <div className="operation-meta">{group.agents.length} agent{group.agents.length===1?"":"s"} engaged</div>
              </div>
            </div>
            {group.agents.map(row=><div key={`${group.key}-${row.name}`}>
              <div className="operation-row">
              <div>
                <div className="operation-agent">{row.name}</div>
                <div className="subtle">{row.since?fAgo(new Date(row.since*1000).toISOString()):"active now"}</div>
              </div>
              <div>
                <div className="operation-status">{row.file} · {row.status}</div>
                <div className="progress-track"><div className="progress-fill" style={{width:`${row.progress}%`,background:"var(--blue)"}}/></div>
              </div>
              <div className="subtle" style={{textAlign:"right"}}>
                <div>{row.progress}%</div>
                {!!row.toolCalls.length&&<button className="toggle-chip" style={{marginTop:6}} onClick={()=>setOpenToolCalls(prev=>({...prev,[row.name]:!prev[row.name]}))}>{openToolCalls[row.name]?"Hide tools":"Show tools"}</button>}
              </div>
            </div>
            {openToolCalls[row.name]&&!!row.toolCalls.length&&<div className="tool-call-list">
              {row.toolCalls.map((call,index)=><div key={`${row.name}-${index}-${call.timestamp||index}`} className="tool-call-item">
                <div className="tool-call-main">
                  <div className="tool-call-title">{call.tool||"tool"}</div>
                  <div className="tool-call-meta">{toolSnippet(call.args)}</div>
                </div>
                <div className="subtle" style={{color:call.error?"var(--red)":"var(--green)"}}>{call.error?"error":"ok"}</div>
              </div>)}
            </div>}
            </div>)}
          </div>)}
          {!activeGroups.length&&<div className="empty-state">No active operations are running right now.</div>}
        </div>
      </section>
    </main>
    <aside className={`activity-feed ${feedCollapsed?"collapsed":""}`}>
      <div className="feed-head">
        {feedCollapsed?<div/>:<div><div className="section-kicker">Feed</div><div className="panel-subtitle">Last 200 events</div></div>}
        <button className="feed-toggle" onClick={onToggleFeed}>{feedCollapsed?"‹":"›"}</button>
      </div>
      {feedCollapsed?<div className="feed-strip"><span>Activity</span></div>:<div className="feed-list">
        {(events||[]).map((event,index)=><div key={`${event.timestamp||index}-${index}`} className="feed-item">
          <div className="feed-time">{fT(event.timestamp)}</div>
          <div className="feed-agent">{event.agent||"system"}</div>
          <div className="feed-summary" style={{color:`var(--${eventColor(event.type)})`}}>{summarizeEvent(event)}</div>
        </div>)}
        {!(events||[]).length&&<div className="empty-state">Waiting for WebSocket events.</div>}
      </div>}
    </aside>
  </div>;
}

function ClusterView({nodes,pods,gitops,gitopsStatus,onRefreshGitops,toast}){
  const[expanded,setExpanded]=useState({});
  const[logsByPod,setLogsByPod]=useState({});
  const[loadingLogs,setLoadingLogs]=useState({});
  const[restartArmed,setRestartArmed]=useState({});
  const[syncing,setSyncing]=useState(false);
  useEffect(()=>{
    const next={};
    (pods||[]).filter(p=>(p.namespace||"valhalla")==="valhalla"&&(p.restarts||0)>=3).forEach(p=>{next[p.name]=true;});
    setExpanded(prev=>Object.keys(prev).length?prev:next);
  },[pods]);
  const loadLogs=async podName=>{
    setLoadingLogs(prev=>({...prev,[podName]:true}));
    const res=await fetch(`/api/v1/cluster/pods/valhalla/${encodeURIComponent(podName)}/logs?tail=50`).catch(()=>null);
    if(!res){setLogsByPod(prev=>({...prev,[podName]:"Gateway could not reach the log endpoint."}));setLoadingLogs(prev=>({...prev,[podName]:false}));return;}
    if(res.status===404){setLogsByPod(prev=>({...prev,[podName]:"Log endpoint not available yet on this gateway build."}));setLoadingLogs(prev=>({...prev,[podName]:false}));return;}
    const text=await res.text();
    setLogsByPod(prev=>({...prev,[podName]:text||"(empty log output)"}));
    setLoadingLogs(prev=>({...prev,[podName]:false}));
  };
  const toggleExpand=podName=>{
    setExpanded(prev=>{
      const next=!prev[podName];
      const out={...prev,[podName]:next};
      if(next&&!logsByPod[podName]&&!loadingLogs[podName])loadLogs(podName);
      return out;
    });
  };
  const restartPod=async podName=>{
    if(!restartArmed[podName]){
      setRestartArmed(prev=>({...prev,[podName]:true}));
      setTimeout(()=>setRestartArmed(prev=>{const out={...prev};delete out[podName];return out;}),3000);
      return;
    }
    const res=await apiDelete(`/api/v1/cluster/pods/valhalla/${encodeURIComponent(podName)}`);
    if(res.status===404){toast("Pod restart endpoint not available yet.");}
    else if(!res.ok){toast(res.data?.error||"Pod restart failed");}
    else{toast(res.data?.message||`Restart requested for ${podName}`);}
    setRestartArmed(prev=>{const out={...prev};delete out[podName];return out;});
  };
  const gitopsDeployments=Array.isArray(gitops?.deployments)?gitops.deployments:(Array.isArray(gitops?.recent_deployments)?gitops.recent_deployments:[]);
  const triggerSync=async()=>{
    setSyncing(true);
    const out=await apiPost('/api/v1/gitops/sync');
    if(out?.error)toast(out.error);else toast(out?.message||"Sync triggered");
    if(onRefreshGitops)await onRefreshGitops();
    setSyncing(false);
  };
  return <div className="cluster-view">
    <div className="node-grid-mc">
      {["node-cp-1","node-worker-1","node-worker-2"].map(name=>{
        const node=(nodes||[]).find(item=>(item.name||"").toLowerCase().includes(name.toLowerCase()))||{name,status:"Unknown",cpu_percent:0,memory_percent:0};
        const podCount=(pods||[]).filter(p=>(p.node||"").toLowerCase()===(node.name||"").toLowerCase()).length;
        return <div key={name} className="node-card">
          <div className="node-title">
            <div className="node-name">{node.name||name}</div>
            <span className={`status-dot ${String(node.status).toLowerCase()==="ready"?"green":"amber"}`}/>
          </div>
          <div className="node-bars">
            <div>
              <div className="bar-label"><span>CPU</span><span>{safePct(node.cpu_percent)}</span></div>
              <div className="progress-track"><div className="progress-fill" style={{width:safePct(node.cpu_percent),background:barTone(node.cpu_percent)}}/></div>
            </div>
            <div>
              <div className="bar-label"><span>Memory</span><span>{safePct(node.memory_percent)}</span></div>
              <div className="progress-track"><div className="progress-fill" style={{width:safePct(node.memory_percent),background:barTone(node.memory_percent)}}/></div>
            </div>
            <div className="node-stat">{podCount} pods scheduled</div>
          </div>
        </div>;
      })}
    </div>
    <div className="workloads-grid">
      <section className="panel">
        <div className="panel-head">
          <div>
            <div className="panel-title">Workloads</div>
            <div className="panel-subtitle">Valhalla namespace pods with inline logs and restart controls.</div>
          </div>
        </div>
        <div className="pod-table">
          <div className="pod-head"><span/><span>Name</span><span>Restarts</span><span>Age</span><span>Status</span></div>
          {(pods||[]).filter(p=>(p.namespace||"valhalla")==="valhalla").map(pod=><React.Fragment key={pod.name}>
            <div className="pod-line">
              <button className="pod-expand" onClick={()=>toggleExpand(pod.name)}>{expanded[pod.name]?"−":"+"}</button>
              <div className="pod-name"><span className={`status-dot ${pod.ready?"green":"amber"}`}/><span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{pod.name}</span></div>
              <div style={{color:pod.restarts>=3?"var(--red)":pod.restarts>=1?"var(--amber)":"var(--text)"}}>{pod.restarts||0}</div>
              <div className="subtle">{pod.age||"—"}</div>
              <div className="subtle">{pod.status||"unknown"}</div>
            </div>
            {expanded[pod.name]&&<div className="pod-expanded">
              <div className="queue-actions" style={{paddingTop:12}}>
                <button className={`flat-btn ${restartArmed[pod.name]?"red":"amber"}`} onClick={()=>restartPod(pod.name)}>{restartArmed[pod.name]?"Confirm restart":"Restart pod"}</button>
                <button className="flat-btn blue" onClick={()=>loadLogs(pod.name)}>Refresh logs</button>
              </div>
              <div className="log-box">{loadingLogs[pod.name]?"Loading logs…":(logsByPod[pod.name]||"No logs loaded yet.")}</div>
            </div>}
          </React.Fragment>)}
        </div>
      </section>
      <section className="panel">
        <div className="panel-head">
          <div>

function HistoryView({tasks,taskStatus,deployments,deployStatus,agents}){
  const[agentFilter,setAgentFilter]=useState("all");
  const[dateFilter,setDateFilter]=useState("");
  const normalizedTasks=Array.isArray(tasks)?tasks:(Array.isArray(tasks?.tasks)?tasks.tasks:(Array.isArray(tasks?.items)?tasks.items:[]));
  const normalizedDeployments=Array.isArray(deployments)?deployments:(Array.isArray(deployments?.deployments)?deployments.deployments:(Array.isArray(deployments?.items)?deployments.items:[]));
  const filteredTasks=useMemo(()=>normalizedTasks.filter(item=>{
    const itemAgents=Array.isArray(item.agents)?item.agents.map(agent=>String(agent).toLowerCase()):[(item.agent||item.owner||"").toLowerCase()].filter(Boolean);
    const when=(item.closed_at||item.completed_at||item.timestamp||item.time||"").slice(0,10);
    if(agentFilter!=="all"&&!itemAgents.includes(agentFilter))return false;
    if(dateFilter&&when!==dateFilter)return false;
    return true;
  }),[normalizedTasks,agentFilter,dateFilter]);
  return <div className="history-view">
    <div className="history-grid">
      <section className="history-panel">
        <div className="panel-head">
          <div><div className="panel-title">Completed tasks</div><div className="panel-subtitle">Chronological task execution history.</div></div>
        </div>
        <div className="history-filter">
          <select value={agentFilter} onChange={e=>setAgentFilter(e.target.value)}>
            <option value="all">All agents</option>
            {agents.map(agent=><option key={agent.id} value={agent.id}>{agent.id}</option>)}
          </select>
          <input type="date" value={dateFilter} onChange={e=>setDateFilter(e.target.value)}/>
        </div>
        <div className="history-list">
          {taskStatus==="missing"&&<div className="empty-state">`/api/v1/history/tasks` is not available yet.</div>}
          {filteredTasks.map((item,index)=><div key={item.id||index} className="history-item">
            <div className="history-item-title">{item.title||item.task||item.summary||"Completed task"}</div>
            <div className="history-item-meta">{(Array.isArray(item.agents)&&item.agents.length?item.agents.join(", "):(item.agent||item.owner||"unknown"))} · {item.closed_at||item.completed_at||item.timestamp||item.time||"—"}</div>
          </div>)}
          {!filteredTasks.length&&taskStatus!=="missing"&&<div className="empty-state">No completed tasks match the current filter.</div>}
        </div>
      </section>
      <section className="history-panel">
        <div className="panel-head">
          <div><div className="panel-title">Deployment log</div><div className="panel-subtitle">Recent releases and rollouts.</div></div>
        </div>
        <div className="history-list">
          {deployStatus==="missing"&&<div className="empty-state">`/api/v1/history/deployments` is not available yet.</div>}
          {normalizedDeployments.map((item,index)=><div key={item.id||index} className="history-item">
            <div className="history-item-title">{item.message||item.service||item.title||item.sha||"Deployment"}</div>
            <div className="history-item-meta">{item.triggered_by||item.status||"unknown"} · {item.deployed_at||item.timestamp||item.time||item.completed_at||"—"}</div>
          </div>)}
          {!normalizedDeployments.length&&deployStatus!=="missing"&&<div className="empty-state">No deployment events returned.</div>}
        </div>
      </section>
    </div>
  </div>;
}

function SettingsViewNext({agents,repos,fleetState,toast}){

  const[settingsStatus,setSettingsStatus]=useState("loading");
  const[modelValue,setModelValue]=useState("");
  const[webhookURL,setWebhookURL]=useState("");
  const[saveBusy,setSaveBusy]=useState(false);
  const[memoryAgent,setMemoryAgent]=useState("");
  const[memoryQuery,setMemoryQuery]=useState("");
