// ═══════════════════════════════════════════════════════════
//  API LAYER — fetch with mock fallback
// ═══════════════════════════════════════════════════════════
async function apiFetch(path, fallback) {
  if (CONFIG.USE_MOCK) return fallback;
  try {
    const res = await fetch(CONFIG.API_BASE + path);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    // Normalize K8s node list
    if (path.includes('cluster/nodes') && data.items) {
      return data.items.map(n => ({
        name: n.metadata?.name || "unknown",
        ip: (n.status?.addresses?.find(a => a.type === "InternalIP") || {}).address || "—",
        role: Object.keys(n.metadata?.labels || {}).filter(l => l.startsWith("node-role")).map(l => l.split("/")[1]).join("+") || "worker",
        status: n.status?.conditions?.find(c => c.type === "Ready")?.status === "True" ? "Ready" : "NotReady",
        pods: 0, cpu_percent: 0, memory_percent: 0,
      }));
    }
    return data;
  } catch (e) {
    console.warn(`API ${path} failed, using fallback:`, e.message);
    return fallback;
  }
}

function usePolledData(path, fallback, interval) {
  const [data, setData] = useState(fallback);
  useEffect(() => {
    let mounted = true;
    const poll = async () => {
      const d = await apiFetch(path, fallback);
      if (mounted) {
        // Normalize agent data from gateway format
        if (path === '/api/v1/agents' && Array.isArray(d)) {
          const normalized = d.map(a => ({
            id: a.name || a.id,
            name: a.display_name || a.name || a.id,
            role: a.role || "Agent",
            model: a.model || "unknown",
            backend: a.backend || "unknown",
            status: a.healthy === false ? "offline" : (a.healthy ? "online" : (a.status || "offline")),
            tools: a.tools || [],
            uptime_seconds: a.uptime_seconds || 0,
            tasks_completed: a.tasks_completed || 0,
            last_action: a.last_action || "—",
            ping_ms: a.ping_ms || a.latency_ms || null,
            cpu_percent: a.cpu_percent || 0,
            memory_percent: a.memory_percent || 0,
            initial: (a.display_name || a.name || a.id || "?")[0].toUpperCase(),
          }));
          setData(normalized.length > 0 ? normalized : fallback);
        } else {
          setData(d);
        }
      }
    };
    poll();
    const id = setInterval(poll, interval || CONFIG.POLL_INTERVAL);
    return () => { mounted = false; clearInterval(id); };
  }, [path]);
  return data;
}

function useEventStream() {
  const [events, setEvents] = useState(MOCK_EVENTS);
  const [connected, setConnected] = useState(CONFIG.USE_MOCK);

  useEffect(() => {
    if (CONFIG.USE_MOCK) return;
    const wsUrl = CONFIG.WS_URL || `${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/events`;
    let ws;
    let retryDelay = 3000;
    const connect = () => {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => { setConnected(true); retryDelay = 3000; };
      ws.onclose = () => { setConnected(false); retryDelay = Math.min(retryDelay * 2, 30000); setTimeout(connect, retryDelay); };
      ws.onmessage = (e) => {
        try {
          const evt = JSON.parse(e.data);
          setEvents(prev => [evt, ...prev].slice(0, 100));
        } catch {}
      };
    };
    connect();
    return () => ws?.close();
  }, []);

  return { events, connected };
}

// ═══════════════════════════════════════════════════════════
//  CHAT API
// ═══════════════════════════════════════════════════════════
async function streamChat(agentId, message, onChunk, onDone, onError) {
  if (CONFIG.USE_MOCK) {
    onChunk(`[MOCK] ${agentId} received: "${message}".`);
    onDone();
    return;
  }
  try {
    const res = await fetch(`${CONFIG.API_BASE}/api/v1/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent: agentId, content: message, session_id: "hirdforge-" + Date.now() }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({error: res.statusText}));
      onError(`Error: ${err.error || res.statusText}`);
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const chunk = JSON.parse(line.slice(6));
          if (chunk.type === 'content' && chunk.content) onChunk(chunk.content);
          if (chunk.done) { onDone(); return; }
        } catch {}
      }
    }
    onDone();
  } catch (e) {
    onError(`Failed to reach ${agentId}: ${e.message}`);
  }
}

const CommsView = ({agents, events, wsConnected, chatHistory, setChatHistory, msg, setMsg, target, setTarget, sending, setSending}) => {
  const chatEnd = useRef(null);
  const ta = agents.find(a => a.id === target) || MOCK_AGENTS[0];
  const tc = AGENT_COLORS[target] || "#818cf8";

  useEffect(() => { chatEnd.current?.scrollIntoView({behavior:'smooth'}); }, [chatHistory]);

  const handleSend = async () => {
    if (!msg.trim() || sending) return;
    const userMsg = {from:"kit",agent:{id:"kit",name:"Kit (Sovereign)",initial:"K",status:"online"},text:msg,time:new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'})};
    const sentMsg = msg;
    setChatHistory(prev => [...prev, userMsg]);
    setMsg("");
    setSending(true);
    const timeStr = new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'});
    setChatHistory(prev => [...prev, {from:target,agent:ta,text:"",time:timeStr,streaming:true}]);
    await streamChat(target, sentMsg,
      (chunk) => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.text = (last.text||"") + chunk;
          u[u.length-1] = last; return u;
        });
      },
      () => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.streaming = false;
          if (!last.text) last.text = "(empty response)";
          u[u.length-1] = last; return u;
        });
        setSending(false);
      },
      (err) => {
        setChatHistory(prev => {
          const u = [...prev]; const last = {...u[u.length-1]};
          last.text = err; last.streaming = false;
          u[u.length-1] = last; return u;
        });
        setSending(false);
      }
    );
  };

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 340px",height:"100%"}}>
      {/* CHAT PANE */}
      <div style={{display:"flex",flexDirection:"column",borderRight:"1px solid rgba(255,255,255,0.04)"}}>
        {/* Agent selector */}
        <div style={{display:"flex",alignItems:"center",gap:0,borderBottom:"1px solid rgba(255,255,255,0.04)",background:"rgba(0,0,0,0.15)"}}>
          {agents.map(a => {
            const ac = AGENT_COLORS[a.id]; const sel = target===a.id;
            return (
              <button key={a.id} onClick={()=>setTarget(a.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"10px 14px",background:sel?`${ac}08`:"transparent",border:"none",borderBottom:sel?`2px solid ${ac}`:"2px solid transparent",cursor:"pointer",transition:"all 0.15s"}}>
                <AgentAvatar agent={a} size={20} showStatus={false} />
                <span style={{fontSize:10,fontWeight:sel?700:400,color:sel?ac:"rgba(255,255,255,0.25)",fontFamily:"'IBM Plex Mono',monospace"}}>{a.id.slice(0,3).toUpperCase()}</span>
              </button>
            );
          })}
          <div style={{marginLeft:"auto",padding:"0 14px"}}>
            <button style={{padding:"5px 12px",fontSize:8,fontWeight:700,letterSpacing:"0.12em",background:"linear-gradient(135deg,rgba(251,191,36,0.12),rgba(251,191,36,0.04))",border:"1px solid rgba(251,191,36,0.2)",color:"#fbbf24",cursor:"pointer",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>⚡ Broadcast</button>
          </div>
        </div>

        {/* Context strip */}
        <div style={{display:"flex",alignItems:"center",gap:12,padding:"8px 18px",background:`linear-gradient(90deg, ${tc}06, transparent)`,borderBottom:"1px solid rgba(255,255,255,0.03)"}}>
          <AgentAvatar agent={ta} size={24} />
          <div style={{flex:1}}><span style={{fontSize:11,fontWeight:700,color:tc}}>{ta.name}</span><span style={{fontSize:9,color:"rgba(255,255,255,0.2)",marginLeft:8}}>{ta.role}</span></div>
          <Badge text={ta.model} color={tc} />
          <span style={{fontSize:9,color:"rgba(255,255,255,0.2)",fontFamily:"'IBM Plex Mono',monospace"}}>{ta.ping_ms?`${ta.ping_ms}ms`:"offline"}</span>
        </div>

        {/* Messages */}
        <div style={{flex:1,overflow:"auto",padding:"20px",display:"flex",flexDirection:"column",gap:20}}>
          {chatHistory.map((m,i) => <ChatBubble key={i} msg={m} isLast={i===chatHistory.length-1} />)}
          {sending && chatHistory.length > 0 && chatHistory[chatHistory.length-1].text === "" && (
            <div style={{display:"flex",gap:12,alignItems:"center",opacity:0.6,paddingLeft:4}}>
              <AgentAvatar agent={ta} size={20} showStatus={false} />
              <Glass style={{padding:"8px 14px",display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:9,color:tc,fontWeight:600}}>{ta.name.split(' ')[0]}</span>
                <TypingIndicator color={tc} />
              </Glass>
            </div>
          )}
          <div ref={chatEnd} />
        </div>

        {/* Input */}
        <div style={{padding:"14px 18px",borderTop:"1px solid rgba(255,255,255,0.04)",background:"linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.2))",display:"flex",gap:6}}>
          <input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder={`Command ${ta.name}...`}
            style={{flex:1,background:"rgba(255,255,255,0.02)",border:`1px solid ${tc}15`,padding:"14px 18px",color:"#e2e8f0",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",outline:"none"}} />
          <button onClick={handleSend} style={{padding:"14px 28px",background:`linear-gradient(135deg, ${tc}30, ${tc}15)`,border:`1px solid ${tc}40`,color:tc,fontSize:10,fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,cursor:"pointer",letterSpacing:"0.14em",textTransform:"uppercase",boxShadow:`0 0 24px ${tc}15`}}>SEND</button>
        </div>
      </div>

      {/* EVENT STREAM */}
      <div style={{display:"flex",flexDirection:"column",background:"rgba(0,0,0,0.2)"}}>
        <div style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,0.04)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:wsConnected?"#ef4444":"#6b7280",animation:wsConnected?"rec-pulse 1.5s ease infinite":"none"}} />
            <span style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.3)",letterSpacing:"0.16em",textTransform:"uppercase"}}>{wsConnected?"Live Feed":"Disconnected"}</span>
          </div>
          <span style={{fontSize:9,color:"rgba(255,255,255,0.12)",fontFamily:"'IBM Plex Mono',monospace"}}>{events.length} events</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:1,padding:"1px",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
          {[{l:"DELEGATES",val:events.filter(e=>e.type==="delegate").length,c:"#818cf8"},{l:"GIT OPS",val:events.filter(e=>e.type==="git").length,c:"#34d399"},{l:"ALERTS",val:events.filter(e=>e.type==="alert").length,c:"#fbbf24"}].map(s=>(
            <div key={s.l} style={{padding:"8px 10px",background:"rgba(0,0,0,0.15)",textAlign:"center"}}>
              <div style={{fontSize:16,fontWeight:800,color:s.c,fontFamily:"'Space Grotesk',sans-serif"}}>{s.val}</div>
              <div style={{fontSize:7,color:"rgba(255,255,255,0.2)",letterSpacing:"0.14em",marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{flex:1,overflow:"auto"}}>{events.map((e,i)=><EventEntry key={i} event={e} idx={i} />)}</div>
        <div style={{padding:"6px 14px",borderTop:"1px solid rgba(255,255,255,0.03)",display:"flex",justifyContent:"space-between",fontSize:8,color:"rgba(255,255,255,0.12)"}}>
          <span>WebSocket: <span style={{color:wsConnected?"#34d399":"#ef4444"}}>{wsConnected?"connected":"reconnecting"}</span></span>
          <span>Gateway</span>
        </div>
      </div>
    </div>
  );
};

          <div style={{fontSize:9,fontWeight:600,letterSpacing:"0.16em",textTransform:"uppercase",color:"rgba(255,255,255,0.2)",marginBottom:10}}>Services</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
            {[{n:"Gateway",p:"8080"},{n:"Seidr",p:"8082"},{n:"ChromaDB",p:"8000"},{n:"Bifrost",p:"3000"},{n:"Gitea",p:"30637"},{n:"ArgoCD"},{n:"cert-manager"},{n:"ingress-nginx",p:"30447"}].map(s=>(
              <Glass key={s.n} style={{padding:"7px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}><GlowPip status="online" size={4} /><span style={{fontSize:10,color:"#e2e8f0"}}>{s.n}</span></div>
                {s.p && <span style={{fontSize:9,color:"rgba(255,255,255,0.15)",fontFamily:"'IBM Plex Mono',monospace"}}>:{s.p}</span>}
              </Glass>
            ))}
          </div>
        </div>
      </div>
    </div>
  </div>
);

// ═══════════════════════════════════════════════════════════
//  MAIN APP
// ═══════════════════════════════════════════════════════════
const Tab = ({active,label,count,onClick}) => (
  <button onClick={onClick} style={{background:"none",border:"none",position:"relative",color:active?"#e2e8f0":"rgba(255,255,255,0.2)",padding:"12px 0",marginRight:28,cursor:"pointer",fontSize:10,fontFamily:"'IBM Plex Mono',monospace",fontWeight:active?700:400,letterSpacing:"0.14em",textTransform:"uppercase",transition:"all 0.15s"}}>
    <span>{label}</span>
    {count && <span style={{marginLeft:6,fontSize:9,fontWeight:700,color:active?"#818cf8":"rgba(255,255,255,0.12)"}}>{count}</span>}
    {active && <div style={{position:"absolute",bottom:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#818cf8,#818cf800)",boxShadow:"0 0 8px rgba(129,140,248,0.3)"}} />}
  </button>
);

function App() {
  const [tab, setTab] = useState("comms");
  const [selected, setSelected] = useState(0);

  // Chat state - moved to App level to persist across tab switches
  const [chatHistory, setChatHistory] = useState([]);
  const [msg, setMsg] = useState("");
  const [target, setTarget] = useState("ragnar");
  const [sending, setSending] = useState(false);

  // Live data hooks
  const agents = usePolledData('/api/v1/agents', MOCK_AGENTS, CONFIG.POLL_INTERVAL);
  const nodes = usePolledData('/api/v1/cluster/nodes', MOCK_NODES, CONFIG.POLL_INTERVAL * 2);
  const pods = usePolledData('/api/v1/cluster/pods', [], CONFIG.POLL_INTERVAL * 2);
  const commits = usePolledData('/api/v1/gitea/commits', [], CONFIG.POLL_INTERVAL * 3);
  const gpus = MOCK_GPUS; // GPU endpoint not yet implemented
  const { events, connected: wsConnected } = useEventStream();

  const online = agents.filter(a => a.status === "online").length;

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* TOP BAR */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 18px",height:44,minHeight:44,borderBottom:"1px solid rgba(255,255,255,0.04)",background:"linear-gradient(90deg,rgba(10,10,20,0.95),rgba(6,6,16,0.95))",position:"relative"}}>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:1,background:"linear-gradient(90deg,transparent,rgba(99,102,241,0.12),transparent)"}} />
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:8,height:8,background:"#818cf8",boxShadow:"0 0 14px rgba(129,140,248,0.5)",borderRadius:1}} />
            <span style={{fontSize:12,fontWeight:800,letterSpacing:"0.22em",color:"#e2e8f0",fontFamily:"'Space Grotesk',sans-serif"}}>HIRDFORGE</span>
          </div>
          <div style={{width:1,height:18,background:"rgba(255,255,255,0.05)"}} />
          <span style={{fontSize:9,color:"rgba(255,255,255,0.15)",letterSpacing:"0.12em"}}>VALHALLA CLUSTER</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:18}}>
          {[{l:"CLUSTER",s:"online"},{l:"ARGOCD",s:"online"},{l:"GITEA",s:"online"}].map(x=>(
            <div key={x.l} style={{display:"flex",alignItems:"center",gap:5,fontSize:9,color:"rgba(255,255,255,0.2)"}}>
              <GlowPip status={x.s} size={4} /><span>{x.l}</span>
            </div>
          ))}
          <div style={{width:1,height:18,background:"rgba(255,255,255,0.05)"}} />
          <span style={{fontSize:10,fontFamily:"'Space Grotesk',sans-serif"}}>
            <span style={{color:"#34d399",fontWeight:700}}>{online}</span>
            <span style={{color:"rgba(255,255,255,0.12)"}}> / {agents.length}</span>
          </span>
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",padding:"0 18px",borderBottom:"1px solid rgba(255,255,255,0.04)",background:"rgba(0,0,0,0.12)"}}>
        <Tab active={tab==="comms"} label="Comms" count={String(events.length)} onClick={()=>setTab("comms")} />
        <Tab active={tab==="fleet"} label="Warriors" count={String(agents.length)} onClick={()=>setTab("fleet")} />
        <Tab active={tab==="ops"} label="Realm" onClick={()=>setTab("ops")} />
      </div>

      {/* CONTENT */}
      <div style={{flex:1,overflow:"hidden"}}>
        {tab==="fleet" && <FleetView agents={agents} selected={selected} setSelected={setSelected} />}
        {tab==="ops" && <OpsView agents={agents} nodes={nodes} gpus={gpus} pods={pods} commits={commits} />}
        {tab==="comms" && <CommsView agents={agents} events={events} wsConnected={wsConnected} chatHistory={chatHistory} setChatHistory={setChatHistory} msg={msg} setMsg={setMsg} target={target} setTarget={setTarget} sending={sending} setSending={setSending} />}
      </div>

      {/* STATUS BAR */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 18px",height:24,minHeight:24,borderTop:"1px solid rgba(255,255,255,0.03)",background:"rgba(0,0,0,0.3)",fontSize:8,color:"rgba(255,255,255,0.15)"}}>
        <div style={{display:"flex",gap:16}}><span>{agents.length+3} pods</span><span>3 nodes</span><span>4 GPUs</span><span>{agents.length} agents</span></div>
        <div style={{display:"flex",gap:16}}>
          <span>WS: <span style={{color:wsConnected?"#34d399":"#ef4444"}}>{wsConnected?"✓":"✗"}</span></span>
          <span>ArgoCD: <span style={{color:"#34d399"}}>Healthy</span></span>
          <span style={{color:"rgba(255,255,255,0.08)"}}>v0.6.0-s6</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
