//   --go-grpc_out=. --go-grpc_opt=paths=source_relative \
//   proto/a2a/a2a.proto
syntax = "proto3";

package a2a;

option go_package = "git.hirdforge.com/kit/hirdforge/proto/a2a";

import "google/protobuf/struct.proto";

service A2AService {
  rpc SendMessage(SendMessageRequest) returns (Task);
  rpc SendStreamingMessage(SendMessageRequest) returns (stream TaskEvent);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc CancelTask(CancelTaskRequest) returns (Task);
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_SUBMITTED = 1;
  TASK_STATE_WORKING = 2;
  TASK_STATE_COMPLETED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_CANCELED = 5;
  TASK_STATE_INPUT_NEEDED = 6;
}

message Task {
  string id = 1;
  string context_id = 2;
  TaskStatus status = 3;
  repeated Artifact artifacts = 4;
  google.protobuf.Struct metadata = 5;
}

message TaskStatus {
  TaskState state = 1;
  string timestamp = 2;
  Message message = 3;
}

message Message {
  string role = 1;
  repeated Part parts = 2;
  string message_id = 3;
}

message Part {
  string text = 1;
  google.protobuf.Value data = 2;
  google.protobuf.Struct metadata = 3;
}

message Artifact {
  string artifact_id = 1;
  repeated Part parts = 2;
}

message PushNotificationConfig {
  string url = 1;
  string token = 2;
}

message TaskStatusUpdateEvent {
  string task_id = 1;
  TaskStatus status = 2;
  bool final = 3;
}

message TaskArtifactUpdateEvent {
  string task_id = 1;
  Artifact artifact = 2;
}

message SendMessageRequest {
  Message message = 1;
  PushNotificationConfig push_notification = 2;
}

message GetTaskRequest {
  string id = 1;
}

message CancelTaskRequest {
  string id = 1;
}

message TaskEvent {
  oneof payload {
    TaskStatusUpdateEvent status_update = 1;
    TaskArtifactUpdateEvent artifact_update = 2;
  }
}
