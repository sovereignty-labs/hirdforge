name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container: golang:1.25-alpine

    steps:
      - name: Install base packages
        run: apk add --no-cache git ca-certificates bash

      - name: Clone repository at workflow SHA
        run: |
          rm -rf /src
          git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src
          cd /src
          git fetch origin ${{ github.sha }}
          git checkout ${{ github.sha }}

      - name: Install static analysis tools
        run: |
          cd /src
          GOBIN=/usr/local/bin go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          GOBIN=/usr/local/bin go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Check gofmt formatting
        run: |
          cd /src
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files need reformatting with gofmt -w:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run staticcheck
        run: |
          cd /src
          staticcheck ./...

      - name: Run gocyclo
        run: |
          cd /src
          # Target threshold is -over 30 once existing legacy hotspots are reduced.
          gocyclo -over 250 .

      - name: Run go vet
        run: |
          cd /src
          go vet ./...

      - name: Run go tests
        run: |
          cd /src
          go test ./... -count=1

      - name: Coverage non-regression ratchet
        run: |
          cd /src
          ./scripts/coverage-ratchet.sh check

      - name: Enforce oversized Go file check
        run: |
          cd /src
          THRESHOLD=1500
          ALLOWLIST=".quality/oversized-go-allowlist.txt"
          exit_code=0
          found_violations=0
          found_grandfathered=0
          if [ ! -f "$ALLOWLIST" ]; then
            echo "ERROR: $ALLOWLIST not found"
            exit 1
          fi
          find . -name '*.go' -type f | sort > /tmp/go-files.txt
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt "$THRESHOLD" ]; then
              if grep -qxF "$file" "$ALLOWLIST"; then
                echo "GRANDFATHERED: $file has $lines lines (threshold $THRESHOLD) — allowlisted"
                found_grandfathered=1
              else
                echo "VIOLATION: $file has $lines lines (threshold $THRESHOLD) — NOT allowlisted"
                found_violations=1
                exit_code=1
              fi
            fi
          done < /tmp/go-files.txt
          if [ "$found_grandfathered" -eq 1 ] && [ "$found_violations" -eq 0 ]; then
            echo "All oversized Go files are grandfathered in the allowlist."
          elif [ "$found_violations" -eq 1 ]; then
            echo "ERROR: New oversized Go files detected. Add them to $ALLOWLIST to grandfather."
          else
            echo "No Go files exceed $THRESHOLD lines."
          fi
          exit $exit_code
