name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    # NOTE: `timeout-minutes` is a backstop, not the real guard — this act_runner
    # was observed running a hung quality job for 100+ minutes past this limit
    # (2026-07-24), wedging the single serialized runner and stalling every queued
    # workflow. The reliable enforcement is the per-step `timeout` binary below:
    # every network-touching step (apk / git / go install / go test) is bounded so
    # an occasional upstream hang fails FAST and legibly instead of blocking CI
    # indefinitely. See docs/DECISIONS.md O-CI-RUNNER-WEDGE.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container: golang:1.25-alpine

    steps:
      # O-CI-RUNNER-WEDGE root cause: the cluster has NO IPv6 egress
      # ("Network unreachable" to any AAAA), but the public mirrors resolve to an
      # AAAA record first — so apk/go/pip connect to IPv6 and hang until the step
      # timeout kills the job (exitcode 143) before any check runs. Pin each
      # external host to its A record so every fetch goes over IPv4. Resolved at
      # run time (no hardcoded CDN IPs), and a no-op if IPv6 ever works.
      - name: Force IPv4 for external fetches
        run: |
          resolve4() {
            # busybox nslookup is always present; getent is not (pre-apk alpine).
            nslookup -type=A "$1" 2>/dev/null \
              | awk '/^Address: /{print $2} /^Address [0-9]*: /{print $3}' \
              | grep -E '^[0-9]+(\.[0-9]+){3}$' | head -1
          }
          for h in dl-cdn.alpinelinux.org proxy.golang.org sum.golang.org storage.googleapis.com; do
            ip=$(resolve4 "$h")
            if [ -n "$ip" ]; then
              echo "$ip  $h" >> /etc/hosts
              echo "pinned $h -> $ip"
            else
              echo "WARN: no A record for $h (leaving unpinned)"
            fi
          done

      - name: Install base packages
        run: timeout 180 apk add --no-cache git ca-certificates bash

      - name: Clone repository at workflow SHA
        run: |
          rm -rf /src
          timeout 180 git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src
          cd /src
          timeout 120 git fetch origin ${{ github.sha }}
          git checkout ${{ github.sha }}

      - name: Install static analysis tools
        run: |
          cd /src
          timeout 300 env GOBIN=/usr/local/bin go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          timeout 300 env GOBIN=/usr/local/bin go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Check gofmt formatting
        run: |
          cd /src
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files need reformatting with gofmt -w:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run staticcheck
        run: |
          cd /src
          timeout 420 staticcheck ./...

      - name: Run gocyclo
        run: |
          cd /src
          # Target threshold is -over 30 once existing legacy hotspots are reduced.
          gocyclo -over 250 .

      - name: Run go vet
        run: |
          cd /src
          timeout 420 go vet ./...

      - name: Run go tests
        run: |
          cd /src
          timeout 600 go test ./... -count=1

      - name: Coverage non-regression ratchet
        run: |
          cd /src
          ./scripts/coverage-ratchet.sh check

      - name: Enforce oversized Go file check
        run: |
          cd /src
          THRESHOLD=1500
          ALLOWLIST=".quality/oversized-go-allowlist.txt"
          exit_code=0
          found_violations=0
          found_grandfathered=0
          if [ ! -f "$ALLOWLIST" ]; then
            echo "ERROR: $ALLOWLIST not found"
            exit 1
          fi
          find . -name '*.go' -type f | sort > /tmp/go-files.txt
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt "$THRESHOLD" ]; then
              if grep -qxF "$file" "$ALLOWLIST"; then
                echo "GRANDFATHERED: $file has $lines lines (threshold $THRESHOLD) — allowlisted"
                found_grandfathered=1
              else
                echo "VIOLATION: $file has $lines lines (threshold $THRESHOLD) — NOT allowlisted"
                found_violations=1
                exit_code=1
              fi
            fi
          done < /tmp/go-files.txt
          if [ "$found_grandfathered" -eq 1 ] && [ "$found_violations" -eq 0 ]; then
            echo "All oversized Go files are grandfathered in the allowlist."
          elif [ "$found_violations" -eq 1 ]; then
            echo "ERROR: New oversized Go files detected. Add them to $ALLOWLIST to grandfather."
          else
            echo "No Go files exceed $THRESHOLD lines."
          fi
          exit $exit_code
      - name: Redaction check
        # This repository is public. Live addresses, internal DNS and host
        # nicknames must not re-enter it. Added with the 2026-08-02 redaction
        # pass — the gate is what keeps it true, rather than a one-off cleanup
        # that quietly decays.
        run: bash scripts/check-redaction.sh


  seidr-python:
    # Seidr Python quality lane: ruff lint + pytest smoke tests. Always runs —
    # the tests are network/DB/GPU/inference-free and complete in well under a
    # second. Tooling and import deps are pinned in seidr/requirements-dev.txt.
    # See the quality job above: per-step `timeout` is the real guard against a
    # hung network step wedging the shared runner; timeout-minutes is a backstop.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container: python:3.12-slim

    steps:
      # Same O-CI-RUNNER-WEDGE guard as the quality job: no IPv6 egress in the
      # cluster, but these hosts resolve AAAA-first, so apt/pip hang to timeout.
      # python:3.12-slim is glibc, so gai.conf is the cleanest lever here.
      - name: Force IPv4 for external fetches
        run: |
          printf 'precedence ::ffff:0:0/96  100\n' >> /etc/gai.conf
          echo "gai.conf: IPv4 precedence set"

      - name: Install base packages
        run: |
          timeout 180 apt-get update -qq
          timeout 180 apt-get install -y -qq --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Clone repository at workflow SHA
        run: |
          rm -rf /src
          timeout 180 git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src
          cd /src
          timeout 120 git fetch origin ${{ github.sha }}
          git checkout ${{ github.sha }}

      - name: Install Seidr dev tooling (pinned)
        run: |
          cd /src/seidr
          timeout 300 pip install --no-cache-dir -r requirements-dev.txt

      - name: Ruff lint (Seidr)
        run: |
          cd /src/seidr
          ruff check .

      - name: Pytest smoke tests (Seidr)
        run: |
          cd /src/seidr
          pytest
