name: Build and Push
on:
  push:
    branches:
      - main
env:
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  DOCKER_HOST: tcp://localhost:2375
  REGISTRY: registry-proxy.gitea.svc:5000/kit/hirdforge
jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: "true"
      - name: Clone repository
        run: rm -rf /src-agent && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-agent
      - name: Build and push agent
        run: |
          cd /src-agent
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(cmd/agent/|pkg/|go\.mod$|go\.sum$|Dockerfile\.agent$)'; then
            if docker pull $REGISTRY/valhalla-agent:latest 2>/dev/null; then
              docker tag $REGISTRY/valhalla-agent:latest $REGISTRY/valhalla-agent:sha-$SHA_SHORT
            else
              docker build -f Dockerfile.agent -t $REGISTRY/valhalla-agent:latest -t $REGISTRY/valhalla-agent:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-agent:latest
            fi
          else
            docker build -f Dockerfile.agent -t $REGISTRY/valhalla-agent:latest -t $REGISTRY/valhalla-agent:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-agent:latest
          fi
          docker push $REGISTRY/valhalla-agent:sha-$SHA_SHORT
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: "true"
      - name: Clone repository
        run: rm -rf /src-gateway && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-gateway
      - name: Build and push gateway
        run: |
          cd /src-gateway
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(cmd/gateway/|pkg/|go\.mod$|go\.sum$|Dockerfile\.gateway$|ui/)'; then
            if docker pull $REGISTRY/valhalla-gateway:latest 2>/dev/null; then
              docker tag $REGISTRY/valhalla-gateway:latest $REGISTRY/valhalla-gateway:sha-$SHA_SHORT
            else
              docker build -f Dockerfile.gateway -t $REGISTRY/valhalla-gateway:latest -t $REGISTRY/valhalla-gateway:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-gateway:latest
            fi
          else
            docker build -f Dockerfile.gateway -t $REGISTRY/valhalla-gateway:latest -t $REGISTRY/valhalla-gateway:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-gateway:latest
          fi
          docker push $REGISTRY/valhalla-gateway:sha-$SHA_SHORT
  smoke-gateway:
    runs-on: ubuntu-latest
    needs: [build-gateway]
    steps:
      - name: Clone repository
        run: rm -rf /src-gateway && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-gateway
      - name: Build gateway binary
        run: |
          curl -sL https://go.dev/dl/go1.23.0.linux-amd64.tar.gz | tar -C /usr/local -xzf -
          export PATH=$PATH:/usr/local/go/bin
          cd /src-gateway
          SHA_SHORT=$(git rev-parse --short HEAD)
          # Only run smoke test if gateway source changed
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(cmd/gateway/|pkg/|go\.mod$|go\.sum$|Dockerfile\.gateway$|ui/)'; then
            echo "No gateway source changes, skipping smoke test"
            exit 0
          fi
          # Build binary locally (path must match smoke test step below)
          go build -ldflags="-s -w" -o /tmp/valhalla-gateway ./cmd/gateway/
      - name: Run UI render smoke test
        run: |
          cd /src-gateway
          # Start gateway in background (path must match build output above)
          /tmp/valhalla-gateway &
          GATEWAY_PID=$!
          # Wait for server to start (max 10s)
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          # Smoke test: verify React UI rendered
          RESPONSE=$(curl -sf http://localhost:8080/)
          if ! echo "$RESPONSE" | grep -q 'class="mc-app'; then
            echo "ERROR: mc-app class not found in response — React UI failed to render"
            echo "Response preview:"
            echo "$RESPONSE" | head -20
            kill $GATEWAY_PID 2>/dev/null
            exit 1
          fi
          if ! echo "$RESPONSE" | grep -q 'id="root"'; then
            echo "ERROR: id=root not found in response"
            kill $GATEWAY_PID 2>/dev/null
            exit 1
          fi
          echo "SUCCESS: React UI rendered correctly (mc-app class found)"
          kill $GATEWAY_PID 2>/dev/null
          exit 0
