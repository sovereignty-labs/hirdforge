name: Build and Push
on:
  push:
    branches:
      - main
env:
  DOCKER_HOST: tcp://localhost:2375
  REGISTRY: 203.0.113.26:30637/gitea_admin
jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src
      - name: Build and push agent
        run: |
          cd /src
          docker build --no-cache -f Dockerfile.agent -t $REGISTRY/valhalla-agent:latest .
          docker push $REGISTRY/valhalla-agent:latest
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src
      - name: Build and push gateway
        run: |
          cd /src
          docker build --no-cache -f Dockerfile.gateway -t $REGISTRY/valhalla-gateway:latest .
          docker push $REGISTRY/valhalla-gateway:latest
  build-lockbox:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src
      - name: Build and push lockbox
        run: |
          cd /src
          if [ -f Dockerfile.lockbox ]; then
            docker build --no-cache -f Dockerfile.lockbox -t $REGISTRY/valhalla-lockbox:latest .
            docker push $REGISTRY/valhalla-lockbox:latest
          fi
