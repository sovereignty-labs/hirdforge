name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        run: git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src
      
      - name: Build and push agent
        run: |
          cd /src
          docker build -f Dockerfile.agent -t 203.0.113.26:30637/gitea_admin/valhalla-agent:latest .
          docker push 203.0.113.26:30637/gitea_admin/valhalla-agent:latest

  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        run: git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src
      
      - name: Build and push gateway
        run: |
          cd /src
          docker build -f Dockerfile.gateway -t 203.0.113.26:30637/gitea_admin/valhalla-gateway:latest .
          docker push 203.0.113.26:30637/gitea_admin/valhalla-gateway:latest

  build-lockbox:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        run: git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src
      
      - name: Build and push lockbox
        run: |
          cd /src
          if [ -f Dockerfile.lockbox ]; then
            docker build -f Dockerfile.lockbox -t 203.0.113.26:30637/gitea_admin/valhalla-lockbox:latest .
            docker push 203.0.113.26:30637/gitea_admin/valhalla-lockbox:latest
          fi
