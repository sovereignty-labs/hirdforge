name: Build and Push
on:
  push:
    branches:
      - main
env:
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  DOCKER_HOST: tcp://localhost:2375
  REGISTRY: 203.0.113.26:30637/gitea_admin
jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: rm -rf /src-agent && git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src-agent
      - name: Build and push agent
        run: |
          cd /src-agent
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(cmd/agent/|pkg/|go\.mod$|go\.sum$|Dockerfile\.agent$)'; then
            docker pull $REGISTRY/valhalla-agent:latest
            docker tag $REGISTRY/valhalla-agent:latest $REGISTRY/valhalla-agent:sha-$SHA_SHORT
          else
            docker build -f Dockerfile.agent -t $REGISTRY/valhalla-agent:latest -t $REGISTRY/valhalla-agent:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-agent:latest
          fi
          docker push $REGISTRY/valhalla-agent:sha-$SHA_SHORT
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: rm -rf /src-gateway && git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src-gateway
      - name: Build and push gateway
        run: |
          cd /src-gateway
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(cmd/gateway/|pkg/|go\.mod$|go\.sum$|Dockerfile\.gateway$|ui/)'; then
            docker pull $REGISTRY/valhalla-gateway:latest
            docker tag $REGISTRY/valhalla-gateway:latest $REGISTRY/valhalla-gateway:sha-$SHA_SHORT
          else
            docker build -f Dockerfile.gateway -t $REGISTRY/valhalla-gateway:latest -t $REGISTRY/valhalla-gateway:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-gateway:latest
          fi
          docker push $REGISTRY/valhalla-gateway:sha-$SHA_SHORT
  build-seidr:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: rm -rf /src-seidr && git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src-seidr
      - name: Build and push seidr
        run: |
          cd /src-seidr
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(seidr/|Dockerfile\.seidr$)'; then
            docker pull $REGISTRY/valhalla-seidr:latest
            docker tag $REGISTRY/valhalla-seidr:latest $REGISTRY/valhalla-seidr:sha-$SHA_SHORT
          else
            docker build -f Dockerfile.seidr -t $REGISTRY/valhalla-seidr:latest -t $REGISTRY/valhalla-seidr:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-seidr:latest
          fi
          docker push $REGISTRY/valhalla-seidr:sha-$SHA_SHORT
  build-codex:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: rm -rf /src-codex && git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src-codex
      - name: Build and push codex
        run: |
          cd /src-codex
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(cmd/agent/|pkg/|Dockerfile\.codex$)'; then
            docker pull $REGISTRY/valhalla-codex:latest
            docker tag $REGISTRY/valhalla-codex:latest $REGISTRY/valhalla-codex:sha-$SHA_SHORT
          else
            docker build -f Dockerfile.codex -t $REGISTRY/valhalla-codex:latest -t $REGISTRY/valhalla-codex:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-codex:latest
          fi
          docker push $REGISTRY/valhalla-codex:sha-$SHA_SHORT
  build-lockbox:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: rm -rf /src-lockbox && git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src-lockbox
      - name: Build and push lockbox
        run: |
          cd /src-lockbox
          if [ -f Dockerfile.lockbox ]; then
            SHA_SHORT=$(git rev-parse --short HEAD)
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
            if ! echo "$CHANGED" | grep -Eq '^(cmd/lockbox/|pkg/|go\.mod$|go\.sum$|Dockerfile\.lockbox$)'; then
              docker pull $REGISTRY/valhalla-lockbox:latest
              docker tag $REGISTRY/valhalla-lockbox:latest $REGISTRY/valhalla-lockbox:sha-$SHA_SHORT
            else
              docker build -f Dockerfile.lockbox -t $REGISTRY/valhalla-lockbox:latest -t $REGISTRY/valhalla-lockbox:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-lockbox:latest
            fi
            docker push $REGISTRY/valhalla-lockbox:sha-$SHA_SHORT
          fi
  build-hirdforge:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: rm -rf /src-hirdforge && git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src-hirdforge
      - name: Build and push hirdforge
        run: |
          cd /src-hirdforge
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(cmd/hirdforge/|go\.mod$|go\.sum$|Dockerfile\.hirdforge$)'; then
            if docker pull $REGISTRY/valhalla-hirdforge:latest 2>/dev/null; then
              docker tag $REGISTRY/valhalla-hirdforge:latest $REGISTRY/valhalla-hirdforge:sha-$SHA_SHORT
            else
              docker build -f Dockerfile.hirdforge -t $REGISTRY/valhalla-hirdforge:latest -t $REGISTRY/valhalla-hirdforge:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-hirdforge:latest
            fi
          else
            docker build -f Dockerfile.hirdforge -t $REGISTRY/valhalla-hirdforge:latest -t $REGISTRY/valhalla-hirdforge:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-hirdforge:latest
          fi
          docker push $REGISTRY/valhalla-hirdforge:sha-$SHA_SHORT
  build-astgraph:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo "$REGISTRY_PASSWORD" | docker login 203.0.113.26:30637 -u "$REGISTRY_USER" --password-stdin
      - name: Clone repository
        run: rm -rf /src-astgraph && git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src-astgraph
      - name: Build and push astgraph
        run: |
          cd /src-astgraph
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if ! echo "$CHANGED" | grep -Eq '^(cmd/astgraph/|go\.mod$|go\.sum$|Dockerfile\.astgraph$)'; then
            if docker pull $REGISTRY/valhalla-astgraph:latest 2>/dev/null; then
              docker tag $REGISTRY/valhalla-astgraph:latest $REGISTRY/valhalla-astgraph:sha-$SHA_SHORT
            else
              docker build -f Dockerfile.astgraph -t $REGISTRY/valhalla-astgraph:latest -t $REGISTRY/valhalla-astgraph:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-astgraph:latest
            fi
          else
            docker build -f Dockerfile.astgraph -t $REGISTRY/valhalla-astgraph:latest -t $REGISTRY/valhalla-astgraph:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-astgraph:latest
          fi
          docker push $REGISTRY/valhalla-astgraph:sha-$SHA_SHORT
  update-infra:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-agent, build-gateway, build-seidr, build-codex, build-lockbox, build-hirdforge, build-astgraph]
    steps:
      - name: Install tools
        run: apk add --no-cache curl jq python3
      - name: Clone repos
        run: |
          rm -rf /src-code /src-infra
          git clone http://gitea-http.gitea.svc:3000/gitea_admin/project_valhalla.git /src-code
          git clone http://kit:$REGISTRY_PASSWORD@gitea-http.gitea.svc:3000/kit/valhalla-infra.git /src-infra
      - name: Update manifests and create PR
        run: |
          cd /src-code
          SHA_SHORT=$(git rev-parse --short HEAD)
          NEW_TAG="sha-$SHA_SHORT"
          cd /src-infra
          # Update first-party valhalla image tags in YAML manifests (non-JSON) using Python.
          python3 - "$NEW_TAG" <<'PY'
          import pathlib
          import re
          import sys

          new_tag = sys.argv[1].strip()
          root = pathlib.Path("infrastructure")
          image_re = re.compile(
              r'^(\s*image:\s*)"?10\.0\.60\.26:30637/gitea_admin/(valhalla-[^:"\'\s]+):[^\s"\']*"?(\s*(?:#.*)?)$',
              re.MULTILINE,
          )

          updated = []
          for path in sorted(root.rglob("*")):
              if path.suffix.lower() not in {".yaml", ".yml"}:
                  continue
              text = path.read_text(encoding="utf-8")
              if text.lstrip().startswith("{"):
                  # JSON-formatted manifests are handled by jq below.
                  continue

              def replace(m):
                  return f'{m.group(1)}"203.0.113.26:30637/gitea_admin/{m.group(2)}:{new_tag}"{m.group(3)}'

              new_text = image_re.sub(replace, text)
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  updated.append(str(path))

          for file in updated:
              print(f"updated: {file}")
          PY
          # For JSON-formatted deployment files, update only the image field via jq
          # so manually-added env vars/volumes are preserved.
          for file in infrastructure/valhalla/deployment-*.yaml infrastructure/valhalla/deployment-codex.yaml; do
            [ -f "$file" ] || continue
            if jq empty "$file" 2>/dev/null; then
              current_image=$(jq -r '.spec.template.spec.containers[0].image // empty' "$file")
              if [ -n "$current_image" ] && echo "$current_image" | grep -q "gitea_admin/valhalla-"; then
                base_image="${current_image%:*}"
                new_image="$base_image:sha-$SHA_SHORT"
                tmp_file="${file}.tmp"
                jq --arg img "$new_image" '.spec.template.spec.containers[0].image = $img' "$file" > "$tmp_file" && mv "$tmp_file" "$file"
              fi
            fi
          done
          git config user.name "CI Bot" && git config user.email "ci@valhalla.local"
          BRANCH_NAME="ci/update-images-$SHA_SHORT"
          git checkout -b $BRANCH_NAME
          git add -A && git commit -m "ci: update images to sha-$SHA_SHORT"
          git push origin $BRANCH_NAME
          # Create PR via Gitea API
          curl -s -X POST -H "Authorization: token $REGISTRY_PASSWORD" -H "Content-Type: application/json" \
            -d "{\"title\":\"ci: update container images to sha-$SHA_SHORT\",\"body\":\"Automated PR to update container image tags to latest builds\",\"head\":\"$BRANCH_NAME\",\"base\":\"main\"}" \
            http://gitea-http.gitea.svc:3000/api/v1/repos/kit/valhalla-infra/pulls
