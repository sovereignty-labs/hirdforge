name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            203.0.113.26:30637/gitea_admin/valhalla-agent:latest
            203.0.113.26:30637/gitea_admin/valhalla-agent:sha-${{ github.sha }}

      - name: Update infra manifests
        run: |
          git clone http://kit:$GITEA_TOKEN@gitea-http.gitea.svc:3000/kit/valhalla-infra.git /tmp/valhalla-infra
          cd /tmp/valhalla-infra
          for f in infrastructure/valhalla/deployment-{chuck,ivar,knut,orm,ragnar,val}.yaml; do
            sed -i 's|valhalla-agent:latest|valhalla-agent:sha-'${{ github.sha }}'|g' "$f"
          done
          git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "chore: update agent image to sha-${{ github.sha }}" && git push
