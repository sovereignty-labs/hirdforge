name: Build and Push
on:
  push:
    branches:
      - main
      - next
env:
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  DOCKER_HOST: tcp://localhost:2375
  REGISTRY: gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge
jobs:
  # DISABLED 2026-07-24 — opt-in only. Dockerfile.agent (the fat v1 agent image)
  # downloads kubectl/helm/kubeseal/talosctl/crane/yq from the public internet,
  # and the Gitea CI runners are airgapped, so this job can ONLY ever fail.
  #
  # It was failing on every push that touched cmd/agent/ or pkg/ — i.e. exactly
  # the v2 builder-harness work — turning main red and destroying the CI signal
  # (the useful jobs beside it were green the whole time). Evidence: run 1195,
  # build-agent FAILURE while build-agent-sandbox, gateway, seidr, lockbox and
  # hirdforge all succeeded.
  #
  # Nothing consumes the artifact: every v1 agent Deployment in asgard-infra
  # pins an old sha (sha-2ccfdc9 / sha-e2b0f9a) and no manifest tracks :latest.
  # The v2 dispatch path uses valhalla-agent-sandbox (build-agent-sandbox below,
  # built from the lean airgap-safe Dockerfile.agent-sandbox), which is green.
  #
  # To re-enable: set the repo variable BUILD_FAT_AGENT_IMAGE=true, but first
  # make the tool downloads come from an in-cluster mirror instead of the public
  # internet — otherwise it will just fail again. Tracked as an open item in
  # docs/DECISIONS.md.
  build-agent:
    if: ${{ vars.BUILD_FAT_AGENT_IMAGE == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo $REGISTRY_PASSWORD | docker login gitea-http.gitea.svc.cluster.local:3000 -u $REGISTRY_USER --password-stdin
      - name: Clone repository
        run: rm -rf /src-agent && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-agent
      - name: Build and push agent
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd /src-agent
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          # Staging (next) lane: use branch-prefixed tags; never overwrite :latest
          if [ "$BRANCH_NAME" = "next" ]; then
            STAGING_TAG="$REGISTRY/valhalla-agent:sha-next-$SHA_SHORT"
            docker build -f Dockerfile.agent -t "$STAGING_TAG" .
            docker push "$STAGING_TAG"
          elif [ -n "$BRANCH_NAME" ] && ! [ "$BRANCH_NAME" = "main" ]; then
            SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-' | tr -cd 'a-zA-Z0-9-')
            BRANCH_TAG="$REGISTRY/valhalla-agent:sha-$SANITIZED-$SHA_SHORT"
            docker build -f Dockerfile.agent -t "$BRANCH_TAG" .
            docker push "$BRANCH_TAG"
          else
            if ! echo "$CHANGED" | grep -Eq '^(cmd/agent/|pkg/|go\.mod$|go\.sum$|Dockerfile\.agent$)'; then
              if docker pull $REGISTRY/valhalla-agent:latest 2>/dev/null; then
                docker tag $REGISTRY/valhalla-agent:latest $REGISTRY/valhalla-agent:sha-$SHA_SHORT
              else
                docker build -f Dockerfile.agent -t $REGISTRY/valhalla-agent:latest -t $REGISTRY/valhalla-agent:sha-$SHA_SHORT .
                docker push $REGISTRY/valhalla-agent:latest
              fi
            else
              docker build -f Dockerfile.agent -t $REGISTRY/valhalla-agent:latest -t $REGISTRY/valhalla-agent:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-agent:latest
            fi
            docker push $REGISTRY/valhalla-agent:sha-$SHA_SHORT
          fi
  build-agent-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo $REGISTRY_PASSWORD | docker login gitea-http.gitea.svc.cluster.local:3000 -u $REGISTRY_USER --password-stdin
      - name: Clone repository
        run: rm -rf /src-agent-sandbox && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-agent-sandbox
      - name: Build and push sandbox agent
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd /src-agent-sandbox
          SHA_SHORT=$(git rev-parse --short HEAD)
          if [ "$BRANCH_NAME" = "main" ]; then
            docker build -f Dockerfile.agent-sandbox -t $REGISTRY/valhalla-agent-sandbox:latest -t $REGISTRY/valhalla-agent-sandbox:sha-$SHA_SHORT .
            docker push $REGISTRY/valhalla-agent-sandbox:latest
            docker push $REGISTRY/valhalla-agent-sandbox:sha-$SHA_SHORT
          else
            SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-' | tr -cd 'a-zA-Z0-9-')
            docker build -f Dockerfile.agent-sandbox -t $REGISTRY/valhalla-agent-sandbox:sha-$SANITIZED-$SHA_SHORT .
            docker push $REGISTRY/valhalla-agent-sandbox:sha-$SANITIZED-$SHA_SHORT
          fi

  build-gateway:
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo $REGISTRY_PASSWORD | docker login gitea-http.gitea.svc.cluster.local:3000 -u $REGISTRY_USER --password-stdin
      - name: Clone repository
        run: rm -rf /src-gateway && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-gateway
      - name: Build and push gateway
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd /src-gateway
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if [ "$BRANCH_NAME" = "next" ]; then
            STAGING_TAG="$REGISTRY/valhalla-gateway:sha-next-$SHA_SHORT"
            docker build -f Dockerfile.gateway -t "$STAGING_TAG" .
            docker push "$STAGING_TAG"
          elif [ -n "$BRANCH_NAME" ] && ! [ "$BRANCH_NAME" = "main" ]; then
            SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-' | tr -cd 'a-zA-Z0-9-')
            BRANCH_TAG="$REGISTRY/valhalla-gateway:sha-$SANITIZED-$SHA_SHORT"
            docker build -f Dockerfile.gateway -t "$BRANCH_TAG" .
            docker push "$BRANCH_TAG"
          else
            if ! echo "$CHANGED" | grep -Eq '^(cmd/gateway/|pkg/|go\.mod$|go\.sum$|Dockerfile\.gateway$|ui/)'; then
              if docker pull $REGISTRY/valhalla-gateway:latest 2>/dev/null; then
                docker tag $REGISTRY/valhalla-gateway:latest $REGISTRY/valhalla-gateway:sha-$SHA_SHORT
              else
                docker build -f Dockerfile.gateway -t $REGISTRY/valhalla-gateway:latest -t $REGISTRY/valhalla-gateway:sha-$SHA_SHORT .
                docker push $REGISTRY/valhalla-gateway:latest
              fi
            else
              docker build -f Dockerfile.gateway -t $REGISTRY/valhalla-gateway:latest -t $REGISTRY/valhalla-gateway:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-gateway:latest
            fi
            docker push $REGISTRY/valhalla-gateway:sha-$SHA_SHORT
          fi
  build-seidr:
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo $REGISTRY_PASSWORD | docker login gitea-http.gitea.svc.cluster.local:3000 -u $REGISTRY_USER --password-stdin
      - name: Clone repository
        run: rm -rf /src-seidr && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-seidr
      - name: Build and push seidr
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd /src-seidr
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if [ "$BRANCH_NAME" = "next" ]; then
            STAGING_TAG="$REGISTRY/valhalla-seidr:sha-next-$SHA_SHORT"
            docker build -f Dockerfile.seidr -t "$STAGING_TAG" .
            docker push "$STAGING_TAG"
          elif [ -n "$BRANCH_NAME" ] && ! [ "$BRANCH_NAME" = "main" ]; then
            SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-' | tr -cd 'a-zA-Z0-9-')
            BRANCH_TAG="$REGISTRY/valhalla-seidr:sha-$SANITIZED-$SHA_SHORT"
            docker build -f Dockerfile.seidr -t "$BRANCH_TAG" .
            docker push "$BRANCH_TAG"
          else
            if ! echo "$CHANGED" | grep -Eq '^(seidr/|Dockerfile\.seidr$)'; then
              if docker pull $REGISTRY/valhalla-seidr:latest 2>/dev/null; then
                docker tag $REGISTRY/valhalla-seidr:latest $REGISTRY/valhalla-seidr:sha-$SHA_SHORT
              else
                docker build -f Dockerfile.seidr -t $REGISTRY/valhalla-seidr:latest -t $REGISTRY/valhalla-seidr:sha-$SHA_SHORT .
                docker push $REGISTRY/valhalla-seidr:latest
              fi
            else
              docker build -f Dockerfile.seidr -t $REGISTRY/valhalla-seidr:latest -t $REGISTRY/valhalla-seidr:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-seidr:latest
            fi
            docker push $REGISTRY/valhalla-seidr:sha-$SHA_SHORT
          fi
  build-lockbox:
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo $REGISTRY_PASSWORD | docker login gitea-http.gitea.svc.cluster.local:3000 -u $REGISTRY_USER --password-stdin
      - name: Clone repository
        run: rm -rf /src-lockbox && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-lockbox
      - name: Build and push lockbox
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd /src-lockbox
          if [ -f Dockerfile.lockbox ]; then
            SHA_SHORT=$(git rev-parse --short HEAD)
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
            if [ "$BRANCH_NAME" = "next" ]; then
              STAGING_TAG="$REGISTRY/valhalla-lockbox:sha-next-$SHA_SHORT"
              docker build -f Dockerfile.lockbox -t "$STAGING_TAG" .
              docker push "$STAGING_TAG"
            elif [ -n "$BRANCH_NAME" ] && ! [ "$BRANCH_NAME" = "main" ]; then
              SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-' | tr -cd 'a-zA-Z0-9-')
              BRANCH_TAG="$REGISTRY/valhalla-lockbox:sha-$SANITIZED-$SHA_SHORT"
              docker build -f Dockerfile.lockbox -t "$BRANCH_TAG" .
              docker push "$BRANCH_TAG"
            else
              if ! echo "$CHANGED" | grep -Eq '^(cmd/lockbox/|pkg/|go\.mod$|go\.sum$|Dockerfile\.lockbox$)'; then
                if docker pull $REGISTRY/valhalla-lockbox:latest 2>/dev/null; then
                  docker tag $REGISTRY/valhalla-lockbox:latest $REGISTRY/valhalla-lockbox:sha-$SHA_SHORT
                else
                  docker build -f Dockerfile.lockbox -t $REGISTRY/valhalla-lockbox:latest -t $REGISTRY/valhalla-lockbox:sha-$SHA_SHORT .
                  docker push $REGISTRY/valhalla-lockbox:latest
                fi
              else
                docker build -f Dockerfile.lockbox -t $REGISTRY/valhalla-lockbox:latest -t $REGISTRY/valhalla-lockbox:sha-$SHA_SHORT .
                docker push $REGISTRY/valhalla-lockbox:latest
              fi
              docker push $REGISTRY/valhalla-lockbox:sha-$SHA_SHORT
            fi
          fi
  build-hirdforge:
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo $REGISTRY_PASSWORD | docker login gitea-http.gitea.svc.cluster.local:3000 -u $REGISTRY_USER --password-stdin
      - name: Clone repository
        run: rm -rf /src-hirdforge && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-hirdforge
      - name: Build and push hirdforge
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd /src-hirdforge
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if [ "$BRANCH_NAME" = "next" ]; then
            STAGING_TAG="$REGISTRY/valhalla-hirdforge:sha-next-$SHA_SHORT"
            docker build -f Dockerfile.hirdforge -t "$STAGING_TAG" .
            docker push "$STAGING_TAG"
          elif [ -n "$BRANCH_NAME" ] && ! [ "$BRANCH_NAME" = "main" ]; then
            SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-' | tr -cd 'a-zA-Z0-9-')
            BRANCH_TAG="$REGISTRY/valhalla-hirdforge:sha-$SANITIZED-$SHA_SHORT"
            docker build -f Dockerfile.hirdforge -t "$BRANCH_TAG" .
            docker push "$BRANCH_TAG"
          else
            if ! echo "$CHANGED" | grep -Eq '^(cmd/hirdforge/|go\.mod$|go\.sum$|Dockerfile\.hirdforge$)'; then
              if docker pull $REGISTRY/valhalla-hirdforge:latest 2>/dev/null; then
                docker tag $REGISTRY/valhalla-hirdforge:latest $REGISTRY/valhalla-hirdforge:sha-$SHA_SHORT
              else
                docker build -f Dockerfile.hirdforge -t $REGISTRY/valhalla-hirdforge:latest -t $REGISTRY/valhalla-hirdforge:sha-$SHA_SHORT .
                docker push $REGISTRY/valhalla-hirdforge:latest
              fi
            else
              docker build -f Dockerfile.hirdforge -t $REGISTRY/valhalla-hirdforge:latest -t $REGISTRY/valhalla-hirdforge:sha-$SHA_SHORT .
              docker push $REGISTRY/valhalla-hirdforge:latest
            fi
            docker push $REGISTRY/valhalla-hirdforge:sha-$SHA_SHORT
          fi
  build-openai-mcp-tunnel:
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker CLI
        run: apk add --no-cache docker-cli
      - name: Registry login
        run: echo $REGISTRY_PASSWORD | docker login gitea-http.gitea.svc.cluster.local:3000 -u $REGISTRY_USER --password-stdin
      - name: Clone repository
        run: rm -rf /src-openai-mcp-tunnel && git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-openai-mcp-tunnel
      - name: Build and push openai mcp tunnel
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd /src-openai-mcp-tunnel
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          if [ "$BRANCH_NAME" = "next" ]; then
            STAGING_TAG="$REGISTRY/openai-mcp-tunnel:sha-next-$SHA_SHORT"
            docker build -f Dockerfile.openai-mcp-tunnel -t "$STAGING_TAG" .
            docker push "$STAGING_TAG"
          elif [ -n "$BRANCH_NAME" ] && ! [ "$BRANCH_NAME" = "main" ]; then
            SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-' | tr -cd 'a-zA-Z0-9-')
            BRANCH_TAG="$REGISTRY/openai-mcp-tunnel:sha-$SANITIZED-$SHA_SHORT"
            docker build -f Dockerfile.openai-mcp-tunnel -t "$BRANCH_TAG" .
            docker push "$BRANCH_TAG"
          else
            if ! echo "$CHANGED" | grep -Eq '^(Dockerfile\.openai-mcp-tunnel$)'; then
              if docker pull $REGISTRY/openai-mcp-tunnel:latest 2>/dev/null; then
                docker tag $REGISTRY/openai-mcp-tunnel:latest $REGISTRY/openai-mcp-tunnel:sha-$SHA_SHORT
              else
                docker build -f Dockerfile.openai-mcp-tunnel -t $REGISTRY/openai-mcp-tunnel:latest -t $REGISTRY/openai-mcp-tunnel:sha-$SHA_SHORT .
                docker push $REGISTRY/openai-mcp-tunnel:latest
              fi
            else
              docker build -f Dockerfile.openai-mcp-tunnel -t $REGISTRY/openai-mcp-tunnel:latest -t $REGISTRY/openai-mcp-tunnel:sha-$SHA_SHORT .
              docker push $REGISTRY/openai-mcp-tunnel:latest
            fi
            docker push $REGISTRY/openai-mcp-tunnel:sha-$SHA_SHORT
          fi
  update-infra:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-agent, build-agent-sandbox, build-gateway, build-seidr, build-lockbox, build-hirdforge, build-openai-mcp-tunnel]
    steps:
      - name: Install tools
        run: apk add --no-cache curl jq python3
      - name: Clone repos
        run: |
          rm -rf /src-code /src-infra
          git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/hirdforge.git /src-code
          git clone http://kit:$REGISTRY_PASSWORD@gitea-http.gitea.svc.cluster.local:3000/kit/asgard-infra.git /src-infra
      - name: Update manifests and create PR
        run: |
          cd /src-code
          SHA_SHORT=$(git rev-parse --short HEAD)
          NEW_TAG="sha-$SHA_SHORT"
          cd /src-infra
          # Update first-party valhalla image tags and the OpenAI tunnel image in YAML manifests (non-JSON) using Python.
          python3 - "$NEW_TAG" <<'PY'
          import pathlib
          import re
          import sys

          new_tag = sys.argv[1].strip()
          root = pathlib.Path("infrastructure")
          image_re = re.compile(
              r'^(\s*image:\s*)"?(.*/)([^:"\'\s]+):[^\s"\']*"?(\s*(?:#.*)?)$',
              re.MULTILINE,
          )

          updated = []
          for path in sorted(root.rglob("*")):
              if path.suffix.lower() not in {".yaml", ".yml"}:
                  continue
              text = path.read_text(encoding="utf-8")
              if text.lstrip().startswith("{"):
                  # JSON-formatted manifests should not appear in asgard-infra.
                  continue

              def replace(m):
                  image_name = m.group(3)
                  if image_name.startswith("valhalla-"):
                      repo = "kit/hirdforge"
                  elif image_name == "openai-mcp-tunnel":
                      repo = "kit/hirdforge"
                  else:
                      return m.group(0)
                  return f'{m.group(1)}"git.hirdforge.com/{repo}/{image_name}:{new_tag}"{m.group(4)}'

              new_text = image_re.sub(replace, text)
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  updated.append(str(path))

          for file in updated:
              print(f"updated: {file}")
          PY
          git config user.name "CI Bot" && git config user.email "ci@valhalla.local"
          BRANCH_NAME="ci/update-images-$SHA_SHORT"
          git checkout -b $BRANCH_NAME
          git add -A && git commit -m "ci: update images to sha-$SHA_SHORT"
          git push origin $BRANCH_NAME
          # Create PR via Gitea API
          PR_RESPONSE=$(curl -s -X POST -H "Authorization: token $REGISTRY_PASSWORD" -H "Content-Type: application/json" \
            -d "{\"title\":\"ci: update container images to sha-$SHA_SHORT\",\"body\":\"Automated PR to update container image tags to latest builds\",\"head\":\"$BRANCH_NAME\",\"base\":\"main\"}" \
            http://gitea-http.gitea.svc.cluster.local:3000/api/v1/repos/kit/asgard-infra/pulls)
          PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number')
          if [ "$PR_NUMBER" = "null" ] || [ -z "$PR_NUMBER" ]; then
            echo "ERROR: PR creation failed, skipping merge"
            echo "$PR_RESPONSE"
            exit 1
          fi
          echo "$PR_RESPONSE"
