# Seidr Python project config — lint (ruff) and test (pytest) for the Seidr service.
# Scoped to the seidr/ directory; run tooling from here (`cd seidr`).
#
# This is the Phase 2 quality lane. It deliberately does NOT pull in Seidr's heavy
# optional runtime deps (sentence-transformers, numpy, uvicorn, mcp) — the smoke
# tests import main.py and exercise endpoints that do not require inference, GPU,
# DB, or network.

[tool.ruff]
line-length = 200
target-version = "py312"
exclude = ["__pycache__"]

[tool.ruff.lint]
# Pyflakes (F: unused/undefined names, bad f-strings), pycodestyle errors (E) and
# warnings (W). E501 (line length) is disabled: main.py predates this lane and has
# long lines; tighten incrementally rather than reformatting in this PR.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
